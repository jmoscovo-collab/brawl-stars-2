const INIM={
    chef:{vel:70,alc:210,abre:0.55,nome:'CHEF'},

// ===== 200 FASES EXTRAS (geradas sozinhas e conferidas: sempre dá pra pegar as 5 pérolas e chegar na saída) =====
const N_EXTRAS=200, NF=FASES.length+N_EXTRAS;
function rng(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const INIM_AREA=[['chef','chef','garcom'],['garcom','gato','garcom'],['rato','rato','gato'],['pescador','gaivota','gato']];
const VIZ=[[1,0],[-1,0],[0,1],[0,-1]];
// BFS que sabe usar os canos (entrar num cano = sair no par dele)
function alcanca(g,de,podeE){
    const O=[]; for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) if(g[r][c]==='O') O.push(r*COLS+c);
    const vis=new Set([de]), fila=[de];
    while(fila.length){ const k=fila.shift(), c=k%COLS, r=(k-c)/COLS;
        for(const [dc,dr] of VIZ){ const nc=c+dc, nr=r+dr, ch=g[nr][nc]; if(ch==='#'||(!podeE&&ch==='E')) continue;
            let nk=nr*COLS+nc;
            if(ch==='O'){ vis.add(nk); const i=O.indexOf(nk); nk=O[i%2?i-1:i+1]; }
            if(!vis.has(nk)){ vis.add(nk); fila.push(nk); } } }
    return vis;
}
function tentaGerar(n,tent){
    const R=rng(77000+n*131+tent*7919), ri=k=>Math.floor(R()*k), a=Math.floor(n/5)%4, nivel=n/N_EXTRAS;
    const g=[]; for(let r=0;r<ROWS;r++){ g.push([]); for(let c=0;c<COLS;c++) g[r].push(r===0||c===0||r===ROWS-1||c===COLS-1?'#':'.'); }
    const blocos=9+ri(6)+Math.floor(nivel*7);
    for(let k=0;k<blocos;k++){ let w=1+ri(4), h=1+ri(3); if(R()<0.5){ const t=w; w=h; h=t; }
        const x=1+ri(COLS-2-w), y=1+ri(ROWS-2-h); for(let r=y;r<y+h;r++) for(let c=x;c<x+w;c++) g[r][c]='#'; }
    const cores=['r','b','g','y','k'].filter(k=>k!==AREAS[a].base);
    for(let k=0,nz=3+ri(3);k<nz;k++){ const w=2+ri(5), h=2+ri(3), x=1+ri(COLS-2-w), y=1+ri(ROWS-2-h), cor=cores[ri(cores.length)];
        for(let r=y;r<y+h;r++) for(let c=x;c<x+w;c++) if(g[r][c]!=='#') g[r][c]=cor; }
    const sr=1+ri(ROWS-2), sc=1+ri(2), er=1+ri(ROWS-2), ec=COLS-2-ri(2);
    g[sr][sc]='S'; g[er][ec]='E';
    if(a===3&&er+1<ROWS-1&&g[er+1][ec]!=='#') g[er+1][ec]='E';   // no porto o mar é maior
    const S=sr*COLS+sc;
    let vis=alcanca(g,S,true);
    if(!vis.has(er*COLS+ec)) return null;
    // canos (fase sim, fase não)
    if(n%2===1){
        const livres=[...alcanca(g,S,false)].filter(k=>{ const c=k%COLS, r=(k-c)/COLS; return g[r][c]!=='S'&&g[r][c]!=='E'&&g[r][c]!=='O'; });
        for(let t=0;t<30;t++){ const p1=livres[ri(livres.length)], p2=livres[ri(livres.length)];
            const c1=p1%COLS, r1=(p1-c1)/COLS, c2=p2%COLS, r2=(p2-c2)/COLS;
            if(Math.abs(c1-c2)+Math.abs(r1-r2)<9) continue;
            g[r1][c1]='O'; g[r2][c2]='O';
            if(alcanca(g,S,true).has(er*COLS+ec)) break;
            g[r1][c1]='.'; g[r2][c2]='.';
        }
    }
    // 5 pérolas espalhadas (alcançáveis sem passar pela saída)
    const semE=[...alcanca(g,S,false)].filter(k=>{ const c=k%COLS, r=(k-c)/COLS; return !'SEO'.includes(g[r][c]); });
    const per=[];
    for(let t=0;t<400&&per.length<5;t++){ const k=semE[ri(semE.length)], c=k%COLS, r=(k-c)/COLS;
        if(Math.abs(c-sc)+Math.abs(r-sr)<3) continue;
        if(per.every(q=>Math.abs(q[0]-c)+Math.abs(q[1]-r)>=3)) per.push([c,r]); }
    if(per.length<5) return null;
    per.forEach(([c,r])=>g[r][c]='p');
    // inimigos patrulhando corredores retos (longe do começo)
    const tipos=INIM_AREA[a], qtd=Math.min(6,2+Math.floor(n/35)+ri(2)), inim=[];
    const livre=(c,r)=>g[r]&&g[r][c]&&g[r][c]!=='#';
    for(let t=0;t<200&&inim.length<qtd;t++){
        const tp=tipos[ri(tipos.length)];
        if(INIM[tp].voa){ const p1=[2+ri(COLS-4),1+ri(ROWS-2)], p2=[2+ri(COLS-4),1+ri(ROWS-2)];
            if(Math.hypot(p1[0]-p2[0],p1[1]-p2[1])<6||Math.min(Math.hypot(p1[0]-sc,p1[1]-sr),Math.hypot(p2[0]-sc,p2[1]-sr))<5) continue;
            inim.push({t:tp,r:[p1,p2]}); continue; }
        const c=1+ri(COLS-2), r=1+ri(ROWS-2); if(!livre(c,r)) continue;
        const hor=R()<0.5; let i0=hor?c:r, i1=i0;
        while(hor?livre(i0-1,r):livre(c,i0-1)) i0--;
        while(hor?livre(i1+1,r):livre(c,i1+1)) i1++;
        if(i1-i0<4) continue;
        const p1=hor?[i0,r]:[c,i0], p2=hor?[i1,r]:[c,i1];
        // não pode passar perto do começo
        let perto=false; for(let s=i0;s<=i1;s++){ const q=hor?[s,r]:[c,s]; if(Math.abs(q[0]-sc)+Math.abs(q[1]-sr)<4) perto=true; }
        if(perto) continue;
        inim.push({t:tp,r:[p1,p2]});
    }
    if(inim.length<2) return null;
    return {a,m:g.map(l=>l.join('')),inim,dica:'',vel:1+Math.min(0.45,n/440),extra:n+1};
}
const cacheExtra={};
function faseDef(i){
    if(i<FASES.length) return FASES[i];
    const n=i-FASES.length;
    if(cacheExtra[n]) return cacheExtra[n];
    for(let t=0;t<80;t++){ const f=tentaGerar(n,t); if(f) return cacheExtra[n]=f; }
    return cacheExtra[n]=FASES[n%FASES.length];
}
const areaDe=i=>i<FASES.length?FASES[i].a:Math.floor((i-FASES.length)/5)%4;

// ===== SAVE =====
const SAVE_K='polvo_save';

try{ Object.assign(save,JSON.parse(localStorage.getItem(SAVE_K)||'{}')); }catch(e){}
if(!Array.isArray(save.est)) save.est=[];
function salva(){ try{ localStorage.setItem(SAVE_K,JSON.stringify(save)); }catch(e){} }
const totalEst=()=>save.est.reduce((a,b)=>a+(b||0),0);
const liberada=i=>i===0||(save.est[i-1]||0)>0;

// ===== MAPA =====
let F=null, grid=[], canos=[], cvMapa=document.createElement('canvas');
cvMapa.width=MW; cvMapa.height=MH;
function tile(c,r){ return (r<0||r>=ROWS||c<0||c>=COLS)?'#':grid[r][c]; }
function paredeXY(x,y){ return tile(Math.floor(x/T),Math.floor(y/T))==='#'; }
function corChao(c,r){
    const k=tile(c,r);
    if(k==='r'||k==='b'||k==='g'||k==='y') return k;
    if(k==='k') return (c+r)%2?'r':'y';
    return AREAS[F.a].base;
}
function centro(c,r){ return {x:c*T+T/2,y:r*T+T/2}; }

// ===== ESTADO =====
let estado='menu', faseN=0, tempo=0, polvo=null, inimigos=[], nuvens=[], perolas=[], parts=[], textos=[], fimT=0, resultado='', dicaT=0;
function comecaFase(i){
    faseN=i; F=faseDef(i); grid=F.m.map(l=>l.split('')); canos=[]; perolas=[];
    let ini={x:T*1.5,y:T*1.5};
    for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
        const k=grid[r][c];
        if(k==='S') ini=centro(c,r);
        if(k==='O') canos.push({c,r});
        if(k==='p') perolas.push(Object.assign(centro(c,r),{pega:false}));
    }
    polvo={x:ini.x,y:ini.y,ini,cor:AREAS[F.a].base,alerta:0,tinta:3,pegos:0,pegoT:0,protege:1.5,canoBloq:-1,anda:0,dir:0};
    inimigos=F.inim.map(d=>{ const p=centro(d.r[0][0],d.r[0][1]), cfg=INIM[d.t];
        return Object.assign({t:d.t,x:p.x,y:p.y,ang:0,rota:d.r.map(q=>centro(q[0],q[1])),i:1,dir:1,espera:0.5,base:0,viu:0},cfg,{vel:cfg.vel*(F.vel||1)}); });
    nuvens=[]; parts=[]; textos=[]; tempo=0; fimT=0; resultado=''; dicaT=F.dica?4.5:0;
    desenhaMapa();
    estado='jogo';
    $('menu').style.display='none'; $('fim').style.display='none'; $('hud').style.display='flex';
}
function trocaCor(k){ if(estado!=='jogo'||!polvo||polvo.cor===k) return; polvo.cor=k; for(let i=0;i<10;i++) parts.push({x:polvo.x,y:polvo.y,vx:(Math.random()-.5)*160,vy:(Math.random()-.5)*160,v:.4,cor:CORES[k],r:4}); }
function proxCor(){ if(!polvo) return; trocaCor(ORDEM_COR[(ORDEM_COR.indexOf(polvo.cor)+1)%4]); }
function soltaTinta(){
    if(estado!=='jogo'||!polvo||polvo.tinta<=0||polvo.pegoT>0) return;
    polvo.tinta--; nuvens.push({x:polvo.x,y:polvo.y,t:4.5,r:0});
    textos.push({x:polvo.x,y:polvo.y-30,txt:'PSSSHH! 💨',v:1,cor:'#e0c8ff'});
}
const naNuvem=(x,y)=>nuvens.some(n=>Math.hypot(x-n.x,y-n.y)<n.r);
function escondido(){
    if(polvo.protege>0) return true;
    if(naNuvem(polvo.x,polvo.y)) return true;
    return polvo.cor===corChao(Math.floor(polvo.x/T),Math.floor(polvo.y/T));
}
function linhaLivre(ax,ay,bx,by){
    const d=Math.hypot(bx-ax,by-ay), n=Math.ceil(d/8);
    for(let i=1;i<n;i++){ const t=i/n, x=ax+(bx-ax)*t, y=ay+(by-ay)*t; if(paredeXY(x,y)||naNuvem(x,y)) return false; }
    return true;
}
function enxerga(e,x,y){
    const dx=x-e.x, dy=y-e.y, d=Math.hypot(dx,dy);
    if(e.voa) return d<e.alc && !naNuvem(x,y);
    if(d>e.alc) return false;
    let da=Math.atan2(dy,dx)-e.ang; while(da>Math.PI) da-=Math.PI*2; while(da<-Math.PI) da+=Math.PI*2;
    if(Math.abs(da)>e.abre) return false;
    return linhaLivre(e.x,e.y,x,y);
}

// ===== CONTROLES =====
const teclas={};
addEventListener('keydown',e=>{
    teclas[e.code]=true;
    if(estado==='jogo'){
        const n={Digit1:'r',Digit2:'b',Digit3:'g',Digit4:'y',Numpad1:'r',Numpad2:'b',Numpad3:'g',Numpad4:'y'}[e.code];
        if(n) trocaCor(n);
        if(e.code==='KeyE'||e.code==='KeyQ'){ e.preventDefault(); proxCor(); }
        if(e.code==='Space'||e.code==='KeyJ'){ e.preventDefault(); soltaTinta(); }
    }
    if(e.code==='Enter'&&estado==='fim'){ if($('fProx').style.display!=='none') $('fProx').click(); else $('fRep').click(); }
});
addEventListener('keyup',e=>{ teclas[e.code]=false; });
const stick={id:null,bx:0,by:0,x:0,y:0}, R_ST=55;
// 4 bolinhas de cor num arco (da esquerda até em cima) em volta do botão de tinta, no canto direito de baixo
// (no PC os botões ficam sempre do lado oposto ao polvo, pra nunca tampar ele)
function posBotoes(){
    const esq=!TOUCH&&(!polvo||polvo.x*S+OX>W/2), bx=esq?62:W-62, by=H-62, R=118, l=[];
    ORDEM_COR.forEach((k,i)=>{ const a=esq?-Math.PI/2+i*(Math.PI/2)/3:Math.PI+i*(Math.PI/2)/3; l.push({k,x:bx+Math.cos(a)*R,y:by+Math.sin(a)*R,r:28}); });
    l.push({k:'tinta',x:bx,y:by,r:38});
    return l;
}
cv.addEventListener('touchstart',e=>{
    e.preventDefault();
    if(estado!=='jogo') return;
    for(const t of e.changedTouches){
        const x=t.clientX, y=t.clientY;
        const b=posBotoes().find(b=>Math.hypot(x-b.x,y-b.y)<b.r+10);
        if(b){ b.k==='tinta'?soltaTinta():trocaCor(b.k); continue; }
        if(stick.id===null && x<W*0.6) Object.assign(stick,{id:t.identifier,bx:x,by:y,x,y});
    }
},{passive:false});
cv.addEventListener('touchmove',e=>{ e.preventDefault(); for(const t of e.changedTouches) if(t.identifier===stick.id){ stick.x=t.clientX; stick.y=t.clientY; } },{passive:false});
function soltaT(e){ for(const t of e.changedTouches) if(t.identifier===stick.id) stick.id=null; }
cv.addEventListener('touchend',soltaT); cv.addEventListener('touchcancel',soltaT);
cv.addEventListener('mousedown',e=>{
    if(TOUCH||estado!=='jogo') return;
    const b=posBotoes().find(b=>Math.hypot(e.clientX-b.x,e.clientY-b.y)<b.r+6);
    if(b){ b.k==='tinta'?soltaTinta():trocaCor(b.k); }
});

// ===== ATUALIZA =====
function resolve(o,r){
    const c0=Math.floor((o.x-r)/T),c1=Math.floor((o.x+r)/T),r0=Math.floor((o.y-r)/T),r1=Math.floor((o.y+r)/T);
    for(let ry=r0;ry<=r1;ry++) for(let cc=c0;cc<=c1;cc++){
        if(tile(cc,ry)!=='#') continue;
        const nx=clamp(o.x,cc*T,cc*T+T), ny=clamp(o.y,ry*T,ry*T+T);
        const dx=o.x-nx, dy=o.y-ny, d=Math.hypot(dx,dy);
        if(d<r&&d>0.001){ o.x+=dx/d*(r-d); o.y+=dy/d*(r-d); }
    }
}
function pegaPolvo(e){
    polvo.pegoT=1.3; polvo.pegos++; polvo.alerta=0;
    textos.push({x:polvo.x,y:polvo.y-40,txt:{chef:'PEGUEI! VAI PRA PANELA! 🍲',garcom:'AQUI, CHEF! 🙋',pescador:'PEIXE GRANDE! 🎣',gato:'MIAU! 😼',rato:'IIIC IIIC! 🐀',gaivota:'QUÁ QUÁ! 🐦'}[e.t],v:1.4,cor:'#ff5a5a'});
}
function update(dt){
    tempo+=dt; dicaT=Math.max(0,dicaT-dt);
    const p=polvo;
    // nuvens de tinta crescem e somem
    for(let i=nuvens.length-1;i>=0;i--){ const n=nuvens[i]; n.t-=dt; n.cresce=Math.min(75,(n.cresce||0)+dt*260); n.r=n.cresce*(n.t<0.6?n.t/0.6:1); if(n.t<=0) nuvens.splice(i,1); }
    if(p.pegoT>0){
        p.pegoT-=dt;
        if(p.pegoT<=0){ p.x=p.ini.x; p.y=p.ini.y; p.protege=1.5; p.canoBloq=-1; }
    } else if(!resultado){
        p.protege=Math.max(0,p.protege-dt);
        let ix=0,iy=0;
        if(teclas.KeyA||teclas.ArrowLeft) ix-=1;
        if(teclas.KeyD||teclas.ArrowRight) ix+=1;
        if(teclas.KeyW||teclas.ArrowUp) iy-=1;
        if(teclas.KeyS||teclas.ArrowDown) iy+=1;
        if(stick.id!==null){ ix=(stick.x-stick.bx)/R_ST; iy=(stick.y-stick.by)/R_ST; }
        const len=Math.hypot(ix,iy);
        if(len>0.1){ const k=Math.min(1,len)/len*135*dt; p.x+=ix*k; p.y+=iy*k; p.anda+=dt*Math.min(1,len); p.dir=Math.atan2(iy,ix); }
        resolve(p,13);
        const c=Math.floor(p.x/T), r=Math.floor(p.y/T), k=tile(c,r), idx=r*COLS+c;
        if(p.canoBloq>=0 && idx!==p.canoBloq) p.canoBloq=-1;
        // cano: sai no par dele
        if(k==='O' && p.canoBloq<0){
            const i=canos.findIndex(q=>q.c===c&&q.r===r), par=canos[i%2?i-1:i+1];
            if(par){ const d=centro(par.c,par.r); p.x=d.x; p.y=d.y; p.canoBloq=par.r*COLS+par.c;
                textos.push({x:d.x,y:d.y-30,txt:'PLOFT! 🟢',v:0.9,cor:'#8aff8a'});
                for(let q=0;q<14;q++) parts.push({x:d.x,y:d.y,vx:(Math.random()-.5)*240,vy:(Math.random()-.5)*240,v:.5,cor:'#6ae0ff',r:4}); }
        }
        for(const pe of perolas) if(!pe.pega && Math.hypot(pe.x-p.x,pe.y-p.y)<24){ pe.pega=true; textos.push({x:pe.x,y:pe.y-24,txt:'+1 ⚪',v:0.8,cor:'#fff'}); for(let q=0;q<10;q++) parts.push({x:pe.x,y:pe.y,vx:(Math.random()-.5)*200,vy:(Math.random()-.5)*200,v:.5,cor:'#fff',r:3}); }
        if(k==='E'){ resultado='ganhou'; fimT=1.6; textos.push({x:p.x,y:p.y-40,txt:faseN===FASES.length-1||faseN===NF-1?'LIBERDADE! 🌊':'FUGIU! 🐙',v:1.6,cor:'#8aff8a'}); }
    }
    // inimigos patrulham e olham em volta
    let alguemVe=false;
    for(const e of inimigos){
        if(e.espera>0){ e.espera-=dt; e.ang=e.base+Math.sin((0.9-e.espera)*3.5)*0.9; }
        else {
            const alvo=e.rota[e.i], dx=alvo.x-e.x, dy=alvo.y-e.y, d=Math.hypot(dx,dy);
            if(d<2){
                e.x=alvo.x; e.y=alvo.y; e.base=e.ang; e.espera=e.voa?0:0.9;
                if(e.i+e.dir>=e.rota.length||e.i+e.dir<0) e.dir*=-1;
                e.i+=e.dir;
            } else { const v=Math.min(d,e.vel*dt); e.x+=dx/d*v; e.y+=dy/d*v; e.ang=Math.atan2(dy,dx); }
        }
        if(p.pegoT<=0 && !resultado){
            const ve=!escondido() && (enxerga(e,p.x,p.y) || Math.hypot(e.x-p.x,e.y-p.y)<26);
            e.viu=ve?Math.min(1,e.viu+dt*4):Math.max(0,e.viu-dt*2);
            if(ve) alguemVe=true;   // encostar também conta, mas precisa ficar visível um tiquinho pra ser pego
            if(ve && p.alerta>=1){ pegaPolvo(e); break; }
        } else e.viu=Math.max(0,e.viu-dt*2);
    }
    p.alerta=alguemVe?Math.min(1,p.alerta+dt*2.2):Math.max(0,p.alerta-dt*1.2);
    for(let i=parts.length-1;i>=0;i--){ const q=parts[i]; q.v-=dt; q.x+=q.vx*dt; q.y+=q.vy*dt; q.vx*=0.93; q.vy*=0.93; if(q.v<=0) parts.splice(i,1); }
    for(let i=textos.length-1;i>=0;i--){ const q=textos[i]; q.v-=dt; q.y-=26*dt; if(q.v<=0) textos.splice(i,1); }
    if(resultado){ fimT-=dt; if(fimT<=0) mostraFim(); }
}

// ===== DESENHO =====
function desenhaMapa(){
    const g=cvMapa.getContext('2d'), A=AREAS[F.a];
    for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
        const x=c*T, y=r*T, k=grid[r][c];
        if(k==='#') continue;
        g.fillStyle=CORES[corChao(c,r)]; g.fillRect(x,y,T,T);
        g.fillStyle='rgba(255,255,255,.12)'; g.fillRect(x+2,y+2,T-4,3);
        g.strokeStyle='rgba(0,0,0,.12)'; g.lineWidth=1; g.strokeRect(x+.5,y+.5,T-1,T-1);
        if(F.a===1&&corChao(c,r)==='r'){ g.fillStyle='rgba(255,220,120,.18)'; g.beginPath(); g.arc(x+T/2,y+T/2,8,0,7); g.fill(); }
    }
    for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
        if(grid[r][c]!=='#') continue;
        const x=c*T, y=r*T;
        switch(A.parede){
            case 'balcao': g.fillStyle='#8a929c'; g.fillRect(x,y,T,T); g.fillStyle='#b8c0ca'; g.fillRect(x+2,y+2,T-4,T-10); g.fillStyle='#6a727c'; g.fillRect(x,y+T-8,T,8);
                if((c*7+r*3)%5===0){ g.fillStyle='#333'; for(const [a,b] of [[14,14],[34,14],[14,30],[34,30]]){ g.beginPath(); g.arc(x+a,y+b,6,0,7); g.fill(); } } break;
            case 'mesa': g.fillStyle='#5a3a2a'; g.fillRect(x,y,T,T); g.fillStyle='#8a5a3a'; g.fillRect(x+2,y+2,T-4,T-4); g.fillStyle='#a8744a'; g.fillRect(x+2,y+2,T-4,4);
                if((c*5+r*11)%3===0){ g.fillStyle='#fff'; g.beginPath(); g.arc(x+T/2,y+T/2,11,0,7); g.fill(); g.fillStyle='#ffb02a'; g.beginPath(); g.arc(x+T/2,y+T/2,5,0,7); g.fill(); } break;
            case 'cano': g.fillStyle='#2a3a3a'; g.fillRect(x,y,T,T); g.fillStyle='#3a5050'; g.fillRect(x+2,y+2,T-4,T-4); g.strokeStyle='#1a2a2a'; g.lineWidth=2;
                for(let k=0;k<3;k++){ g.beginPath(); g.moveTo(x+2,y+8+k*16); g.lineTo(x+T-2,y+8+k*16); g.stroke(); }
                if((c+r)%4===0){ g.fillStyle='#6a8a5a'; g.fillRect(x+T/2-6,y,12,T); g.fillStyle='#8aaa7a'; g.fillRect(x+T/2-8,y+T/2-4,16,8); } break;
            case 'caixote': g.fillStyle='#7a5a3a'; g.fillRect(x,y,T,T); g.fillStyle='#a8784a'; g.fillRect(x+3,y+3,T-6,T-6); g.strokeStyle='#7a5a3a'; g.lineWidth=4;
                g.beginPath(); g.moveTo(x+4,y+4); g.lineTo(x+T-4,y+T-4); g.moveTo(x+T-4,y+4); g.lineTo(x+4,y+T-4); g.stroke(); break;
        }
    }
    // canos, saída
    for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
        const k=grid[r][c], x=c*T, y=r*T;
        if(k==='O'){ g.fillStyle='#2a8a3a'; g.beginPath(); g.arc(x+T/2,y+T/2,20,0,7); g.fill(); g.fillStyle='#0a2a10'; g.beginPath(); g.arc(x+T/2,y+T/2,13,0,7); g.fill(); g.strokeStyle='#5ae06a'; g.lineWidth=3; g.beginPath(); g.arc(x+T/2,y+T/2,20,0,7); g.stroke(); }
        if(k==='E'&&A.saida!=='mar'){
            if(A.saida==='porta'){ g.fillStyle='#5a3a1a'; g.fillRect(x+4,y+2,T-8,T-4); g.fillStyle='#ffd23a'; g.beginPath(); g.arc(x+T-14,y+T/2,4,0,7); g.fill(); g.fillStyle='#fff'; g.font='bold 9px Arial'; g.textAlign='center'; g.fillText('SAÍDA',x+T/2,y+14); }
            else { g.fillStyle='#555'; g.beginPath(); g.arc(x+T/2,y+T/2,20,0,7); g.fill(); g.strokeStyle='#222'; g.lineWidth=3; for(let q=-12;q<=12;q+=6){ g.beginPath(); g.moveTo(x+T/2+q,y+T/2-14); g.lineTo(x+T/2+q,y+T/2+14); g.stroke(); } }
        }
    }
}
function desenhaPolvo(){
    const p=polvo; if(p.pegoT>0&&p.pegoT<1.3){ /* desenha na panela */ }
    const esc=escondido(), x=p.x, y=p.y, t=tempo;
    ctx.save(); ctx.globalAlpha=esc?(p.protege>0?0.4+0.3*Math.sin(t*20):0.38):1;
    const cor=CORES[p.cor];
    ctx.strokeStyle=cor; ctx.lineWidth=5; ctx.lineCap='round';
    for(let i=0;i<8;i++){
        const a=i*Math.PI/4+0.2, ond=Math.sin(t*8+i+p.anda*12)*0.35;
        ctx.beginPath(); ctx.moveTo(x+Math.cos(a)*8,y+Math.sin(a)*8);
        ctx.quadraticCurveTo(x+Math.cos(a+ond)*18,y+Math.sin(a+ond)*18,x+Math.cos(a-ond*0.6)*24,y+Math.sin(a-ond*0.6)*24); ctx.stroke();
    }
    ctx.fillStyle=cor; ctx.beginPath(); ctx.ellipse(x,y-2,15,14,0,0,7); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.3)'; ctx.beginPath(); ctx.ellipse(x-5,y-8,5,4,0,0,7); ctx.fill();
    const lx=Math.cos(p.dir)*2, ly=Math.sin(p.dir)*2;
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(x-6,y-2,4.5,0,7); ctx.arc(x+6,y-2,4.5,0,7); ctx.fill();
    ctx.fillStyle='#111'; ctx.beginPath(); ctx.arc(x-6+lx,y-2+ly,2.3,0,7); ctx.arc(x+6+lx,y-2+ly,2.3,0,7); ctx.fill();
    ctx.restore();
    if(p.alerta>0.05&&!esc){ ctx.font='bold 26px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle=p.alerta>0.6?'#ff3a3a':'#ffd23a'; ctx.strokeStyle='#000'; ctx.lineWidth=4; const s=p.alerta>0.6?'!':'?'; ctx.strokeText(s,x,y-34); ctx.fillText(s,x,y-34); }
}
function desenhaInimigo(e){
    const x=e.x, y=e.y, a=e.ang, passo=Math.sin(tempo*10)*3;
    if(e.voa){
        ctx.fillStyle='rgba(0,0,0,.18)'; ctx.beginPath(); ctx.ellipse(x,y+18,16,7,0,0,7); ctx.fill();
        const asa=Math.sin(tempo*12)*10;
        ctx.fillStyle='#e8e8f0'; ctx.beginPath(); ctx.moveTo(x-4,y); ctx.lineTo(x-26,y-8-asa); ctx.lineTo(x-6,y+6); ctx.moveTo(x+4,y); ctx.lineTo(x+26,y-8-asa); ctx.lineTo(x+6,y+6); ctx.fill();
        ctx.fillStyle='#fff'; ctx.beginPath(); ctx.ellipse(x,y,9,13,a+Math.PI/2,0,7); ctx.fill();
        ctx.fillStyle='#ffb02a'; ctx.beginPath(); ctx.arc(x+Math.cos(a)*13,y+Math.sin(a)*13,4,0,7); ctx.fill();
        return;
    }
    ctx.save(); ctx.translate(x,y); ctx.rotate(a);
    if(e.t==='gato'||e.t==='rato'){
        const cor=e.t==='gato'?'#ff9a3a':'#8a8a98', s=e.t==='gato'?1:0.75;
        ctx.strokeStyle=cor; ctx.lineWidth=4*s; ctx.beginPath(); ctx.moveTo(-14*s,0); ctx.quadraticCurveTo(-26*s,Math.sin(tempo*6)*10,-30*s,Math.sin(tempo*6+1)*6); ctx.stroke();
        ctx.fillStyle=cor; ctx.beginPath(); ctx.ellipse(0,0,15*s,10*s,0,0,7); ctx.fill();
        ctx.beginPath(); ctx.arc(13*s,0,9*s,0,7); ctx.fill();
        ctx.beginPath(); ctx.moveTo(14*s,-6*s); ctx.lineTo(20*s,-13*s); ctx.lineTo(10*s,-9*s); ctx.moveTo(14*s,6*s); ctx.lineTo(20*s,13*s); ctx.lineTo(10*s,9*s); ctx.fill();
        if(e.t==='gato'){ ctx.fillStyle='#d8702a'; ctx.fillRect(-8,-9,4,18); ctx.fillRect(0,-10,4,20); }
        ctx.fillStyle='#ffef5a'; ctx.beginPath(); ctx.arc(17*s,-3.5*s,2.5,0,7); ctx.arc(17*s,3.5*s,2.5,0,7); ctx.fill();
    } else {
        const roupa={chef:'#ffffff',garcom:'#222233',pescador:'#3a6a3a'}[e.t];
        ctx.fillStyle='#2a2a3a'; ctx.fillRect(-6+passo,-12,10,7); ctx.fillRect(-6-passo,5,10,7);
        ctx.fillStyle=roupa; ctx.beginPath(); ctx.ellipse(0,0,12,17,0,0,7); ctx.fill(); ctx.strokeStyle='rgba(0,0,0,.3)'; ctx.lineWidth=2; ctx.stroke();
        ctx.fillStyle='#f0c8a0'; ctx.beginPath(); ctx.arc(14,-14,5,0,7); ctx.arc(14,14,5,0,7); ctx.fill();
        if(e.t==='chef'){ ctx.fillStyle='#bbb'; ctx.fillRect(14,10,16,4); ctx.fillStyle='#888'; ctx.beginPath(); ctx.ellipse(30,12,7,5,0,0,7); ctx.fill(); }
        if(e.t==='garcom'){ ctx.fillStyle='#ddd'; ctx.beginPath(); ctx.arc(16,-16,9,0,7); ctx.fill(); }
        if(e.t==='pescador'){ ctx.strokeStyle='#8a5a2a'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(14,14); ctx.lineTo(40,24); ctx.stroke(); }
        ctx.fillStyle='#f0c8a0'; ctx.beginPath(); ctx.arc(0,0,9,0,7); ctx.fill();
        if(e.t==='chef'){ ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(-1,0,10,0,7); ctx.fill(); ctx.strokeStyle='#ddd'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(-1,0,6,0,7); ctx.stroke(); }
        if(e.t==='garcom'){ ctx.fillStyle='#2a1a0a'; ctx.beginPath(); ctx.arc(-1,0,9,Math.PI/2,Math.PI*1.5); ctx.fill(); }
        if(e.t==='pescador'){ ctx.fillStyle='#2a5aaa'; ctx.beginPath(); ctx.arc(-1,0,9,0,7); ctx.fill(); ctx.fillRect(2,-5,9,10); }
    }
    ctx.restore();
    if(e.viu>0.05){ ctx.font='bold 22px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle=e.viu>0.6?'#ff3a3a':'#ffd23a'; ctx.strokeStyle='#000'; ctx.lineWidth=4; const s=e.viu>0.6?'❗':'❓'; ctx.strokeText(s,x,y-30); ctx.fillText(s,x,y-30); }
}
function desenhaCone(e){
    const vendo=e.viu>0.3;
    ctx.fillStyle=vendo?'rgba(255,60,60,.32)':'rgba(255,240,120,.22)';
    if(e.voa){ ctx.beginPath(); ctx.arc(e.x,e.y+16,e.alc,0,7); ctx.fill(); ctx.strokeStyle=vendo?'rgba(255,60,60,.6)':'rgba(255,255,255,.4)'; ctx.setLineDash([6,6]); ctx.lineWidth=2; ctx.stroke(); ctx.setLineDash([]); return; }
    ctx.beginPath(); ctx.moveTo(e.x,e.y);
    const N=16;
    for(let i=0;i<=N;i++){
        const a=e.ang-e.abre+i*(2*e.abre/N); let d=0;
        while(d<e.alc){ d+=8; const x=e.x+Math.cos(a)*d, y=e.y+Math.sin(a)*d; if(paredeXY(x,y)||naNuvem(x,y)) break; }
        ctx.lineTo(e.x+Math.cos(a)*d,e.y+Math.sin(a)*d);
    }
    ctx.closePath(); ctx.fill();
}
let cvEscuro=null;
function desenhaEscuro(){
    if(!cvEscuro){ cvEscuro=document.createElement('canvas'); cvEscuro.width=MW; cvEscuro.height=MH; }
    const g=cvEscuro.getContext('2d');
    g.globalCompositeOperation='source-over'; g.fillStyle='rgba(0,8,6,.86)'; g.fillRect(0,0,MW,MH);
    g.globalCompositeOperation='destination-out';
    const luz=(x,y,r)=>{ const gr=g.createRadialGradient(x,y,r*0.3,x,y,r); gr.addColorStop(0,'rgba(0,0,0,1)'); gr.addColorStop(1,'rgba(0,0,0,0)'); g.fillStyle=gr; g.beginPath(); g.arc(x,y,r,0,7); g.fill(); };
    luz(polvo.x,polvo.y,170);
    for(const e of inimigos) luz(e.x+Math.cos(e.ang)*50,e.y+Math.sin(e.ang)*50,90);
    for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) if(grid[r][c]==='E'||grid[r][c]==='O') luz(c*T+T/2,r*T+T/2,50);
    ctx.drawImage(cvEscuro,0,0);
}
function desenhaMar(){
    for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
        if(grid[r][c]!=='E') continue;
        const x=c*T, y=r*T;
        ctx.fillStyle='#1a5ab0'; ctx.fillRect(x,y,T,T);
        ctx.strokeStyle='rgba(255,255,255,.7)'; ctx.lineWidth=2;
        for(let k=0;k<2;k++){ const yy=y+14+k*18+Math.sin(tempo*3+c+k)*3; ctx.beginPath(); ctx.moveTo(x+4,yy); ctx.quadraticCurveTo(x+T/2,yy-7,x+T-4,yy); ctx.stroke(); }
    }
}
function render(){
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.fillStyle='#0e1a3a'; ctx.fillRect(0,0,W,H);
    if(!F) return;
    ctx.setTransform(DPR*S,0,0,DPR*S,DPR*OX,DPR*OY);
    ctx.drawImage(cvMapa,0,0);
    if(AREAS[F.a].saida==='mar') desenhaMar();
    for(const pe of perolas) if(!pe.pega){ const b=Math.sin(tempo*3+pe.x)*2; ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(pe.x,pe.y+b,8,0,7); ctx.fill(); ctx.fillStyle='#d8e8ff'; ctx.beginPath(); ctx.arc(pe.x+2,pe.y+b+2,4,0,7); ctx.fill(); ctx.fillStyle='rgba(255,255,255,.9)'; ctx.beginPath(); ctx.arc(pe.x-3,pe.y+b-3,2,0,7); ctx.fill(); }
    for(const e of inimigos) desenhaCone(e);
    for(const n of nuvens){ ctx.fillStyle='rgba(40,20,60,'+Math.min(0.85,n.t/1.2)+')'; for(let k=0;k<6;k++){ const a=k*1.05+tempo*0.4; ctx.beginPath(); ctx.arc(n.x+Math.cos(a)*n.r*0.45,n.y+Math.sin(a)*n.r*0.45,n.r*0.6,0,7); ctx.fill(); } }
    if(polvo.pegoT<=0) desenhaPolvo();
    else { ctx.font='34px serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('🍲',polvo.x,polvo.y); }
    for(const e of inimigos) if(!e.voa) desenhaInimigo(e);
    if(AREAS[F.a].escuro) desenhaEscuro();
    for(const e of inimigos) if(e.voa) desenhaInimigo(e);
    for(const q of parts){ ctx.globalAlpha=Math.min(1,q.v*2); ctx.fillStyle=q.cor; ctx.fillRect(q.x-q.r/2,q.y-q.r/2,q.r,q.r); }
    ctx.globalAlpha=1;
    ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.font='bold 22px Arial';
    for(const q of textos){ ctx.globalAlpha=Math.min(1,q.v*2); ctx.lineWidth=5; ctx.strokeStyle='#000'; ctx.strokeText(q.txt,q.x,q.y); ctx.fillStyle=q.cor; ctx.fillText(q.txt,q.x,q.y); }
    ctx.globalAlpha=1;
    if(dicaT>0){
        ctx.globalAlpha=Math.min(1,dicaT); ctx.fillStyle='rgba(0,0,0,.6)'; ctx.fillRect(40,MH/2-34,MW-80,68);
        ctx.font='bold 22px Arial'; ctx.fillStyle='#ffd76a'; ctx.fillText(F.dica,MW/2,MH/2); ctx.globalAlpha=1;
    }
    // ===== HUD (tela) =====
    ctx.setTransform(DPR,0,0,DPR,0,0);
    const pegas=perolas.filter(q=>q.pega).length;
    ctx.font='bold 16px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
    const hud=AREAS[F.a].nome+' • Fase '+(faseN+1)+'   ⚪ '+pegas+'/'+perolas.length+'   💨 '+polvo.tinta+'   🍲 '+polvo.pegos;
    ctx.fillStyle='rgba(0,0,0,.5)'; const lw=ctx.measureText(hud).width+24; rr(ctx,W/2-lw/2,6,lw,30,10); ctx.fill();
    ctx.fillStyle='#fff'; ctx.fillText(hud,W/2,21);
    const esc=escondido();
    ctx.font='bold 15px Arial';
    ctx.fillStyle=esc?'#8aff8a':'#ffb0b0';
    ctx.fillText(esc?'👻 Invisível!':'👀 Visível — fique da cor do chão!',W/2,50);
    // botões de cor + tinta
    const chao=corChao(Math.floor(polvo.x/T),Math.floor(polvo.y/T));
    ctx.globalAlpha=TOUCH?0.6:0.85;
    for(const b of posBotoes()){
        if(b.k==='tinta'){
            ctx.fillStyle=polvo.tinta>0?'rgba(60,30,90,.85)':'rgba(60,60,60,.6)'; ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,7); ctx.fill();
            ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke();
            ctx.font='22px serif'; ctx.fillStyle='#fff'; ctx.fillText('💨',b.x,b.y-4); ctx.font='bold 12px Arial'; ctx.fillText((TOUCH?'':'Espaço ')+'x'+polvo.tinta,b.x,b.y+18);
            continue;
        }
        ctx.fillStyle=CORES[b.k]; ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,7); ctx.fill();
        ctx.lineWidth=polvo.cor===b.k?5:2; ctx.strokeStyle=polvo.cor===b.k?'#fff':'rgba(0,0,0,.4)'; ctx.stroke();
        if(chao===b.k&&polvo.cor!==b.k){ ctx.strokeStyle='rgba(255,255,255,'+(0.5+0.5*Math.sin(tempo*8))+')'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(b.x,b.y,b.r+7,0,7); ctx.stroke(); }
        if(!TOUCH){ ctx.font='bold 14px Arial'; ctx.fillStyle='#fff'; ctx.fillText(String(ORDEM_COR.indexOf(b.k)+1),b.x,b.y); }
    }
    ctx.globalAlpha=1;
    if(stick.id!==null){
        ctx.globalAlpha=0.6; ctx.fillStyle='rgba(0,0,0,.3)'; ctx.beginPath(); ctx.arc(stick.bx,stick.by,R_ST,0,7); ctx.fill();
        const dx=stick.x-stick.bx, dy=stick.y-stick.by, m=Math.hypot(dx,dy), k=m>R_ST?R_ST/m:1;
        ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(stick.bx+dx*k,stick.by+dy*k,24,0,7); ctx.fill(); ctx.globalAlpha=1;
    }
}

// ===== TELAS =====
function montaMenu(){
    $('mEstr').textContent='⭐ '+totalEst()+' / '+(NF*3);
    const botao=(i,A)=>{ const e=save.est[i]||0, ok=liberada(i);
        return '<button class="fase'+(ok?'':' trav')+(e?' feita':'')+'" style="background:'+A.menu+'" '+(ok?'onclick="comecaFase('+i+')"':'')+'>'+(ok?i+1:'🔒')+'<small>'+(ok?'⭐'.repeat(e)+'☆'.repeat(3-e):'')+'</small></button>'; };
    let h='';
    AREAS.forEach((A,a)=>{
        h+='<div class="area"><div class="ta">'+A.nome+'</div><div class="fases">';
        FASES.forEach((f,i)=>{ if(f.a===a) h+=botao(i,A); });
        h+='</div></div>';
    });
    // fases extras: de 20 em 20
    for(let b=FASES.length;b<NF;b+=20){
        const fimB=Math.min(NF,b+20);
        h+='<div class="area"><div class="ta">🌟 Fases Extras '+(b+1)+'–'+fimB+'</div><div class="fases" style="grid-template-columns:repeat(5,1fr)">';
        for(let i=b;i<fimB;i++) h+=botao(i,AREAS[areaDe(i)]);
        h+='</div></div>';
    }
    $('gFases').innerHTML=h;
    $('ajuda').innerHTML=(TOUCH?'📱 Arraste do lado esquerdo pra andar. Toque nas bolinhas coloridas pra mudar de cor e no 💨 pra soltar tinta.'
        :'⌨️ WASD/setas: andar • 1 2 3 4: mudar de cor (ou E) • Espaço: tinta 💨 • 🎮 Controle: Quadrado muda a cor, R2 solta tinta')
        +'<br>🎨 Da MESMA cor do chão você fica INVISÍVEL! A bolinha que pisca é a cor do chão embaixo de você.<br>⭐ Chegar na saída • ⭐ Pegar as 5 pérolas ⚪ • ⭐ Não ser pego nenhuma vez<br>🍄 Cada estrela nova vale 1 Cogu Coin!';
}
function mostraFim(){
    estado='fim'; $('hud').style.display='none';
    const pegas=perolas.filter(q=>q.pega).length, todas=pegas===perolas.length;
    const e=1+(todas?1:0)+(polvo.pegos===0?1:0), antes=save.est[faseN]||0;
    let tx='⚪ Pérolas: '+pegas+'/'+perolas.length+'<br>🍲 Vezes que te pegaram: '+polvo.pegos;
    if(e>antes){
        save.est[faseN]=e; salva();
        const novas=e-antes, bonus=totalEst()===NF*3?10:0;
        try{ if(window.CoguCoins) CoguCoins.ganha(novas+bonus); }catch(er){}
        tx+='<br>+'+(novas+bonus)+' 🍄 Cogu Coins'+(bonus?' (BÔNUS de todas as estrelas!)':'');
    }
    const mar=faseN===FASES.length-1, ultima=faseN===NF-1;
    if(mar) tx+='<br><br>🌊 O Polvilho chegou no MAR! Mas ainda tem 200 FASES EXTRAS te esperando! 🐙🌟';
    else if(ultima) tx+='<br><br>🏆 Você zerou TODAS as '+NF+' fases do Polvo Fujão! LENDA! 🐙👑';
    else if(areaDe(faseN+1)!==F.a) tx+='<br>🗺️ Próxima área: '+AREAS[areaDe(faseN+1)].nome+'!';
    $('fTit').textContent=mar||ultima?'LIBERDADE! 🌊':['','Fugiu! 🐙','Muito bem! 😄','PERFEITO! 🤩'][e];
    $('fEst').textContent='⭐'.repeat(e)+'☆'.repeat(3-e);
    $('fTx').innerHTML=tx;
    $('fProx').style.display=ultima?'none':'inline-block';
    $('fim').style.display='flex';
}
function vaiMenu(){ estado='menu'; $('fim').style.display='none'; $('hud').style.display='none'; $('menu').style.display='flex'; montaMenu(); }
$('fProx').onclick=()=>comecaFase(Math.min(NF-1,faseN+1));
$('fRep').onclick=()=>comecaFase(faseN);
$('fMenu').onclick=vaiMenu;
$('bMenu').onclick=vaiMenu;
$('bRep').onclick=()=>comecaFase(faseN);

// ===== LOOP (começa antes de tudo) =====
let ultimo=performance.now();
function loop(t){
    requestAnimationFrame(loop);
    let dt=(t-ultimo)/1000;
    if(TOUCH && dt<1/32) return;   // 30fps no celular
    ultimo=t; dt=Math.min(dt,0.05);
    if(estado==='jogo') update(dt);
    if(estado!=='menu') render();
}
requestAnimationFrame(loop);
montaMenu();
</script>
