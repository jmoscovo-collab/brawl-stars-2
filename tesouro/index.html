<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Caça ao Tesouro — Cogumelo Games</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
html,body { height:100%; overflow:hidden; }
body { background:#0a3a5c; font-family:Arial,sans-serif; color:#fff; user-select:none; }
canvas { display:block; position:fixed; inset:0; touch-action:none; }
#bCavar { position:fixed; right:18px; bottom:calc(20px + env(safe-area-inset-bottom)); z-index:6; width:92px; height:92px; border-radius:50%;
    border:4px solid #fff; background:linear-gradient(135deg,#b06a2a,#e0954a); color:#fff; font-size:44px; cursor:pointer;
    box-shadow:0 4px 14px rgba(0,0,0,0.5); }
#bCavar:active { transform:scale(0.9); }
#bIndice { position:fixed; top:12px; right:136px; z-index:6; font-size:26px; width:52px; height:52px; border-radius:14px; color:#fff; cursor:pointer; border:2px solid #c86bff; background:rgba(200,107,255,0.25); }
#bLoja, #bIlhas { position:fixed; top:12px; z-index:6; font-size:26px; width:52px; height:52px; border-radius:14px; color:#fff; cursor:pointer; }
#bLoja { right:12px; border:2px solid #ffaa00; background:rgba(255,170,0,0.25); }
#bIlhas { right:74px; border:2px solid #4dff88; background:rgba(77,255,136,0.25); }
.painel { position:fixed; inset:0; z-index:20; background:rgba(4,15,30,0.88); display:none; align-items:center; justify-content:center; }
.painel .cartao { background:linear-gradient(180deg,#14405e,#0b2a42); border:3px solid #ffaa00; border-radius:22px; padding:20px;
    width:min(94vw,420px); max-height:86vh; overflow:auto; text-align:center; }
.painel h2 { font-size:30px; margin-bottom:12px; }
.item { display:flex; align-items:center; gap:10px; width:100%; margin:7px 0; padding:10px 14px; border:2px solid rgba(255,255,255,0.25);
    border-radius:14px; cursor:pointer; background:rgba(255,255,255,0.08); color:#fff; font-size:17px; font-weight:bold; }
.item:active { transform:scale(0.96); }
.item .ic { font-size:30px; }
.item .info { flex:1; text-align:left; }
.item small { display:block; font-weight:normal; font-size:12px; color:#a8cbe0; }
.item.meu { border-color:#4dff88; }
.item.usando { border-color:#ffd700; background:rgba(255,215,0,0.15); }
.item.caro { opacity:0.45; }
.fechar { font-size:24px; margin-top:10px; padding:8px 26px; border:none; border-radius:14px; cursor:pointer; background:#456; color:#fff; }
#achou { position:fixed; inset:0; z-index:25; display:none; align-items:center; justify-content:center; flex-direction:column;
    background:rgba(4,15,30,0.8); text-align:center; }
#achou .ic { font-size:110px; filter:drop-shadow(0 0 30px rgba(255,215,0,0.9)); animation:pula 0.6s ease infinite alternate; }
@keyframes pula { from{ transform:scale(1) rotate(-4deg);} to{ transform:scale(1.15) rotate(4deg);} }
#achou .nome { font-size:30px; font-weight:900; color:#ffd700; margin:10px 0; text-shadow:0 0 16px rgba(255,215,0,0.7); }
#achou .valor { font-size:24px; font-weight:bold; color:#4dff88; }
a.voltar { position:fixed; bottom:8px; left:12px; color:#a8cbe0; text-decoration:none; font-weight:bold; font-size:13px; z-index:6; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<button id="bCavar">⛏️</button>
<button id="bIlhas" onclick="abreIlhas()">🏝️</button>
<button id="bLoja" onclick="abreLoja()">🛒</button>
<button id="bIndice" onclick="abreIndice()">📖</button>
<a class="voltar" href="/">← jogos</a>

<div class="painel" id="loja">
    <div class="cartao">
        <h2>🛒 Loja do Pirata</h2>
        <div id="listaLoja"></div>
        <button class="fechar" onclick="fecha('loja')">❌</button>
    </div>
</div>

<div class="painel" id="ilhas">
    <div class="cartao">
        <h2>🗺️ Ilhas</h2>
        <div id="listaIlhas"></div>
        <button class="fechar" onclick="fecha('ilhas')">❌</button>
    </div>
</div>

<div id="achou" onclick="fechaAchou()">
    <div class="ic" id="achouIc">💎</div>
    <div class="nome" id="achouNome">DIAMANTE!</div>
    <div style="font-size:20px; font-weight:900" id="achouRar">⭐ RARO</div>
    <div class="valor" id="achouValor">+🪙 80</div>
</div>

<div class="painel" id="venda">
    <div class="cartao">
        <h2>💰 Comerciante</h2>
        <div style="font-size:16px; color:#a8cbe0; margin-bottom:8px">"Arrr! Me mostra teus achados, pirata!"</div>
        <div id="vendaInfo" style="font-size:20px; font-weight:bold; margin:10px 0"></div>
        <button class="item" style="justify-content:center; border-color:#4dff88; background:rgba(77,255,136,0.2)" onclick="venderTudo()">💰 VENDER TUDO!</button>
        <button class="fechar" onclick="fecha('venda')">❌</button>
    </div>
</div>

<div class="painel" id="indice">
    <div class="cartao" style="max-width:520px">
        <h2>📖 Índice do Colecionador</h2>
        <div id="indiceProg" style="font-weight:bold; color:#ffd700; margin-bottom:10px"></div>
        <div id="listaIndice" style="display:grid; grid-template-columns:repeat(5,1fr); gap:6px"></div>
        <button class="fechar" onclick="fecha('indice')">❌</button>
    </div>
</div>

<script src="/stats.js?v=358"></script>
<script src="/avisos.js?v=6"></script>
<script>
if (window.initStats) initStats('tesouro');

function lsGet(k,d){ try{ var v=localStorage.getItem('tesouro_'+k); return v===null?d:JSON.parse(v); }catch(e){ return d; } }
function lsSet(k,v){ try{ localStorage.setItem('tesouro_'+k, JSON.stringify(v)); }catch(e){} }

var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
var W, H;
var ehCel = matchMedia('(pointer:coarse)').matches || ('ontouchstart' in window);
var DPR = ehCel ? 1 : Math.min(devicePixelRatio||1, 1.5);
function resize(){
    W = innerWidth; H = innerHeight;
    cv.width = W*DPR; cv.height = H*DPR;
    cv.style.width = W+'px'; cv.style.height = H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener('resize', resize); resize();

// ============ DADOS ============
var ILHAS = [
    { nome:'Praia do Começo',    emoji:'🏖️', custo:0,     areia:'#e8c87a', agua:'#1a7ab8', tesouros:6 },
    { nome:'Ilha da Selva',      emoji:'🌴', custo:300,   areia:'#a8c46a', agua:'#1a8a6a', tesouros:8 },
    { nome:'Deserto Dourado',    emoji:'🏜️', custo:900,   areia:'#e0a84a', agua:'#2a9ac8', tesouros:10 },
    { nome:'Ilha do Gelo',       emoji:'🧊', custo:2500,  areia:'#cfe4f0', agua:'#3a6a9c', tesouros:12 },
    { nome:'Vulcão do Pirata',   emoji:'🌋', custo:7000,  areia:'#8a6a5a', agua:'#c84a2a', tesouros:15 }
];
// 5 raridades — quanto mais rara, mais vale!
var RARIDADES = [
    { nome:'COMUM',    sufixo:'Simples',    mult:1,  cor:'#b8c4cc', peso:0.45 },
    { nome:'INCOMUM',  sufixo:'de Bronze',  mult:3,  cor:'#4dff88', peso:0.25 },
    { nome:'RARO',     sufixo:'de Prata',   mult:8,  cor:'#4da8ff', peso:0.15 },
    { nome:'ÉPICO',    sufixo:'de Ouro',    mult:20, cor:'#c86bff', peso:0.10 },
    { nome:'LENDÁRIO', sufixo:'Encantado',  mult:60, cor:'#ffd700', peso:0.05 }
];
// 42 objetos x 5 raridades = 210 itens colecionáveis!
var BASES = [
    ['🔩','Parafuso',2],   ['🥄','Colher',3],       ['🥾','Bota Perdida',3], ['🍾','Garrafa',4],
    ['🐚','Concha',4],     ['🦴','Osso de Dino',5], ['🪙','Moeda Antiga',5], ['🔔','Sino',6],
    ['🧦','Meia Sumida',6],['🪥','Escova',6],       ['🥫','Lata Velha',7],   ['🍴','Garfo',7],
    ['🕶️','Óculos',8],     ['📿','Colar',8],        ['💍','Anel',9],         ['🫖','Bule',9],
    ['🏮','Lanterna',10],  ['🎭','Máscara',10],     ['♟️','Peça de Xadrez',11],['🪃','Bumerangue',11],
    ['🏺','Vaso Antigo',12],['🗝️','Chave Misteriosa',12],['🪞','Espelho',13],['🕯️','Castiçal',13],
    ['🎺','Trombeta',14],  ['🎻','Violino',15],     ['🧭','Bússola',15],     ['⌚','Relógio',16],
    ['🖼️','Quadro',17],    ['🧿','Amuleto',18],     ['⚓','Âncora',18],      ['🗡️','Adaga',20],
    ['🛡️','Escudo',22],    ['🥇','Medalha',22],     ['⚔️','Espada',24],      ['⛑️','Elmo',24],
    ['📜','Mapa do Pirata',26],['🔮','Bola de Cristal',28],['🏆','Troféu',30],['💰','Saco de Moedas',32],
    ['💎','Diamante',36],  ['👑','Coroa Real',40]
];
function itemDe(b, r){
    var base = BASES[b], rar = RARIDADES[r];
    return { ic: base[0], nome: (base[1] + ' ' + rar.sufixo).toUpperCase(), v: base[2]*rar.mult, rar: rar, id: b*5+r };
}
var PAS = [
    { ic:'🥄', nome:'Colher',        raio:40,  p:0 },
    { ic:'⛏️', nome:'Pá de Madeira', raio:65,  p:120 },
    { ic:'🪓', nome:'Pá de Ferro',   raio:95,  p:500 },
    { ic:'💪', nome:'Pá de Ouro',    raio:140, p:2000 }
];
var MOCHILAS = [
    { ic:'🎒', nome:'Mochila Pequena', cap:15,  p:0 },
    { ic:'🧳', nome:'Mala Média',      cap:35,  p:300 },
    { ic:'🛒', nome:'Carrinho',        cap:80,  p:1200 },
    { ic:'🐪', nome:'Camelo Cargueiro',cap:200, p:5000 }
];
var DETECTORES = [
    { ic:'📻', nome:'Detector Velho',   alc:170, p:0 },
    { ic:'📡', nome:'Detector Bom',     alc:280, p:200 },
    { ic:'🛰️', nome:'Super Detector',   alc:450, p:800 },
    { ic:'🔮', nome:'Detector Mágico',  alc:9999, p:3000 }
];

var moedas = lsGet('moedas', 0);
var ilhaAtual = lsGet('ilha', 0);
var ilhasMinhas = lsGet('ilhasMinhas', [true]);
var pasMinhas = lsGet('pas', [true]);
var pa = lsGet('pa', 0);
var detsMinhas = lsGet('dets', [true]);
var det = lsGet('det', 0);
var achados = lsGet('achados', 0); // total de tesouros já achados (recorde de pirata)
var ima = lsGet('ima', false); // 🧲 puxa ferro e moeda sozinho!
var colecao = lsGet('colecao', {}); // 📖 índice: id do item -> quantas vezes achou
var mochilasMinhas = lsGet('mochilas', [true]);
var mochilaEq = lsGet('mochilaEq', 0);
var mochila = lsGet('mochila', []); // itens guardados {b, r} — vende no comerciante!
function capMochila(){ return MOCHILAS[mochilaEq].cap; }
function valorMochila(){ var v=0; mochila.forEach(function(m){ v += itemDe(m.b,m.r).v; }); return v; }
function guardaNaColecao(item){
    colecao[item.id] = (colecao[item.id] || 0) + 1;
    lsSet('colecao', colecao);
}

// ============ ILHA ============
var tesouros = [], buracos = [], pl, alvo, ultimoT = 0, brilhoAchado = 0;
var MW = 0, MH = 0, camX = 0, camY = 0, palmeiras = [], comerciantes = [], pertoVenda = false;
function rnd(seed){
    var a = seed >>> 0;
    return function(){ a|=0; a=a+0x6D2B79F5|0; var t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; };
}
var rodada = lsGet('rodada', 1); // cada ilha muda os esconderijos a cada rodada!
function montaIlha(){
    var I = ILHAS[ilhaAtual];
    var r = rnd(ilhaAtual*991 + rodada*37 + 7);
    tesouros = []; buracos = [];
    // ilha GIGANTE — bem maior que a tela!
    MW = 2400 + ilhaAtual*600;
    MH = 1700 + ilhaAtual*400;
    palmeiras = [];
    for(var i=0;i<14 + ilhaAtual*4;i++) palmeiras.push({ x: 120 + r()*(MW-240), y: 120 + r()*(MH-240) });
    comerciantes = [];
    for(var i=0;i<2 + Math.floor(ilhaAtual/2);i++) comerciantes.push({ x: 200 + r()*(MW-400), y: 200 + r()*(MH-400) });
    var margem = 130;
    for(var i=0;i<I.tesouros;i++){
        // sorteia objeto + raridade (lendário é raríssimo!)
        var b = Math.floor(r()*BASES.length);
        var sorte = r(), acc = 0, rar = 0;
        for(var k=0;k<RARIDADES.length;k++){ acc += RARIDADES[k].peso; if(sorte < acc){ rar = k; break; } }
        tesouros.push({ x: margem + r()*(MW-margem*2), y: margem + r()*(MH-margem*2), b:b, r:rar, achado:false });
    }
    pl = { x:MW/2, y:MH/2, dir:1, cavando:0 };
    alvo = { x:pl.x, y:pl.y };
}
montaIlha();

// ============ SOM (bipes do detector) ============
var actx = null, bipT = 0;
function bipe(freq, dur){
    try{
        if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
        var o = actx.createOscillator(), g = actx.createGain();
        o.type='square'; o.frequency.value = freq;
        g.gain.setValueAtTime(0.08, actx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
        o.connect(g); g.connect(actx.destination);
        o.start(); o.stop(actx.currentTime + dur);
    }catch(e){}
}

// ============ CONTROLES ============
// no computador: SÓ teclado (setas/WASD) — o mouse não manda no explorador!
// no celular: toca na areia que ele anda até lá
if(ehCel){
    cv.addEventListener('pointerdown', function(e){ alvo.x = e.clientX + camX; alvo.y = e.clientY + camY; });
    cv.addEventListener('pointermove', function(e){ if(e.buttons || e.pressure > 0) { alvo.x = e.clientX + camX; alvo.y = e.clientY + camY; } });
}
var tec = {};
addEventListener('keydown', function(e){
    tec[e.key.toLowerCase()] = true;
    var k = e.key.toLowerCase();
    if(k===' '||k==='e'||k==='j'){ e.preventDefault(); cavar(); }
});
addEventListener('keyup', function(e){ tec[e.key.toLowerCase()] = false; });
document.getElementById('bCavar').addEventListener('pointerdown', function(e){ e.preventDefault(); cavar(); });

// ============ CAVAR ============
function cavar(){
    if(pl.cavando > 0) return;
    pl.cavando = 0.5;
    buracos.push({ x:pl.x, y:pl.y + 14 });
    if(buracos.length > 40) buracos.shift();
    var raio = PAS[pa].raio;
    var achou = null;
    for(var i=0;i<tesouros.length;i++){
        var t = tesouros[i];
        if(!t.achado && Math.hypot(t.x-pl.x, t.y-pl.y) < raio){ achou = t; break; }
    }
    if(achou && mochila.length >= capMochila()){
        // mochila CHEIA! o tesouro fica esperando — vai vender no comerciante!
        bipe(140, 0.25);
        document.getElementById('achouIc').textContent = '🎒';
        document.getElementById('achouNome').textContent = 'MOCHILA CHEIA!';
        document.getElementById('achouNome').style.color = '#ff6666';
        document.getElementById('achouRar').textContent = 'ache um comerciante 💰 pra vender';
        document.getElementById('achouRar').style.color = '#a8cbe0';
        document.getElementById('achouValor').textContent = '';
        document.getElementById('achou').style.display = 'flex';
        setTimeout(fechaAchou, 1500);
        return;
    }
    if(achou){
        achou.achado = true;
        var item = itemDe(achou.b, achou.r);
        mochila.push({ b:achou.b, r:achou.r });
        achados++;
        guardaNaColecao(item);
        lsSet('mochila', mochila); lsSet('achados', achados);
        brilhoAchado = 1;
        bipe(880, 0.15); setTimeout(function(){ bipe(1320, 0.3); }, 130);
        document.getElementById('achouIc').textContent = item.ic;
        document.getElementById('achouNome').textContent = item.nome + '!';
        document.getElementById('achouNome').style.color = item.rar.cor;
        document.getElementById('achouRar').textContent = '⭐ ' + item.rar.nome;
        document.getElementById('achouRar').style.color = item.rar.cor;
        document.getElementById('achouValor').textContent = '🎒 guardou! (vale 🪙 ' + item.v + ')';
        document.getElementById('achou').style.display = 'flex';
        setTimeout(fechaAchou, 1600);
        // achou TODOS = ilha limpa! novos tesouros são enterrados
        if(tesouros.every(function(t){ return t.achado; })){
            setTimeout(function(){
                rodada++; lsSet('rodada', rodada);
                montaIlha();
            }, 1800);
        }
    } else {
        bipe(160, 0.12);
    }
}
function fechaAchou(){ document.getElementById('achou').style.display = 'none'; }
window.fechaAchou = fechaAchou;

// ============ LOJA / ILHAS ============
function abreLoja(){
    var el = document.getElementById('listaLoja');
    el.innerHTML = '<small style="color:#a8cbe0">⛏️ PÁS (cavam uma área maior)</small>';
    PAS.forEach(function(s,i){
        var b = document.createElement('button');
        b.className = 'item' + (pasMinhas[i] ? ' meu' : (moedas < s.p ? ' caro' : '')) + (pa===i ? ' usando' : '');
        b.innerHTML = '<span class="ic">'+s.ic+'</span><span class="info">'+s.nome+'<small>cava área de '+s.raio+'</small></span>' +
            (pasMinhas[i] ? (pa===i?'✅':'👆') : '🪙'+s.p.toLocaleString('pt-BR'));
        b.onclick = function(){
            if(pasMinhas[i]){ pa=i; lsSet('pa',pa); }
            else if(moedas>=s.p){ moedas-=s.p; pasMinhas[i]=true; pa=i; lsSet('moedas',moedas); lsSet('pas',pasMinhas); lsSet('pa',pa); }
            abreLoja();
        };
        el.appendChild(b);
    });
    var t2 = document.createElement('small'); t2.style.color='#a8cbe0'; t2.textContent='📡 DETECTORES (sentem o tesouro de mais longe)';
    el.appendChild(t2);
    DETECTORES.forEach(function(s,i){
        var b = document.createElement('button');
        b.className = 'item' + (detsMinhas[i] ? ' meu' : (moedas < s.p ? ' caro' : '')) + (det===i ? ' usando' : '');
        b.innerHTML = '<span class="ic">'+s.ic+'</span><span class="info">'+s.nome+'<small>'+(s.alc>5000?'sente a ilha INTEIRA':'sente a '+s.alc+' de distância')+'</small></span>' +
            (detsMinhas[i] ? (det===i?'✅':'👆') : '🪙'+s.p.toLocaleString('pt-BR'));
        b.onclick = function(){
            if(detsMinhas[i]){ det=i; lsSet('det',det); }
            else if(moedas>=s.p){ moedas-=s.p; detsMinhas[i]=true; det=i; lsSet('moedas',moedas); lsSet('dets',detsMinhas); lsSet('det',det); }
            abreLoja();
        };
        el.appendChild(b);
    });
    var t4 = document.createElement('small'); t4.style.color='#a8cbe0'; t4.textContent='🎒 MOCHILAS (carregam mais tesouros)';
    el.appendChild(t4);
    MOCHILAS.forEach(function(s2,i){
        var b = document.createElement('button');
        b.className = 'item' + (mochilasMinhas[i] ? ' meu' : (moedas < s2.p ? ' caro' : '')) + (mochilaEq===i ? ' usando' : '');
        b.innerHTML = '<span class="ic">'+s2.ic+'</span><span class="info">'+s2.nome+'<small>cabem '+s2.cap+' tesouros</small></span>' +
            (mochilasMinhas[i] ? (mochilaEq===i?'✅':'👆') : '🪙'+s2.p.toLocaleString('pt-BR'));
        b.onclick = function(){
            if(mochilasMinhas[i]){ mochilaEq=i; lsSet('mochilaEq',mochilaEq); }
            else if(moedas>=s2.p){ moedas-=s2.p; mochilasMinhas[i]=true; mochilaEq=i; lsSet('moedas',moedas); lsSet('mochilas',mochilasMinhas); lsSet('mochilaEq',mochilaEq); }
            abreLoja();
        };
        el.appendChild(b);
    });
    var t3 = document.createElement('small'); t3.style.color='#a8cbe0'; t3.textContent='🧲 EXTRAS';
    el.appendChild(t3);
    var bi = document.createElement('button');
    bi.className = 'item' + (ima ? ' meu usando' : (moedas < 800 ? ' caro' : ''));
    bi.innerHTML = '<span class="ic">🧲</span><span class="info">Ímã de Metais<small>puxa 🔩 ferro e 🪙 moeda sozinho, sem cavar!</small></span>' + (ima ? '✅' : '🪙800');
    bi.onclick = function(){
        if(!ima && moedas >= 800){ moedas -= 800; ima = true; lsSet('moedas',moedas); lsSet('ima',ima); }
        abreLoja();
    };
    el.appendChild(bi);
    document.getElementById('loja').style.display = 'flex';
}
function abreIlhas(){
    var el = document.getElementById('listaIlhas');
    el.innerHTML = '';
    ILHAS.forEach(function(I,i){
        var b = document.createElement('button');
        b.className = 'item' + (ilhasMinhas[i] ? ' meu' : (moedas < I.custo ? ' caro' : '')) + (ilhaAtual===i ? ' usando' : '');
        b.innerHTML = '<span class="ic">'+I.emoji+'</span><span class="info">'+I.nome+'<small>'+I.tesouros+' tesouros enterrados</small></span>' +
            (ilhasMinhas[i] ? (ilhaAtual===i?'✅':'⛵') : '🪙'+I.custo.toLocaleString('pt-BR'));
        b.onclick = function(){
            if(ilhasMinhas[i]){ ilhaAtual=i; lsSet('ilha',ilhaAtual); montaIlha(); fecha('ilhas'); }
            else if(moedas>=I.custo){ moedas-=I.custo; ilhasMinhas[i]=true; ilhaAtual=i; lsSet('moedas',moedas); lsSet('ilhasMinhas',ilhasMinhas); lsSet('ilha',ilhaAtual); montaIlha(); fecha('ilhas'); }
            else abreIlhas();
        };
        el.appendChild(b);
    });
    document.getElementById('ilhas').style.display = 'flex';
}
function fecha(id){ document.getElementById(id).style.display = 'none'; }
function abreVenda(){
    document.getElementById('vendaInfo').innerHTML = '🎒 ' + mochila.length + ' tesouros na mochila<br>valem <span style="color:#ffd700">🪙 ' + valorMochila().toLocaleString('pt-BR') + '</span>';
    document.getElementById('venda').style.display = 'flex';
}
function venderTudo(){
    var v = valorMochila();
    moedas += v;
    mochila = [];
    lsSet('moedas', moedas); lsSet('mochila', mochila);
    bipe(700, 0.12); setTimeout(function(){ bipe(1000, 0.2); }, 120);
    brilhoAchado = 0.6;
    fecha('venda');
}
function abreIndice(){
    var el = document.getElementById('listaIndice');
    el.innerHTML = '';
    var total = BASES.length * RARIDADES.length, tenho = 0;
    for(var b=0;b<BASES.length;b++){
        for(var r=0;r<RARIDADES.length;r++){
            var it = itemDe(b, r);
            var qtd = colecao[it.id] || 0;
            if(qtd > 0) tenho++;
            var d = document.createElement('div');
            d.style.cssText = 'border:2px solid ' + (qtd>0 ? it.rar.cor : 'rgba(255,255,255,0.15)') +
                '; border-radius:10px; padding:6px 2px; text-align:center; background:rgba(0,0,0,0.25);' +
                (qtd>0 ? '' : 'opacity:0.45; filter:grayscale(1);');
            d.innerHTML = '<div style="font-size:24px">' + (qtd>0 ? it.ic : '❓') + '</div>' +
                '<div style="font-size:8.5px; font-weight:bold; color:' + (qtd>0?it.rar.cor:'#889') + '; line-height:1.1">' +
                (qtd>0 ? it.nome : '???') + '</div>' +
                (qtd>1 ? '<div style="font-size:9px; color:#a8cbe0">x' + qtd + '</div>' : '');
            el.appendChild(d);
        }
    }
    document.getElementById('indiceProg').textContent = '🏆 ' + tenho + ' / ' + total + ' itens descobertos';
    document.getElementById('indice').style.display = 'flex';
}
window.abreLoja = abreLoja; window.abreIlhas = abreIlhas; window.fecha = fecha; window.abreIndice = abreIndice; window.abreVenda = abreVenda; window.venderTudo = venderTudo;

// ============ LOOP ============
function loop(agora){
    var dt = Math.min((agora-ultimoT)/1000, 0.05);
    ultimoT = agora;

    var V = 300*dt;
    if(tec['arrowleft']||tec['a']) { alvo.x = pl.x - 60; alvo.y = pl.y; }
    if(tec['arrowright']||tec['d']) { alvo.x = pl.x + 60; alvo.y = pl.y; }
    if(tec['arrowup']||tec['w']) { alvo.y = pl.y - 60; alvo.x = pl.x; }
    if(tec['arrowdown']||tec['s']) { alvo.y = pl.y + 60; alvo.x = pl.x; }

    var dx = alvo.x - pl.x, dy = alvo.y - pl.y, dist = Math.hypot(dx,dy);
    pl.andando = dist > 6 && pl.cavando <= 0;
    if(dist > 6 && pl.cavando <= 0){
        pl.x += dx/dist * Math.min(240*dt, dist);
        pl.y += dy/dist * Math.min(240*dt, dist);
        if(Math.abs(dx) > 4) pl.dir = dx > 0 ? 1 : -1;
    }
    pl.x = Math.max(70, Math.min(MW-70, pl.x));
    pl.y = Math.max(80, Math.min(MH-80, pl.y));
    // câmera acompanha o explorador
    camX = Math.max(0, Math.min(pl.x - W/2, MW - W));
    camY = Math.max(0, Math.min(pl.y - H/2, MH - H));
    if(pl.cavando > 0) pl.cavando -= dt;
    if(brilhoAchado > 0) brilhoAchado -= dt;

    // 🧲 ímã: ferro e moeda enterrados PERTO voam pro seu bolso!
    if(ima){
        tesouros.forEach(function(t){
            if(!t.achado && t.r === 0 && mochila.length < capMochila() && Math.hypot(t.x-pl.x, t.y-pl.y) < 190){
                t.achado = true;
                var item = itemDe(t.b, t.r);
                mochila.push({ b:t.b, r:t.r });
                achados++;
                guardaNaColecao(item);
                lsSet('mochila', mochila); lsSet('achados', achados);
                brilhoAchado = 0.35;
                bipe(700, 0.1);
                if(tesouros.every(function(x){ return x.achado; })){
                    setTimeout(function(){ rodada++; lsSet('rodada', rodada); montaIlha(); }, 1200);
                }
            }
        });
    }
    // chegou perto de um comerciante? abre a venda!
    var pertoAgora = false;
    comerciantes.forEach(function(c){ if(Math.hypot(c.x-pl.x, c.y-pl.y) < 75) pertoAgora = true; });
    if(pertoAgora && !pertoVenda && document.getElementById('venda').style.display !== 'flex') abreVenda();
    pertoVenda = pertoAgora;
    // detector: quanto mais perto do tesouro, mais rápido apita
    var maisPerto = 1e9;
    tesouros.forEach(function(t){ if(!t.achado) maisPerto = Math.min(maisPerto, Math.hypot(t.x-pl.x, t.y-pl.y)); });
    var alc = DETECTORES[det].alc;
    var sinal = maisPerto < alc ? 1 - (maisPerto/alc) : 0; // 0 (longe) a 1 (em cima!)
    bipT -= dt;
    if(sinal > 0 && bipT <= 0){
        bipe(300 + sinal*500, 0.06);
        bipT = 0.8 - sinal*0.68;
    }

    desenha(agora, sinal, maisPerto);
    requestAnimationFrame(loop);
}

// ============ DESENHO ============
function desenha(agora, sinal, maisPerto){
    var I = ILHAS[ilhaAtual];
    // água
    ctx.fillStyle = I.agua; ctx.fillRect(0,0,W,H);
    ctx.save();
    ctx.translate(-camX, -camY);
    // areia da ilha GIGANTE
    ctx.fillStyle = I.areia;
    ctx.beginPath();
    var m = 40, rr = 80;
    ctx.moveTo(m+rr, m);
    ctx.arcTo(MW-m, m, MW-m, MH-m, rr); ctx.arcTo(MW-m, MH-m, m, MH-m, rr);
    ctx.arcTo(m, MH-m, m, m, rr); ctx.arcTo(m, m, MW-m, m, rr);
    ctx.closePath(); ctx.fill();
    // pontinhos de areia (só os que aparecem na tela)
    ctx.fillStyle = 'rgba(0,0,0,0.07)';
    var gx0 = Math.floor(camX/140)*140, gy0 = Math.floor(camY/140)*140;
    for(var gx=gx0; gx<camX+W+140; gx+=140){
        for(var gy=gy0; gy<camY+H+140; gy+=140){
            ctx.fillRect(gx + (gx*7+gy*13)%90, gy + (gx*11+gy*3)%90, 3, 3);
        }
    }
    // árvores do Davi espalhadas pela ilha (pinheiro ou copuda, sorteado pelo lugar)
    palmeiras.forEach(function(pm){
        if(pm.x < camX-90 || pm.x > camX+W+90 || pm.y < camY-140 || pm.y > camY+H+60) return;
        var img = ((Math.floor(pm.x) + Math.floor(pm.y)) % 2 === 0) ? imgPinheiro : imgArvore;
        if(img.complete && img.naturalWidth > 0){
            ctx.imageSmoothingEnabled = false;
            var th = 110, tw = th * img.naturalWidth / img.naturalHeight;
            ctx.fillStyle = 'rgba(0,0,0,0.15)';
            ctx.beginPath(); ctx.ellipse(pm.x, pm.y+2, tw*0.35, 7, 0, 0, 7); ctx.fill();
            ctx.drawImage(img, pm.x - tw/2, pm.y - th, tw, th);
        } else {
            palmeira(pm.x, pm.y);
        }
    });
    // comerciantes — o velhinho pixelado de touca vermelha!
    comerciantes.forEach(function(c){
        if(c.x < camX-80 || c.x > camX+W+80 || c.y < camY-100 || c.y > camY+H+100) return;
        desenhaComerciante(c.x, c.y, agora);
        ctx.font = '22px Arial'; ctx.textAlign = 'center';
        ctx.fillText('💰', c.x, c.y - 92 + Math.sin(agora/300)*4);
    });
    // buracos cavados
    buracos.forEach(function(b){
        ctx.fillStyle = 'rgba(90,60,30,0.55)';
        ctx.beginPath(); ctx.ellipse(b.x, b.y, 16, 9, 0, 0, 7); ctx.fill();
    });
    // brilho dourado quando acha
    if(brilhoAchado > 0){
        ctx.fillStyle = 'rgba(255,215,0,' + brilhoAchado*0.25 + ')';
        ctx.fillRect(0,0,W,H);
    }
    // jogador: o PERSONAGEM desenhado pelo Davi no Gemini — com animação de andar!
    if(imgPersonagem.complete && imgPersonagem.naturalWidth > 0){
        ctx.save();
        ctx.translate(pl.x, pl.y);
        // sombra
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.beginPath(); ctx.ellipse(0, 2, 20, 6, 0, 0, 7); ctx.fill();
        if(pl.dir < 0) ctx.scale(-1,1);
        var passo = pl.andando ? Math.sin(agora/90) : 0;
        var pulo = pl.andando ? Math.abs(Math.sin(agora/90))*5 : 0; // quica ao andar
        ctx.rotate(passo * 0.09); // balança pros lados como passinhos
        if(pl.cavando > 0) ctx.rotate(Math.sin(pl.cavando*20)*0.35); // cavando com força!
        ctx.imageSmoothingEnabled = false;
        var h = 78, w = h * imgPersonagem.naturalWidth / imgPersonagem.naturalHeight;
        ctx.drawImage(imgPersonagem, -w/2, -h - pulo, w, h);
        if(pl.cavando > 0){ ctx.font = '26px Arial'; ctx.textAlign='center'; ctx.fillText('⛏️', 24, -18); }
        ctx.restore();
    } else {
    // (desenho reserva enquanto a imagem carrega)
    ctx.save();
    // (dentro do mundo, a câmera já foi aplicada)
    ctx.translate(pl.x, pl.y);
    if(pl.dir < 0) ctx.scale(-1,1);
    var cavAng = pl.cavando > 0 ? Math.sin(pl.cavando*20)*0.5 : 0;
    // sombra
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath(); ctx.ellipse(0, 18, 18, 6, 0, 0, 7); ctx.fill();
    // perninhas
    ctx.fillStyle = '#3a5a8c';
    ctx.fillRect(-9, 2, 7, 15); ctx.fillRect(3, 2, 7, 15);
    // corpo
    ctx.fillStyle = '#e05a3a';
    ctx.beginPath(); ctx.ellipse(0, -8, 13, 13, 0, 0, 7); ctx.fill();
    // cabeça
    ctx.fillStyle = '#f0b088';
    ctx.beginPath(); ctx.arc(0, -26, 10, 0, 7); ctx.fill();
    // chapéu de explorador
    ctx.fillStyle = '#c8a04a';
    ctx.beginPath(); ctx.ellipse(0, -31, 15, 5, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(0, -33, 9, Math.PI, 0); ctx.fill();
    // olho
    ctx.fillStyle = '#222';
    ctx.beginPath(); ctx.arc(5, -27, 1.8, 0, 7); ctx.fill();
    // braço + detector (ou pá cavando)
    ctx.save();
    ctx.translate(9, -10);
    ctx.rotate(0.5 + cavAng);
    ctx.strokeStyle = '#f0b088'; ctx.lineWidth = 5; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(14, 8); ctx.stroke();
    if(pl.cavando > 0){
        ctx.font = '22px Arial'; ctx.fillText('⛏️', 22, 16);
    } else {
        // cabo do detector + disco
        ctx.strokeStyle = '#888'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(14, 8); ctx.lineTo(30, 24); ctx.stroke();
        ctx.fillStyle = sinal > 0.6 ? '#ff5a3a' : '#a0a8b0';
        ctx.beginPath(); ctx.ellipse(33, 27, 9, 4.5, 0.7, 0, 7); ctx.fill();
    }
    ctx.restore();
    ctx.restore();
    }
    ctx.restore(); // sai da câmera — HUD fica parado na tela

    // ===== HUD =====
    ctx.textAlign='left'; ctx.font='bold 22px Arial'; ctx.fillStyle='#fff';
    ctx.fillText('🪙 ' + moedas.toLocaleString('pt-BR'), 14, 32);
    var faltam = tesouros.filter(function(t){ return !t.achado; }).length;
    ctx.fillText('💰 faltam ' + faltam, 14, 60);
    ctx.fillText(PAS[pa].ic + ' ' + DETECTORES[det].ic, 14, 88);
    var cheia = mochila.length >= capMochila();
    ctx.fillStyle = cheia ? '#ff6666' : '#fff';
    ctx.fillText(MOCHILAS[mochilaEq].ic + ' ' + mochila.length + '/' + capMochila() + (cheia ? ' CHEIA!' : ''), 14, 148);
    ctx.fillStyle = '#fff';
    // medidor do detector 📶
    var barras = Math.ceil(sinal*5);
    for(var i=0;i<5;i++){
        ctx.fillStyle = i < barras ? (sinal>0.7?'#ff5a3a':sinal>0.4?'#ffd24a':'#4dff88') : 'rgba(255,255,255,0.25)';
        ctx.fillRect(14 + i*16, 118 - i*4, 12, 10 + i*4);
    }
    if(sinal >= 0.92){
        ctx.font='bold 26px Arial'; ctx.fillStyle='#ff5a3a';
        ctx.fillText('⛏️ CAVA AQUI!!!', 100, 126);
    }
}
function px(x, y, w, h, cor){ ctx.fillStyle = cor; ctx.fillRect(Math.round(x), Math.round(y), w, h); }
var imgPersonagem = new Image();
imgPersonagem.src = 'personagem.png';
// árvores desenhadas pelo Davi no Gemini!
var imgPinheiro = new Image(); imgPinheiro.src = 'pinheiro.png';
var imgArvore = new Image(); imgArvore.src = 'arvore.png';
// a imagem oficial do comerciante (feita pelo Davi com o Gemini!)
var imgComerciante = new Image();
imgComerciante.src = 'comerciante.png';
function desenhaComerciante(cx, cy, agora){
    if(imgComerciante.complete && imgComerciante.naturalWidth > 0){
        ctx.fillStyle='rgba(0,0,0,0.2)';
        ctx.beginPath(); ctx.ellipse(cx, cy+2, 24, 6, 0, 0, 7); ctx.fill();
        ctx.imageSmoothingEnabled = false;
        var h = 84, w = h * imgComerciante.naturalWidth / imgComerciante.naturalHeight;
        ctx.drawImage(imgComerciante, cx - w/2, cy - h, w, h);
        return;
    }
    // pixel-art: velhinho de touca vermelha, barba e avental (cada "pixel" = 3x3)
    var u = 3, x = cx - 8*u, y = cy - 26*u; // origem no canto superior esquerdo
    function P(gx, gy, gw, gh, cor){ px(x + gx*u, y + gy*u, gw*u, gh*u, cor); }
    var CONTORNO='#2f241c', TOUCA='#7a3b34', PELE='#e8b48a', BARBA='#cfcfc9',
        CAMISA='#7a5c40', AVENTAL='#b39a74', AVENTAL2='#a08a66', CINTO='#5a3a24',
        BOLSA='#8a6844', CALCA='#6b5136', BOTA='#4e3826', FIVELA='#c8c0a8';
    // sombra no chão
    ctx.fillStyle='rgba(0,0,0,0.2)';
    ctx.beginPath(); ctx.ellipse(cx, cy+2, 22, 6, 0, 0, 7); ctx.fill();
    // ===== touca =====
    P(5,0,6,1,CONTORNO); P(4,1,8,2,TOUCA); P(3,3,10,1,TOUCA); P(3,4,10,1,CONTORNO);
    // ===== rosto =====
    P(4,5,8,3,PELE);
    P(6,6,1,1,CONTORNO); P(9,6,1,1,CONTORNO); // olhos
    // ===== barba grisalha =====
    P(4,8,8,3,BARBA); P(5,11,6,1,BARBA);
    P(7,8,2,1,'#8a8a86'); // boca escondida na barba
    // ===== corpo: camisa + avental =====
    P(3,12,10,2,CAMISA);
    P(5,12,6,1,AVENTAL2); // alça do avental
    P(4,14,8,6,AVENTAL);
    P(4,19,8,1,AVENTAL2);
    // ===== braço esquerdo (na cintura) =====
    P(2,13,2,4,CAMISA); P(2,17,2,1,PELE);
    // ===== braço direito LEVANTADO acenando =====
    var acena = Math.floor(agora/400)%2 === 0 ? 0 : 1;
    P(12,12,2,2,CAMISA);
    P(13,10-acena,2,2,PELE); // mãozinha acenando!
    // ===== cinto com fivela e bolsinhas =====
    P(4,16,8,1,CINTO); P(7,16,2,1,FIVELA);
    P(3,17,2,2,BOLSA); P(11,17,2,2,BOLSA);
    // ===== pernas =====
    P(5,20,3,3,CALCA); P(9,20,3,3,CALCA);
    // ===== botas =====
    P(4,23,4,2,BOTA); P(9,23,4,2,BOTA);
    P(4,25,4,1,CONTORNO); P(9,25,4,1,CONTORNO);
}
function palmeira(x, y){
    ctx.strokeStyle = '#8a5a2a'; ctx.lineWidth = 6; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(x, y+18); ctx.quadraticCurveTo(x+6, y-4, x+2, y-18); ctx.stroke();
    ctx.fillStyle = '#2f8a43';
    for(var i=0;i<5;i++){
        var a = -Math.PI/2 + (i-2)*0.55;
        ctx.beginPath();
        ctx.ellipse(x+2 + Math.cos(a)*14, y-18 + Math.sin(a)*8, 13, 5, a, 0, 7);
        ctx.fill();
    }
    ctx.fillStyle = '#7a4a1a';
    ctx.beginPath(); ctx.arc(x+2, y-14, 3, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(x+8, y-16, 3, 0, 7); ctx.fill();
}

ultimoT = performance.now();
requestAnimationFrame(loop);
