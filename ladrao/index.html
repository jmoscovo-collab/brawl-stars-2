<script>
'use strict';
// ================================================================
// Polícia VS Ladrão — Cogumelo Games (jogo do Davi)
// ================================================================

// ==GEN_START==  (gerador procedural — testável em node)
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
var FLOOR=470, CEIL=120;
function genLevel(lvl){
  var rng=mulberry32(lvl*9301+49297);
  var width=Math.min(1500+lvl*45,12500);
  var diff=Math.min(lvl/250,1);
  var tema=Math.floor(rng()*6);          // cada fase tem uma casa com cara diferente!
  var perfil=Math.floor(rng()*4);        // 0=normal 1=cheia de laser 2=cheia de policial 3=janelas+canos
  var obs=[]; var x=380;
  var copSpd=1.1+diff*1.1;           // sempre < velocidade do jogador (3.6)
  var copVis=130+diff*120;
  function gap(){return 200-40*diff+rng()*120}
  var kinds=['window','laserL','laserH','cop','pipe'];
  var pipePending=null;
  while(x<width-360){
    var r=rng(); var k;
    if(perfil===1){ if(r<0.12)k='window'; else if(r<0.45)k='laserL'; else if(r<0.78)k='laserH'; else if(r<0.92)k='cop'; else k='pipe'; }
    else if(perfil===2){ if(r<0.15)k='window'; else if(r<0.28)k='laserL'; else if(r<0.4)k='laserH'; else if(r<0.9)k='cop'; else k='pipe'; }
    else if(perfil===3){ if(r<0.4)k='window'; else if(r<0.52)k='laserL'; else if(r<0.64)k='laserH'; else if(r<0.78)k='cop'; else k='pipe'; }
    else { if(r<0.22)k='window'; else if(r<0.42)k='laserL'; else if(r<0.62)k='laserH'; else if(r<0.88)k='cop'; else k='pipe'; }
    if(k==='pipe'&&(pipePending||x>width-900))k='laserL';
    if(k==='window'){ obs.push({type:'window',x:x,w:90}); x+=90+gap(); }
    else if(k==='laserL'){ obs.push({type:'laserL',x:x,w:10,h:22}); x+=10+gap(); }  // pula por cima
    else if(k==='laserH'){ obs.push({type:'laserH',x:x,w:10,h:42}); x+=10+gap(); }  // passa AGACHADO (vão 42 > 36) ou rastejando
    else if(k==='cop'){
      var zone=150+rng()*130;
      obs.push({type:'cabinet',x:x,w:46});                       // GARANTIA: armário antes do policial
      var zx=x+46+70;
      obs.push({type:'cop',x:zx,x2:zx+zone,spd:copSpd*(0.8+rng()*0.4),vis:copVis*(0.8+rng()*0.4)});
      x=zx+zone+gap();
    }
    else { // pipe: cano de entrada + saída mais à frente (atalho seguro)
      var ent=x, skip=280+rng()*220;
      obs.push({type:'pipeIn',x:ent,w:44,out:ent+skip});
      obs.push({type:'pipeOut',x:ent+skip,w:44});
      x=ent+44+gap();  // hazards continuam sendo gerados normalmente; saída fica num ponto seguro checado abaixo
    }
  }
  // afasta saídas de cano de qualquer hazard (garantia de spawn seguro)
  for(var i=0;i<obs.length;i++){
    var o=obs[i];
    if(o.type!=='pipeOut')continue;
    var moved=true, guard=0;
    while(moved&&guard++<50){
      moved=false;
      for(var j=0;j<obs.length;j++){
        var h=obs[j];
        var hx1,hx2;
        if(h.type==='cop'){hx1=h.x-h.vis-40;hx2=h.x2+h.vis+40}
        else if(h.type==='laserL'||h.type==='laserH'||h.type==='window'){hx1=h.x-50;hx2=h.x+(h.w||10)+50}
        else continue;
        if(o.x+44>hx1&&o.x<hx2){o.x=hx2+10;moved=true}
      }
    }
    if(o.x>width-200)o.x=width-200;
    // atualiza referência do pipeIn correspondente
    for(var j2=0;j2<obs.length;j2++)if(obs[j2].type==='pipeIn'&&Math.abs(obs[j2].out-(o._orig||o.x))<1)obs[j2].out=o.x;
  }
  // liga pipeIn->pipeOut por ordem (mais simples e robusto)
  var ins=obs.filter(function(o){return o.type==='pipeIn'});
  var outs=obs.filter(function(o){return o.type==='pipeOut'});
  for(var p=0;p<ins.length;p++)if(outs[p])ins[p].out=outs[p].x;
  // BOTÃO VERMELHO escondido: em algumas fases a porta nasce trancada!
  var temBotao = lvl>=3 && rng()<0.4;
  if(temBotao){
    // esconde numa posição aleatória do meio da casa (pertinho do chão, pequenininho)
    var bx = 500 + rng()*(width-1200);
    // não deixa em cima de laser/cop
    for(var bi=0;bi<obs.length;bi++){
      var bo=obs[bi];
      if((bo.type==='laserL'||bo.type==='laserH')&&Math.abs(bo.x-bx)<70) bx=bo.x+90;
      if(bo.type==='cop'&&bx>bo.x-60&&bx<bo.x2+60) bx=bo.x2+80;
    }
    obs.push({type:'botao',x:Math.min(bx,width-420),w:18});
  }
  obs.push({type:'exit',x:width-120,w:70,trancada:temBotao});
  return {width:width,obstacles:obs,tema:tema};
}
if(typeof module!=='undefined'&&module.exports){module.exports={genLevel:genLevel,mulberry32:mulberry32,FLOOR:FLOOR};}
// ==GEN_END==

// ---------------- persistência ----------------
function LS(k,v){ if(v===undefined){try{return localStorage.getItem('ladrao_'+k)}catch(e){return null}} try{localStorage.setItem('ladrao_'+k,v)}catch(e){} }
var coins=parseInt(LS('coins')||'0',10);
var won=JSON.parse(LS('won')||'[]');
var skinsOwned=JSON.parse(LS('skins')||'["base"]');
var curSkin=LS('skin')||'base';
var abilsOwned=JSON.parse(LS('abils')||'[]');
var curAbil=LS('abil')||'';
var ctrlMode=LS('ctrl'); // 'pc' | 'mob'
function saveAll(){LS('coins',coins);LS('won',JSON.stringify(won));LS('skins',JSON.stringify(skinsOwned));LS('skin',curSkin);LS('abils',JSON.stringify(abilsOwned));LS('abil',curAbil);}

// ---------------- catálogo ----------------
var SKINS=[
 {id:'base',  nm:'Ladrãozinho Clássico', pc:0,    ds:'Roupa listrada e máscara. Um fofo.'},
 {id:'pato',  nm:'Cabeça de Pato de Borracha', pc:100, ds:'Quack! Ninguém desconfia de um pato.'},
 {id:'tenis', nm:'Tênis Gigante', pc:200, ds:'Pés enormes, estilo gigante.'},
 {id:'azul',  nm:'Corredor Azul Turbo', pc:350, ds:'Rápido demais pra câmera pegar!'},
 {id:'banana',nm:'Fantasia de Banana', pc:500, ds:'Cuidado pra não escorregar em si mesmo.'},
 {id:'tv',    nm:'Cabeça de Televisão', pc:700, ds:'Passando o canal do crime... de fofura.'},
 {id:'robo',  nm:'Robô Enferrujado', pc:900, ds:'Bip bop, range ao andar.'},
 {id:'pirata',nm:'Pirata com Tapa-olho', pc:1200, ds:'Arrr! Vim buscar o tesouro.'},
 {id:'ninja', nm:'Ninja Todo Preto', pc:1500, ds:'Silencioso como uma sombra.'},
 {id:'astro', nm:'Astronauta', pc:1800, ds:'Roubando... corações espaciais.'},
 {id:'mumia', nm:'Múmia', pc:2200, ds:'Enrolado, mas chega lá.'}
];
var ABILS=[
 {id:'escudo',nm:'Escudo',emo:'🛡️',pc:300, ds:'5 segundos sem poder ser pego.'},
 {id:'vida',  nm:'Vida Extra',emo:'❤️',pc:500, ds:'Uma segunda chance no nível (automática).'},
 {id:'turbo', nm:'Turbo',emo:'⚡',pc:600, ds:'Velocidade 2x por 5 segundos.'},
 {id:'invis', nm:'Invisibilidade',emo:'👻',pc:800, ds:'3 segundos invisível pros policiais e janelas.'},
 {id:'asas',  nm:'Asas Ninja',emo:'🪽',pc:1200, ds:'VOA por 3 segundos e fica imortal voando!'}
];

// ---------------- som (WebAudio) ----------------
var AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}return AC}
function beep(f,d,type,vol){var c=ac();if(!c)return;var o=c.createOscillator(),g=c.createGain();o.type=type||'square';o.frequency.value=f;g.gain.value=vol||0.06;g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+d);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d)}
function sJump(){beep(300,.12,'square');beep(500,.12,'square')}
function sCoin(){beep(880,.1,'triangle',.08);setTimeout(function(){beep(1320,.15,'triangle',.08)},80)}
function sCaught(){beep(200,.3,'sawtooth',.1);setTimeout(function(){beep(150,.4,'sawtooth',.1)},150)}
function sWin(){[523,659,784,1046].forEach(function(f,i){setTimeout(function(){beep(f,.18,'triangle',.09)},i*120)})}
function sAbil(){beep(700,.15,'sine',.08);setTimeout(function(){beep(1000,.2,'sine',.08)},100)}
function sPipe(){beep(400,.1,'sine',.08);setTimeout(function(){beep(250,.15,'sine',.08)},90)}

// ---------------- telas ----------------
function $(id){return document.getElementById(id)}
function show(id){['scCtrl','scMenu','scShop','scGame'].forEach(function(s){$(s).classList.toggle('hidden',s!==id)})}

$('btnPC').onclick=function(){ctrlMode='pc';LS('ctrl','pc');buildMenu();show('scMenu')};
$('btnMob').onclick=function(){ctrlMode='mob';LS('ctrl','mob');buildMenu();show('scMenu')};
$('btnCtrl').onclick=function(){show('scCtrl')};
$('btnShop').onclick=function(){buildShop();show('scShop')};
$('btnBack').onclick=function(){buildMenu();show('scMenu')};
$('btnMenu').onclick=function(){stopGame();buildMenu();show('scMenu')};

function maxUnlocked(){var m=1;for(var i=1;i<=250;i++){if(won.indexOf(i)>=0&&i+1>m)m=i+1}return Math.min(m,250)}
function buildMenu(){
  $('mCoins').textContent=coins;
  $('ctrlHint').innerHTML= ctrlMode==='pc'
   ? '💻 <b>A/D</b> andar · <b>ESPAÇO</b> pular · <b>F</b> arrastar (rastejar) · <b>CLIQUE do mouse</b> agachar · <b>E</b> habilidade'
   : '📱 Use os botões na tela: ◀ ▶ andar · ⤒ pular · 🙇 agachar · 🐍 arrastar · E habilidade';
  var g=$('grid');g.innerHTML='';
  var mx=maxUnlocked();
  for(var i=1;i<=250;i++){
    var b=document.createElement('button');
    if(won.indexOf(i)>=0){b.textContent='⭐'+i;b.className='won'}
    else if(i<=mx){b.textContent=i}
    else{b.textContent='🔒';b.className='lock';b.disabled=true}
    b.dataset.lvl=i;
    b.onclick=function(){startLevel(parseInt(this.dataset.lvl,10))};
    g.appendChild(b);
  }
}
function buildShop(){
  $('sCoins').textContent=coins;
  var sg=$('skinGrid');sg.innerHTML='';
  SKINS.forEach(function(s){
    var c=document.createElement('div');c.className='card';
    var ownedS=skinsOwned.indexOf(s.id)>=0;
    c.innerHTML='<div class="nm">'+s.nm+'</div><div class="ds">'+s.ds+'</div><div class="pc">'+(s.pc?'🪙 '+s.pc:'Grátis')+'</div>';
    var pv=document.createElement('canvas');pv.width=84;pv.height=100;pv.className='prev';
    paintPreview(pv,s.id);
    c.insertBefore(pv,c.firstChild);
    var b=document.createElement('button');
    if(!ownedS){b.textContent='Comprar';b.className='buy';b.disabled=coins<s.pc;
      b.onclick=function(){coins-=s.pc;skinsOwned.push(s.id);curSkin=s.id;saveAll();sCoin();buildShop()};}
    else if(curSkin===s.id){b.textContent='✔ Usando';b.className='eq';b.disabled=true;}
    else{b.textContent='Usar';b.className='eq';b.onclick=function(){curSkin=s.id;saveAll();buildShop()};}
    c.appendChild(b);sg.appendChild(c);
  });
  var ag=$('abilGrid');ag.innerHTML='';
  ABILS.forEach(function(a){
    var c=document.createElement('div');c.className='card';
    var ownedA=abilsOwned.indexOf(a.id)>=0;
    c.innerHTML='<div class="emo">'+a.emo+'</div><div class="nm">'+a.nm+'</div><div class="ds">'+a.ds+'</div><div class="pc">🪙 '+a.pc+'</div>';
    var b=document.createElement('button');
    if(!ownedA){b.textContent='Comprar';b.className='buy';b.disabled=coins<a.pc;
      b.onclick=function(){coins-=a.pc;abilsOwned.push(a.id);curAbil=a.id;saveAll();sCoin();buildShop()};}
    else if(curAbil===a.id){b.textContent='✔ Equipada';b.className='eq';
      b.onclick=function(){curAbil='';saveAll();buildShop()};}
    else{b.textContent='Equipar';b.className='eq';b.onclick=function(){curAbil=a.id;saveAll();buildShop()};}
    c.appendChild(b);ag.appendChild(c);
  });
}

// ---------------- input ----------------
var keys={L:false,R:false,J:false,C:false,X:false};
document.addEventListener('keydown',function(e){
  if($('scGame').classList.contains('hidden'))return;
  var k=e.key.toLowerCase();
  if(k==='a'||k==='arrowleft')keys.L=true;
  if(k==='d'||k==='arrowright')keys.R=true;
  if(k===' '||k==='w'||k==='arrowup'){keys.J=true;e.preventDefault()}
  if(k==='s'||k==='arrowdown'){keys.C=true;e.preventDefault()}
  if(k==='f')keys.X=true;
  if(k==='e')useAbility();
});
document.addEventListener('keyup',function(e){
  var k=e.key.toLowerCase();
  if(k==='a'||k==='arrowleft')keys.L=false;
  if(k==='d'||k==='arrowright')keys.R=false;
  if(k===' '||k==='w'||k==='arrowup')keys.J=false;
  if(k==='s'||k==='arrowdown')keys.C=false;
  if(k==='f')keys.X=false;
});
var cv=$('cv');
cv.addEventListener('mousedown',function(e){if(ctrlMode==='pc'){keys.C=true;e.preventDefault()}});
document.addEventListener('mouseup',function(){keys.C=false});
cv.addEventListener('contextmenu',function(e){e.preventDefault()});
function bindHold(id,k){var el=$(id);
  ['pointerdown','touchstart'].forEach(function(ev){el.addEventListener(ev,function(e){keys[k]=true;e.preventDefault()},{passive:false})});
  ['pointerup','pointercancel','pointerleave','touchend'].forEach(function(ev){el.addEventListener(ev,function(e){keys[k]=false;e.preventDefault()},{passive:false})});
}
bindHold('tL','L');bindHold('tR','R');bindHold('tJ','J');bindHold('tC','C');bindHold('tX','X');
$('btnE').addEventListener('pointerdown',function(e){useAbility();e.preventDefault()});

// ---------------- jogo ----------------
var ctx=cv.getContext('2d');
var G=null; // estado do jogo corrente
var rafId=0;

function startLevel(lvl){
  var data=genLevel(lvl);
  G={lvl:lvl,W:data.width,obs:data.obstacles,tema:data.tema||0,
     p:{x:80,y:FLOOR,vx:0,vy:0,w:28,h:56,pose:'stand',face:1,onGround:true,flying:false,botaoApertado:false},
     cam:0,t:0,dead:false,winFlag:false,
     abilUsed:false,abilTimer:0,abilActive:'',extraLife:(curAbil==='vida'&&abilsOwned.indexOf('vida')>=0),
     pipeCD:0,alertT:0,msg:''};
  // reset cops
  G.obs.forEach(function(o){if(o.type==='cop'){o.cx=o.x;o.dir=1;o.phT=0;o.distracted=true}});
  $('hLvl').textContent=lvl;$('hCoins').textContent=coins;
  $('hAbil').textContent= curAbil? (ABILS.find(function(a){return a.id===curAbil}).emo+' pronta'):'';
  $('touch').classList.toggle('hidden',ctrlMode!=='mob');
  $('btnE').classList.toggle('hidden',!curAbil);
  $('ovl').classList.add('hidden');
  show('scGame');
  keys={L:false,R:false,J:false,C:false,X:false};
  cancelAnimationFrame(rafId);
  rafId=requestAnimationFrame(loop);
}
function stopGame(){cancelAnimationFrame(rafId);G=null}

function useAbility(){
  if(!G||G.dead||G.winFlag)return;
  if(!curAbil||curAbil==='vida'||G.abilUsed)return;
  G.abilUsed=true;G.abilActive=curAbil;
  G.abilTimer= curAbil==='escudo'?300: curAbil==='turbo'?300: 180; // frames (~60fps)
  if(curAbil==='asas'){G.p.flying=true}
  $('hAbil').textContent='';
  sAbil();
}

function caught(reason){
  if(G.dead||G.winFlag)return;
  var p=G.p;
  var immune= G.abilActive==='escudo' || (G.abilActive==='asas'&&p.flying);
  if(immune)return;
  if(G.extraLife){G.extraLife=false;G.abilActive='escudo';G.abilTimer=120;sAbil();G.msg='❤️ Vida extra usada!';G.alertT=90;return}
  G.dead=true;sCaught();
  setTimeout(function(){
    showOvl('👮 Te pegaram!','Ih! '+reason+' O ladrãozinho foi levado pra tomar um suquinho na delegacia. Tenta de novo!','🔄 Tentar de novo',function(){startLevel(G.lvl)});
  },500);
}
function winLevel(){
  if(G.winFlag||G.dead)return;
  G.winFlag=true;sWin();
  var first=won.indexOf(G.lvl)<0;
  var reward=(10+Math.floor(G.lvl*0.8))*(first?2:1);
  coins+=reward;
  if(first)won.push(G.lvl);
  saveAll();
  var nxt=G.lvl<250?G.lvl+1:null;
  setTimeout(function(){
    showOvl('🎉 Conseguiu!','Você atravessou a casa sem ser visto e ganhou 🪙 '+reward+' moedas'+(first?' (dobro por ser a primeira vez!)':'')+'!',
      nxt?('▶ Nível '+nxt):'🏆 Zerou o jogo!',
      function(){ if(nxt)startLevel(nxt); else {stopGame();buildMenu();show('scMenu')} });
  },400);
}
function showOvl(t,m,btnA,fnA){
  $('ovTitle').textContent=t;$('ovMsg').textContent=m;
  $('ovA').textContent=btnA;$('ovA').onclick=function(){$('ovl').classList.add('hidden');fnA()};
  $('ovB').onclick=function(){$('ovl').classList.add('hidden');stopGame();buildMenu();show('scMenu')};
  $('ovl').classList.remove('hidden');
}

// física / regras
var SPD=3.6,GRAV=0.5,JUMPV=-11;
function loop(){
  if(!G)return;
  rafId=requestAnimationFrame(loop);
  var p=G.p;G.t++;
  if(G.pipeCD>0)G.pipeCD--;
  if(G.alertT>0)G.alertT--;
  if(G.abilTimer>0){G.abilTimer--;if(G.abilTimer===0){if(G.abilActive==='asas')p.flying=false;G.abilActive=''}}

  if(!G.dead&&!G.winFlag){
    // pose
    if(p.flying)p.pose='fly';
    else if(keys.X&&p.onGround)p.pose='crawl';
    else if(keys.C&&p.onGround)p.pose='crouch';
    else p.pose='stand';
    p.h= p.pose==='crawl'?22 : p.pose==='crouch'?36 : 56;
    var spd=SPD*(G.abilActive==='turbo'?2:1)*(p.pose==='crawl'?0.45:p.pose==='crouch'?0.6:1);
    p.vx=0;
    if(keys.L){p.vx=-spd;p.face=-1}
    if(keys.R){p.vx=spd;p.face=1}
    if(p.flying){ p.vy = keys.J? -3.2 : (keys.C?3.2:0); }
    else{
      if(keys.J&&p.onGround&&p.pose==='stand'){p.vy=JUMPV;p.onGround=false;sJump()}
      p.vy+=GRAV;
    }
    p.x+=p.vx;p.y+=p.vy;
    if(p.y>=FLOOR){p.y=FLOOR;p.vy=0;p.onGround=true}else p.onGround=false;
    if(p.y-p.h<CEIL)p.y=CEIL+p.h;
    if(p.x<20)p.x=20; if(p.x>G.W-30)p.x=G.W-30;

    // escondido no armário?
    var hidden=false;
    G.obs.forEach(function(o){
      if(o.type==='cabinet'&&(keys.C||keys.X)&&p.x+p.w>o.x&&p.x<o.x+o.w&&p.onGround)hidden=true;
    });
    G.hidden=hidden;
    var invis=G.abilActive==='invis';

    // obstáculos
    for(var i=0;i<G.obs.length;i++){
      var o=G.obs[i];
      if(o.type==='window'){
        if(!hidden&&!invis&&p.x+p.w>o.x&&p.x<o.x+o.w&&p.pose!=='crouch'&&p.pose!=='crawl')
          {caught('Um policial te viu pela janela!');break}
      }
      else if(o.type==='laserL'){ // do chão até FLOOR-h*? baixo: pula por cima
        var topL=FLOOR-o.h;
        if(p.x+p.w>o.x&&p.x<o.x+o.w&&p.y>topL){caught('Você encostou no laser e o alarme tocou!');break}
      }
      else if(o.type==='laserH'){ // do teto até FLOOR-h: rasteja por baixo
        var botH=FLOOR-o.h;
        if(p.x+p.w>o.x&&p.x<o.x+o.w&&p.y-p.h<botH){caught('Você encostou no laser e o alarme tocou!');break}
      }
      else if(o.type==='cop'){
        // ciclo: 240 frames distraído no celular (dá pra passar!) + 180 patrulhando
        o.phT=(o.phT||0)+1; if(o.phT>=420)o.phT=0;
        o.distracted=o.phT<240;
        if(!o.distracted){
          o.cx+=o.spd*o.dir;
          if(o.cx>o.x2){o.cx=o.x2;o.dir=-1}
          if(o.cx<o.x){o.cx=o.x;o.dir=1}
        }
        if(!hidden&&!invis&&!p.flying&&!o.distracted){
          var vis=o.vis*(p.pose==='crawl'?0.5:p.pose==='crouch'?0.7:1);
          var dx=p.x-o.cx;
          var inFront=(o.dir===1&&dx>0&&dx<vis)||(o.dir===-1&&dx<0&&dx>-vis);
          var near=Math.abs(dx)<26&&p.y>FLOOR-60; // esbarrou nele (dá pra pular por cima)
          if(inFront||near){caught('O policial te viu e gritou "PARADO AÍ, AMIGUINHO!"');break}
        }
      }
      else if(o.type==='pipeIn'){
        if(keys.X&&G.pipeCD===0&&p.onGround&&p.x+p.w>o.x&&p.x<o.x+o.w){
          p.x=o.out+8;p.y=FLOOR;G.pipeCD=60;sPipe();G.msg='🕳️ Uhuu, viagem de cano!';G.alertT=80;
        }
      }
      else if(o.type==='botao'){
        if(!G.botaoApertado&&p.x+p.w>o.x&&p.x<o.x+o.w+10&&(keys.C||keys.X)){
          G.botaoApertado=true;sPipe();G.msg='🔴 CLICK! A porta destrancou! 🔓';G.alertT=120;
        }
      }
      else if(o.type==='exit'){
        if(p.x+p.w>o.x+20){
          if(o.trancada&&!G.botaoApertado){
            if(G.alertT<=0){G.msg='🔒 Trancada! Ache o BOTÃO VERMELHO escondido!';G.alertT=110;}
          } else winLevel();
        }
      }
    }
  }
  // câmera
  G.cam=Math.max(0,Math.min(p.x-320,G.W-960));
  draw();
}

// ---------------- desenho ----------------
function rr(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}
function draw(){
  var c=G.cam,p=G.p;
  // fundo casa — cada fase tem um tema!
  var TEMAS=[
    {parede:'#2b3358',chao:'#5b4636',rodape:'#3d2e23',teto:'#1c2340'},  // casa azul clássica
    {parede:'#4a2b3a',chao:'#3a2a2a',rodape:'#241818',teto:'#2e1a26'},  // mansão vinho
    {parede:'#23422e',chao:'#6b5a3a',rodape:'#463b25',teto:'#152a1d'},  // casa de campo verde
    {parede:'#3a3a3f',chao:'#2e2e33',rodape:'#1c1c20',teto:'#26262b'},  // BANCO cinza chique
    {parede:'#4a3a1c',chao:'#7a5230',rodape:'#4d341e',teto:'#33280f'},  // museu dourado
    {parede:'#1e2f4a',chao:'#31425e',rodape:'#1c2438',teto:'#141e30'}   // laboratório noturno
  ];
  var T=TEMAS[G.tema||0];
  rr(0,0,960,540,T.parede);                  // parede
  rr(0,FLOOR,960,540-FLOOR,T.chao);          // chão
  rr(0,FLOOR,960,8,T.rodape);
  rr(0,CEIL-24,960,24,T.teto);               // teto
  // divisórias de cômodos (visuais)
  for(var wx=600;wx<G.W;wx+=560){
    var sx=wx-c; if(sx<-60||sx>1020)continue;
    rr(sx,CEIL,14,110,'#222a4d'); rr(sx,FLOOR-90,14,90,'#222a4d');
  }
  // quadros fofos
  for(var qx=250;qx<G.W;qx+=730){
    var q=qx-c;if(q<-60||q>1000)continue;
    rr(q,200,54,44,'#caa46a');rr(q+6,206,42,32,'#8fd3f4');
    ctx.font='20px sans-serif';ctx.fillText(['🐱','🌻','🐶','🍕'][Math.floor(qx/730)%4],q+16,230);
  }
  // obstáculos
  ctx.font='22px sans-serif';
  G.obs.forEach(function(o){
    var x=o.x-c; if(x<-400||x>1400)return;
    if(o.type==='window'){
      rr(x,180,o.w,160,'#0f1830');rr(x+4,184,o.w-8,152,'#9fd8ff');
      rr(x+o.w/2-3,184,6,152,'#0f1830');rr(x+4,256,o.w-8,6,'#0f1830');
      // policial olhando de fora (mesmo estilo do de dentro — busto na janela)
      var wx=x+o.w/2-13;
      rr(wx,314,26,22,'#1d4ed8');                                  // corpo apoiado no parapeito
      rr(wx+3,294,20,20,'#ffd9b3');                                // rosto
      rr(wx,288,26,8,'#12275e');rr(wx+8,282,10,8,'#12275e');       // quepe
      ctx.fillStyle='#000';ctx.fillRect(wx+7,300,4,4);ctx.fillRect(wx+15,300,4,4); // olhos
      if(G.t%40<20)rr(wx+11,276,4,4,'#f00');                       // luzinha
      ctx.fillStyle='#fff';ctx.font='12px sans-serif';ctx.fillText('abaixe!',x+18,346);ctx.font='22px sans-serif';
    }
    else if(o.type==='laserL'){
      rr(x-4,FLOOR-o.h-8,18,8,'#888');
      ctx.fillStyle='rgba(255,40,60,.85)';ctx.fillRect(x,FLOOR-o.h,10,o.h);
      if(G.t%20<10){ctx.fillStyle='rgba(255,120,120,.4)';ctx.fillRect(x-3,FLOOR-o.h,16,o.h)}
    }
    else if(o.type==='laserH'){
      rr(x-4,CEIL,18,8,'#888');
      ctx.fillStyle='rgba(255,40,60,.85)';ctx.fillRect(x,CEIL,10,FLOOR-o.h-CEIL);
      if(G.t%20<10){ctx.fillStyle='rgba(255,120,120,.4)';ctx.fillRect(x-3,CEIL,16,FLOOR-o.h-CEIL)}
    }
    else if(o.type==='cabinet'){
      rr(x,FLOOR-92,o.w,92,'#8a5a2b');rr(x+3,FLOOR-88,o.w-6,84,'#a06a34');
      rr(x+o.w/2-2,FLOOR-88,4,84,'#6d4522');rr(x+o.w/2-10,FLOOR-52,5,10,'#3a2a15');rr(x+o.w/2+5,FLOOR-52,5,10,'#3a2a15');

    }
    else if(o.type==='cop'){
      // faixa de patrulha
      ctx.fillStyle='rgba(255,255,255,.05)';ctx.fillRect(o.x-c,FLOOR-4,o.x2-o.x,4);
      var cx=o.cx-c;
      // cone de visão (some quando distraído no celular)
      if(!o.distracted){
        var vis=o.vis;
        ctx.fillStyle='rgba(255,230,80,.13)';
        ctx.beginPath();ctx.moveTo(cx+14,FLOOR-40);
        ctx.lineTo(cx+14+o.dir*vis,FLOOR-70);ctx.lineTo(cx+14+o.dir*vis,FLOOR);
        ctx.lineTo(cx+14,FLOOR);ctx.closePath();ctx.fill();
      }
      // corpo do policial
      rr(cx,FLOOR-52,26,34,'#1d4ed8');rr(cx,FLOOR-18,10,18,'#12275e');rr(cx+16,FLOOR-18,10,18,'#12275e');
      rr(cx+3,FLOOR-70,20,20,'#ffd9b3');rr(cx,FLOOR-76,26,8,'#12275e');rr(cx+8,FLOOR-82,10,8,'#12275e');
      ctx.fillStyle='#000';ctx.fillRect(cx+(o.dir===1?15:6),FLOOR-64,4,4);
      if(G.t%40<20)rr(cx+11,FLOOR-88,4,4,'#f00');
      if(o.distracted){ctx.font='18px sans-serif';ctx.fillText('📱',cx+(o.dir===1?24:-14),FLOOR-46);ctx.fillText('💤',cx+6,FLOOR-92);ctx.font='22px sans-serif'}
    }
    else if(o.type==='pipeIn'||o.type==='pipeOut'){
      rr(x,FLOOR-46,o.w,46,'#2e7d32');rr(x-4,FLOOR-52,o.w+8,10,'#1b5e20');
      ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(x+o.w/2,FLOOR-42,o.w/2-8,6,0,0,7);ctx.fill();
      ctx.fillStyle='#fff';ctx.font='11px sans-serif';ctx.fillText(o.type==='pipeIn'?'🐍 entrar':'saída',x+2,FLOOR+14);ctx.font='22px sans-serif';
    }
    else if(o.type==='botao'){
      if(!G.botaoApertado){
        rr(x,FLOOR-16,o.w,16,'#3a3a4a');                              // caixinha discreta
        ctx.fillStyle='#7a1020';ctx.beginPath();ctx.arc(x+o.w/2,FLOOR-16,6,Math.PI,0);ctx.fill(); // botão vermelho escuro (camuflado!)
      } else {
        rr(x,FLOOR-16,o.w,16,'#3a3a4a');
        ctx.fillStyle='#2e7d32';ctx.beginPath();ctx.arc(x+o.w/2,FLOOR-14,6,Math.PI,0);ctx.fill(); // apertado = verde
      }
    }
    else if(o.type==='exit'){
      if(o.trancada&&!G.botaoApertado){ctx.font='18px sans-serif';ctx.fillText('🔒',x+o.w/2-9,FLOOR-160);ctx.font='22px sans-serif';}
      rr(x,FLOOR-130,o.w,130,'#7b4b1e');rr(x+8,FLOOR-122,o.w-16,122,'#9c6428');
      rr(x+o.w-20,FLOOR-70,8,8,'#ffd166');
      ctx.fillText('🚪',x+o.w/2-12,FLOOR-140);
      ctx.fillStyle='#80ed99';ctx.font='14px sans-serif';ctx.fillText('SAÍDA!',x+8,FLOOR-135);ctx.font='22px sans-serif';
    }
  });
  // jogador
  if(!(G.hidden)) drawThief(p.x-c,p.y,p);
  // efeitos de habilidade
  if(G.abilActive){
    ctx.font='20px sans-serif';
    var em=G.abilActive==='escudo'?'🛡️':G.abilActive==='turbo'?'⚡':G.abilActive==='invis'?'👻':'🪽';
    ctx.fillText(em,p.x-c-2,p.y-p.h-14);
    if(G.abilActive==='escudo'){ctx.strokeStyle='rgba(120,200,255,.8)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x-c+14,p.y-p.h/2,34,0,7);ctx.stroke()}
  }
  if(G.alertT>0&&G.msg){ctx.fillStyle='#ffd166';ctx.font='18px sans-serif';ctx.fillText(G.msg,p.x-c-40,p.y-p.h-34)}
  // progresso
  ctx.fillStyle='rgba(255,255,255,.2)';ctx.fillRect(20,16,920,8);
  ctx.fillStyle='#80ed99';ctx.fillRect(20,16,920*Math.min(p.x/G.W,1),8);
}
// ---------- ladrão & skins (100% desenhados, sem emoji) ----------
function oRect(g,x,y,w,h,fill){g.fillStyle=fill;g.fillRect(x,y,w,h);g.strokeStyle='rgba(15,18,30,.55)';g.lineWidth=1.5;g.strokeRect(x+.75,y+.75,w-1.5,h-1.5)}
function olhos(g,cx,ey,face,opt){ // dois olhos expressivos olhando pro lado do movimento
  opt=opt||{};var off=face*2;
  if(opt.glow){g.fillStyle=opt.glow;g.fillRect(cx-8+off,ey-1,7,7);g.fillRect(cx+1+off,ey-1,7,7)}
  g.fillStyle=opt.branco||'#fff';g.fillRect(cx-7+off,ey,5,5);g.fillRect(cx+2+off,ey,5,5);
  g.fillStyle=opt.iris||'#111';g.fillRect(cx-6+off+face,ey+1,3,3);g.fillRect(cx+3+off+face,ey+1,3,3);
}
function drawSkinHead(g,cx,ty,sk,face,t){
  var x=cx-10,y=ty;
  if(sk==='pato'){ // cabeça amarela redonda + bico laranja achatado
    g.fillStyle='#ffd23f';g.beginPath();g.arc(cx,y+7,11,0,7);g.fill();
    g.strokeStyle='rgba(15,18,30,.55)';g.lineWidth=1.5;g.stroke();
    var bx=face===1?cx+6:cx-16;
    g.fillStyle='#ff8c1a';g.fillRect(bx,y+6,10,4);g.fillRect(bx+(face===1?1:-1),y+10,9,2);
    g.strokeRect(bx+.75,y+6.75,8.5,4.5);
    g.fillStyle='#fff';g.fillRect(cx+face*3-3,y,6,6);
    g.fillStyle='#111';g.fillRect(cx+face*4-1,y+2,3,3);
    return;
  }
  if(sk==='tv'){ // TV retrô cinza, tela azul com olhos de pixel, antenas
    g.strokeStyle='#8b93a5';g.lineWidth=2;
    g.beginPath();g.moveTo(cx-4,y-2);g.lineTo(cx-9,y-11);g.moveTo(cx+4,y-2);g.lineTo(cx+9,y-11);g.stroke();
    g.fillStyle='#cfd6e4';g.fillRect(cx-11,y-13,4,4);g.fillRect(cx+7,y-13,4,4);
    oRect(g,x-3,y-2,26,20,'#9aa0a8');
    oRect(g,x,y+1,20,14,'#2a63ff');
    g.fillStyle='#bfe3ff';
    g.fillRect(x+4+face,y+5,4,4);g.fillRect(x+12+face,y+5,4,4);
    g.fillRect(x+7,y+11,6,2);
    g.fillStyle='#6f767f';g.fillRect(x+20,y+3,2,2);g.fillRect(x+20,y+7,2,2);
    return;
  }
  if(sk==='robo'){ // cabeça metálica enferrujada, olho de LED piscando
    var led=(Math.floor(t/20)%2===0)?'#ff5252':'#ff9e9e';
    g.strokeStyle='#666';g.lineWidth=2;g.beginPath();g.moveTo(cx,y-1);g.lineTo(cx,y-7);g.stroke();
    g.fillStyle=led;g.fillRect(cx-2,y-10,4,4);
    oRect(g,x-2,y-1,24,18,'#a05a1e');
    g.fillStyle='#c77b33';g.fillRect(x,y+1,20,4);
    g.fillStyle='#7c3f10';g.fillRect(x+2,y+12,7,3);g.fillRect(x+14,y+3,5,3);
    g.fillStyle='#3a1c05';g.fillRect(cx-5+face*2,y+5,10,7);
    g.fillStyle=led;g.fillRect(cx-3+face*2,y+7,6,3);
    return;
  }
  if(sk==='astro'){ // capacete de vidro com reflexo
    g.fillStyle='#fff';g.beginPath();g.arc(cx,y+8,12,0,7);g.fill();
    g.strokeStyle='#aab';g.lineWidth=2;g.stroke();
    g.fillStyle='#9fd8ff';g.beginPath();g.arc(cx+face,y+8,9,0,7);g.fill();
    g.fillStyle='#ffd9b3';g.fillRect(cx-5+face,y+5,10,7);
    olhos(g,cx+face,y+6,face);
    g.strokeStyle='rgba(255,255,255,.85)';g.lineWidth=2;
    g.beginPath();g.arc(cx-3,y+5,5,3.6,4.9);g.stroke();
    return;
  }
  if(sk==='ninja'){ // faixa vermelha, olhos brilhando
    oRect(g,x,y,20,16,'#181820');
    g.fillStyle='#d62828';g.fillRect(x-1,y+2,22,4);
    g.fillStyle='#a51f1f';g.fillRect(face===1?x-6:x+20,y+3,6,3);
    olhos(g,cx,y+8,face,{branco:'#ffe36e',iris:'#7a4a00',glow:'rgba(255,220,90,.35)'});
    return;
  }
  if(sk==='mumia'){ // olhos aparecendo entre as faixas
    oRect(g,x,y,20,16,'#f3ecdc');
    g.fillStyle='#2b2117';g.fillRect(x+1,y+5,18,7);
    olhos(g,cx,y+6,face);
    g.strokeStyle='#cfc4ab';g.lineWidth=2;
    g.beginPath();g.moveTo(x,y+2);g.lineTo(x+20,y+4);g.moveTo(x,y+13);g.lineTo(x+20,y+15);g.stroke();
    return;
  }
  if(sk==='pirata'){ // bandana de bolinhas, tapa-olho, barba
    oRect(g,x,y,20,16,'#ffd9b3');
    g.fillStyle='#d62828';g.fillRect(x-1,y-3,22,7);
    g.fillStyle='#fff';g.fillRect(x+3,y-1,2,2);g.fillRect(x+9,y-2,2,2);g.fillRect(x+15,y-1,2,2);
    g.fillStyle='#a51f1f';g.fillRect(face===1?x-6:x+20,y-1,6,4);
    g.strokeStyle='#111';g.lineWidth=2;
    g.beginPath();g.moveTo(x,y+7);g.lineTo(x+20,y+5);g.stroke();
    g.fillStyle='#111';g.fillRect(cx+face*3-3,y+3,7,6);      // tapa-olho
    g.fillStyle='#fff';g.fillRect(cx-face*4-2,y+4,5,5);      // olho bom
    g.fillStyle='#111';g.fillRect(cx-face*4-1+face,y+5,3,3);
    g.fillStyle='#6b4423';g.fillRect(x+2,y+11,16,6);         // barba
    g.fillStyle='#ffd9b3';g.fillRect(cx-2+face,y+11,4,3);    // boca no meio da barba
    return;
  }
  if(sk==='banana'){ // rostinho na janela da banana
    g.fillStyle='#ffd9b3';g.beginPath();g.ellipse(cx+face,y+8,8,7,0,0,7);g.fill();
    g.strokeStyle='rgba(15,18,30,.4)';g.lineWidth=1.5;g.stroke();
    olhos(g,cx+face,y+5,face);
    g.strokeStyle='#5b3a1a';g.lineWidth=2;g.beginPath();g.arc(cx+face,y+10,3,0.3,2.8);g.stroke();
    return;
  }
  // base / tenis / azul
  var headC= sk==='azul' ? '#1e6ef5' : '#ffd9b3';
  if(sk==='azul'){ // espinhos/topete pra trás
    g.fillStyle='#1450b8';
    for(var s5=0;s5<3;s5++){
      var tipX=face===1?x-3-s5*4:x+23+s5*4;
      g.beginPath();g.moveTo(cx-face*6,y+1+s5*4);g.lineTo(tipX,y+4+s5*4);g.lineTo(cx-face*3,y+5+s5*4);g.closePath();g.fill();
    }
  }
  oRect(g,x,y,20,16,headC);
  if(sk!=='azul'){g.fillStyle='#222';g.fillRect(x-1,y-3,22,5)}  // gorro
  g.fillStyle='#2b2b33';g.fillRect(x-1,y+4,22,6);               // máscara
  olhos(g,cx,y+5,face);
  g.strokeStyle='#7a4a1e';g.lineWidth=2;
  g.beginPath();g.arc(cx+face,y+12,3,0.3,2.8);g.stroke();       // sorriso
}
function paintThief(g,x,y,o){
  var sk=o.sk,pose=o.pose||'stand',face=o.face||1,h=o.h||56,w=28,t=o.t||0;
  var walking=o.moving&&o.onGround&&pose!=='fly';
  var swing=walking?Math.sin(t*0.35)*4:0;
  var air=o.onGround===false&&pose!=='fly';
  g.save();
  var P={body:'#ececec',stripe:'#2f2f38',perna:'#33333d'};
  if(sk==='azul'){P.body='#1e6ef5';P.stripe='#1450b8';P.perna='#123c8c'}
  if(sk==='banana'){P.body='#ffe135';P.stripe='#f2c200';P.perna='#f2c200'}
  if(sk==='robo'){P.body='#b5651d';P.stripe='#8a4b12';P.perna='#7c3f10'}
  if(sk==='ninja'){P.body='#181820';P.stripe='#26262f';P.perna='#000'}
  if(sk==='mumia'){P.body='#f3ecdc';P.stripe='#d8cdb2';P.perna='#e6dcc4'}
  if(sk==='astro'){P.body='#f4f4fa';P.stripe='#c9c9dd';P.perna='#d8d8e8'}
  if(sk==='pirata'){P.body='#fff';P.stripe='#d62828';P.perna='#2b2b33'}
  if(sk==='pato'){P.body='#ffd23f';P.stripe='#f0b21a';P.perna='#e8960c'}
  if(pose==='crawl'){ // rastejando
    oRect(g,x,y-16,w+16,12,P.body);
    g.fillStyle=P.stripe;
    for(var s=0;s<3;s++)g.fillRect(x+5+s*13,y-15,6,10);
    g.fillStyle=P.perna;
    g.fillRect(face===1?x-4:x+w+14,y-9,6,6);                    // pezinho atrás
    drawSkinHead(g,face===1?x+w+20:x-6,y-28,sk,face,t);
    g.restore();return;
  }
  var legH=pose==='crouch'?9:14;
  var l1=x+3+swing,l2=x+w-11-swing;
  if(air){l1=x+2;l2=x+w-10}
  // pernas com animação de andar
  oRect(g,l1,y-legH,8,legH,P.perna);oRect(g,l2,y-legH,8,legH,P.perna);
  // sapatos
  if(sk==='tenis'){ // tênis GIGANTES com cadarço
    [l1,l2].forEach(function(lx){
      oRect(g,lx-9,y-12,26,12,'#fafafa');
      g.fillStyle='#c1121f';g.fillRect(lx-9,y-7,26,4);
      g.fillStyle='#888';g.fillRect(lx-9,y-2,26,2);
      g.strokeStyle='#c1121f';g.lineWidth=1.5;
      g.beginPath();g.moveTo(lx-2,y-11);g.lineTo(lx+8,y-8);g.moveTo(lx+8,y-11);g.lineTo(lx-2,y-8);g.stroke();
    });
  } else if(sk==='azul'){
    oRect(g,l1-2,y-5,12,5,'#e53935');oRect(g,l2-2,y-5,12,5,'#e53935');
  } else {
    oRect(g,l1-1,y-5,11,5,'#3a3a44');oRect(g,l2-1,y-5,11,5,'#3a3a44');
  }
  var bTop=y-h+16,bBot=y-legH+2,bH=bBot-bTop;
  if(sk==='banana'){ // casca de banana envolvendo o corpo
    g.fillStyle='#ffe135';
    g.beginPath();g.ellipse(x+w/2,(bTop+y-4)/2,w/2+6,(y-4-bTop)/2+10,0,0,7);g.fill();
    g.strokeStyle='rgba(15,18,30,.55)';g.lineWidth=1.5;g.stroke();
    g.fillStyle='#5b3a1a';g.fillRect(x+w/2-3,bTop-15,6,7);      // pontas marrons
    g.fillRect(x+w/2-3,y-6,6,5);
    g.strokeStyle='#f2c200';g.lineWidth=2;
    g.beginPath();g.moveTo(x+4,bTop);g.lineTo(x+4,y-10);g.moveTo(x+w-4,bTop);g.lineTo(x+w-4,y-10);g.stroke();
    drawSkinHead(g,x+w/2,y-h+2,sk,face,t);
    g.restore();return;
  }
  oRect(g,x,bTop,w,bH,P.body);
  if(sk!=='ninja'&&sk!=='astro'&&sk!=='robo'&&sk!=='mumia'){    // listras
    g.fillStyle=P.stripe;
    for(var i=bTop+4;i<bBot-3;i+=8)g.fillRect(x+1,i,w-2,4);
  }
  // bracinhos com luvas
  var armY=bTop+2;
  g.fillStyle=P.body;
  g.fillRect(x-5,armY,5,12);g.fillRect(x+w,armY,5,12);
  g.fillStyle= sk==='ninja'?'#000':'#222';
  g.fillRect(x-5,armY+12,5,5);g.fillRect(x+w,armY+12,5,5);
  // detalhes por skin
  if(sk==='robo'){
    g.fillStyle='#d9d9d9';
    g.fillRect(x+2,bTop+2,2,2);g.fillRect(x+w-4,bTop+2,2,2);g.fillRect(x+2,bBot-4,2,2);g.fillRect(x+w-4,bBot-4,2,2); // rebites
    g.fillStyle='#7c3f10';g.fillRect(x+4,bTop+8,8,4);g.fillRect(x+w-11,bBot-9,7,4);   // ferrugem
    g.strokeStyle='#8a4b12';g.lineWidth=1.5;g.strokeRect(x+6.5,bTop+4.5,w-13,Math.max(4,bH-9)); // placa
  }
  if(sk==='mumia'){
    g.strokeStyle='#cfc4ab';g.lineWidth=2;
    for(var m=0;m<4;m++){g.beginPath();g.moveTo(x,bTop+2+m*6);g.lineTo(x+w,bTop+5+m*6);g.stroke();}
    var wav=Math.sin(t*0.15)*4;                                 // faixa solta balançando
    g.beginPath();g.moveTo(x+w,bTop+6);g.quadraticCurveTo(x+w+8,bTop+10+wav,x+w+5,bTop+18+wav);g.stroke();
  }
  if(sk==='astro'){
    g.fillStyle='#9aa0b5';g.fillRect(face===1?x-8:x+w+3,bTop+1,5,16);  // mochila
    g.fillStyle='#2a63ff';g.fillRect(x+w/2-4,bTop+4,8,2);              // patch
    g.fillStyle='#d62828';g.fillRect(x+w/2-4,bTop+6,8,3);
  }
  if(sk==='ninja'){g.fillStyle='#3a3a46';g.fillRect(x,bBot-5,w,3)}     // faixa da cintura
  drawSkinHead(g,x+w/2,y-h+2,sk,face,t);
  g.restore();
}
function drawThief(x,y,p){
  var inv=G.abilActive==='invis';
  ctx.save();
  if(inv)ctx.globalAlpha=0.35;
  // sombra no chão (encolhe quando pula)
  var sc=Math.max(.35,1-(FLOOR-p.y)/240);
  ctx.fillStyle='rgba(0,0,0,'+(0.28*sc).toFixed(2)+')';
  ctx.beginPath();ctx.ellipse(x+p.w/2,FLOOR+6,14*sc+7,4,0,0,7);ctx.fill();
  paintThief(ctx,x,y,{sk:curSkin,pose:p.pose,face:p.face,h:p.h,t:G.t,moving:p.vx!==0,onGround:p.onGround});
  if(G.abilActive==='asas'&&p.flying){ctx.font='20px sans-serif';ctx.fillText('🪽',x-18,y-p.h+18);ctx.fillText('🪽',x+p.w+2,y-p.h+18)}
  ctx.restore();
  ctx.font='22px sans-serif';
}
function paintPreview(canvas,skid){ // mini-prévia da skin nos cards da loja
  var g=canvas.getContext('2d');
  g.clearRect(0,0,canvas.width,canvas.height);
  g.save();
  g.translate(canvas.width/2-18,10);g.scale(1.3,1.3);
  g.fillStyle='rgba(0,0,0,.3)';
  g.beginPath();g.ellipse(14,62,20,4,0,0,7);g.fill();
  paintThief(g,0,60,{sk:skid,pose:'stand',face:1,h:56,t:0,moving:false,onGround:true});
  g.restore();
}
