<meta name="description" content="Cogumelo Clicker 2: clique, alimente o seu cogumelo, deixe ele forte e vença batalhas! Skins e auras de fogo brilhantes. Jogo grátis do Cogumelo Games.">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root { --vidro:rgba(255,255,255,0.07); --borda:rgba(255,255,255,0.14); --texto:#f4f1ff; --suave:#b9b2d8; --ouro:#ffd36a; --roxo:#8b5cf6; --rosa:#f472b6; }
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { width:100%; height:100%; overflow:hidden; background:#0b0716; font-family:'Poppins', Arial, sans-serif; color:var(--texto); user-select:none; -webkit-user-select:none; touch-action:manipulation; }
#cena { position:fixed; inset:0; width:100%; height:100%; display:block; }
/* barra de cima */
#topo { position:fixed; top:0; left:0; right:0; display:flex; gap:8px; justify-content:center; padding:12px 10px; z-index:3; flex-wrap:wrap; pointer-events:none; }
.chip { pointer-events:auto; display:flex; align-items:center; gap:6px; padding:7px 14px; border-radius:999px; background:var(--vidro); border:1px solid var(--borda); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); font-weight:800; font-size:16px; box-shadow:0 8px 24px rgba(0,0,0,0.25); }
.chip small { font-weight:600; color:var(--suave); font-size:12px; }
#voltar { position:fixed; top:12px; left:12px; z-index:4; width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; text-decoration:none; color:var(--texto); background:var(--vidro); border:1px solid var(--borda); backdrop-filter:blur(12px); font-size:18px; }
/* fome */
#painelFome { position:fixed; left:50%; transform:translateX(-50%); bottom:178px; width:min(340px, 86vw); z-index:3; text-align:center; }
#fomeTxt { font-size:13px; font-weight:600; color:var(--suave); margin-bottom:6px; display:flex; justify-content:space-between; }
#fomeTxt b { color:var(--texto); }
.barra { height:12px; border-radius:999px; background:rgba(255,255,255,0.08); overflow:hidden; border:1px solid var(--borda); }
.barra i { display:block; height:100%; width:0; border-radius:999px; transition:width .4s, background .4s; }
/* bandeja de comida */
#bandeja { position:fixed; left:50%; transform:translateX(-50%); bottom:96px; z-index:3; display:flex; gap:8px; padding:8px; border-radius:20px; background:var(--vidro); border:1px solid var(--borda); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); max-width:94vw; overflow-x:auto; }
.comida { position:relative; width:52px; height:52px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:28px; cursor:pointer; background:rgba(255,255,255,0.06); border:1px solid transparent; transition:transform .15s; flex:0 0 auto; }
.comida:active { transform:scale(0.9); }
.comida.pode { border-color:rgba(255,211,106,0.6); box-shadow:0 0 14px rgba(255,211,106,0.35); }
.comida b { position:absolute; right:-4px; bottom:-4px; min-width:20px; height:20px; padding:0 5px; border-radius:999px; background:var(--roxo); font-size:11px; display:flex; align-items:center; justify-content:center; }
#bandejaVazia { font-size:13px; color:var(--suave); padding:12px 14px; }
/* abas de baixo */
#abas { position:fixed; left:50%; transform:translateX(-50%); bottom:14px; z-index:6; display:flex; gap:4px; padding:6px; border-radius:22px; background:rgba(20,14,40,0.75); border:1px solid var(--borda); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); box-shadow:0 12px 30px rgba(0,0,0,0.4); }
.aba { border:none; background:none; color:var(--suave); font-family:inherit; font-size:11px; font-weight:600; padding:6px 7px; border-radius:16px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:1px; min-width:50px; }
.aba span { font-size:22px; line-height:1.1; }
.aba.on { background:linear-gradient(135deg, rgba(139,92,246,0.45), rgba(244,114,182,0.35)); color:#fff; }
/* folhas (loja, skins, auras, batalha) */
#folha { position:fixed; left:50%; bottom:0; transform:translate(-50%, 105%); width:min(560px, 100vw); max-height:72vh; z-index:5; border-radius:28px 28px 0 0; padding:18px 16px 110px;
    background:linear-gradient(180deg, rgba(34,24,66,0.97), rgba(16,10,34,0.98)); border:1px solid var(--borda); border-bottom:none; box-shadow:0 -20px 50px rgba(0,0,0,0.5); transition:transform .35s cubic-bezier(.2,.9,.3,1.1); overflow-y:auto; }
#folha.on { transform:translate(-50%, 0); }
#folha h2 { font-size:22px; font-weight:800; margin-bottom:2px; }
#folha .dica { font-size:13px; color:var(--suave); margin-bottom:12px; }
.grade { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:10px; }
.item { position:relative; border-radius:18px; padding:12px 10px; background:var(--vidro); border:1px solid var(--borda); text-align:center; cursor:pointer; transition:transform .15s, border-color .2s; }
.item:active { transform:scale(0.96); }
.item.usando { border-color:var(--ouro); box-shadow:0 0 18px rgba(255,211,106,0.3); }
.item.trava { opacity:0.55; }
.item .ic { font-size:34px; line-height:1.2; }
.item canvas { width:84px; height:84px; display:block; margin:0 auto; }
.item b { display:block; font-size:14px; margin-top:4px; }
.item .info { font-size:12px; color:var(--suave); margin-top:2px; }
.preco { display:inline-block; margin-top:8px; padding:4px 12px; border-radius:999px; font-size:13px; font-weight:800; background:linear-gradient(135deg, #ffd36a, #f59e0b); color:#2a1600; }
.preco.cinza { background:rgba(255,255,255,0.12); color:var(--suave); }
.preco.verde { background:linear-gradient(135deg, #6ee7b7, #10b981); color:#032a1c; }
/* batalha */
#telaBatalha { position:fixed; inset:0; z-index:6; display:none; }
#telaBatalha.on { display:block; }
.hp { position:fixed; top:70px; width:min(40vw, 260px); }
.hp .nome { font-weight:800; font-size:15px; margin-bottom:4px; display:flex; justify-content:space-between; gap:6px; }
.hp .nome small { color:var(--suave); font-weight:600; }
.hp .barra { height:16px; }
#hpEu { left:14px; } #hpEle { right:14px; text-align:right; }
#btSoco { position:fixed; left:50%; bottom:40px; transform:translateX(-50%); width:150px; height:150px; border-radius:50%; border:none; cursor:pointer; font-family:inherit; font-weight:800; font-size:16px; color:#fff;
    background:radial-gradient(circle at 35% 30%, #fda4af, #e11d48 60%, #881337); box-shadow:0 0 40px rgba(225,29,72,0.6), inset 0 -8px 0 rgba(0,0,0,0.25); }
#btSoco:active { transform:translateX(-50%) scale(0.92); }
#btSoco span { display:block; font-size:44px; }
/* janela de aviso */
#modal { position:fixed; inset:0; z-index:8; display:none; align-items:center; justify-content:center; background:rgba(5,2,15,0.6); backdrop-filter:blur(6px); padding:20px; }
#modal.on { display:flex; }
#modal .caixa { width:min(380px, 92vw); border-radius:26px; padding:24px 20px; text-align:center; background:linear-gradient(180deg, #2a1f55, #170f33); border:1px solid var(--borda); box-shadow:0 30px 60px rgba(0,0,0,0.5); animation:pop .35s cubic-bezier(.2,.9,.3,1.3); }
@keyframes pop { from { transform:scale(0.7); opacity:0; } to { transform:scale(1); opacity:1; } }
#modal .grande { font-size:56px; line-height:1.2; }
#modal h3 { font-size:24px; font-weight:800; margin:6px 0; }
#modal p { color:var(--suave); font-size:15px; margin-bottom:16px; }
.bt { border:none; cursor:pointer; font-family:inherit; font-weight:800; font-size:16px; padding:12px 24px; border-radius:16px; color:#fff; background:linear-gradient(135deg, var(--roxo), var(--rosa)); box-shadow:0 10px 24px rgba(139,92,246,0.4); }
.bt:active { transform:scale(0.96); }
#toast { position:fixed; left:50%; top:76px; transform:translate(-50%, -20px); z-index:9; padding:10px 18px; border-radius:999px; font-weight:600; font-size:14px; background:rgba(20,14,40,0.92); border:1px solid var(--borda); opacity:0; transition:all .3s; pointer-events:none; white-space:nowrap; }
#toast.on { opacity:1; transform:translate(-50%, 0); }
@media (max-height:640px) { #painelFome { bottom:160px; } #bandeja { bottom:88px; } .comida { width:44px; height:44px; font-size:24px; } }
</style>

</head>

        '<div class="dica">Seu cogumelo tem <b>' + fmt(S.forca) + ' 💪</b>. Ganhe e leve a recompensa! Se perder, perde moedas. Na luta, <b>toque rápido</b> pra bater mais forte!</div><div class="grade">' +
        INIMIGOS.map(function (n, i) {
            var ganhou = S.venceu[i], r = S.forca / n.forca, cor = r >= 1.3 ? '#86efac' : r >= 0.8 ? '#fde047' : '#fca5a5', dif = r >= 1.3 ? 'Fácil' : r >= 0.8 ? 'Parelho' : r >= 0.5 ? 'Difícil' : 'Muito forte!';
            return '<div class="item" onclick="lutar(' + i + ')"><canvas data-ini="' + i + '" width="168" height="168"></canvas><b>' + n.nome + (ganhou ? ' 🏆' : '') + '</b><div class="info">' + fmt(n.forca) + ' 💪 · <span style="color:' + cor + '">' + dif + '</span></div><span class="preco">💰 +' + fmt(premio(i)) + '</span><div class="info" style="margin-top:4px">perde ' + fmt(perda(i)) + ' se perder</div></div>';
        }).join('') + '</div>';
}
setInterval(function () {
    if (abaAtual === 'batalha') document.querySelectorAll('canvas[data-ini]').forEach(function (c) { var n = INIMIGOS[+c.getAttribute('data-ini')], g = c.getContext('2d'); g.clearRect(0, 0, 168, 168); desenhaCogu(g, 84, 150, 62, achaSkin(n.skin), { t:tempo, humor:'bravo', vira:true }); });
    if (abaAtual === 'skins') desenhaMiniaturas();
}, 300);

// ---------------- batalha ----------------
function lutar(i, online) {
    audio();
    var n = online || INIMIGOS[i];
    trocaAba('clicar');
    var forEu = S.forca, forEle = n.forca;
    B = { i:i, n:n, hpEu:60 + forEu * 8, hpEle:60 + forEle * 8, t:-1.4, vez:0, golpe:0, quem:-1, socos:0, fim:false, auraEle:novaAura(), sqEu:1, sqEle:1, tremor:0 };
    B.maxEu = B.hpEu; B.maxEle = B.hpEle;
    document.getElementById('hpEuNome').textContent = 'Você (' + fmt(forEu) + ' 💪)';
    document.getElementById('hpEleNome').textContent = n.nome + ' (' + fmt(forEle) + ' 💪)';
    document.getElementById('telaBatalha').classList.add('on');
    ['topo', 'painelFome', 'bandeja', 'abas', 'voltar'].forEach(function (id) { document.getElementById(id).style.display = 'none'; });
    texto(W / 2, H * 0.4, '⚔️ LUTA!', '#fff', 46); som(200, 600, 0.4, 'sawtooth', 0.06);
}
document.getElementById('btSoco').addEventListener('pointerdown', function (e) { e.preventDefault(); soco(); });
function soco() {
    if (!B || B.fim || B.t < 0) return;
    if (B.ultSoco && performance.now() - B.ultSoco < 90) return;   // no máximo ~11 socos por segundo
    B.ultSoco = performance.now();
    var dano = Math.max(1, S.forca * 0.35);
    B.hpEle -= dano; B.sqEle = 0.85; B.socos++;
    if (B.n.online) danoAcum += dano;   // manda os socos juntos a cada pouquinho (pra não encher a internet)
    var pe = posLuta(1); texto(pe.x + (Math.random() - 0.5) * 60, pe.y - pe.s * 2, '-' + fmt(dano), '#fda4af', 20); faiscas(pe.x, pe.y - pe.s, '#fda4af', 4);
    somSoco();
}
function posLuta(lado) { var s = Math.min(W * 0.17, H * 0.16, 130); return { x:W / 2 + (lado ? 1 : -1) * Math.min(W * 0.25, 260), y:H * 0.62, s:s }; }
function passoBatalha(dt) {
    desenhaFundo(ctx, tempo, '#3b0f2e');
    B.t += dt;
    var pEu = posLuta(0), pEle = posLuta(1), skinEu = achaSkin(S.skin), skinEle = achaSkin(B.n.skin);
    // online: eu só calculo os MEUS golpes e mando pro outro; os dele chegam pela internet
    if (B.n.online && !B.fim && B.t > 0) {
        B.vez -= dt; B.envio = (B.envio || 0) - dt;
        if (B.vez <= 0) {
            B.vez = 1.5; B.quem = 0; B.golpe = 0.3;
            var dOn = Math.max(1, S.forca * (1.6 + Math.random() * 0.8));
            B.hpEle -= dOn; B.sqEle = 0.8; texto(pEle.x, pEle.y - pEle.s * 2.2, '-' + fmt(dOn), '#fff', 30); faiscas(pEle.x, pEle.y - pEle.s, '#fde047', 12); somSoco();
            netEnvia({ t:'dano', para:NET.oponente.id, v:Math.round(dOn), auto:1 });
        }
        if (B.envio <= 0 && danoAcum > 0) { B.envio = 0.3; netEnvia({ t:'dano', para:NET.oponente.id, v:Math.round(danoAcum) }); danoAcum = 0; }
        if (B.hpEle < 1) B.hpEle = 1;   // quem decide que perdeu é o próprio outro jogador
    }
    // golpes automáticos alternados
    else if (!B.fim && B.t > 0) {
        B.vez -= dt;
        if (B.vez <= 0) {
            B.vez = 0.75; B.quem = B.quem === 0 ? 1 : 0; B.golpe = 0.3;
            var atk = B.quem === 0 ? S.forca : B.n.forca, dano = Math.max(1, atk * (1.6 + Math.random() * 0.8));
            if (B.quem === 0) { B.hpEle -= dano; B.sqEle = 0.8; texto(pEle.x, pEle.y - pEle.s * 2.2, '-' + fmt(dano), '#fff', 30); faiscas(pEle.x, pEle.y - pEle.s, '#fde047', 12); }
            else { B.hpEu -= dano; B.sqEu = 0.8; B.tremor = 0.2; texto(pEu.x, pEu.y - pEu.s * 2.2, '-' + fmt(dano), '#fca5a5', 30); faiscas(pEu.x, pEu.y - pEu.s, '#fb7185', 12); }
            somSoco();
        }
        if (B.hpEle <= 0 || B.hpEu <= 0) fimLuta(B.hpEle <= 0);
    }
    B.golpe -= dt; B.sqEu += (1 - B.sqEu) * Math.min(1, dt * 10); B.sqEle += (1 - B.sqEle) * Math.min(1, dt * 10);
    var avanco = B.golpe > 0 ? Math.sin((0.3 - B.golpe) / 0.3 * Math.PI) * Math.min(W * 0.12, 90) : 0;
    var tx = B.tremor > 0 ? (Math.random() - 0.5) * 10 : 0; B.tremor -= dt;
    var xEu = pEu.x + (B.quem === 0 ? avanco : 0) + tx, xEle = pEle.x - (B.quem === 1 ? avanco : 0);
    pedestal(ctx, pEu.x, pEu.y, pEu.s, tempo); pedestal(ctx, pEle.x, pEle.y, pEle.s, tempo);
    var aEu = achaAura(S.aura), aEle = achaAura(B.n.aura);
    passaAura(EU.aura, aEu, xEu, pEu.y, pEu.s, dt); passaAura(B.auraEle, aEle, xEle, pEle.y, pEle.s, dt);
    desenhaAura(ctx, EU.aura, aEu, xEu, pEu.y, pEu.s, true); desenhaAura(ctx, B.auraEle, aEle, xEle, pEle.y, pEle.s, true);
    var vivoEu = !(B.fim && !B.ganhou), vivoEle = !(B.fim && B.ganhou);
    ctx.save(); if (!vivoEu) { ctx.globalAlpha = 0.6; ctx.translate(xEu, pEu.y); ctx.rotate(-0.4); ctx.translate(-xEu, -pEu.y); }
    desenhaCogu(ctx, xEu, pEu.y, pEu.s, skinEu, { sq:B.sqEu, humor:vivoEu ? 'bravo' : 'triste', t:tempo }); ctx.restore();
    ctx.save(); if (!vivoEle) { ctx.globalAlpha = 0.6; ctx.translate(xEle, pEle.y); ctx.rotate(0.4); ctx.translate(-xEle, -pEle.y); }
    desenhaCogu(ctx, xEle, pEle.y, pEle.s, skinEle, { sq:B.sqEle, humor:vivoEle ? 'bravo' : 'triste', t:tempo, vira:true }); ctx.restore();
    desenhaAura(ctx, EU.aura, aEu, xEu, pEu.y, pEu.s, false); desenhaAura(ctx, B.auraEle, aEle, xEle, pEle.y, pEle.s, false);
    if (B.t < 0) { ctx.save(); ctx.font = '800 64px Poppins, Arial'; ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.shadowColor = '#e11d48'; ctx.shadowBlur = 30; ctx.fillText(B.t < -0.7 ? 'PRONTO?' : 'LUTA!', W / 2, H * 0.36); ctx.restore(); }
    else { ctx.save(); ctx.font = '800 34px Poppins, Arial'; ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.fillText('VS', W / 2, H * 0.45); ctx.restore(); }
    document.getElementById('hpEuBarra').style.width = Math.max(0, B.hpEu / B.maxEu * 100) + '%';
    document.getElementById('hpEleBarra').style.width = Math.max(0, B.hpEle / B.maxEle * 100) + '%';
    document.getElementById('hpEuNum').textContent = fmt(Math.max(0, B.hpEu)) + ' ❤️';
    document.getElementById('hpEleNum').textContent = '❤️ ' + fmt(Math.max(0, B.hpEle));
}
function fimLuta(ganhou, wo) {
    if (B.fim) return;
    B.fim = true; B.ganhou = ganhou;
    var i = B.i, txt;
    if (B.n.online) {
        var pr = premioOnline(B.n.forca);
        if (ganhou) {
            if (wo) pr = Math.round(pr / 2);
            S.moedas += pr; S.vitorias++; S.vitOnline++; B.hpEle = 0;
            somVitoria(); faiscas(W / 2, H * 0.4, '#ffd36a', 40);
            txt = '<div class="grande">🏆🌐</div><h3>VOCÊ GANHOU ONLINE!</h3><p>Derrotou o <b>' + B.n.nome + '</b>' + (wo ? ' (ele saiu da luta)' : '') + ' e ganhou <b style="color:#ffd36a">💰 ' + fmt(pr) + '</b></p>';
        } else {
            var pdo = Math.min(S.moedas, Math.round(pr * 0.25)); S.moedas -= pdo;
            som(400, 120, 0.6, 'sawtooth', 0.07);
            txt = '<div class="grande">😵</div><h3>Você perdeu...</h3><p>O <b>' + B.n.nome + '</b> foi mais forte. Você perdeu <b style="color:#fca5a5">💰 ' + fmt(pdo) + '</b>.<br>Treine na 🏋️ academia e coma mais! 💪</p>';
        }
        fechaOnline(); salva();
        setTimeout(function () { abreModal(txt + '<button class="bt" onclick="saiLuta()">Continuar</button>'); }, 1200);
        return;
    }
    if (ganhou) {
        var r = premio(i), primeira = !S.venceu[i];
        if (primeira) r *= 2;
        S.moedas += r; S.vitorias++; S.venceu[i] = true;
        somVitoria(); faiscas(W / 2, H * 0.4, '#ffd36a', 40);
        if (window.CoguCoins) CoguCoins.ganha(3 + i);
        txt = '<div class="grande">🏆</div><h3>VOCÊ GANHOU!</h3><p>Derrotou o ' + B.n.nome + ' e ganhou <b style="color:#ffd36a">💰 ' + fmt(r) + '</b>' + (primeira ? '<br>(dobrado na primeira vitória! 🎉)' : '') + '</p>';
    } else {
        var pd = Math.min(S.moedas, perda(i)); S.moedas -= pd;
        som(400, 120, 0.6, 'sawtooth', 0.07);
        txt = '<div class="grande">😵</div><h3>Você perdeu...</h3><p>O ' + B.n.nome + ' foi mais forte. Você perdeu <b style="color:#fca5a5">💰 ' + fmt(pd) + '</b>.<br>Dê mais comida pro seu cogumelo ficar forte! 💪</p>';
    }
    salva();
    setTimeout(function () { abreModal(txt + '<button class="bt" onclick="saiLuta()">Continuar</button>'); }, 1200);
}
function saiLuta() {
    fechaModal(); B = null;
    document.getElementById('telaBatalha').classList.remove('on');
    ['topo', 'painelFome', 'bandeja', 'abas', 'voltar'].forEach(function (id) { document.getElementById(id).style.display = ''; });
    montaBandeja(); hud(); trocaAba('batalha');
}

// ---------------- hud, modal, toast ----------------
function hud() {
    document.getElementById('moedas').textContent = fmt(S.moedas); document.getElementById('multi').textContent = '+' + fmt(porClique()) + '/clique';
    document.getElementById('forca').textContent = fmt(S.forca);
    document.getElementById('nivel').textContent = 'Nv ' + nivel();
    document.getElementById('vitorias').textContent = S.vitorias;
    var f = S.fome, bar = document.getElementById('fomeBarra');
    bar.style.width = f + '%';
    bar.style.background = f >= 100 ? 'linear-gradient(90deg,#f43f5e,#be123c)' : f >= FOME_MIN ? 'linear-gradient(90deg,#fbbf24,#f97316)' : 'linear-gradient(90deg,#6ee7b7,#10b981)';
    document.getElementById('fomeEstado').textContent = f >= 100 ? 'FAMINTO! 😭 (moedas pela metade)' : f >= FOME_MIN ? 'Com fome! Dê comida 🍽️' : 'Satisfeito 😊';
    var pode = f >= FOME_MIN;
    if (pode !== hud.pode) { hud.pode = pode; montaBandeja(); }
}
function abreModal(h) { document.getElementById('modalCaixa').innerHTML = h; document.getElementById('modal').classList.add('on'); }
function fechaModal() { document.getElementById('modal').classList.remove('on'); }
var toastT = null;
function toast(t) { var e = document.getElementById('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(function () { e.classList.remove('on'); }, 1800); }

// ---------------- começo ----------------
montaBandeja(); hud();
if (!S.cliques) {
    S.inv.maca = (S.inv.maca || 0) + 3;   // presentinho pra começar
    montaBandeja();
    abreModal('<div class="grande">🍄</div><h3>Cogumelo Clicker 2</h3><p>Clique no cogumelo pra ganhar 💰 moedas.<br>Quando ele ficar <b>com fome</b>, dê comida pra ele ficar <b>forte</b> 💪<br>Depois vença batalhas ⚔️ e compre skins 🎨 e auras ✨!<br><br>Toma 3 🍎 de presente!</p><button class="bt" onclick="fechaModal()">Bora!</button>');
}
requestAnimationFrame(loop);
</script>
