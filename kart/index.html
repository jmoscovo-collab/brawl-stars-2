<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const TOUCH=('ontouchstart' in window)||(window.matchMedia&&matchMedia('(pointer:coarse)').matches);
if(TOUCH)document.body.classList.add('touch');

// ================= CONFIG =================
const LARG=16, N=700, VOLTAS=3, VMAX=40, LIM=LARG/2+6;
const KART_ROT=0; // ajuste se o modelo vier virado
const KARTS=[
  {arq:'kart-oobi',nome:'Oobi',cor:0x3399ff},
  {arq:'kart-oodi',nome:'Oodi',cor:0xff4444},
  {arq:'kart-ooli',nome:'Ooli',cor:0x44dd55},
  {arq:'kart-oopi',nome:'Oopi',cor:0xff66cc},
  {arq:'kart-oozi',nome:'Oozi',cor:0xffcc22}
];
const BOTS=['🦫 Capivara','🦖 Dino','🥷 Ninja','🦈 Tubarão','🧟 Zumbi'];
const PISTAS=[
  {nome:'🌳 Campo do Cogumelo',chao:0x55b84a,ceu:0x8fd3ff,muro:0xff5533,morro:0x3f8f3a,arv:'arvore',
   pts:[[0,-180],[160,-180],[240,-90],[200,20],[100,40],[60,120],[140,200],[40,260],[-120,240],[-200,120],[-180,-60],[-120,-160]]},
  {nome:'🌵 Deserto Quente',chao:0xe2c27a,ceu:0xffd9a0,muro:0x8b5a2b,morro:0xc9874a,arv:'cacto',
   pts:[[0,-220],[200,-200],[280,-40],[180,80],[260,200],[120,280],[-60,200],[-40,80],[-200,40],[-260,-120],[-150,-220]]},
  {nome:'❄️ Montanha Gelada',chao:0xeef4ff,ceu:0xb8d4ff,muro:0x3388ff,morro:0xdde8f5,arv:'pinheiro',
   pts:[[0,-160],[140,-200],[220,-100],[120,-20],[200,80],[120,180],[0,120],[-80,220],[-200,140],[-160,0],[-220,-100],[-120,-180]]}
];
const ITENS={turbo:'🍄',banana:'🍌',foguete:'🚀',estrela:'⭐'};
const PREMIO=[30,20,15,10,5,5];

let kartEsc=0, pistaEsc=0;
try{kartEsc=+localStorage.getItem('kart_kart')||0;pistaEsc=+localStorage.getItem('kart_pista')||0;}catch(e){}
if(!(kartEsc>=0&&kartEsc<KARTS.length))kartEsc=0;
if(!(pistaEsc>=0&&pistaEsc<PISTAS.length))pistaEsc=0;

// ================= RENDER =================
const renderer=new THREE.WebGLRenderer({canvas:$('c'),antialias:!TOUCH});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));
renderer.setSize(innerWidth,innerHeight);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.5,1600);
scene.add(new THREE.HemisphereLight(0xffffff,0x557755,0.8));
const sol=new THREE.DirectionalLight(0xffffff,0.9);sol.position.set(100,200,60);scene.add(sol);
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();});

let estado='menu', tCorrida=0, tContagem=0;
let ultimo=performance.now(), ultQuadro=0, acHud=0, acMini=0;

// rAF começa antes de montar o mundo
requestAnimationFrame(loop);

// ================= PISTA =================
let mundo=null, P=[], T=[], R=[], LEN=1, miniBase=null, miniEsc={};
let caixas=[], turbos=[], bananas=[], foguetes=[];

function pt(i,lat){i=((i%N)+N)%N;return {x:P[i].x+R[i].x*lat,z:P[i].z+R[i].z*lat};}

function texCanvas(w,h,fn){const cv=document.createElement('canvas');cv.width=w;cv.height=h;fn(cv.getContext('2d'),w,h);return new THREE.CanvasTexture(cv);}

function faixa(a,b,y,cores,passo){
  const pos=[],col=[],c=new THREE.Color();
  for(let i=0;i<N;i++){
    const k=Math.floor(i/passo)%cores.length;
    if(cores[k]===null)continue;
    c.set(cores[k]);
    const j=(i+1)%N,a1=pt(i,a),b1=pt(i,b),a2=pt(j,a),b2=pt(j,b);
    pos.push(a1.x,y,a1.z,a2.x,y,a2.z,b1.x,y,b1.z, b1.x,y,b1.z,a2.x,y,a2.z,b2.x,y,b2.z);
    for(let q=0;q<6;q++)col.push(c.r,c.g,c.b);
  }
  return malha(pos,col);
}
function muro(lat,alt,cores,passo){
  const pos=[],col=[],c=new THREE.Color();
  for(let i=0;i<N;i++){
    c.set(cores[Math.floor(i/passo)%cores.length]);
    const j=(i+1)%N,p1=pt(i,lat),p2=pt(j,lat);
    pos.push(p1.x,0,p1.z,p2.x,0,p2.z,p1.x,alt,p1.z, p1.x,alt,p1.z,p2.x,0,p2.z,p2.x,alt,p2.z);
    for(let q=0;q<6;q++)col.push(c.r,c.g,c.b);
  }
  return malha(pos,col);
}
function malha(pos,col){
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  g.computeVertexNormals();
  const m=new THREE.Mesh(g,new THREE.MeshLambertMaterial({vertexColors:true,side:THREE.DoubleSide}));
  mundo.add(m);return m;
}

function construirPista(ix){
  if(mundo){scene.remove(mundo);mundo.traverse(o=>{if(o.geometry)o.geometry.dispose();});}
  mundo=new THREE.Group();scene.add(mundo);
  const pi=PISTAS[ix];
  scene.background=new THREE.Color(pi.ceu);
  scene.fog=new THREE.Fog(pi.ceu,160,700);
  const curva=new THREE.CatmullRomCurve3(pi.pts.map(p=>new THREE.Vector3(p[0]*0.76,0,p[1]*0.76)),true,'centripetal');
  P=curva.getSpacedPoints(N);P.pop();
  T=[];R=[];LEN=0;
  for(let i=0;i<N;i++){
    const a=P[(i+N-1)%N],b=P[(i+1)%N];
    const t=new THREE.Vector3(b.x-a.x,0,b.z-a.z).normalize();
    T.push(t);R.push(new THREE.Vector3(-t.z,0,t.x));
    LEN+=P[i].distanceTo(P[(i+1)%N]);
  }
  // chão
  const chao=new THREE.Mesh(new THREE.PlaneGeometry(3000,3000),new THREE.MeshLambertMaterial({color:pi.chao}));
  chao.rotation.x=-Math.PI/2;chao.position.y=-0.15;mundo.add(chao);
  // asfalto, zebras, linha do meio, grama da beira e muros
  faixa(-LARG/2,LARG/2,0.02,[0x4a4a55],1);
  faixa(-LARG/2-1.4,-LARG/2,0.05,[0xff2222,0xffffff],4);
  faixa(LARG/2,LARG/2+1.4,0.05,[0xff2222,0xffffff],4);
  faixa(-0.25,0.25,0.06,[0xffffff,null],5);
  muro(-LIM-0.6,1.3,[pi.muro,0xffffff],6);
  muro(LIM+0.6,1.3,[pi.muro,0xffffff],6);
  // linha de largada
  const xadrez=texCanvas(256,64,(g,w,h)=>{for(let x=0;x<16;x++)for(let y=0;y<4;y++){g.fillStyle=(x+y)%2?'#111':'#fff';g.fillRect(x*16,y*16,16,16);}});
  const lin=new THREE.Mesh(new THREE.PlaneGeometry(LARG,3),new THREE.MeshLambertMaterial({map:xadrez}));
  lin.rotation.x=-Math.PI/2;
  const lg=new THREE.Group();lg.add(lin);lg.position.set(P[0].x,0.08,P[0].z);lg.rotation.y=Math.atan2(T[0].x,T[0].z);mundo.add(lg);
  // pórtico de largada
  const arco=new THREE.Group();
  const posteM=new THREE.MeshLambertMaterial({color:0x333333});
  [-1,1].forEach(s=>{const p=new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.5,8,8),posteM);p.position.set(s*(LARG/2+2.5),4,0);arco.add(p);});
  const faixaTex=texCanvas(1024,128,(g,w,h)=>{g.fillStyle='#ff5500';g.fillRect(0,0,w,h);for(let x=0;x<32;x++){g.fillStyle=x%2?'#111':'#fff';g.fillRect(x*32,0,32,16);g.fillStyle=x%2?'#fff':'#111';g.fillRect(x*32,h-16,32,16);}
    g.fillStyle='#fff';g.font='bold 72px Arial';g.textAlign='center';g.textBaseline='middle';g.fillText('🍄 COGUMELO KART 🍄',w/2,h/2+4);});
  const banner=new THREE.Mesh(new THREE.BoxGeometry(LARG+6,2.2,0.4),new THREE.MeshLambertMaterial({map:faixaTex}));
  banner.position.y=8;arco.add(banner);
  arco.position.set(P[0].x,0,P[0].z);arco.rotation.y=Math.atan2(T[0].x,T[0].z);mundo.add(arco);
  // árvores / cactos / pinheiros
  plantarArvores(pi);
  // morros no horizonte
  const morroM=new THREE.MeshLambertMaterial({color:pi.morro});
  for(let i=0;i<16;i++){
    const a=i/16*Math.PI*2+Math.random()*0.2,r=560+Math.random()*120,h=60+Math.random()*90;
    const m=new THREE.Mesh(new THREE.ConeGeometry(h*1.3,h,7),morroM);
    m.position.set(Math.cos(a)*r,h/2-2,Math.sin(a)*r);mundo.add(m);
  }
  // caixas de poder
  caixas=[];
  const texCaixa=texCanvas(128,128,(g,w,h)=>{const gr=g.createLinearGradient(0,0,w,h);gr.addColorStop(0,'#ff44cc');gr.addColorStop(.5,'#ffcc00');gr.addColorStop(1,'#33ccff');g.fillStyle=gr;g.fillRect(0,0,w,h);g.strokeStyle='#fff';g.lineWidth=10;g.strokeRect(5,5,w-10,h-10);g.fillStyle='#fff';g.font='bold 96px Arial';g.textAlign='center';g.textBaseline='middle';g.fillText('?',w/2,h/2+6);});
  const caixaM=new THREE.MeshLambertMaterial({map:texCaixa,transparent:true,opacity:0.92});
  const caixaG=new THREE.BoxGeometry(1.7,1.7,1.7);
  [0.22,0.52,0.8].forEach(f=>{const i=Math.floor(f*N);[-5.2,-1.75,1.75,5.2].forEach(l=>{
    const p=pt(i,l),m=new THREE.Mesh(caixaG,caixaM);m.position.set(p.x,1.3,p.z);mundo.add(m);
    caixas.push({m,x:p.x,z:p.z,ativo:true,t:0});});});
  // placas de turbo
  turbos=[];
  const texSeta=texCanvas(128,160,(g,w,h)=>{g.fillStyle='#ff7700';g.fillRect(0,0,w,h);g.strokeStyle='#ffee44';g.lineWidth=14;g.lineCap='round';
    for(let k=0;k<3;k++){const y=h-30-k*48;g.beginPath();g.moveTo(20,y);g.lineTo(w/2,y-34);g.lineTo(w-20,y);g.stroke();}});
  const setaM=new THREE.MeshBasicMaterial({map:texSeta});
  [0.1,0.4,0.66,0.92].forEach((f,k)=>{const i=Math.floor(f*N),l=[-3.5,3.5,0,-3][k],p=pt(i,l);
    const pl=new THREE.Mesh(new THREE.PlaneGeometry(4,5),setaM);pl.rotation.x=-Math.PI/2;
    const g=new THREE.Group();g.add(pl);g.position.set(p.x,0.09,p.z);g.rotation.y=Math.atan2(T[i].x,T[i].z)+Math.PI;mundo.add(g);
    turbos.push({x:p.x,z:p.z});});
  bananas.forEach(b=>scene.remove(b.m));bananas=[];
  foguetes.forEach(f=>scene.remove(f.m));foguetes=[];
  fazMiniBase();
}

function plantarArvores(pi){
  const qtd=TOUCH?130:240;
  const tronco=new THREE.CylinderGeometry(0.6,0.8,4,6);tronco.translate(0,2,0);
  let copa,corCopa,corTronco=0x7a4b26;
  if(pi.arv==='cacto'){copa=new THREE.CylinderGeometry(1,1.1,7,8);copa.translate(0,3.5,0);corCopa=0x2f8f3a;corTronco=0x2f8f3a;}
  else if(pi.arv==='pinheiro'){copa=new THREE.ConeGeometry(3.4,9,7);copa.translate(0,7.5,0);corCopa=0x1f6b3a;}
  else {copa=new THREE.IcosahedronGeometry(3.6,0);copa.translate(0,6,0);corCopa=0x2fa84f;}
  const iT=new THREE.InstancedMesh(tronco,new THREE.MeshLambertMaterial({color:corTronco}),qtd);
  const iC=new THREE.InstancedMesh(copa,new THREE.MeshLambertMaterial({color:corCopa}),qtd);
  const mtx=new THREE.Matrix4(),q=new THREE.Quaternion(),s=new THREE.Vector3(),v=new THREE.Vector3(),eixo=new THREE.Vector3(0,1,0);
  let n=0,tent=0;
  while(n<qtd&&tent<qtd*20){
    tent++;
    const x=(Math.random()*2-1)*420,z=(Math.random()*2-1)*420;
    let perto=false;
    for(let i=0;i<N;i+=4){const dx=x-P[i].x,dz=z-P[i].z;if(dx*dx+dz*dz<(LIM+6)*(LIM+6)){perto=true;break;}}
    if(perto)continue;
    const e=0.8+Math.random()*0.7;s.set(e,e,e);q.setFromAxisAngle(eixo,Math.random()*6.28);v.set(x,0,z);
    mtx.compose(v,q,s);iT.setMatrixAt(n,mtx);iC.setMatrixAt(n,mtx);n++;
  }
  iT.count=n;iC.count=n;mundo.add(iT);mundo.add(iC);
}

function fazMiniBase(){
  let x0=1e9,x1=-1e9,z0=1e9,z1=-1e9;
  P.forEach(p=>{x0=Math.min(x0,p.x);x1=Math.max(x1,p.x);z0=Math.min(z0,p.z);z1=Math.max(z1,p.z);});
  const esc=110/Math.max(x1-x0,z1-z0);
  miniEsc={esc,ox:65-(x0+x1)/2*esc,oz:65-(z0+z1)/2*esc};
  miniBase=document.createElement('canvas');miniBase.width=130;miniBase.height=130;
  const g=miniBase.getContext('2d');
  g.strokeStyle='rgba(255,255,255,.85)';g.lineWidth=5;g.lineJoin='round';g.beginPath();
  P.forEach((p,i)=>{const mx=miniEsc.ox+p.x*esc,my=miniEsc.oz+p.z*esc;if(i)g.lineTo(mx,my);else g.moveTo(mx,my);});
  g.closePath();g.stroke();
  const s=pt(0,0);g.fillStyle='#ff3300';g.fillRect(miniEsc.ox+s.x*esc-3,miniEsc.oz+s.z*esc-3,6,6);
}
function desenhaMini(){

}

// ================= FÍSICA =================
function atualizaIdx(c){
  let best=c.idx,bd=1e12;
  for(let o=-10;o<=26;o++){const i=(c.idx+o+N)%N,dx=c.x-P[i].x,dz=c.z-P[i].z,d=dx*dx+dz*dz;if(d<bd){bd=d;best=i;}}
  if(c.idx>N*0.8&&best<N*0.2)c.volta++;
  else if(c.idx<N*0.2&&best>N*0.8)c.volta--;
  c.idx=best;
  c.lat=(c.x-P[best].x)*R[best].x+(c.z-P[best].z)*R[best].z;
  c.total=c.volta*N+best;
}
function fisica(c,dt,acel,freio,giro){
  if(c.spin>0){c.spin-=dt;c.v*=Math.pow(0.2,dt);acel=false;freio=false;giro=0;}
  if(c.boost>0)c.boost-=dt;
  if(c.estrela>0)c.estrela-=dt;
  const naGrama=Math.abs(c.lat)>LARG/2+1.4;
  const max=c.vmax*(naGrama&&c.boost<=0&&c.estrela<=0?0.5:1)*(c.boost>0?1.45:c.estrela>0?1.3:1);
  if(acel)c.v+=(c.boost>0||c.estrela>0?50:24)*dt;
  if(freio)c.v-=(c.v>0?45:16)*dt;
  if(!acel&&!freio)c.v-=Math.sign(c.v)*Math.min(Math.abs(c.v),9*dt);
  if(c.v>max)c.v=Math.max(max,c.v-35*dt);
  if(c.v<-12)c.v=-12;
  const fator=Math.min(1,Math.abs(c.v)/10)*(1-Math.min(0.35,Math.abs(c.v)/150));
  c.h+=giro*2.3*fator*Math.sign(c.v)*dt;
  c.x+=Math.sin(c.h)*c.v*dt;c.z+=Math.cos(c.h)*c.v*dt;
  atualizaIdx(c);
  if(Math.abs(c.lat)>LIM){
    const s=Math.sign(c.lat),ex=Math.abs(c.lat)-LIM;
    c.x-=R[c.idx].x*s*ex;c.z-=R[c.idx].z*s*ex;c.lat=s*LIM;
    if(Math.abs(c.v)>8){c.v*=0.6;if(c.jog)bip(90,0.15,'square',0.12);}
  }
}
function ia(c,dt){
  const a=(c.idx+22)%N,alvo=pt(a,c.alvoLat);
  let d=Math.atan2(alvo.x-c.x,alvo.z-c.z)-c.h;
  while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;
  const ta=T[c.idx],tb=T[(c.idx+35)%N];
  const ang=Math.acos(Math.max(-1,Math.min(1,ta.x*tb.x+ta.z*tb.z)));
  if(c.auto){c.vmax=34*(1-ang*0.25);}
  else{
    const dif=jogador?(jogador.total-c.total)/N:0;
    c.vmax=c.base*(1-ang*0.25)*(1+Math.max(-0.14,Math.min(0.16,dif*0.5)));
  }
  c.trocaT-=dt;if(c.trocaT<=0){c.alvoLat=(Math.random()*2-1)*4.5;c.trocaT=2+Math.random()*3;}
  if(c.item&&!c.jog){c.usarEm-=dt;if(c.usarEm<=0)usaItem(c);}
  fisica(c,dt,true,false,Math.max(-1,Math.min(1,d*2.5)));
}
// kart de outro computador: segue o último estado recebido (e adivinha o caminho entre um e outro)
function remotoPasso(c,dt){
  c.tx+=Math.sin(c.th)*c.v*dt;c.tz+=Math.cos(c.th)*c.v*dt;
  const dx=c.tx-c.x,dz=c.tz-c.z;
  if(dx*dx+dz*dz>900){c.x=c.tx;c.z=c.tz;c.h=c.th;}
  const k=Math.min(1,dt*8);
  c.x+=dx*k;c.z+=dz*k;
  let d=c.th-c.h;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;c.h+=d*k;
  if(c.spin>0)c.spin-=dt;if(c.boost>0)c.boost-=dt;if(c.estrela>0)c.estrela-=dt;
}
function colisoes(){
  for(let i=0;i<carros.length;i++)for(let j=i+1;j<carros.length;j++){
    const a=carros[i],b=carros[j];
    if(a.remoto&&b.remoto)continue;
    const dx=b.x-a.x,dz=b.z-a.z,d2=dx*dx+dz*dz;
    if(d2<5.8&&d2>0.0001){
      const d=Math.sqrt(d2),em=2.4-d,nx=dx/d,nz=dz/d;
      const wa=a.remoto?0:b.remoto?1:0.5,wb=1-wa;
      a.x-=nx*em*wa;a.z-=nz*em*wa;b.x+=nx*em*wb;b.z+=nz*em*wb;
      const m=(a.v+b.v)/2;
      if(!a.remoto)a.v=a.v*0.85+m*0.15;
      if(!b.remoto)b.v=b.v*0.85+m*0.15;
      if(a.estrela>0&&b.estrela<=0&&!b.remoto)acerta(b);
      if(b.estrela>0&&a.estrela<=0&&!a.remoto)acerta(a);
      if((a.jog||b.jog)&&Math.random()<0.3)bip(140,0.08,'square',0.06);
    }
  }
}
function posGrafico(c){
  c.g.position.set(c.x,0,c.z);c.g.rotation.y=c.h;
  c.corpo.rotation.y=c.spin>0?c.spin*14:0;
  c.corpo.position.y=c.boost>0||c.estrela>0?Math.sin(performance.now()/40)*0.06:0;
  c.aura.visible=c.estrela>0;
  if(c.estrela>0)c.aura.material.color.setHSL((performance.now()/600)%1,1,0.6);
}
function classificacao(){
  return carros.slice().sort((a,b)=>{
    if(a.fim&&b.fim)return a.fim-b.fim;
    if(a.fim)return -1;if(b.fim)return 1;
    return b.total-a.total;
  });
}

function usaItem(c){
  const it=c.item;if(!it||c.roletaT>0)return;c.item=null;
  if(it==='turbo'){c.boost=1.7;if(c.jog){bip(300,0.3,'sawtooth',0.1);bip(500,0.4,'sawtooth',0.06);}}
  else if(it==='estrela'){c.estrela=5;if(c.jog){avisa('⭐ INVENCÍVEL!');[523,659,784,1047].forEach((f,i)=>setTimeout(()=>bip(f,0.12,'square',0.08),i*90));}}
  else if(it==='banana'){
    const pid=novoPid(),x=c.x-Math.sin(c.h)*3.2,z=c.z-Math.cos(c.h)*3.2;

    if(c.jog)bip(200,0.5,'sawtooth',0.1);
  }
  if(c.jog)mostraItem();

function acerta(c){
  if(c.spin>0||c.estrela>0)return;
  c.spin=1.3;c.v*=0.3;
  if(c.jog){avisa('💥 Rodou!');bip(120,0.4,'sawtooth',0.14);}
  else if(jogador&&Math.hypot(c.x-jogador.x,c.z-jogador.z)<60)bip(700,0.12,'square',0.06);
}
function pegouCaixa(c){
  if(c.item||c.roletaT>0)return;
  if(c.jog){c.roletaT=1.5;c.roletaItem=sorteia(c);abreRoleta();}
  else{c.item=sorteia(c);c.usarEm=0.8+Math.random()*3;}
}
function some(b){b.ativo=false;b.t=3;b.m.visible=false;}
function atualizaItens(dt){
  const tt=performance.now()/1000;
  caixas.forEach((b,bi)=>{
    if(!b.ativo){b.t-=dt;if(b.t<=0){b.ativo=true;b.m.visible=true;}return;}
    b.m.rotation.y=tt*1.5;b.m.rotation.x=tt*0.7;b.m.position.y=1.3+Math.sin(tt*2+b.x)*0.25;
    for(const c of carros){
      if(c.remoto)continue;
      const dx=c.x-b.x,dz=c.z-b.z;
      if(dx*dx+dz*dz<7){some(b);pegouCaixa(c);mpEnvia({t:'cx',i:bi});break;}
    }
  });
  turbos.forEach(p=>{for(const c of carros){if(c.remoto)continue;const dx=c.x-p.x,dz=c.z-p.z;if(dx*dx+dz*dz<8){if(c.boost<0.9&&c.jog)bip(400,0.25,'sawtooth',0.08);c.boost=Math.max(c.boost,1);}}});
  for(let i=bananas.length-1;i>=0;i--){const b=bananas[i];b.t+=dt;
    for(const c of carros){
      if(c.remoto||(c===b.dono&&b.t<1))continue;
      const dx=c.x-b.x,dz=c.z-b.z;
      if(dx*dx+dz*dz<3.2){acerta(c);mpEnvia({t:'rm',pid:b.pid});scene.remove(b.m);bananas.splice(i,1);break;}
    }
  }
  const passo=LEN/N;
  for(let i=foguetes.length-1;i>=0;i--){const f=foguetes[i];f.vida-=dt;
    f.p+=80*dt/passo;
    if(f.alvo)f.lat+=(f.alvo.lat-f.lat)*Math.min(1,dt*3);
    const i0=Math.floor(f.p)%N,p=pt(i0,f.lat);
    f.m.position.set(p.x,1,p.z);f.m.rotation.y=Math.atan2(T[i0].x,T[i0].z);
    let bateu=false;
    for(const c of carros){
      if(c===f.dono||c.remoto)continue;
      const dx=c.x-p.x,dz=c.z-p.z;
      if(dx*dx+dz*dz<6.5){acerta(c);mpEnvia({t:'rm',pid:f.pid});bateu=true;break;}
    }
    if(bateu||f.vida<=0){scene.remove(f.m);foguetes.splice(i,1);}
  }
}

let ac=null,motor=null,motorG=null;
const SOM=false; // sons desligados a pedido do Davi (eram robóticos) — pra voltar, troque pra true
function audio(){
  if(!SOM)return;
  if(ac){if(ac.state==='suspended')ac.resume();return;}
  try{ac=new (window.AudioContext||window.webkitAudioContext)();
    motor=ac.createOscillator();motor.type='sawtooth';motorG=ac.createGain();motorG.gain.value=0;

function bip(fr,dur,tipo,vol){

    g.gain.setValueAtTime(vol||0.08,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+dur);
    o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+dur+0.02);}catch(e){}
}

const camPos=new THREE.Vector3(),camTmp=new THREE.Vector3();let camInstant=true;
function atualizaCamera(dt){
  const c=jogador;if(!c)return;
  if(estado==='menu'){
    const a=performance.now()/2500;
    camera.position.set(c.x+Math.sin(a)*7,3.2,c.z+Math.cos(a)*7);camera.lookAt(c.x,1,c.z);camInstant=true;return;
  }
  const fx=Math.sin(c.h),fz=Math.cos(c.h),dist=8+Math.max(0,c.v)*0.05;
  camTmp.set(c.x-fx*dist,3.6+Math.max(0,c.v)*0.02,c.z-fz*dist);
  if(camInstant){camPos.copy(camTmp);camInstant=false;}else camPos.lerp(camTmp,1-Math.pow(0.0015,dt));
  camera.position.copy(camPos);camera.lookAt(c.x+fx*5,1.4,c.z+fz*5);
  const fov=c.boost>0||c.estrela>0?80:70;if(Math.abs(camera.fov-fov)>0.2){camera.fov+=(fov-camera.fov)*Math.min(1,dt*5);camera.updateProjectionMatrix();}
}

function loop(t){
  requestAnimationFrame(loop);
  if(TOUCH&&t-ultQuadro<31)return;
  ultQuadro=t;
  const dt=Math.min(0.05,(t-ultimo)/1000);ultimo=t;
  if(!P.length||!jogador)return;
  passo(dt);
  renderer.render(scene,camera);
}
function passo(dt){
  if(estado==='contagem'){
    tContagem-=dt;
    const n=Math.ceil(tContagem-0.6);
    if(n!==ultContagem){ultContagem=n;
      if(n>0){$('msg').textContent=n;bip(440,0.2,'square',0.1);}
      else{$('msg').textContent='JÁ! 🏁';bip(880,0.5,'square',0.12);}}
    if(tContagem<=0.6){estado='corrida';ultVolta=1;setTimeout(()=>{if($('msg').textContent==='JÁ! 🏁')$('msg').textContent='';},800);}
    carros.forEach(c=>{if(c.remoto)remotoPasso(c,dt);});
  }else if(estado==='corrida'||estado==='fim'){
    if(estado==='corrida')tCorrida+=dt;
    carros.forEach(c=>{
      if(c.remoto)remotoPasso(c,dt);
      else if(c.jog&&!c.auto){const k=controleJogador();fisica(c,dt,k.acel,k.freio,k.giro);}
      else ia(c,dt);
      if(!c.remoto&&!c.fim&&c.volta>VOLTAS)c.fim=tCorrida||0.1;
    });
    colisoes();
    atualizaItens(dt);
    roletaPasso(dt);
    if(estado==='corrida'){
      if(jogador.volta>ultVolta&&jogador.volta<=VOLTAS){
        ultVolta=jogador.volta;avisa(jogador.volta===VOLTAS?'🔥 ÚLTIMA VOLTA!':'🏁 Volta '+jogador.volta+'!');bip(700,0.2,'square',0.08);}
      if(jogador.fim){estado='fim';terminaJogador();}
    }
  }
  carros.forEach(posGrafico);
  if(estado==='menu'){jogador.corpo.rotation.y=0;}
  atualizaCamera(dt);

  if(mp.online&&estado!=='menu'){mp.ultEnvio+=dt;if(mp.ultEnvio>=0.1){mp.ultEnvio=0;mpEnviaEstado();}}
  if(avisoT>0){avisoT-=dt;if(avisoT<=0)$('aviso').textContent='';}
  if(motorG){motorG.gain.value=(estado==='corrida'||estado==='contagem')?0.035:0;motor.frequency.value=45+Math.abs(jogador.v)*4+(jogador.boost>0?60:0);}
  acHud+=dt;if(acHud>0.25&&estado!=='menu'){acHud=0;hud();}
  acMini+=dt;if(acMini>0.1&&estado!=='menu'){acMini=0;desenhaMini();}
  if(estado==='fim'&&$('fim').classList.contains('on')){acTabela+=dt;if(acTabela>1){acTabela=0;preencheTabela();}}
}

// teste automático (só com #teste na URL)
if(location.hash==='#teste'){
  window.__kartTeste=function(pista,seg){
    pistaEsc=pista;comecar();jogador.auto=true;
    for(let i=0;i<seg*30;i++)passo(1/30);
    return PISTAS[pista].nome+': '+carros.map(c=>c.nome+'='+(c.fim?fmt(c.fim):'NAO(volta '+c.volta+')')).join(', ');
  };
  window.__kartMp={
    criar:()=>{mpConecta(codigoSala(),true);return mp.sala;},
    entrar:c=>mpConecta(c,false),
    comecar:hostComeca,
    roleta:()=>{pegouCaixa(jogador);return jogador.roletaItem;},
    passo:s=>{jogador.auto=true;for(let i=0;i<s*30;i++)passo(1/30);},
    info:()=>({estado,tela:mp.tela,jog:mp.jog.map(j=>j.nome),item:jogador.item,
      carros:carros.map(c=>c.id+(c.remoto?'R':'L')+':'+Math.round(c.x)+','+Math.round(c.z)).join(' ')})
  };
}

// ================= INÍCIO =================
construirPista(pistaEsc);
montaGrid();
montaMenu();
// link de convite: /kart/?sala=CODIGO
try{const s=new URLSearchParams(location.search).get('sala');if(s){abreSala();mpConecta(s.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,5),false);}}catch(e){}
})();
</script>
