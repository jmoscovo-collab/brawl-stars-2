    <radialGradient id="lua" cx=".5" cy=".5" r=".5"><stop offset=".55" stop-color="#fff6d0"/><stop offset=".75" stop-color="rgba(255,240,180,.35)"/><stop offset="1" stop-color="rgba(255,240,180,0)"/></radialGradient>
