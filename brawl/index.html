<style id="device-screen-style">
#device-screen {
  position: fixed; inset: 0; background: #000; z-index: 99999;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  color: #fff; font-family: Arial, sans-serif; text-align: center;
}
#device-screen h1 { font-size: 38px; margin: 0 0 10px; color: #ff4444; text-shadow: 0 0 20px #ff4444;}
#device-screen p { font-size: 18px; margin: 0 0 30px;}
#device-screen .opts { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; }
#device-screen .opt {
  background: #222; border: 3px solid #555; border-radius: 16px;
  padding: 28px 36px; cursor: pointer; min-width: 160px;
}
#device-screen .opt:hover, #device-screen .opt:active { background: #333; border-color: #ff4444; transform: scale(1.05); }
#device-screen .ico { font-size: 56px; }
#device-screen .lbl { font-size: 18px; font-weight: bold; margin-top: 8px;}
#device-warn { color: #fa4; font-size: 14px; margin-top: 18px; min-height: 20px;}
</style>

<body>

<div id="device-screen">
  <h1>🍄 ARENA COGUMELO</h1>
  <p>Como você está jogando?</p>
  <div class="opts">
    <div class="opt" id="ds-pc"><div class="ico">🖥️</div><div class="lbl">COMPUTADOR</div></div>
    <div class="opt" id="ds-mobile"><div class="ico">📱</div><div class="lbl">CELULAR</div></div>
  </div>
  <div id="device-warn"></div>
</div>
<script>
(function(){
  var s = document.getElementById('device-screen');
  var warn = document.getElementById('device-warn');
  var isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  document.getElementById('ds-pc').onclick = function(){
    if (isTouch) { warn.textContent = '⚠️ Seu aparelho parece ser celular. Mesmo assim, jogar no PC.'; setTimeout(function(){ s.remove(); }, 600); return; }
    s.remove();
  };
  document.getElementById('ds-mobile').onclick = function(){
    document.body.classList.add('mobile-mode');
    if (!isTouch) { warn.textContent = '⚠️ Modo celular ativado (alguns controles podem não ter touch).'; }
    if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function(){});
    setTimeout(function(){ s.remove(); }, 400);
  };
})();
</script>

    <script>
// === AUDIO ===
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
document.addEventListener('click', () => audioCtx.resume());
function playTone(freq, dur, type='square', vol=0.15) {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, audioCtx.currentTime);
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + dur);
}
function sfxShoot(){playTone(600,0.06)}
function sfxHit(){playTone(150,0.1,'sawtooth',0.2)}

(function gerarNovosLutadores(){
    const prefixos = ['Turbo','Fera','Sombra','Trovão','Vulcão','Gelo','Fogo','Aço','Cristal','Vento','Raio','Pedra','Estrela','Nebulosa','Fúria','Choque','Brasa','Névoa','Garra','Eco','Prisma','Ciclone','Magma','Ônix','Zênite','Ártico','Fênix','Nova','Quantum','Ruptura'];
    const sufixos = ['bot','tron','max','zor','ex','ax','on','ino','ão','yx','ik','us','oth','ara','prime','ix'];
    const icones = ['🦁','🐺','🦂','🐉','🦅','🦈','🐙','🦇','🐝','🦖','🦕','🐲','🦄','🐧','🦉','🐆','🦓','🦍','🐊','🦏','🦣','🦫','🐿️','🦔','🐢','🦎','🐍','🦟','🕷️','🦗','🐌','🦋','🐞','🦀','🐡','🦑','🐳','🐬','🦭','🐋','🌪️','🔥','💥','⚙️','🧲','🔮','🛰️','🎯','🧨','⚗️'];
    const ataques = ['normal','shotgun','zap','cannon','laser','triple','spore','bomb','sniper'];
    const rarezas = ['comum','comum','raro','raro','epico','comum','raro','mitico','epico','lendario'];
    const precoPorRaridade = { comum:250, raro:550, epico:1100, mitico:1900, lendario:2800 };
    function hsl2hex(h,s,l){
        s/=100; l/=100;
        const k=n=>(n+h/30)%12;
        const a=s*Math.min(l,1-l);
        const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
        const toHex=x=>Math.round(255*Math.max(0,Math.min(1,x))).toString(16).padStart(2,'0');
        return parseInt('0x'+toHex(f(0))+toHex(f(8))+toHex(f(4)));
    }
    for (let i=0;i<50;i++){
        const name = prefixos[i%prefixos.length] + sufixos[Math.floor(i/3)%sufixos.length];
        const icon = icones[i%icones.length];
        const rarity = rarezas[i%rarezas.length];
        const hue = (i*47)%360;
        const color = hsl2hex(hue,65,55);
        const accent = hsl2hex(hue,65,28);
        const attack = ataques[i%ataques.length];
        const rMul = rarity==='lendario'?1.35:rarity==='mitico'?1.22:rarity==='epico'?1.12:rarity==='raro'?1.05:1;
        const hp = Math.round((90+(i%7)*18)*rMul);
        const dmg = Math.round((10+(i%9)*2.4)*rMul);
        const speed = +(2+(i%6)*0.7).toFixed(1);
        brawlers.push({
            name, icon, rarity, hp, dmg, speed, color, accent, attack,
            atkDesc: 'Ataque especial', unlocked:false, price:precoPorRaridade[rarity],
            mitico: rarity==='mitico'
        });
    }
})();

const SAVE_KEY = 'arenaCogumeloSave';
// jogador NOVO começa zerado: 0 moedas, 0 gemas, só o Bolt liberado (definido lá em cima)
let gold = 0, gems = 0, claimedMilestones = [];
let seasonTokens = 0, passPlusOwned = false, claimedPassRewards = [];
let selectedBrawler = 0;
function saveGame() {
    try {
        localStorage.setItem(SAVE_KEY, JSON.stringify({
            gold, gems, claimedMilestones, selectedBrawler,
            seasonTokens, passPlusOwned, claimedPassRewards,
            brawlers: brawlers.map(b => ({ name: b.name, trophies: b.trophies, unlocked: b.unlocked }))
        }));
    } catch (e) {}
}
function loadGame() {
    let s;
    try { s = JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) { s = null; }
    if (!s) return;
    if (typeof s.gold === 'number') gold = s.gold;
    if (typeof s.gems === 'number') gems = s.gems;
    if (Array.isArray(s.claimedMilestones)) claimedMilestones = s.claimedMilestones;
    if (typeof s.seasonTokens === 'number') seasonTokens = s.seasonTokens;
    if (typeof s.passPlusOwned === 'boolean') passPlusOwned = s.passPlusOwned;
    if (Array.isArray(s.claimedPassRewards)) claimedPassRewards = s.claimedPassRewards;
    if (Array.isArray(s.brawlers)) {
        s.brawlers.forEach(sb => {
            const b = brawlers.find(x => x.name === sb.name);
            if (b) { b.trophies = sb.trophies || 0; if (sb.unlocked) b.unlocked = true; }
        });
    }
    if (typeof s.selectedBrawler === 'number' && brawlers[s.selectedBrawler] && brawlers[s.selectedBrawler].unlocked) selectedBrawler = s.selectedBrawler;
}
loadGame();

// === 90 CAIXAS TEMPORÁRIAS — a cada 2h só 6 aparecem na loja (rotação determinística) ===
const ALL_BOXES = (function(){
    const icons = ['📦','🎁','🧰','🗃️','🎒','🪆','🧧','🎇','🛍️','🗳️'];
    const boxes = [];
    for (let i=0;i<90;i++){
        const tier = i % 5; // 0=comum .. 4=lendária
        const priceGems = [15,35,60,100,160][tier];
        const coinMin = [50,150,350,600,1000][tier];
        const coinMax = coinMin + [150,250,400,600,900][tier];
        const brawlerChance = [0,0.06,0.13,0.24,0.38][tier];
        boxes.push({
            id: 'box'+i,
            icon: icons[i % icons.length],
            name: 'Caixa ' + (i+1),
            priceGems, tier,
            open(){
                const rewards = [];
                const coins = coinMin + Math.floor(Math.random()*(coinMax-coinMin));
                gold += coins;
                rewards.push(`+${coins} 🪙`);
                if (Math.random() < brawlerChance) {
                    const locked = brawlers.filter(b=>!b.unlocked);
                    if (locked.length) {
                        const b = locked[Math.floor(Math.random()*locked.length)];
                        b.unlocked = true;
                        rewards.push(`${b.icon} Lutador novo: ${b.name}!`);
                    }
                }
                if (tier >= 2 && Math.random() < 0.35) {
                    const g = 5 + tier*6;
                    gems += g;
                    rewards.push(`+${g} 💎`);
                }
                return rewards;
            }
        });
    }
    return boxes;
})();
function getShopWindowSeed(){ return Math.floor(Date.now()/7200000); } // muda a cada 2 horas
function mulberry32(a){ return function(){ a|=0; a = a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t = t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function getRotatingBoxes(){
    const seed = getShopWindowSeed();
    const rnd = mulberry32(seed);
    const idxs = ALL_BOXES.map((_,i)=>i);
    for (let i=idxs.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); const tmp=idxs[i]; idxs[i]=idxs[j]; idxs[j]=tmp; }
    return idxs.slice(0,6).map(i=>ALL_BOXES[i]);
}
function minutesUntilNextRotation(){
    const msPerWindow = 7200000;
    const next = (getShopWindowSeed()+1)*msPerWindow;
    return Math.max(0, Math.ceil((next - Date.now())/60000));
}

function renderShop(){
    const content = document.getElementById('shop-content');
    content.innerHTML = '';

    const rotTitle = document.createElement('div');
    rotTitle.className = 'shop-section-title';
    rotTitle.textContent = '📦 CAIXAS DA VEZ (trocam a cada 2 horas!)';
    content.appendChild(rotTitle);
    const timer = document.createElement('div');

    timer.textContent = `⏳ Próxima troca em ${minutesUntilNextRotation()} min`;
    content.appendChild(timer);

    const boxGrid = document.createElement('div');
    boxGrid.className = 'shop-grid';
    getRotatingBoxes().forEach(box=>{
        const el = document.createElement('div');
        el.className = 'shop-item shop-tier-'+box.tier;
        const priceTxt = box.priceGems > 0 ? `${box.priceGems} 💎` : 'GRÁTIS';
        el.innerHTML = `<div class="shop-icon">${box.icon}</div><div class="shop-name">${box.name}</div><div class="shop-price">${priceTxt}</div>`;
        el.onclick = ()=>{
            if (gems < box.priceGems) { showToast(`Faltam ${box.priceGems - gems} 💎!`); return; }
            gems -= box.priceGems;
            saveGame(); updateCurrencyDisplay();
            openBoxScreen(box);
        };

    });
    content.appendChild(boxGrid);

    const permTitle = document.createElement('div');
    permTitle.className = 'shop-section-title';
    permTitle.style.marginTop = '20px';
    permTitle.textContent = '🛒 SEMPRE NA LOJA';
    content.appendChild(permTitle);
    const permGrid = document.createElement('div');
    permGrid.className = 'shop-grid';
    shopItems.forEach(item=>{
        const el=document.createElement('div');el.className='shop-item';
        const priceTxt = item.priceGems > 0 ? `${item.priceGems} 💎` : 'GRÁTIS';
        el.innerHTML=`<div class="shop-icon">${item.icon}</div><div class="shop-name">${item.name}</div><div class="shop-price">${priceTxt}</div>`;
        el.onclick=()=>{
            if (item.priceGems > 0 && gems < item.priceGems) { showToast(`Faltam ${item.priceGems - gems} 💎!`); return; }
            if (item.priceGems > 0) gems -= item.priceGems;
            const msg = item.action();
            sfxBuy(); showToast(msg);
            saveGame(); updateCurrencyDisplay(); renderShop();
        };
        permGrid.appendChild(el);
    });
    content.appendChild(permGrid);
}

function openBoxScreen(box){
    const screen = document.getElementById('box-open-screen');
    const iconEl = document.getElementById('box-open-icon');
    const hintEl = document.getElementById('box-open-hint');
    const rewardsEl = document.getElementById('box-open-rewards');
    const closeBtn = document.getElementById('box-open-close');
    iconEl.textContent = box.icon;
    iconEl.className = 'shaking';
    hintEl.style.display = 'block';
    hintEl.textContent = 'Clique na caixa pra abrir!';
    rewardsEl.className = '';
    rewardsEl.innerHTML = '';
    closeBtn.className = '';
    screen.classList.add('show');
    iconEl.onclick = ()=>{
        iconEl.onclick = null;
        iconEl.className = 'exploded';
        hintEl.style.display = 'none';
        sfxBuy();
        setTimeout(()=>{
            const rewards = box.open();
            saveGame(); updateCurrencyDisplay();
            rewardsEl.className = 'show';
            rewards.forEach((r,i)=>{
                setTimeout(()=>{
                    const item = document.createElement('div');
                    item.className = 'box-reward-item';
                    item.textContent = r;
                    rewardsEl.appendChild(item);
                    sfxPickup();
                }, i*250);
            });
            setTimeout(()=>{ closeBtn.className = 'show'; }, rewards.length*250 + 150);
        }, 420);
    };
    closeBtn.onclick = ()=>{
        screen.classList.remove('show');
        renderShop();
    };
}

// === PASSE DE TEMPORADA ===
const PASS_PLUS_PRICE = 6000;
const passLevels = (function(){
    const levels = [];
    for (let i=1;i<=20;i++){
        levels.push({
            lvl: i,
            need: i*80, // vales acumulados (seasonTokens)
            free: i%5===0 ? `${i*30} 🪙` : (i%3===0 ? `${i*2} 💎` : `${i*15} 🪙`),
            freeGrant(){ if (i%5===0) gold+=i*30; else if (i%3===0) gems+=i*2; else gold+=i*15; },
            plus: i%5===0 ? `📦 Caixa lendária + ${i*80} 🪙` : `${i*60} 🪙 + ${i} 💎`,
            plusGrant(){ if (i%5===0) { gold+=i*80; const b=brawlers.find(x=>!x.unlocked); if(b) b.unlocked=true; } else { gold+=i*60; gems+=i; } }
        });
    }
    return levels;
})();
function renderPass(){
    const c = document.getElementById('pass-content');
    c.innerHTML = '';
    const banner = document.createElement('div');
    banner.className = 'pass-plus-banner';
    banner.innerHTML = passPlusOwned
        ? `<b>✨ Você tem o PASSE PLUS! ✨</b><div style="color:#ccc;font-size:11px;margin-top:4px">Recompensas em dobro liberadas.</div>`
        : `<b>🎫 PASSE PLUS</b><div style="color:#ccc;font-size:11px;margin-top:4px">Recompensas MUITO maiores em cada nível!</div><button id="btn-buy-pass">Comprar por ${PASS_PLUS_PRICE} 🪙</button>`;
    c.appendChild(banner);
    if (!passPlusOwned) {
        banner.querySelector('#btn-buy-pass').onclick = ()=>{
            if (gold < PASS_PLUS_PRICE) { showToast(`Faltam ${PASS_PLUS_PRICE-gold} 🪙 pro Passe Plus!`); return; }
            gold -= PASS_PLUS_PRICE; passPlusOwned = true;
            sfxBuy(); showToast('✨ Passe Plus ativado!');
            saveGame(); updateCurrencyDisplay(); renderPass();
        };
    }
    const info = document.createElement('div');
    info.style.cssText = 'color:#00ccff;text-align:center;font-size:13px;margin-bottom:10px;';
    info.textContent = `Você tem ${seasonTokens} 🎟️ vales — ganhe vales terminando batalhas!`;
    c.appendChild(info);
    const track = document.createElement('div');
    track.className = 'pass-track';
    passLevels.forEach((lv,idx)=>{
        const reached = seasonTokens >= lv.need;
        const claimedFree = claimedPassRewards.includes('f'+idx);
        const claimedPlus = claimedPassRewards.includes('p'+idx);
        const row = document.createElement('div');
        row.className = 'pass-row'+(reached?' unlocked':'');
        let freeBtn = claimedFree ? '✅' : (reached ? `<button class="btn-claim" data-k="f${idx}">PEGAR</button>` : '🔒');
        let plusBtn = !passPlusOwned ? '🔒 Plus' : (claimedPlus ? '✅' : (reached ? `<button class="btn-claim" data-k="p${idx}">PEGAR</button>` : '🔒'));

function isInWater(x, z) {
    for (const w of waterData) {
        if (x > w.x && x < w.x + w.w && z > w.z && z < w.z + w.d) return true;
    }
    return false;
}

function pushFromWater(x, z, r) {
    for (const w of waterData) {
        const cx = Math.max(w.x, Math.min(w.x + w.w, x));
        const cz = Math.max(w.z, Math.min(w.z + w.d, z));
        const dx = x - cx, dz = z - cz;
        const dist = Math.sqrt(dx*dx + dz*dz);
        if (dist < r && dist > 0) {
            x += (dx/dist) * (r - dist);
            z += (dz/dist) * (r - dist);
        } else if (dist === 0) {
            const toLeft = x - w.x, toRight = (w.x + w.w) - x;
            const toTop = z - w.z, toBottom = (w.z + w.d) - z;
            const minDist = Math.min(toLeft, toRight, toTop, toBottom);
            if (minDist === toLeft) x = w.x - r;
            else if (minDist === toRight) x = w.x + w.w + r;
            else if (minDist === toTop) z = w.z - r;
            else z = w.z + w.d + r;
        }
    }
    return { x, z };
}

function isInBush(x, z) {
    for (const b of bushData) {
        if (x > b.x && x < b.x + b.w && z > b.z && z < b.z + b.d) return true;
    }
    return false;
}

// Robô com visual próprio de cada lutador (cor + detalhe + formato pelo tipo de ataque)
function createRobot(b, size) {
    const group = new THREE.Group();
    const mitico = !!b.mitico;
    const accent = b.accent || 0x888888;

    // body — formato varia pelo estilo do lutador
    let bodyW = size, bodyD = size;
    if (b.attack === 'cannon') { bodyW = size * 1.35; bodyD = size * 1.2; }   // tanques largos
    if (b.speed >= 5.5) { bodyW = size * 0.8; bodyD = size * 0.8; }           // velozes magrinhos
    const bodyGeo = new THREE.BoxGeometry(bodyW, size*1.2, bodyD);
    const bodyMat = new THREE.MeshStandardMaterial({ color: b.color, roughness: 0.4, metalness: 0.6 });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.position.y = size * 0.7;
    body.castShadow = true;
    group.add(body);

    // faixa no peito com a cor de detalhe
    const beltGeo = new THREE.BoxGeometry(bodyW * 1.02, size*0.25, bodyD * 1.02);
    const beltMat = new THREE.MeshStandardMaterial({ color: accent, roughness: 0.3, metalness: 0.7 });
    const belt = new THREE.Mesh(beltGeo, beltMat);
    belt.position.y = size * 0.7;
    group.add(belt);

    // ombreiras pros pesados (shotgun/cannon)
    if (b.attack === 'shotgun' || b.attack === 'cannon') {
        const padGeo = new THREE.BoxGeometry(size*0.35, size*0.35, size*0.5);
        const padMat = new THREE.MeshStandardMaterial({ color: accent, roughness: 0.5, metalness: 0.5 });
        const p1 = new THREE.Mesh(padGeo, padMat);
        p1.position.set(-bodyW*0.62, size*1.15, 0);
        group.add(p1);
        const p2 = new THREE.Mesh(padGeo, padMat);
        p2.position.set(bodyW*0.62, size*1.15, 0);
        group.add(p2);
    }

    // head
    const headGeo = new THREE.BoxGeometry(size*0.7, size*0.6, size*0.7);
    const headMat = new THREE.MeshStandardMaterial({ color: b.color, roughness: 0.3, metalness: 0.7 });
    const head = new THREE.Mesh(headGeo, headMat);
    head.position.y = size * 1.5;
    head.castShadow = true;
    group.add(head);

    // eyes — laser/sniper têm visor único, os outros 2 olhos
    if (b.attack === 'laser' || b.attack === 'sniper') {
        const visorGeo = new THREE.BoxGeometry(size*0.5, size*0.12, size*0.1);
        const visorMat = new THREE.MeshBasicMaterial({ color: mitico ? 0xff0000 : 0xff4444 });
        const visor = new THREE.Mesh(visorGeo, visorMat);
        visor.position.set(0, size*1.55, size*0.33);
        group.add(visor);
    } else {
        const eyeGeo = new THREE.SphereGeometry(size*0.12, 8, 8);
        const eyeMat = new THREE.MeshBasicMaterial({ color: mitico ? 0xff0000 : 0x00ff00 });
        const eye1 = new THREE.Mesh(eyeGeo, eyeMat);
        eye1.position.set(-size*0.15, size*1.55, size*0.3);
        group.add(eye1);
        const eye2 = new THREE.Mesh(eyeGeo, eyeMat);
        eye2.position.set(size*0.15, size*1.55, size*0.3);
        group.add(eye2);
    }

    // antenna ou chapéu de cogumelo
    if (mitico && b.attack === 'spore') {
        const capGeo = new THREE.SphereGeometry(size*0.6, 12, 8, 0, Math.PI*2, 0, Math.PI/2);
        const capMat = new THREE.MeshStandardMaterial({ color: 0xff00ff, roughness: 0.3 });
        const cap = new THREE.Mesh(capGeo, capMat);
        cap.position.y = size * 1.9;
        group.add(cap);
        const dotGeo = new THREE.SphereGeometry(size*0.1, 6, 6);
        const dotMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        for (let i = 0; i < 4; i++) {
            const dot = new THREE.Mesh(dotGeo, dotMat);
            dot.position.set(Math.cos(i*1.5)*size*0.35, size*2.0, Math.sin(i*1.5)*size*0.35);
            group.add(dot);
        }
    } else {
        const antGeo = new THREE.CylinderGeometry(0.05, 0.05, size*0.5);
        const antMat = new THREE.MeshStandardMaterial({ color: 0x888888 });
        const ant = new THREE.Mesh(antGeo, antMat);
        ant.position.y = size * 1.9;
        group.add(ant);
        const tipGeo = new THREE.SphereGeometry(size*0.1, 6, 6);
        const tipMat = new THREE.MeshBasicMaterial({ color: accent });
        const tip = new THREE.Mesh(tipGeo, tipMat);
        tip.position.y = size * 2.15;
        group.add(tip);
    }

    // HP bar
    const hpBg = new THREE.Mesh(new THREE.PlaneGeometry(size*1.8, 0.25), new THREE.MeshBasicMaterial({ color: 0x333333 }));
    hpBg.position.y = size * 2.5;
    hpBg.rotation.x = -0.3;
    group.add(hpBg);
    const hpBar = new THREE.Mesh(new THREE.PlaneGeometry(size*1.8, 0.2), new THREE.MeshBasicMaterial({ color: 0x00ff00 }));
    hpBar.position.y = size * 2.5;
    hpBar.position.z = 0.01;
    hpBar.rotation.x = -0.3;
    group.add(hpBar);
    group.userData.hpBar = hpBar;
    group.userData.hpBarWidth = size * 1.8;

    return group;
}

// deixa todos os materiais do robô prontos pra ficar transparentes (modo escondido)
function makeGhostable(group) {
    const mats = [];
    group.traverse(o => { if (o.isMesh && o.material) { o.material = o.material.clone(); o.material.transparent = true; mats.push(o.material); } });
    group.userData.ghostMats = mats;
}
function setGhostOpacity(group, opacity) {
    if (!group.userData.ghostMats) return;
    group.userData.ghostMats.forEach(m => { m.opacity = opacity; });
}

function getWorldMouse() {

    return target;
}

function fireBullets(fromX, fromZ, angle, attack, damage, owner, color) {
    // avisa os outros jogadores do meu tiro (eles renderizam o projétil localmente)
    if (owner === 'player' && gameMode === 'online') {
        netSend({ acao: 'evento', t: 'tiro', id: MEU_ID, x: +fromX.toFixed(2), z: +fromZ.toFixed(2), ang: +angle.toFixed(3) });
    }
    const spd = 0.6;
    const makeB = (a, s, sz, life, pierce, bomb) => {
        const geo = new THREE.SphereGeometry(sz, 8, 8);
        const mat = new THREE.MeshBasicMaterial({ color });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(fromX, 1.2, fromZ);
        scene.add(mesh);
        gBullets.push({ mesh, vx: Math.cos(a)*s, vz: Math.sin(a)*s, damage, life, owner, pierce, bomb });
    };
    switch(attack) {
        case 'normal': makeB(angle, spd*1.2, 0.2, 50, false, false); sfxShoot(); break;
        case 'shotgun': for(let i=-2;i<=2;i++) makeB(angle+i*0.15, spd, 0.15, 30, false, false); sfxShotgun(); break;
        case 'zap': makeB(angle, spd*2, 0.12, 35, false, false); sfxZap(); break;
        case 'cannon': makeB(angle, spd*0.5, 0.5, 80, false, false); sfxBoom(); break;
        case 'laser': for(let i=0;i<3;i++) makeB(angle, spd*1.6, 0.1, 40, true, false); sfxLaser(); break;
        case 'triple': for(let i=-1;i<=1;i++) makeB(angle+i*0.25, spd*1.3, 0.18, 40, false, false); sfxShoot(); break;
        case 'spore': for(let i=0;i<5;i++) makeB(angle+(Math.random()-0.5)*0.8, spd*(0.7+Math.random()*0.5), 0.25, 35, false, false); break;
        case 'bomb': makeB(angle, spd*0.8, 0.4, 55, false, true); sfxBoom(); break;
        case 'sniper': makeB(angle, spd*2.4, 0.15, 75, false, false); sfxZap(); break;
    }
}

function shootCooldownFor(attack) {
    return attack==='zap'?8 : attack==='bomb'?25 : attack==='cannon'?22 : attack==='sniper'?20 : 15;

function shootPlayer() {
    if (player.shootCooldown > 0 || player.dead) return;
    const target = getWorldMouse();
    if (!target) return;
    const angle = Math.atan2(target.z - player.z, target.x - player.x);
    const b = brawlers[selectedBrawler];
    fireBullets(player.x, player.z, angle, b.attack, b.dmg, 'player', b.color);

}

function findSafeSpawn() {

        if (!isInWater(x, z) && !collideObstacles(x, z, 1.5)) return { x, z };

    return { x: 0, z: 0 };
}

function findClosestTarget(e) {
    let closest = null, closestDist = Infinity;
    // Player (só se não estiver escondido no mato!)
    if (!player.hidden && !player.dead) {
        const dpx = player.x - e.x, dpz = player.z - e.z;
        const distP = Math.sqrt(dpx*dpx + dpz*dpz);
        if (distP < closestDist) { closest = { x: player.x, z: player.z, type: 'player' }; closestDist = distP; }
    }
    // Outros robôs
    for (const other of enemies) {
        if (!other.alive || other === e) continue;
        if (other.hidden) continue;
        const dx = other.x - e.x, dz = other.z - e.z;
        const d = Math.sqrt(dx*dx + dz*dz);
        if (d < closestDist) { closest = { x: other.x, z: other.z, type: 'enemy', ref: other }; closestDist = d; }
    }
    // Kit médico (se estiver machucado, prefere ir curar)
    if (e.hp < e.maxHp * 0.5) {
        for (const k of medkits) {
            if (!k.alive) continue;
            const dx = k.x - e.x, dz = k.z - e.z;
            const d = Math.sqrt(dx*dx + dz*dz);
            if (d < closestDist * 0.8) { closest = { x: k.x, z: k.z, type: 'medkit' }; closestDist = d; }
        }
    }
    // Cristais (modo pega-cristais: prioridade máxima)
    if (isCrystalLike()) {
        for (const c of crystals) {
            if (!c.alive) continue;
            const dx = c.x - e.x, dz = c.z - e.z;
            const d = Math.sqrt(dx*dx + dz*dz);
            if (d < closestDist * 1.5) { closest = { x: c.x, z: c.z, type: 'crystal' }; closestDist = d; }
        }
    }
    return { target: closest, dist: closestDist };
}

// === ZONA QUE FECHA ===
function setupZone() {
    if (zoneMesh) { scene.remove(zoneMesh); zoneMesh = null; }
    zoneActive = (gameMode === 'royale');
    zonePhaseIdx = 0;
    zoneRadius = ZONE_PHASES[0];
    zoneTargetRadius = ZONE_PHASES[0];
    zoneTimer = ZONE_HOLD;
    zoneShrinking = false;
    document.getElementById('zone-warning').style.display = 'none';
    if (!zoneActive) return;
    const ringGeo = new THREE.RingGeometry(0.97, 1.0, 64);
    const ringMat = new THREE.MeshBasicMaterial({ color: 0xff3333, transparent: true, opacity: 0.55, side: THREE.DoubleSide, depthWrite: false });
    zoneMesh = new THREE.Mesh(ringGeo, ringMat);
    zoneMesh.rotation.x = -Math.PI / 2;
    zoneMesh.position.y = 0.05;
    zoneMesh.scale.set(zoneRadius, zoneRadius, 1);
    scene.add(zoneMesh);
}

function updateZone() {
    if (!zoneActive) return;
    const warnEl = document.getElementById('zone-warning');
    if (zoneShrinking) {
        zoneRadius -= (zoneRadius - zoneTargetRadius) * 0.02 + 0.01;
        if (zoneRadius <= zoneTargetRadius + 0.1) {
            zoneRadius = zoneTargetRadius;
            zoneShrinking = false;
            zoneTimer = ZONE_HOLD;
            warnEl.style.display = 'none';
        } else {
            warnEl.style.display = 'block';
            warnEl.textContent = '🔴 A ZONA ESTÁ FECHANDO! CORRE PRO MEIO!';
        }
    } else if (zonePhaseIdx < ZONE_PHASES.length - 1) {
        zoneTimer--;
        if (zoneTimer <= ZONE_WARN && zoneTimer > 0) {
            warnEl.style.display = 'block';
            warnEl.textContent = `⚠️ A zona vai fechar em ${Math.ceil(zoneTimer/60)}s!`;
            if (zoneTimer === ZONE_WARN) sfxWarn();
        }
        if (zoneTimer <= 0) {
            zonePhaseIdx++;
            zoneTargetRadius = ZONE_PHASES[zonePhaseIdx];
            zoneShrinking = true;
        }
    } else {
        warnEl.style.display = 'none';
    }
    zoneMesh.scale.set(zoneRadius, zoneRadius, 1);
    // pulso visual
    zoneMesh.material.opacity = 0.45 + Math.sin(Date.now()*0.005)*0.15;

    // dano fora da zona
    const ZONE_DPS = 0.2;
    if (!player.dead) {
        const pd = Math.sqrt(player.x*player.x + player.z*player.z);
        if (pd > zoneRadius) {
            player.hp -= ZONE_DPS;
            if (Math.random() < 0.1) spawnParticle3D(player.x, player.z, 0xff3333);
            if (player.hp <= 0) { killPlayer(); }
        }
    }
    for (const e of enemies) {
        if (!e.alive) continue;
        const ed = Math.sqrt(e.x*e.x + e.z*e.z);
        if (ed > zoneRadius) {
            e.hp -= ZONE_DPS;
            if (e.hp <= 0) killEnemy(e, null);
        }
    }
}

// === MULTIPLAYER ONLINE (relay WebSocket) ===
const NET_URL = 'wss://zxbmtlkq6b.execute-api.sa-east-1.amazonaws.com/prod?jogo=arena';
const MEU_ID = Math.random().toString(36).slice(2, 9);
let ws = null, netTimer = null, peers = {};
let meuNome = 'Robô';

function ehOperador(n){ return ['samuel9','ovo gostoso','davi0'].indexOf(String(n||'').trim().toLowerCase())>=0; }
function makeNameSprite(nome) {
    const cv = document.createElement('canvas');
    cv.width = 256; cv.height = 64;
    const ctx = cv.getContext('2d');
    ctx.font = 'bold 36px monospace';
    ctx.textAlign = 'center';
    ctx.lineWidth = 6;
    ctx.strokeStyle = '#000';
    if (ehOperador(nome)) { ctx.fillStyle = '#ff2222'; ctx.shadowColor = '#ff2222'; ctx.shadowBlur = 10; }
    else { ctx.fillStyle = '#ffffff'; }
    ctx.strokeText(nome, 128, 42);
    ctx.fillText(nome, 128, 42);
    ctx.shadowBlur = 0;
    const tex = new THREE.CanvasTexture(cv);
    const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
    spr.scale.set(6, 1.5, 1);
    spr.position.y = 4.3;
    return spr;
}

function makePeerMesh(p) {
    const b = brawlers[p.lutador] || brawlers[0];
    const mesh = createRobot(b, 1.2);
    makeGhostable(mesh);
    mesh.add(makeNameSprite(p.nome));
    mesh.position.set(p.x, 0, p.z);
    scene.add(mesh);
    return mesh;
}

function netConnect() {
    netDisconnect();
    try { ws = new WebSocket(NET_URL); } catch (e) { ws = null; showToast('📡 Não deu pra conectar!'); return; }
    ws.onopen = () => {
        showToast('🌍 Conectado! Procurando jogadores...');
        netTimer = setInterval(netSendEstado, 140); // ~7x/s
    };
    ws.onmessage = ev => {
        let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
        handleNet(m);
    };
    ws.onclose = () => {
        ws = null;
        if (gameRunning && gameMode === 'online') {
            showToast('📡 A conexão caiu! Voltando pro menu...');
            backToMenu();
        }
    };
    ws.onerror = () => {};
}

function netDisconnect() {
    if (netTimer) { clearInterval(netTimer); netTimer = null; }
    if (ws) { ws.onclose = null; try { ws.close(); } catch (e) {} ws = null; }
    Object.values(peers).forEach(p => scene.remove(p.mesh));
    peers = {};
}

function netSend(obj) {
    if (ws && ws.readyState === 1) { try { ws.send(JSON.stringify(obj)); } catch (e) {} }
}

function netSendEstado() {
    if (!gameRunning || gameMode !== 'online') return;
    netSend({
        acao: 'estado', t: 'estado', id: MEU_ID, nome: meuNome,
        x: +player.x.toFixed(2), z: +player.z.toFixed(2),
        ang: playerObj ? +playerObj.rotation.y.toFixed(2) : 0,
        lutador: selectedBrawler, hp: player.dead ? 0 : Math.max(0, Math.round(player.hp)), pts: score
    });
}

function handleNet(m) {
    if (!gameRunning || gameMode !== 'online' || !m || !m.quem) return;
    const q = m.quem;
    if (m.t === 'estado') {
        let p = peers[q];
        const li = (typeof m.lutador === 'number' && brawlers[m.lutador]) ? m.lutador : 0;
        if (!p) {
            p = peers[q] = { x: m.x || 0, z: m.z || 0, tx: m.x || 0, tz: m.z || 0, ang: m.ang || 0, tang: m.ang || 0, lutador: li, nome: m.nome || 'Robô', hp: m.hp, pts: m.pts || 0, id: m.id, last: Date.now() };
            p.mesh = makePeerMesh(p);
            showToast('🎮 ' + p.nome + ' entrou na arena!');
        }
        if (li !== p.lutador || (m.nome && m.nome !== p.nome)) {
            scene.remove(p.mesh);
            p.lutador = li; p.nome = m.nome || p.nome;
            p.mesh = makePeerMesh(p);
        }
        p.tx = m.x || 0; p.tz = m.z || 0; p.tang = m.ang || 0;
        p.hp = m.hp; p.pts = m.pts || 0; p.id = m.id || p.id;
        p.last = Date.now();
    } else if (m.t === 'tiro') {
        const p = peers[q];
        const b = brawlers[p ? p.lutador : 0];
        fireBullets(m.x || 0, m.z || 0, m.ang || 0, b.attack, b.dmg, 'peer_' + q, b.color);
        if (p) p.last = Date.now();
    } else if (m.t === 'morri') {
        // alguém morreu por um tiro MEU → ganho o abate
        if (m.para === MEU_ID) {
            player.kills++;
            score += 10;
            sfxKill();
            showToast('💥 Você derrubou ' + ((peers[q] && peers[q].nome) || 'um robô') + '!');
        }
    }
}

function updatePeers() {
    const now = Date.now();
    for (const q of Object.keys(peers)) {
        const p = peers[q];
        if (now - p.last > 6000) { scene.remove(p.mesh); delete peers[q]; continue; }
        // interpolação suave
        p.x += (p.tx - p.x) * 0.2;
        p.z += (p.tz - p.z) * 0.2;
        let da = p.tang - p.ang;
        while (da > Math.PI) da -= Math.PI * 2;
        while (da < -Math.PI) da += Math.PI * 2;
        p.ang += da * 0.2;
        p.mesh.position.set(p.x, 0, p.z);
        p.mesh.rotation.y = p.ang;
        const mb = brawlers[p.lutador] || brawlers[0];
        const r = Math.max(0, Math.min(1, (p.hp || 0) / mb.hp));
        p.mesh.userData.hpBar.scale.x = r;
        p.mesh.userData.hpBar.material.color.setHex(r > 0.5 ? 0x00ff00 : r > 0.25 ? 0xffff00 : 0xff0000);
        p.mesh.visible = (p.hp || 0) > 0;
    }
}

function updatePlacarOnline() {
    const rows = [{ nome: '⭐ ' + meuNome, pts: score, raw: meuNome }]
        .concat(Object.values(peers).map(p => ({ nome: p.nome, pts: p.pts || 0, raw: p.nome })))
        .concat(enemies.map(e => ({ nome: '🤖 ' + e.name, pts: e.kills * 10, raw: e.name })))
        .sort((a, b) => b.pts - a.pts)
        .slice(0, 8);
    document.getElementById('online-placar').innerHTML =
        '<b>🏆 PLACAR</b><br>' + rows.map((r, i) => ehOperador(r.raw)
            ? `<span style="color:#ff2222;font-weight:bold">${i + 1}º ${r.nome} — ${r.pts}</span>`
            : `${i + 1}º ${r.nome} — ${r.pts}`).join('<br>');
}

function startGame() {
    const b = brawlers[selectedBrawler];
    player.hp = b.hp; player.maxHp = b.hp;
    player.speed = b.speed * 0.05;
    player.dmg = b.dmg; player.attack = b.attack;
    player.shootCooldown = 0;
    player.hidden = false; player.dead = false; player.respawnTimer = 0;
    player.kills = 0; player.crystals = 0;
    score = 0; gameOver = false; victory = false;
    matchTimer = gameMode === 'matamata' ? 90 * 60 : 0;
    crystalSpawnTimer = 0;
    CRYSTAL_GOAL = gameMode === 'bandeira' ? 1 : 10;
    survivalWave = 1;

    // Clear old
    if (playerObj) scene.remove(playerObj);
    gBullets.forEach(b => scene.remove(b.mesh));
    gBullets = [];
    gParticles.forEach(p => scene.remove(p.mesh));
    gParticles = [];

    generateMapElements();

    const pSpawn = findSafeSpawn();
    player.x = pSpawn.x; player.z = pSpawn.z;

    playerObj = createRobot(b, 1.2);
    makeGhostable(playerObj);
    playerObj.position.set(player.x, 0, player.z);
    scene.add(playerObj);

    spawnEnemies();
    setupZone();
    if (isCrystalLike()) { const n = gameMode === 'bandeira' ? 1 : 5; for (let i = 0; i < n; i++) spawnCrystal(); }
    gameRunning = true;
    if (gameMode === 'online') {
        meuNome = localStorage.getItem('cg_usuario') || ('Robô' + Math.floor(100 + Math.random() * 900));
        document.getElementById('online-placar').style.display = 'block';

        document.getElementById('online-placar').style.display = 'none';

    }
    document.getElementById('overlay').classList.remove('show');
    document.getElementById('hidden-tag').style.display = 'none';
    resizeGame();
}

    document.getElementById('game-container').style.display = 'none';
    document.getElementById('menu').style.display = 'flex';
    document.getElementById('zone-warning').style.display = 'none';
    document.getElementById('hidden-tag').style.display = 'none';
    if (score > 0 || victory) {
        brawlers[selectedBrawler].trophies += trophiesEarned();
        gold += score;  // moedas por batalha!
        seasonTokens += Math.max(1, Math.floor(score/5)); // vales do Passe de Temporada
        saveGame();
        updateCurrencyDisplay();
    }
}

function collideObstacles(x, z, r) {
    for (const o of obstacleData) {
        const cx = Math.max(o.x, Math.min(o.x + o.w, x));
        const cz = Math.max(o.z, Math.min(o.z + o.d, z));
        const dx = x - cx, dz = z - cz;
        if (dx*dx + dz*dz < r*r) return true;
    }
    return false;
}

function pushFromObstacles(x, z, r) {
    for (const o of obstacleData) {
        const cx = Math.max(o.x, Math.min(o.x + o.w, x));
        const cz = Math.max(o.z, Math.min(o.z + o.d, z));
        const dx = x - cx, dz = z - cz;
        const dist = Math.sqrt(dx*dx + dz*dz);
        if (dist < r && dist > 0) {
            x += (dx/dist) * (r - dist);
            z += (dz/dist) * (r - dist);
        }
    }
    return { x, z };
}

function spawnParticle3D(x, z, color) {
    const geo = new THREE.SphereGeometry(0.12, 4, 4);
    const mat = new THREE.MeshBasicMaterial({ color });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(x, 1 + Math.random(), z);
    scene.add(mesh);
    gParticles.push({ mesh, vx: (Math.random()-0.5)*0.3, vy: Math.random()*0.2, vz: (Math.random()-0.5)*0.3, life: 20 });
}

const modeHasRespawn = () => gameMode === 'matamata' || gameMode === 'cristais' || gameMode === 'online';

function killPlayer() {
    if (player.dead) return;
    sfxDamage();
    for(let k=0;k<10;k++) spawnParticle3D(player.x, player.z, brawlers[selectedBrawler].color);
    if (modeHasRespawn()) {
        player.dead = true;
        player.respawnTimer = gameMode === 'online' ? 180 : 120;
        playerObj.visible = false;
        if (isCrystalLike() && player.crystals > 0) {
            for (let i = 0; i < player.crystals; i++) spawnCrystal(player.x, player.z);
            player.crystals = 0;
        }
    } else {
        gameOver = true;
        sfxGameOver();
        showOverlay();
    }
}

function killEnemy(e, killerOwner) {
    if (!e.alive) return;
    e.alive = false;
    sfxKill();
    for(let k=0;k<10;k++) spawnParticle3D(e.x, e.z, e.color);
    if (killerOwner === 'player') {
        player.kills++;
        score += e.mitico ? 50 : 10;
    } else if (killerOwner && killerOwner.startsWith('enemy_')) {
        const ki = parseInt(killerOwner.split('_')[1]);
        if (enemies[ki]) enemies[ki].kills++;
    }
    if (isCrystalLike() && e.crystals > 0) {
        for (let i = 0; i < e.crystals; i++) spawnCrystal(e.x, e.z);
        e.crystals = 0;
    }
    if (modeHasRespawn()) {
        e.respawnTimer = 120;
        e.mesh.visible = false;
    } else {
        aliveCount--;
        scene.remove(e.mesh);
        checkEndConditions();
    }
}

function checkEndConditions() {
    if (gameOver || victory) return;
    if (gameMode === 'royale' || gameMode === 'duelo' || gameMode === 'bandeira') {
        if (!player.dead && player.hp > 0 && aliveCount <= 1) { victory = true; sfxVictory(); showOverlay(); }
    } else if (gameMode === 'sobrevivencia') {
        if (!player.dead && player.hp > 0 && aliveCount <= 1) { spawnNextWave(); }
    }
}

function respawnEntity() {
    // player
    if (player.dead && player.respawnTimer > 0) {
        player.respawnTimer--;
        if (player.respawnTimer <= 0) {
            const s = findSafeSpawn();
            player.x = s.x; player.z = s.z;
            player.hp = player.maxHp;
            player.dead = false;
            playerObj.visible = true;
            sfxHeal();
        }
    }
    for (const e of enemies) {
        if (!e.alive && e.respawnTimer > 0) {
            e.respawnTimer--;
            if (e.respawnTimer <= 0) {
                const s = findSafeSpawn();
                e.x = s.x; e.z = s.z;
                e.hp = e.maxHp;
                e.alive = true;
                e.mesh.visible = true;
                e.mesh.position.set(e.x, 0, e.z);
            }
        }
    }
}

function endMataMata() {
    // ranking por abates
    const ranking = [{ name: 'Você', kills: player.kills }].concat(
        enemies.map(e => ({ name: e.name, kills: e.kills }))
    ).sort((a, b) => b.kills - a.kills);
    const myPos = ranking.findIndex(r => r.name === 'Você') + 1;
    score = player.kills * 10;
    if (myPos === 1) { victory = true; sfxVictory(); }
    else { gameOver = true; sfxGameOver(); }
    showOverlayMataMata(myPos, ranking[0]);
}

function update() {
    if (!gameRunning || gameOver || victory) return;

    respawnEntity();

    // timer do mata-mata
    if (gameMode === 'matamata') {
        matchTimer--;
        if (matchTimer <= 0) { endMataMata(); return; }
    }

    // cristais/bandeira aparecendo
    if (isCrystalLike()) {
        const maxAtivos = gameMode === 'bandeira' ? 1 : 8;
        crystalSpawnTimer--;
        if (crystalSpawnTimer <= 0 && crystals.filter(c => c.alive).length < maxAtivos) {
            spawnCrystal();
            crystalSpawnTimer = 240;
        }
        // gira os cristais
        for (const c of crystals) { if (c.alive) { c.mesh.rotation.y += 0.04; c.mesh.position.y = 1 + Math.sin(Date.now()*0.003 + c.x)*0.2; } }
    }

    // Player movement — keyboard + touch
    const _prevPx = player.x, _prevPz = player.z;
    if (!player.dead) {
        let dx = 0, dz = 0;
        if (keys['KeyW']||keys['ArrowUp']) dz -= 1;
        if (keys['KeyS']||keys['ArrowDown']) dz += 1;
        if (keys['KeyA']||keys['ArrowLeft']) dx -= 1;
        if (keys['KeyD']||keys['ArrowRight']) dx += 1;
        if (touchMove.active) { dx += touchMove.dx; dz += touchMove.dz; }
        if (dx || dz) {
            const len = Math.sqrt(dx*dx+dz*dz);
            player.x += (dx/len) * player.speed;
            player.z += (dz/len) * player.speed;
        }
        // Touch shoot
        if (touchShoot.active && touchShoot.shooting && (touchShoot.dx !== 0 || touchShoot.dz !== 0)) {
            if (player.shootCooldown <= 0) {
                const angle = Math.atan2(touchShoot.dz, touchShoot.dx);
                const b = brawlers[selectedBrawler];
                fireBullets(player.x, player.z, angle, b.attack, b.dmg, 'player', b.color);
                player.shootCooldown = shootCooldownFor(b.attack);
            }
        }
    }
    const half = MAP_SIZE/2 - 1;
    player.x = Math.max(-half, Math.min(half, player.x));
    player.z = Math.max(-half, Math.min(half, player.z));
    const pushed = pushFromObstacles(player.x, player.z, 0.8);
    player.x = pushed.x; player.z = pushed.z;
    const pushedW = pushFromWater(player.x, player.z, 1.0);
    player.x = pushedW.x; player.z = pushedW.z;
    player.vx = player.x - _prevPx; player.vz = player.z - _prevPz;

    playerObj.position.set(player.x, 0, player.z);

    // MATO = INVISÍVEL! (bots não te veem, e você fica translúcido pra saber)
    player.hidden = !player.dead && isInBush(player.x, player.z);
    setGhostOpacity(playerObj, player.hidden ? 0.3 : 1);
    document.getElementById('hidden-tag').style.display = player.hidden ? 'block' : 'none';

    // Player face mouse
    const target = getWorldMouse();
    if (target) playerObj.lookAt(target.x, 0, target.z);

    // HP bar
    const hpRatio = Math.max(0, player.hp / player.maxHp);
    playerObj.userData.hpBar.scale.x = hpRatio;
    playerObj.userData.hpBar.material.color.setHex(hpRatio > 0.5 ? 0x00ff00 : hpRatio > 0.25 ? 0xffff00 : 0xff0000);

    if (player.shootCooldown > 0) player.shootCooldown--;

    // pega kit médico
    if (!player.dead) {
        for (const k of medkits) {
            if (!k.alive) continue;
            if (Math.abs(player.x - k.x) < 1.4 && Math.abs(player.z - k.z) < 1.4) {
                if (player.hp < player.maxHp) {
                    player.hp = Math.min(player.maxHp, player.hp + 50);
                    k.alive = false;
                    scene.remove(k.mesh);
                    sfxHeal();
                    for(let p=0;p<6;p++) spawnParticle3D(k.x, k.z, 0x00ff88);
                }
            }
        }
        // pega cristal
        if (isCrystalLike()) {
            for (const c of crystals) {
                if (!c.alive) continue;
                if (Math.abs(player.x - c.x) < 1.4 && Math.abs(player.z - c.z) < 1.4) {
                    c.alive = false;
                    scene.remove(c.mesh);
                    player.crystals++;
                    score += 10;
                    sfxPickup();
                    for(let p=0;p<5;p++) spawnParticle3D(c.x, c.z, 0x00eeff);
                    if (player.crystals >= CRYSTAL_GOAL) { victory = true; sfxVictory(); showOverlay(); return; }
                }
            }
        }
    }

    // Camera follow
    cam.position.x = player.x;
    cam.position.z = player.z + 30;
    cam.position.y = 45;
    cam.lookAt(player.x, 0, player.z + 5);

    // zona
    updateZone();
    if (gameOver || victory) return;

    // jogadores online (interpola, remove sem sinal, placar)
    if (gameMode === 'online') {
        updatePeers();
        updatePlacarOnline();
    }

    // Enemies — AI: cada um por si
    for (let ei = 0; ei < enemies.length; ei++) {
        const e = enemies[ei];
        if (!e.alive) continue;

        e.speed = e.baseSpeed;
        // Bush hides
        e.hidden = isInBush(e.x, e.z);
        e.mesh.visible = !e.hidden || Math.sqrt((player.x-e.x)**2+(player.z-e.z)**2) < 5;

        e.moveTimer--;
        const { target, dist } = findClosestTarget(e);
        const _prevEx = e.x, _prevEz = e.z;

        // fora da zona? corre pro meio!
        const eDistCenter = Math.sqrt(e.x*e.x + e.z*e.z);
        if (zoneActive && eDistCenter > zoneRadius - 4) {
            const md = eDistCenter || 1;
            e.x -= (e.x/md)*e.speed*1.2;
            e.z -= (e.z/md)*e.speed*1.2;
        } else if (target && dist < 25) {
            const mx = target.x - e.x, mz = target.z - e.z;
            const md = Math.sqrt(mx*mx + mz*mz);
            const stopDist = (target.type === 'medkit' || target.type === 'crystal') ? 0.3 : 1;
            if (md > stopDist) { e.x += (mx/md)*e.speed; e.z += (mz/md)*e.speed; }
        } else {
            if (e.moveTimer <= 0) {
                e.targetX = Math.max(-half, Math.min(half, e.x + (Math.random()-0.5)*30));
                e.targetZ = Math.max(-half, Math.min(half, e.z + (Math.random()-0.5)*30));
                e.moveTimer = 60 + Math.random()*100;
            }
            const mx = e.targetX - e.x, mz = e.targetZ - e.z;
            const md = Math.sqrt(mx*mx + mz*mz);
            if (md > 0.5) { e.x += (mx/md)*e.speed; e.z += (mz/md)*e.speed; }
        }

        // Bot esperto: desvia de tiros que vêm na direção dele
        if (e.dodgeTimer > 0) e.dodgeTimer--;
        for (const bl of gBullets) {
            if (bl.owner === 'enemy_'+ei) continue;
            const bdx = e.x - bl.mesh.position.x, bdz = e.z - bl.mesh.position.z;
            const bdist2 = bdx*bdx + bdz*bdz;
            if (bdist2 > 100) continue;
            const bvlen = Math.sqrt(bl.vx*bl.vx + bl.vz*bl.vz) || 1;
            const approach = (bl.vx/bvlen)*bdx + (bl.vz/bvlen)*bdz;
            if (approach > 1.5 && approach < 9) {
                if (e.dodgeTimer <= 0) {
                    e.dodgeDx = -bl.vz/bvlen; e.dodgeDz = bl.vx/bvlen;
                    if (Math.random() < 0.5) { e.dodgeDx = -e.dodgeDx; e.dodgeDz = -e.dodgeDz; }
                    e.dodgeTimer = 22;
                }
                break;
            }
        }
        if (e.dodgeTimer > 0) { e.x += e.dodgeDx * e.speed * 1.5; e.z += e.dodgeDz * e.speed * 1.5; }

        e.vx = e.x - _prevEx; e.vz = e.z - _prevEz;
        e.x = Math.max(-half, Math.min(half, e.x));
        e.z = Math.max(-half, Math.min(half, e.z));
        const ep = pushFromObstacles(e.x, e.z, 0.6);
        e.x = ep.x; e.z = ep.z;
        const ew = pushFromWater(e.x, e.z, 0.8);
        e.x = ew.x; e.z = ew.z;
        e.mesh.position.set(e.x, 0, e.z);

        // bot pega kit médico
        for (const k of medkits) {
            if (!k.alive) continue;
            if (Math.abs(e.x - k.x) < 1.4 && Math.abs(e.z - k.z) < 1.4 && e.hp < e.maxHp) {
                e.hp = Math.min(e.maxHp, e.hp + 50);
                k.alive = false;
                scene.remove(k.mesh);
                for(let p=0;p<4;p++) spawnParticle3D(k.x, k.z, 0x00ff88);
            }
        }
        // bot pega cristal
        if (isCrystalLike()) {
            for (const c of crystals) {
                if (!c.alive) continue;
                if (Math.abs(e.x - c.x) < 1.4 && Math.abs(e.z - c.z) < 1.4) {
                    c.alive = false;
                    scene.remove(c.mesh);
                    e.crystals++;
                    if (e.crystals >= CRYSTAL_GOAL) {
                        gameOver = true; sfxGameOver();
                        showOverlayCrystalLoss(e);
                        return;
                    }
                }
            }
        }

        // Face target
        if (target) e.mesh.lookAt(target.x, 0, target.z);

        // HP bar
        const er = Math.max(0, e.hp / e.maxHp);
        e.mesh.userData.hpBar.scale.x = er;
        e.mesh.userData.hpBar.material.color.setHex(er > 0.5 ? 0x00ff00 : er > 0.25 ? 0xffff00 : 0xff0000);

        // Shoot at closest target (não atira em kit/cristal!)
        e.shootCooldown--;
        if (e.shootCooldown <= 0 && target && dist < 25 && (target.type === 'player' || target.type === 'enemy')) {
            // mira melhor: antecipa pra onde o alvo está indo
            let tvx = 0, tvz = 0;
            if (target.type === 'player') { tvx = player.vx || 0; tvz = player.vz || 0; }
            else if (target.ref) { tvx = target.ref.vx || 0; tvz = target.ref.vz || 0; }
            const leadTime = Math.min(18, dist / 10);
            const predX = target.x + tvx * leadTime, predZ = target.z + tvz * leadTime;
            const a = Math.atan2(predZ - e.z, predX - e.x);
            fireBullets(e.x, e.z, a, e.attack, e.dmg, 'enemy_'+ei, e.color);
            e.shootCooldown = e.shootRate;
        }
    }

    // Bullets
    for (let i = gBullets.length-1; i >= 0; i--) {
        const b = gBullets[i];
        b.mesh.position.x += b.vx;
        b.mesh.position.z += b.vz;
        b.life--;
        const bx = b.mesh.position.x, bz = b.mesh.position.z;

        if (b.life <= 0 || Math.abs(bx) > half+5 || Math.abs(bz) > half+5) { scene.remove(b.mesh); gBullets.splice(i,1); continue; }

        // Wall collision
        if (!b.pierce && collideObstacles(bx, bz, 0.2)) {
            if (b.bomb) for(let k=0;k<8;k++) spawnParticle3D(bx, bz, 0xff6600);
            scene.remove(b.mesh); gBullets.splice(i,1); continue;
        }

        // Hit enemies
        if (b.owner === 'player') {
            for (const e of enemies) {
                if (!e.alive) continue;
                if (Math.abs(bx-e.x)<1.2 && Math.abs(bz-e.z)<1.2) {
                    e.hp -= b.damage;
                    sfxHit();
                    for(let k=0;k<3;k++) spawnParticle3D(bx, bz, e.color);
                    if (!b.pierce) { scene.remove(b.mesh); gBullets.splice(i,1); }
                    if (e.hp <= 0) killEnemy(e, 'player');
                    if (gameOver || victory) return;
                    break;
                }
            }
        } else if (b.owner.startsWith('peer_')) {
            // Tiro de jogador remoto — DANO confiado no alvo: só EU aplico dano em mim
            if (!player.dead && Math.abs(bx-player.x)<1 && Math.abs(bz-player.z)<1) {
                player.hp -= b.damage;
                sfxDamage();
                for(let k=0;k<3;k++) spawnParticle3D(player.x, player.z, brawlers[selectedBrawler].color);
                scene.remove(b.mesh); gBullets.splice(i,1);
                if (player.hp <= 0) {
                    const pq = b.owner.slice(5);
                    const shooter = peers[pq];
                    if (shooter && shooter.id) netSend({ acao: 'evento', t: 'morri', id: MEU_ID, para: shooter.id });
                    killPlayer();
                }
                continue;
            }
        } else {
            // Enemy bullet — can hit player or other enemies
            const ownerIdx = parseInt(b.owner.split('_')[1]);

            // Hit player
            if (!player.dead && Math.abs(bx-player.x)<1 && Math.abs(bz-player.z)<1) {
                player.hp -= b.damage;
                sfxDamage();
                for(let k=0;k<3;k++) spawnParticle3D(player.x, player.z, brawlers[selectedBrawler].color);
                scene.remove(b.mesh); gBullets.splice(i,1);
                if (player.hp <= 0) killPlayer();
                if (gameOver || victory) return;
                continue;
            }

            // Hit other enemies
            for (let j = 0; j < enemies.length; j++) {
                if (j === ownerIdx || !enemies[j].alive) continue;
                const e = enemies[j];
                if (Math.abs(bx-e.x)<1.2 && Math.abs(bz-e.z)<1.2) {
                    e.hp -= b.damage;
                    for(let k=0;k<3;k++) spawnParticle3D(bx, bz, e.color);
                    if (!b.pierce) { scene.remove(b.mesh); gBullets.splice(i,1); }
                    if (e.hp <= 0) killEnemy(e, b.owner);
                    if (gameOver || victory) return;
                    break;
                }
            }
        }
    }

    // Particles
    for (let i = gParticles.length-1; i >= 0; i--) {
        const p = gParticles[i];
        p.mesh.position.x += p.vx;
        p.mesh.position.y += p.vy;
        p.mesh.position.z += p.vz;
        p.vy -= 0.01;
        p.life--;
        if (p.life <= 0) { scene.remove(p.mesh); gParticles.splice(i,1); }
    }

    // Kit médicos flutuam de leve
    for (const k of medkits) {
        if (!k.alive) continue;
        k.mesh.rotation.y += 0.02;
        k.mesh.position.y = Math.sin(Date.now()*0.003 + k.x)*0.1;
    }

    // HUD
    const bSel = brawlers[selectedBrawler];
    const deadTxt = player.dead ? ' 💀 renascendo...' : '';
    document.getElementById('hud-brawler').textContent = `${bSel.icon} ${bSel.name} | HP: ${Math.max(0,Math.round(player.hp))}${deadTxt}`;
    if (gameMode === 'matamata') {
        document.getElementById('hud-alive').textContent = `⏱ ${Math.ceil(matchTimer/60)}s | Abates: ${player.kills}`;
    } else if (gameMode === 'bandeira') {
        document.getElementById('hud-alive').textContent = player.crystals > 0 ? '🚩 Você tem a bandeira!! CORRE!' : '🚩 Ache a bandeira na arena!';
    } else if (isCrystalLike()) {
        const best = enemies.reduce((m,e)=>Math.max(m,e.crystals),0);
        document.getElementById('hud-alive').textContent = `💎 ${player.crystals}/${CRYSTAL_GOAL} (robô melhor: ${best})`;
    } else if (gameMode === 'online') {
        document.getElementById('hud-alive').textContent = `🌍 Jogadores: ${Object.keys(peers).length + 1 + enemies.length} | Abates: ${player.kills}`;
    } else if (gameMode === 'duelo') {
        const foe = enemies[0];
        document.getElementById('hud-alive').textContent = foe && foe.alive ? `🤺 ${foe.name}: ${Math.max(0,Math.round(foe.hp))} HP` : '🤺 Duelo';
    } else if (gameMode === 'sobrevivencia') {
        document.getElementById('hud-alive').textContent = `🌊 Onda ${survivalWave} | Vivos: ${aliveCount-1}/${totalFighters-1}`;
    } else {
        document.getElementById('hud-alive').textContent = `Vivos: ${aliveCount}/${totalFighters}`;
    }
    document.getElementById('hud-score').textContent = `Pontos: ${score}`;

    // Minimap
    drawMinimap();
}

function showOverlay() {
    const ol = document.getElementById('overlay');
    ol.classList.add('show');
    if (victory) {
        document.getElementById('overlay-title').innerHTML = '<span style="color:#ffd700">VITÓRIA!</span>';
        document.getElementById('overlay-text1').textContent = isCrystalLike() ? `💎 ${CRYSTAL_GOAL} cristais! Você venceu!` : '#1 LUGAR!';
        document.getElementById('overlay-text2').textContent = `Pontos: ${score} | +${trophiesEarned()} 🏆 | +${score} 🪙`;
    } else {
        document.getElementById('overlay-title').innerHTML = '<span style="color:#ff4444">ELIMINADO!</span>';
        document.getElementById('overlay-text1').textContent = `Posição: #${aliveCount}`;
        document.getElementById('overlay-text2').textContent = `Pontos: ${score} | +${trophiesEarned()} 🏆 | +${score} 🪙`;
    }
    document.getElementById('overlay-sub').textContent = 'Clique pra voltar ao menu';
}

function showOverlayMataMata(myPos, top) {
    const ol = document.getElementById('overlay');
    ol.classList.add('show');
    if (victory) {
        document.getElementById('overlay-title').innerHTML = '<span style="color:#ffd700">CAMPEÃO!</span>';
        document.getElementById('overlay-text1').textContent = `⚔️ ${player.kills} abates — ninguém te segurou!`;
    } else {
        document.getElementById('overlay-title').innerHTML = '<span style="color:#ff4444">FIM DE JOGO!</span>';
        document.getElementById('overlay-text1').textContent = `Você ficou em #${myPos} (${player.kills} abates). Campeão: ${top.name} com ${top.kills}`;
    }
    document.getElementById('overlay-text2').textContent = `Pontos: ${score} | +${trophiesEarned()} 🏆 | +${score} 🪙`;
    document.getElementById('overlay-sub').textContent = 'Clique pra voltar ao menu';
}

function showOverlayCrystalLoss(e) {
    const ol = document.getElementById('overlay');
    ol.classList.add('show');
    document.getElementById('overlay-title').innerHTML = '<span style="color:#ff4444">PERDEU!</span>';
    document.getElementById('overlay-text1').textContent = `O robô ${e.name} juntou ${CRYSTAL_GOAL} cristais primeiro!`;
    document.getElementById('overlay-text2').textContent = `Você pegou ${player.crystals} 💎 | Pontos: ${score} | +${trophiesEarned()} 🏆`;
    document.getElementById('overlay-sub').textContent = 'Clique pra voltar ao menu';
}

function drawMinimap() {
    const mc = document.getElementById('minimap-canvas').getContext('2d');
    mc.fillStyle = '#1a3a1a'; mc.fillRect(0, 0, 140, 105);
    const scale = 140 / MAP_SIZE;
    const cx = 70, cy = 52;
    // water (solid — blocked area)
    mc.fillStyle = 'rgba(20,80,180,0.8)';
    for (const w of waterData) mc.fillRect(cx + (w.x+w.w/2)*scale - w.w*scale/2, cy + (w.z+w.d/2)*scale - w.d*scale/2, w.w*scale, w.d*scale);
    // bushes
    mc.fillStyle = 'rgba(30,100,30,0.5)';
    for (const b of bushData) mc.fillRect(cx + (b.x+b.w/2)*scale - b.w*scale/2, cy + (b.z+b.d/2)*scale - b.d*scale/2, b.w*scale, b.d*scale);
    // kit médicos
    mc.fillStyle = '#ffffff';
    for (const k of medkits) { if(k.alive) mc.fillRect(cx + k.x*scale - 1, cy + k.z*scale - 1, 2, 2); }
    // cristais
    if (isCrystalLike()) {
        mc.fillStyle = '#00eeff';
        for (const c of crystals) { if(c.alive) mc.fillRect(cx + c.x*scale - 1.5, cy + c.z*scale - 1.5, 3, 3); }
    }
    // zona
    if (zoneActive) {
        mc.strokeStyle = 'rgba(255,60,60,0.9)';
        mc.lineWidth = 1.5;
        mc.beginPath();
        mc.arc(cx, cy, zoneRadius * scale, 0, Math.PI * 2);
        mc.stroke();
    }
    // jogadores online
    if (gameMode === 'online') {
        mc.fillStyle = '#ff44ff';
        for (const q in peers) { const p = peers[q]; if ((p.hp||0) > 0) mc.fillRect(cx + p.x * scale - 2, cy + p.z * scale - 2, 4, 4); }
    }
    // player
    mc.fillStyle = '#00ff88';
    mc.fillRect(cx + player.x * scale - 2, cy + player.z * scale - 2, 4, 4);
    // enemies (only if not hidden)
    for (const e of enemies) {
        if (!e.alive || e.hidden) continue;
        mc.fillStyle = '#' + e.color.toString(16).padStart(6, '0');
        mc.fillRect(cx + e.x * scale - 1.5, cy + e.z * scale - 1.5, 3, 3);
    }
    mc.strokeStyle = '#333'; mc.strokeRect(0, 0, 140, 105);
}

// === TOUCH CONTROLS ===
const isMobile = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
const touchMove = { active: false, dx: 0, dz: 0, id: null };
const touchShoot = { active: false, dx: 0, dz: 0, id: null, shooting: false };

function setupTouchControls() {
    const joyMove = document.getElementById('joystick-move');
    const stickMove = document.getElementById('stick-move');
    const joyShoot = document.getElementById('joystick-shoot');
    const stickShoot = document.getElementById('stick-shoot');

    function handleMoveStart(e) {
        e.preventDefault();
        const t = e.changedTouches[0];
        touchMove.active = true;
        touchMove.id = t.identifier;
    }
    function handleMoveMove(e) {
        e.preventDefault();
        for (const t of e.changedTouches) {
            if (t.identifier === touchMove.id) {
                const rect = joyMove.getBoundingClientRect();
                const cx = rect.left + rect.width/2;
                const cy = rect.top + rect.height/2;
                let dx = t.clientX - cx, dy = t.clientY - cy;
                const maxR = rect.width/2 - 10;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if (dist > maxR) { dx = (dx/dist)*maxR; dy = (dy/dist)*maxR; }
                stickMove.style.transform = `translate(${dx}px, ${dy}px)`;
                touchMove.dx = dx / maxR;
                touchMove.dz = dy / maxR;
            }
        }
    }
    function handleMoveEnd(e) {
        for (const t of e.changedTouches) {
            if (t.identifier === touchMove.id) {
                touchMove.active = false;
                touchMove.dx = 0; touchMove.dz = 0;
                stickMove.style.transform = '';
                touchMove.id = null;
            }
        }
    }

    function handleShootStart(e) {
        e.preventDefault();
        const t = e.changedTouches[0];
        touchShoot.active = true;
        touchShoot.id = t.identifier;
        touchShoot.shooting = true;
    }
    function handleShootMove(e) {
        e.preventDefault();
        for (const t of e.changedTouches) {
            if (t.identifier === touchShoot.id) {
                const rect = joyShoot.getBoundingClientRect();
                const cx = rect.left + rect.width/2;
                const cy = rect.top + rect.height/2;
                let dx = t.clientX - cx, dy = t.clientY - cy;
                const maxR = rect.width/2 - 10;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if (dist > maxR) { dx = (dx/dist)*maxR; dy = (dy/dist)*maxR; }
                stickShoot.style.transform = `translate(${dx}px, ${dy}px)`;
                touchShoot.dx = dx / maxR;
                touchShoot.dz = dy / maxR;
            }
        }
    }
    function handleShootEnd(e) {
        for (const t of e.changedTouches) {
            if (t.identifier === touchShoot.id) {
                touchShoot.active = false;
                touchShoot.shooting = false;
                touchShoot.dx = 0; touchShoot.dz = 0;
                stickShoot.style.transform = '';
                touchShoot.id = null;
            }
        }
    }

    joyMove.addEventListener('touchstart', handleMoveStart, { passive: false });
    joyMove.addEventListener('touchmove', handleMoveMove, { passive: false });
    joyMove.addEventListener('touchend', handleMoveEnd);
    joyMove.addEventListener('touchcancel', handleMoveEnd);

    joyShoot.addEventListener('touchstart', handleShootStart, { passive: false });
    joyShoot.addEventListener('touchmove', handleShootMove, { passive: false });
    joyShoot.addEventListener('touchend', handleShootEnd);
    joyShoot.addEventListener('touchcancel', handleShootEnd);

    // Tap anywhere else to go back to menu on game over
    container.addEventListener('touchstart', (e) => {
        if (gameOver || victory) { backToMenu(); e.preventDefault(); }
    }, { passive: false });
}
setupTouchControls();

// Resize renderer for mobile
function resizeGame() {
    const w = container.clientWidth || 900;
    const h = container.clientHeight || 600;
    renderer.setSize(w, h);
    cam.aspect = w / h;
    cam.updateProjectionMatrix();
}
window.addEventListener('resize', resizeGame);

function animate() {
    requestAnimationFrame(animate);
    update();
    if (gameRunning) renderer.render(scene, cam);
}
animate();
