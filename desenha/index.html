* { margin:0; padding:0; box-sizing:border-box; }
body {

    min-height:100vh; overflow-x:hidden;
}
#topo {
    display:flex; align-items:center; justify-content:space-between;
    padding:8px 12px; background:rgba(0,0,0,0.35); position:sticky; top:0; z-index:30;
}
#topo a.home {
    text-decoration:none; color:#fff; font-weight:bold; font-size:16px;
    background:rgba(255,255,255,0.1); padding:8px 14px; border-radius:12px;

.wrap { max-width:960px; margin:0 auto; padding:14px; }
h1.big { font-size:34px; text-align:center; margin:14px 0 6px;
    background:linear-gradient(to right,#ff5eae,#ffd93d,#6be9ff); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.sub { text-align:center; color:#bbb; margin-bottom:16px; font-size:15px; }
.card {
    background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.12);
    border-radius:18px; padding:18px; margin:12px 0;
}
.btn {
    font-size:17px; font-weight:bold; padding:12px 22px; border:none; border-radius:14px;
    background:linear-gradient(135deg,#ff5eae,#a24bff); color:#fff; cursor:pointer; margin:5px;
}
.btn:active { transform:scale(0.96); }
.btn.verde { background:linear-gradient(135deg,#00c86e,#00a2ff); }
.btn.amarelo { background:linear-gradient(135deg,#ffb300,#ff6a00); color:#3a2000; }
.btn.pequeno { font-size:14px; padding:7px 14px; }
.btn:disabled { opacity:0.5; }
.abas { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
.jogador {
    display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,0.1);
    border-radius:20px; padding:6px 14px; margin:5px; font-size:16px; font-weight:bold;

.codigo { font-size:30px; font-weight:900; letter-spacing:4px; color:#ffd93d; }
/* JOGO */
#jogo { display:none; }
#hud {

canvas#tela { width:100%; background:#fff; border-radius:14px; touch-action:none; display:block; }

#lateral { width:230px; min-width:200px; flex:0 0 auto; }
#placarLista .linha { display:flex; justify-content:space-between; background:rgba(255,255,255,0.08);

#rankingBox { display:none; text-align:center; }

function mpLogado(){ return !!localStorage.getItem('cg_usuario'); }

/* ===== cgOn: status ONLINE/OFFLINE dos amigos (bolinha + convite offline) ===== */
var cgOnStatus = {}, cgOnTimer = null, cgOnCtx = null;
function cgOnPara(){ if(cgOnTimer){ clearInterval(cgOnTimer); cgOnTimer = null; } cgOnCtx = null; }
function cgOnPonto(n){
    var s = cgOnStatus[n];
    var cor = s === true ? '#00e05a' : (s === false ? '#ff3344' : '#777');
    var brilho = s === true ? 'box-shadow:0 0 7px #00e05a;' : '';
    return '<span style="display:inline-block;width:11px;height:11px;border-radius:50%;background:' + cor + ';' + brilho + 'vertical-align:middle;margin-right:5px;"></span>';
}
function cgOnTag(n){
    var s = cgOnStatus[n];
    if(s === undefined) return '';
    return '<span style="font-size:12px;color:' + (s ? '#00e05a' : '#ff3344') + ';margin-left:5px;">' + (s ? 'online' : 'offline') + '</span>';
}
function cgOnOrdena(lista){
    return lista.slice().sort(function(a,b){ return (cgOnStatus[b] === true ? 1 : 0) - (cgOnStatus[a] === true ? 1 : 0); });
}
function cgOnPinta(){
    if(!cgOnCtx) return;
    var el = document.getElementById(cgOnCtx.id); if(!el){ cgOnPara(); return; }
    var alvo = el.querySelector('.cgOnLista'); if(!alvo){ cgOnPara(); return; }
    alvo.innerHTML = cgOnOrdena(cgOnCtx.amigos).map(cgOnCtx.linha).join('');
}
async function cgOnBusca(){
    if(!cgOnCtx) return;
    try{
        var d = await mpApi({acao:'online', nomes: cgOnCtx.amigos});
        if(d && d.online){
            for(var k in d.online) cgOnStatus[k] = !!d.online[k];
            cgOnPinta();
        }
    }catch(e){}
}
// liga o polling de 20s; para sozinho quando o container sai da tela (não vaza timer)
function cgOnLiga(id, amigos, linha){
    cgOnPara();
    if(!mpLogado() || !amigos || !amigos.length) return;
    cgOnCtx = { id: id, amigos: amigos, linha: linha };
    cgOnBusca();
    cgOnTimer = setInterval(function(){
        if(!cgOnCtx || !document.getElementById(cgOnCtx.id)){ cgOnPara(); return; }
        cgOnBusca();
    }, 20000);
}
function cgOnAvisoOffline(d){
    if(!d || !d.offline) return false;
    var nome = d.alvo || 'seu amigo';
    cgOnStatus[nome] = false; cgOnPinta();
    var html = '<div class="cg-tit">📨 Convite guardado</div>' +
        '<div style="font-size:14px;margin:6px 0;">O(a) <b>' + nome + '</b> está offline agora 😴 — ele(a) vai ver o convite quando entrar no site!</div>' +
        '<button class="no">OK</button>';
    if(window.cgNotifCard){
        var c = window.cgNotifCard(html);
        var b = (c && c.querySelector) ? c.querySelector('.no') : null;
        if(b) b.onclick = function(){ c.remove(); };
        setTimeout(function(){ if(c && c.parentNode) c.remove(); }, 9000);
    } else if(typeof mostraMsg === 'function'){
        mostraMsg('📨 Convite enviado! Mas ' + nome + ' está offline 😴 — vai ver quando entrar no site.', '#ffd34d', 4000);
    }
    return true;
}

async function mpApi(payload){
    const r = await fetch(MP_API, { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify(Object.assign({
            nome: localStorage.getItem('cg_usuario'),
            senhaHash: localStorage.getItem('cg_senhaHash')
        }, payload)) });
    return r.json();
}
function mpEnvia(o){
    if(mp.ws && mp.ws.readyState===1)
        mp.ws.send(JSON.stringify(Object.assign({acao:'mp', sala:mp.sala}, o)));
}
function mpFechaWs(){
    if(mp.ws){ try{mp.ws.onclose=null; mp.ws.close();}catch(e){} mp.ws=null; }
    [mp.ping, mp.vigia].forEach(t=>t&&clearInterval(t));
    [mp.checaSala].forEach(t=>t&&clearTimeout(t));
    mp.ping=mp.vigia=mp.checaSala=null;
}
function mpDesliga(msg){
    mpFechaWs(); pararTimers(); mp.emJogo=false; mp.comecou=false;
    document.getElementById('jogo').style.display='none';
    document.getElementById('lobby').style.display='block';
    renderLobby(msg);
}

// ---------- LOBBY ----------
function renderLobby(aviso){
    const area = document.getElementById('lobbyArea');
    if(!mpLogado()){
        area.innerHTML = `<div class="card"><p class="aviso-jogo">🔒 Faça login na sua conta pra jogar com amigos!</p>
            <div style="text-align:center"><a class="btn" href="/conta/">Fazer login</a></div></div>`;
        return;
    }
    area.innerHTML = `${aviso?`<div class="card" style="text-align:center;color:#ff9ed6;font-size:18px;">${aviso}</div>`:''}
        <div class="card" style="text-align:center;">
            <div class="abas">
                <button class="btn" onclick="criarSala()">➕ CRIAR SALA</button>
                <button class="btn amarelo" onclick="verConvites()">📬 MEUS CONVITES</button>
            </div>
            <div id="mpArea" style="margin-top:14px;"></div>
        </div>`;
}
function codigoSala(){
    const L='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s='';
    for(let i=0;i<6;i++) s+=L[Math.floor(Math.random()*L.length)];
    return s;
}
async function criarSala(){
    if(mp.pollConvites){ clearInterval(mp.pollConvites); mp.pollConvites=null; }
    conecta(codigoSala(), true);
    const area = document.getElementById('mpArea');
    area.innerHTML = `<h2 class="codigo">${mp.sala}</h2>
        <p style="color:#6be9ff;margin:6px 0;">⏳ esperando os amigos entrarem... (máx ${MAX})</p>
        <div id="salaJogadores"></div>
        <div class="card" style="margin:10px 0;padding:10px;">
            <p style="font-size:14px;color:#bbb;margin-bottom:6px;">⏱️ Tempo por rodada:</p>
            <div id="cfgTempoBox"></div>
            <p style="font-size:14px;color:#bbb;margin:10px 0 6px;">🎯 Pontos pra vencer:</p>
            <div id="cfgMetaBox"></div>
        </div>
        <div id="mpAmigos"><p>carregando amigos...</p></div>
        <div id="botaoComeca"></div>`;
    renderSalaJogadores();
    renderConfigJogo();
    try{
        const d = await mpApi({acao:'entrar'});
        const amigos = d.amigos || [];
        const el = document.getElementById('mpAmigos'); if(!el) return;
        const cgOnLinha = a =>
            `<span class="jogador">${cgOnPonto(a)}🎨 ${a}${cgOnTag(a)}
                 <button class="btn pequeno" onclick="convidar('${a}',this)">📨 Convidar</button></span>`;
        el.innerHTML = amigos.length
            ? `<h3 style="margin:10px 0 4px;font-size:16px;">Convide seus amigos:</h3><div class="cgOnLista">` + amigos.map(cgOnLinha).join('') + `</div>`
            : `<p>Você ainda não tem amigos adicionados 😅</p>`;
        cgOnLiga('mpAmigos', amigos, cgOnLinha);
    }catch(e){
        const el=document.getElementById('mpAmigos'); if(el) el.innerHTML='<p>Não deu pra carregar os amigos 😢</p>';
    }
}
async function convidar(alvo, btn){

}

// ---------- CONEXÃO ----------
function conecta(sala, souHost){
    mpFechaWs();
    mp.sala=sala; mp.souHost=souHost;
    mp.meuNome = localStorage.getItem('cg_usuario') || 'VOCÊ';
    mp.jogadores = souHost ? [mp.meuNome] : [];
    mp.comecou=false; mp.emJogo=false;
    mp.ws = new WebSocket(MP_WS);
    mp.ws.onopen = ()=>{
        mp.lastMsg = Date.now();
        mpEnvia({t:'oi', nome:mp.meuNome});
        if(!souHost){
            mp.checaSala = setTimeout(()=>{
                if(!mp.comecou && mp.jogadores.length<=1) mpDesliga('🚪 SALA INDISPONÍVEL!');
            }, 8000);
        }
        mp.ping = setInterval(()=>mpEnvia({t:'ping'}), 4000);
        mp.vigia = setInterval(()=>{
            if(mp.comecou && Date.now()-mp.lastMsg > 12000) mpDesliga('🚪 SALA INDISPONÍVEL! Alguém saiu.');
        }, 2000);
    };
    mp.ws.onmessage = recebe;
    mp.ws.onclose = ()=>{ if(mp.comecou) mpDesliga('🚪 SALA INDISPONÍVEL!'); };
}
function recebe(ev){
    let m; try{ m = JSON.parse(ev.data); }catch(e){ return; }
    if(!m || m.sala !== mp.sala) return; // ignora sala diferente
    mp.lastMsg = Date.now();
    const eu = (m.quem === mp.meuNome);
    switch(m.t){
        case 'ping': return;
        case 'oi':
            if(mp.checaSala){ clearTimeout(mp.checaSala); mp.checaSala=null; }
            if(mp.souHost && !mp.comecou){
                if(!mp.jogadores.includes(m.nome) && mp.jogadores.length<MAX) mp.jogadores.push(m.nome);
                mpEnvia({t:'jogadores', lista:mp.jogadores});
                renderSalaJogadores();
            }
            return;
        case 'jogadores':
            if(!mp.souHost){ mp.jogadores = m.lista||[]; renderSalaJogadores(); }
            return;
        case 'comeca':
            if(!mp.comecou){ mp.comecou=true; iniciaJogoUI(m.ordem, m.tempoRodada, m.metaPontos); }
            return;
        case 'rodada':
            aplicaRodada(m); return;
        case 'traco':
            if(!eu && !G.souDrawer) desenhaSegmento(m.x0,m.y0,m.x1,m.y1,m.cor,m.grossura); return;
        case 'linha': case 'ponto': case 'reta': case 'retangulo': case 'circulo': case 'balde':
            if(!eu && !G.souDrawer) aplicaOp(m, false); return;
        case 'redraw':
            if(!eu && !G.souDrawer){ limpaCanvas(); (m.ops||[]).forEach(function(op){ aplicaOp(op,false); }); } return;
        case 'limpa':
            if(!eu && !G.souDrawer) limpaCanvas(); return;
        case 'chute':
            if(mp.souHost) hostProcessaChute(m); return;
        case 'chatmsg':
            addChat(`<b>${m.nome}:</b> ${m.texto}`); return;
        case 'acertou':
            addChat(`🎉 <span class="acerto">${m.nome} acertou!</span>`, 'acerto'); tocaAcerto(); return;
        case 'placar':
            G.placar = m.placar; renderPlacar(); return;
        case 'fimrodada':
            aplicaFimRodada(m); return;
        case 'fim':
            mostraRanking(m.ranking); return;
    }
}

// ---------- INÍCIO DO JOGO ----------
function hostComeca(){
    if(!mp.souHost || mp.jogadores.length<2) return;
    const ordem = mp.jogadores.slice();
    const tempoRodada = mp.cfgTempo || 70;
    const metaPontos = mp.cfgMeta || 10;
    G.ordem = ordem; G.tempoRodada = tempoRodada; G.metaPontos = metaPontos; G.idx = 0;
    G.placar = {}; ordem.forEach(n=>G.placar[n]=0);
    mpEnvia({t:'comeca', ordem, tempoRodada, metaPontos});
    mp.comecou=true; iniciaJogoUI(ordem, tempoRodada, metaPontos);
    setTimeout(hostNovaRodada, 800);
}
function iniciaJogoUI(ordem, tempoRodada, metaPontos){
    mp.emJogo=true;
    if(mp.pollConvites){ clearInterval(mp.pollConvites); mp.pollConvites=null; }
    G.ordem = ordem; G.tempoRodada = tempoRodada || 70; G.metaPontos = metaPontos || 10;
    if(!mp.souHost){ G.placar={}; ordem.forEach(n=>G.placar[n]=0); }
    document.getElementById('lobby').style.display='none';
    document.getElementById('jogo').style.display='block';
    document.getElementById('rankingBox').style.display='none';
    document.getElementById('chat').innerHTML='';
    document.getElementById('metaHud').textContent = `🎯 meta: ${G.metaPontos} pts`;
    montaFerramentas();
    limpaCanvas();
    renderPlacar();
    addChat('🎮 <span class="sistema">O jogo começou! Boa sorte!</span>');
}

// ---------- RODADAS (host) ----------
function hostNovaRodada(){
    const drawer = G.ordem[G.idx % G.ordem.length];
    const palavra = PALAVRAS[Math.floor(Math.random()*PALAVRAS.length)];
    G.drawer = drawer; G.palavra = palavra; G.acertaram=[]; G.num = G.idx+1;
    mpEnvia({t:'rodada', drawer, palavra, num:G.num});
    aplicaRodada({drawer, palavra, num:G.num});
    // timer autoritativo do host
    limparHostTimers();
    G.roundTimer = setTimeout(()=>hostFimRodada(false), G.tempoRodada*1000);
}
function limparHostTimers(){ if(G.roundTimer){ clearTimeout(G.roundTimer); G.roundTimer=null; } }
function hostProcessaChute(m){
    if(m.nome === G.drawer) return; // desenhista não chuta
    if(G.acertaram.includes(m.nome)) return;
    if(normaliza(m.texto) === normaliza(G.palavra)){
        G.placar[m.nome] = (G.placar[m.nome]||0) + 1;
        G.acertaram.push(m.nome);
        mpEnvia({t:'acertou', nome:m.nome});
        addChat(`🎉 <span class="acerto">${m.nome} acertou!</span>`, 'acerto'); tocaAcerto();
        mpEnvia({t:'placar', placar:G.placar}); G.placar=G.placar; renderPlacar();
        // todos (menos desenhista) acertaram?
        const adivinhadores = G.ordem.filter(n=>n!==G.drawer);
        if(adivinhadores.every(n=>G.acertaram.includes(n))) hostFimRodada(true);
    } else {
        mpEnvia({t:'chatmsg', nome:m.nome, texto:m.texto});
        addChat(`<b>${m.nome}:</b> ${m.texto}`);
    }
}
function hostFimRodada(todosAcertaram){
    limparHostTimers();
    if(G.acertaram.length===0){
        G.placar[G.drawer] = (G.placar[G.drawer]||0) + 1; // ninguém acertou: desenhista ganha ponto
    }
    mpEnvia({t:'fimrodada', palavra:G.palavra, placar:G.placar});
    aplicaFimRodada({palavra:G.palavra, placar:G.placar});
    const alguemChegouNaMeta = Object.values(G.placar).some(p=>p>=G.metaPontos);
    if(alguemChegouNaMeta){
        setTimeout(()=>{
            const ranking = Object.entries(G.placar).sort((a,b)=>b[1]-a[1]).map(([nome,pts])=>({nome,pts}));
            mpEnvia({t:'fim', ranking}); mostraRanking(ranking);
        }, 3500);
        return;
    }
    G.idx++;
    setTimeout(hostNovaRodada, 3500);
}

function pararTimers(){ if(G.tickTimer){ clearInterval(G.tickTimer); G.tickTimer=null; } }

// ---------- CANVAS / DESENHO ----------
const tela = document.getElementById('tela');
const ctx = tela.getContext('2d');
let corAtual = '#000000', grossuraAtual = 5, desenhando=false, ultimo=null;
let ferramenta = 'pincel';            // pincel | reta | retangulo | circulo | balde
let bufferLinha = null, flushTimer = null, primeiroLoteDoTraco = true;
let snapshot = null, inicioForma = null;
let historico = [];                    // pra desfazer (lista de operações)
const CORES = ['#000000','#ffffff','#e11d48','#f97316','#facc15','#22c55e','#0ea5e9','#6366f1','#a855f7','#92400e','#ec4899','#94a3b8'];

tela.style.cursor = 'crosshair';
function montaFerramentas(){
    const f = document.getElementById('ferramentas');
    if(!G.souDrawer){ f.innerHTML = `<span style="color:#666;font-size:13px;">👀 adivinhe o desenho!</span>`; return; }
    const ferrs = [['pincel','✏️'],['reta','📏'],['retangulo','▭'],['circulo','⚪'],['balde','🪣'],['borracha','🧽']];
    f.innerHTML = CORES.map(c=>`<span class="cor${c===corAtual?' sel':''}" style="background:${c}" onclick="pickCor('${c}')"></span>`).join('')
        + ' &nbsp; '
        + ferrs.map(([id,ic])=>`<button class="btn pequeno${ferramenta===id?' amarelo':''}" onclick="pickFerramenta('${id}')">${ic}</button>`).join('')
        + `<button class="btn pequeno" onclick="mudaGrossura()">➖ ${grossuraAtual}px</button>`
        + `<button class="btn pequeno" onclick="desfazer()">↩️ Desfazer</button>`
        + `<button class="btn pequeno" style="background:#c00" onclick="limparTudo()">🗑️ Limpar</button>`
        + `<button class="btn pequeno" style="background:linear-gradient(135deg,#a855f7,#6366f1)" onclick="pintarAutomatico()" ${G.pintouAuto?'disabled':''}>🪄 Pintura mágica (-${PRECO_PINTURA}🍄)</button>`;
}
function pickCor(c){ corAtual=c; if(ferramenta==='borracha') ferramenta='pincel'; montaFerramentas(); }
function pickFerramenta(t){ ferramenta=t; montaFerramentas(); }
function pickBorracha(){ ferramenta='borracha'; montaFerramentas(); }
function mudaGrossura(){ const g=[3,6,10,16,24]; grossuraAtual = g[(g.indexOf(grossuraAtual)+1)%g.length]||6; montaFerramentas(); }
function corEfetiva(){ return ferramenta==='borracha' ? '#ffffff' : corAtual; }
function grossuraEfetiva(){ return ferramenta==='borracha' ? Math.max(18,grossuraAtual*2) : grossuraAtual; }
function desfazer(){
    if(!G.souDrawer || !historico.length) return;
    historico.pop();
    limpaCanvas();
    for(const op of historico) aplicaOp(op, true);
    mpEnvia({t:'redraw', ops:historico});
}
// desenha uma forma qualquer no ctx (usado local e nos peers)
function aplicaOp(op, local){
    ctx.strokeStyle=op.cor; ctx.fillStyle=op.cor; ctx.lineWidth=op.gr; ctx.lineCap='round'; ctx.lineJoin='round';
    const W=tela.width, H=tela.height;
    if(op.t==='linha' && op.pts && op.pts.length){
        ctx.beginPath(); ctx.moveTo(op.pts[0][0]*W, op.pts[0][1]*H);
        for(var pi=1; pi<op.pts.length; pi++) ctx.lineTo(op.pts[pi][0]*W, op.pts[pi][1]*H);
        ctx.stroke();
        // bolinha só na PONTA REAL do traço (início/fim do gesto), não em cada lote enviado —
        // senão o traço fica cheio de bolotas no meio pra quem tá vendo (era o motivo do desenho "bugado")
        if(op.first){ ctx.fillStyle=op.cor; ctx.beginPath(); ctx.arc(op.pts[0][0]*W,op.pts[0][1]*H,op.gr/2,0,7); ctx.fill(); }
        if(op.last){ var lp=op.pts[op.pts.length-1]; ctx.fillStyle=op.cor; ctx.beginPath(); ctx.arc(lp[0]*W,lp[1]*H,op.gr/2,0,7); ctx.fill(); }
    }
    else if(op.t==='ponto'){ ctx.fillStyle=op.cor; ctx.beginPath(); ctx.arc(op.x0*W,op.y0*H,op.gr/2,0,7); ctx.fill(); }
    else if(op.t==='traco'){ ctx.beginPath(); ctx.moveTo(op.x0*W,op.y0*H); ctx.lineTo(op.x1*W,op.y1*H); ctx.stroke(); }
    else if(op.t==='reta'){ ctx.beginPath(); ctx.moveTo(op.x0*W,op.y0*H); ctx.lineTo(op.x1*W,op.y1*H); ctx.stroke(); }
    else if(op.t==='retangulo'){ ctx.strokeRect(Math.min(op.x0,op.x1)*W, Math.min(op.y0,op.y1)*H, Math.abs(op.x1-op.x0)*W, Math.abs(op.y1-op.y0)*H); }
    else if(op.t==='circulo'){ ctx.beginPath(); ctx.ellipse((op.x0+op.x1)/2*W,(op.y0+op.y1)/2*H, Math.abs(op.x1-op.x0)/2*W, Math.abs(op.y1-op.y0)/2*H, 0,0,7); ctx.stroke(); }
    else if(op.t==='balde'){ baldeTinta(op.x0*W|0, op.y0*H|0, op.cor); }
}
function limparTudo(){ if(!G.souDrawer) return; historico=[]; limpaCanvas(); mpEnvia({t:'limpa'}); }
function limpaCanvas(){ ctx.fillStyle='#fff'; ctx.fillRect(0,0,tela.width,tela.height); }
function resetHistorico(){ historico = []; }
function desenhaSegmento(x0,y0,x1,y1,cor,gr){
    ctx.strokeStyle=cor; ctx.lineWidth=gr; ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath(); ctx.moveTo(x0*tela.width, y0*tela.height); ctx.lineTo(x1*tela.width, y1*tela.height); ctx.stroke();
}
function posCanvas(e){
    const r = tela.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { x:(p.clientX-r.left)/r.width, y:(p.clientY-r.top)/r.height };
}
function registra(op){ historico.push(op); if(historico.length>400) historico.shift(); }
function inicioDesenho(e){
    if(!G.souDrawer) return; e.preventDefault();
    const p = posCanvas(e);
    if(ferramenta==='balde'){
        baldeTinta(p.x*tela.width|0, p.y*tela.height|0, corAtual);
        const op={t:'balde',x0:p.x,y0:p.y,x1:p.x,y1:p.y,cor:corAtual,gr:grossuraAtual};
        registra(op); mpEnvia(op);
        return;
    }
    desenhando=true; ultimo=p; inicioForma=p; primeiroLoteDoTraco=true;
    if(ferramenta==='pincel' || ferramenta==='borracha'){
        // clique = pinta uma bolinha do tamanho do pincel (sem precisar arrastar)
        pintaPonto(p.x, p.y, corEfetiva(), grossuraEfetiva());
    } else {
        snapshot = ctx.getImageData(0,0,tela.width,tela.height); // pra prévia da forma
    }
}
function pintaPonto(x,y,cor,gr){
    ctx.fillStyle=cor;
    ctx.beginPath(); ctx.arc(x*tela.width, y*tela.height, gr/2, 0, 7); ctx.fill();
    const op={t:'ponto',x0:x,y0:y,x1:x,y1:y,cor:cor,gr:gr};
    registra(op); mpEnvia(op);
}
function moveDesenho(e){
    if(!desenhando || !G.souDrawer) return; e.preventDefault();
    const p = posCanvas(e);
    if(ferramenta==='pincel' || ferramenta==='borracha'){
        desenhaSegmento(ultimo.x,ultimo.y,p.x,p.y,corEfetiva(),grossuraEfetiva());
        registra({t:'traco',x0:ultimo.x,y0:ultimo.y,x1:p.x,y1:p.y,cor:corEfetiva(),gr:grossuraEfetiva()});
        // acumula os pontos e envia em LOTE (evita listras por mensagem perdida)
        if(!bufferLinha) bufferLinha = { t:'linha', pts:[[ultimo.x,ultimo.y]], cor:corEfetiva(), gr:grossuraEfetiva(), first:primeiroLoteDoTraco };
        bufferLinha.pts.push([p.x,p.y]);
        if(bufferLinha.pts.length >= 12) flushLinha();
        else if(!flushTimer) flushTimer = setTimeout(flushLinha, 60);
        ultimo=p;
    } else {
        // prévia da forma: restaura o snapshot e desenha por cima
        ctx.putImageData(snapshot,0,0);
        aplicaOp({t:ferramenta,x0:inicioForma.x,y0:inicioForma.y,x1:p.x,y1:p.y,cor:corAtual,gr:grossuraAtual});
    }
}
function flushLinha(){
    if(flushTimer){ clearTimeout(flushTimer); flushTimer=null; }
    if(bufferLinha && bufferLinha.pts.length>1){ mpEnvia(bufferLinha); primeiroLoteDoTraco=false; }
    bufferLinha = null;
}
function fimDesenho(e){
    if(ferramenta==='pincel' || ferramenta==='borracha'){
        if(bufferLinha) bufferLinha.last = true; // marca a ponta final do traço pra quem tá vendo
        flushLinha();
    }

    if(desenhando && G.souDrawer && ferramenta!=='pincel' && ferramenta!=='borracha' && inicioForma){
        const p = (e && (e.changedTouches?e.changedTouches[0]:e)) ? posCanvas(e) : ultimo;
        const op={t:ferramenta,x0:inicioForma.x,y0:inicioForma.y,x1:p.x,y1:p.y,cor:corAtual,gr:grossuraAtual};
        if(snapshot) ctx.putImageData(snapshot,0,0);

}
// balde de tinta (floodfill simples)
function baldeTinta(sx,sy,corHex){
    if(sx<0||sy<0||sx>=tela.width||sy>=tela.height) return;
    const img = ctx.getImageData(0,0,tela.width,tela.height), d=img.data, W=tela.width, H=tela.height;
    const idx=(sy*W+sx)*4, alvo=[d[idx],d[idx+1],d[idx+2]];
    const rgb = [parseInt(corHex.slice(1,3),16),parseInt(corHex.slice(3,5),16),parseInt(corHex.slice(5,7),16)];
    if(Math.abs(alvo[0]-rgb[0])+Math.abs(alvo[1]-rgb[1])+Math.abs(alvo[2]-rgb[2])<12) return;
    const pilha=[[sx,sy]], tol=40;
    function bate(i){ return Math.abs(d[i]-alvo[0])<tol && Math.abs(d[i+1]-alvo[1])<tol && Math.abs(d[i+2]-alvo[2])<tol; }
    let n=0;
    while(pilha.length && n++<200000){
        const [x,y]=pilha.pop(); if(x<0||y<0||x>=W||y>=H) continue;
        const i=(y*W+x)*4; if(!bate(i)) continue;
        d[i]=rgb[0]; d[i+1]=rgb[1]; d[i+2]=rgb[2]; d[i+3]=255;
        pilha.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]);
    }
    ctx.putImageData(img,0,0);
}

const ASPECT = tela.height/tela.width; // pra desenhar círculos redondos de verdade (canvas não é quadrado)
function redondo(ry){ return ry*ASPECT; }
function escolha(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function opLinha(pts,cor,gr){ return {t:'linha', pts:pts, cor:cor, gr:gr, first:true, last:true}; }
function opReta(x0,y0,x1,y1,cor,gr){ return {t:'reta', x0,y0,x1,y1,cor,gr}; }
function opRetangulo(x0,y0,x1,y1,cor,gr){ return {t:'retangulo', x0,y0,x1,y1,cor,gr}; }
function opCirculo(cx,cy,rx,ry,cor,gr){ return {t:'circulo', x0:cx-rx, y0:cy-ry, x1:cx+rx, y1:cy+ry, cor, gr}; }
function opPonto(x,y,cor,gr){ return {t:'ponto', x0:x, y0:y, x1:x, y1:y, cor, gr}; }
function opBalde(x,y,cor){ return {t:'balde', x0:x, y0:y, x1:x, y1:y, cor, gr:1}; }

    ops.push(opCirculo(cx,cyCorpo,rCorpoX,rCorpoY,'#000',4)); ops.push(opBalde(cx,cyCorpo,cor));
    ops.push(opCirculo(cx,cyCabeca,rCabX,rCabY,'#000',4)); ops.push(opBalde(cx,cyCabeca,cor));
    ops.push(opLinha([[cx-rCabX*0.7,cyCabeca-rCabY*0.6],[cx-rCabX*0.95,cyCabeca-rCabY*1.8],[cx-rCabX*0.2,cyCabeca-rCabY*0.9],[cx-rCabX*0.7,cyCabeca-rCabY*0.6]],'#000',3));

    ops.push(opPonto(cx-rCabX*0.35,cyCabeca,'#000',8)); ops.push(opPonto(cx+rCabX*0.35,cyCabeca,'#000',8));

function desenhoNatureza(){
    const ops=[];
    ops.push(opCirculo(0.78,0.22,redondo(0.08),0.08,'#000',3)); ops.push(opBalde(0.78,0.22,'#facc15'));
    ops.push(opLinha([[0.1,0.9],[0.1,0.75],[0.4,0.35],[0.6,0.6],[0.8,0.3],[0.9,0.75],[0.9,0.9],[0.1,0.9]],'#000',4));
    // várias sementes na base pra garantir que o verde preenche tudo mesmo com a serrilhada da linha diagonal
    [0.15,0.2,0.25,0.3,0.35,0.4,0.45,0.48,0.52,0.55,0.6,0.65,0.7,0.75,0.8,0.85].forEach(x=>ops.push(opBalde(x,0.87,'#16a34a')));
    return ops;
}
function desenhoObjeto(){
    const ops=[], cor=escolha(['#6366f1','#0ea5e9','#a855f7','#f97316','#22c55e']);
    ops.push(opRetangulo(0.32,0.32,0.68,0.68,'#000',4)); ops.push(opBalde(0.5,0.5,cor));
    ops.push(opReta(0.5,0.32,0.5,0.68,'#fff',4)); ops.push(opReta(0.32,0.5,0.68,0.5,'#fff',4));
    return ops;
}
const GENERICOS = { animal:desenhoAnimal, veiculo:desenhoVeiculo, comida:desenhoComida, roupa:desenhoRoupa,
    personagem:desenhoPersonagem, corpo:desenhoCorpo, brinquedo:desenhoBrinquedo, natureza:desenhoNatureza, objeto:desenhoObjeto };
function categoriaDe(p){
    if(CATEGORIA_ANIMAL.includes(p)) return 'animal';
    if(CATEGORIA_VEICULO.includes(p)) return 'veiculo';
    if(CATEGORIA_COMIDA.includes(p)) return 'comida';
    if(CATEGORIA_ROUPA.includes(p)) return 'roupa';
    if(CATEGORIA_PERSONAGEM.includes(p)) return 'personagem';
    if(CATEGORIA_CORPO.includes(p)) return 'corpo';
    if(CATEGORIA_BRINQUEDO.includes(p)) return 'brinquedo';
    if(CATEGORIA_NATUREZA.includes(p)) return 'natureza';
    return 'objeto';
}
function geraDesenhoAutomatico(palavra){
    const chave = normaliza(palavra);
    if(DESENHOS_ESPECIFICOS[chave]) return DESENHOS_ESPECIFICOS[chave]();
    return (GENERICOS[categoriaDe(palavra)]||desenhoObjeto)();
}
function pintarAutomatico(){
    if(!G.souDrawer || G.pintouAuto || !window.CoguCoins) return;
    if(!CoguCoins.gasta(PRECO_PINTURA)){
        addChat(`😕 <span class="sistema">Faltam Cogu Coins pra pintura mágica (precisa 🍄${PRECO_PINTURA}).</span>`);
        return;
    }
    G.pintouAuto = true;
    historico = [];
    limpaCanvas();
    const ops = geraDesenhoAutomatico(G.palavra);
    ops.forEach(op=>{ aplicaOp(op,true); registra(op); });
    mpEnvia({t:'redraw', ops:historico});
    montaFerramentas();
    addChat(`🪄 <span class="sistema">Pintura mágica usada! (-${PRECO_PINTURA}🍄)</span>`);
}

// ---------- DENÚNCIA ----------
function renderBotaoDenuncia(){
    const box = document.getElementById('denunciaBtnBox'); if(!box) return;
    // só quem tá adivinhando pode denunciar (o desenhista não denuncia o próprio desenho)
    if(G.souDrawer || G.denunciado){ box.innerHTML=''; return; }
    box.innerHTML = `<button class="btn pequeno" style="background:#c00" onclick="denunciarDesenho()">🚩 Denunciar desenho</button>`;
}
function denunciarDesenho(){
    if(G.souDrawer || G.denunciado) return;
    try{
        const registro = {
            desenho: tela.toDataURL('image/png'),
            palavra: G.palavra || '',
            desenhista: G.drawer || '',
            denunciante: mp.meuNome || '',
            sala: mp.sala || '',
            data: new Date().toISOString()
        };
        const lista = JSON.parse(localStorage.getItem('denuncias') || '[]');
        lista.push(registro);
        // mantém só as últimas 50 pra não estourar o localStorage
        while(lista.length > 50) lista.shift();
        localStorage.setItem('denuncias', JSON.stringify(lista));
    }catch(e){ /* localStorage cheio ou indisponível — ainda assim escondemos o desenho */ }
    G.denunciado = true;
    const ov = document.getElementById('denunciaOverlay');
    if(ov) ov.style.display='flex';
    renderBotaoDenuncia();
    addChat('🚩 <span class="sistema">Você denunciou este desenho.</span>');
}

// ---------- UTIL ----------
function normaliza(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,''); }
function mascara(p){
    return p.split('').map((c,i)=>{
        if(c===' ') return '  ';
        if(!/[a-zA-Zà-ú]/.test(c)) return c;
        return G.letrasReveladas.has(i) ? c.toUpperCase() : '_';
    }).join(' ');
}

// ---------- DICA (gasta Cogu Coins pra revelar uma letra) ----------
function renderBotaoDica(){
    const box = document.getElementById('dicaBox'); if(!box) return;
    if(G.souDrawer || G.revelou){ box.innerHTML=''; return; }
    box.innerHTML = `<button class="btn pequeno amarelo" style="width:100%;margin-top:6px;" onclick="pedirDica()">💡 Dica (-${PRECO_DICA}🍄)</button>`;
}
function pedirDica(){
    if(G.souDrawer || G.revelou || !window.CoguCoins) return;
    const faltam = G.palavra.split('').map((c,i)=>({c,i})).filter(o=>/[a-zA-Zà-ú]/.test(o.c) && !G.letrasReveladas.has(o.i));
    if(faltam.length<=1){
        addChat('💡 <span class="sistema">Já tem quase tudo revelado, só falta você adivinhar! 😄</span>');
        return;
    }
    if(!CoguCoins.gasta(PRECO_DICA)){
        addChat(`😕 <span class="sistema">Faltam Cogu Coins pra dica (precisa 🍄${PRECO_DICA}).</span>`);
        return;
    }
    const sorteada = faltam[Math.floor(Math.random()*faltam.length)];
    G.letrasReveladas.add(sorteada.i);
    document.getElementById('palavraHud').textContent = mascara(G.palavra);
    addChat(`💡 <span class="sistema">Dica usada! Uma letra foi revelada. (-${PRECO_DICA}🍄)</span>`);
}

// ---------- SONS (WebAudio) ----------
let actx=null;
function ac(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return actx; }
function bip(freq, dur, tipo){
    const a=ac(); if(!a) return;
    const o=a.createOscillator(), g=a.createGain();
    o.type=tipo||'sine'; o.frequency.value=freq;
    o.connect(g); g.connect(a.destination);
    g.gain.setValueAtTime(0.15, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, a.currentTime+dur);
    o.start(); o.stop(a.currentTime+dur);
}
function tocaAcerto(){ bip(660,0.1,'square'); setTimeout(()=>bip(880,0.15,'square'),110); setTimeout(()=>bip(1100,0.2,'square'),240); }
function tocaTique(){ bip(400,0.05,'triangle'); }
