<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Cidade Capivara — Cogumelo Games</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
    background:linear-gradient(180deg,#7ec8e3 0%, #a8e6a0 55%, #7abf5a 100%);
    min-height:100vh; font-family:Arial,sans-serif; color:#234;
    display:flex; flex-direction:column; align-items:center; padding:12px; user-select:none;
}
h1 { font-size:26px; margin-bottom:2px; color:#1a5c2a; text-shadow:0 2px 0 rgba(255,255,255,0.5); }
.sub { color:#3a6c4a; font-size:12px; margin-bottom:8px; text-align:center; }
#hud { display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap; justify-content:center; }
#hud span { background:rgba(255,255,255,0.85); border:2px solid #4a8c5a; border-radius:12px; padding:5px 12px; font-weight:bold; font-size:14px; }
#hud small { display:block; font-size:10px; color:#567; font-weight:normal; }
#mapa {
    display:grid; grid-template-columns:repeat(12,1fr); gap:3px;
    width:min(96vw, 680px); background:rgba(255,255,255,0.35); border:3px solid #4a8c5a; border-radius:16px; padding:6px;
    position:relative;
}
.lote {
    aspect-ratio:1; border-radius:10px; background:#8fce7a; border:2px solid rgba(0,0,0,0.12);
    display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; position:relative;
}
.lote:active { transform:scale(0.94); }
.lote .emo { font-size:min(4.2vw,26px); line-height:1; filter:drop-shadow(0 2px 2px rgba(0,0,0,0.3)); }
.lote .nv { font-size:8px; font-weight:bold; color:#fff; background:rgba(0,0,0,0.45); border-radius:8px; padding:1px 5px; margin-top:2px; }
.lote.vazio { background:#a5d98f; }
.lote.vazio::after { content:'➕'; opacity:0.3; font-size:13px; }
.lote.trancado { background:#6a8a5a; }
.lote.trancado::after { content:'🌲'; font-size:min(4vw,22px); opacity:0.9; }
.lote.parado::before { content:'💤'; position:absolute; top:2px; right:3px; font-size:13px; }

#painel {
    position:fixed; inset:0; background:rgba(10,20,10,0.75); z-index:50; display:none;
    align-items:flex-end; justify-content:center;
}
#painel .cartao {
    background:#fffef2; border-radius:22px 22px 0 0; width:min(100vw,480px); padding:18px; text-align:center;
    max-height:80vh; overflow:auto;
}
#painel h2 { font-size:20px; color:#1a5c2a; }
#painel p { font-size:13px; color:#567; margin:6px 0; }
#painel button {
    width:100%; margin-top:8px; font-size:16px; font-weight:bold; padding:12px; border:none; border-radius:14px; cursor:pointer;
    background:linear-gradient(135deg,#2fae4d,#5dd97a); color:#fff;
}
#painel button.cinza { background:#98a; }
#painel button.vermelho { background:linear-gradient(135deg,#cc4433,#ee6655); }
#painel button:disabled { background:#bbb; color:#888; }
.opcoes { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-top:8px; }
.opcoes button { margin-top:0 !important; font-size:14px !important; padding:10px 6px !important; }
.opcoes button b { font-size:20px; display:block; }
#msg { position:fixed; top:16%; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.85); border:2px solid #5dd97a;
    color:#aaffbb; padding:10px 18px; border-radius:14px; font-weight:bold; font-size:15px; z-index:60; display:none; text-align:center; max-width:92vw; }
a.voltar { color:#2a5c3a; text-decoration:none; margin-top:12px; font-weight:bold; }
#voltouBox { position:fixed; inset:0; background:rgba(10,20,10,0.85); z-index:70; display:none;
    flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:20px; }
#voltouBox .c { background:#fffef2; border-radius:20px; padding:24px; max-width:380px; }
#voltouBox h2 { color:#1a5c2a; }
#voltouBox p { color:#456; margin:8px 0; font-size:15px; }
#voltouBox button { font-size:17px; font-weight:bold; padding:12px 28px; border:none; border-radius:14px;
    background:linear-gradient(135deg,#2fae4d,#5dd97a); color:#fff; cursor:pointer; margin-top:6px; }

.nuvem { position:fixed; font-size:46px; opacity:0.8; z-index:1; pointer-events:none; animation:nuvemVai linear infinite; }
@keyframes nuvemVai { from{ left:-80px; } to{ left:105vw; } }
#capiPasseio { position:fixed; bottom:8px; font-size:34px; z-index:2; pointer-events:none;
    animation:capiAnda 26s linear infinite; filter:drop-shadow(0 2px 3px rgba(0,0,0,0.4)); }
@keyframes capiAnda { 0%{ left:-50px; transform:scaleX(1);} 49%{ left:calc(100vw + 10px); transform:scaleX(1);} 50%{ left:calc(100vw + 10px); transform:scaleX(-1);} 100%{ left:-50px; transform:scaleX(-1);} }
</style>
</head>
<body>
<h1>🦫🏗️ Cidade Capivara</h1>
<div class="sub">Construa e pense bem: casas dão moedas mas comem 🌽 — fazendas alimentam tudo! A cidade produz até você DORMINDO 😴</div>
<div id="hud">
    <span>🪙 <b id="hMoedas">0</b><small id="hMoedasTx">+0/s</small></span>
    <span>🌽 <b id="hComida">0</b><small id="hComidaTx">+0/s</small></span>
    <span>😊 <b id="hFelic">x1.0</b><small>felicidade</small></span>
</div>
<div id="mapa"></div>
<div class="nuvem" style="top:6%; animation-duration:55s">☁️</div>
<div class="nuvem" style="top:13%; animation-duration:80s; animation-delay:-30s; font-size:32px">☁️</div>
<div id="capiPasseio">🦫</div>
<a class="voltar" href="/">← Voltar pros jogos</a>

<div id="msg"></div>

<div id="painel" onclick="if(event.target===this)fechaPainel()">
    <div class="cartao" id="painelIn"></div>
</div>

<div id="voltouBox">
    <div class="c">
        <h2>😴 Enquanto você dormia...</h2>
        <p id="voltouTexto"></p>
        <button onclick="document.getElementById('voltouBox').style.display='none'">COLETAR! 🎉</button>
    </div>
</div>

<script src="/stats.js"></script>
<script src="/avisos.js?v=6"></script>
<script>
if (window.initStats) initStats('cidade');

// ============ DADOS ============
// estratégia: moedas x comida x felicidade. Casa gera moeda mas COME. Fazenda alimenta. Parque multiplica.
var PREDIOS = {
    casa:    { emoji:'🏠', nome:'Casa',        custo:50,    moedas:1,   comida:-0.4, desc:'Gera 🪙 mas os moradores comem 🌽' },
    fazenda: { emoji:'🌾', nome:'Fazenda',     custo:40,    moedas:0,   comida:1.2,  desc:'Produz 🌽 pra alimentar a cidade' },
    mercado: { emoji:'🏪', nome:'Mercadinho',  custo:300,   moedas:6,   comida:-1.5, desc:'Muita moeda, mas come bastante' },
    parque:  { emoji:'🎡', nome:'Parque',      custo:500,   moedas:0,   comida:0,    desc:'+15% de moedas na cidade toda (felicidade!)' },
    fabrica: { emoji:'🏭', nome:'Fábrica',     custo:2500,  moedas:30,  comida:-6,   desc:'Produção GIGANTE... e fome gigante' },
    praca:   { emoji:'🌳', nome:'Praça',       custo:100,   moedas:0,   comida:0,    desc:'+5% de moedas (arzinho puro!)' },
    banco:   { emoji:'🏦', nome:'Banco',       custo:12000, moedas:80,  comida:-10,  desc:'Dinheiro chama dinheiro!' },
    castelo: { emoji:'🏰', nome:'Castelo',     custo:50000, moedas:200, comida:-20,  desc:'A glória da cidade! (símbolo de rei)' }
};
// o prédio EVOLUI de aparência conforme o nível (mais realista!)
function emojiDe(l){
    var t=l.t, n=l.nv;
    if(t==='casa')    return n>=10?'🏘️':n>=5?'🏡':'🏠';
    if(t==='fazenda') return n>=10?'🏞️':n>=5?'🚜':'🌾';
    if(t==='mercado') return n>=8?'🏬':'🏪';
    if(t==='fabrica') return n>=8?'🏗️':'🏭';
    return PREDIOS[t].emoji;
}
var LADO = 12, TOTAL = LADO*LADO;
// preço do terreno cresce conforme se afasta do centro da cidade
function custoLote(i){
    var r = Math.floor(i/LADO), c = i%LADO;
    var anel = Math.max(Math.abs(r-5.5), Math.abs(c-5.5)); // 1.5=centro ... 5.5=beirada
    if(anel <= 2.5) return 150;
    if(anel <= 3.5) return 600;
    if(anel <= 4.5) return 2500;
    return 9000;
}

function lsGet(k,d){ try{ var v=localStorage.getItem('cidade_'+k); return v===null?d:JSON.parse(v); }catch(e){ return d; } }
function lsSet(k,v){ try{ localStorage.setItem('cidade_'+k, JSON.stringify(v)); }catch(e){} }

var lotes = lsGet('lotes', null);   // [{t:'casa', nv:1} | null | 'trancado']
var moedas = lsGet('moedas', 120);
var comida = lsGet('comida', 30);
function loteNovoPadrao(i){
    var r = Math.floor(i/LADO), c = i%LADO;
    return (Math.max(Math.abs(r-5.5), Math.abs(c-5.5)) <= 1.5) ? null : 'trancado'; // centro 4x4 livre
}
if(!lotes){
    lotes = [];
    for(var i=0;i<TOTAL;i++) lotes.push(loteNovoPadrao(i));
} else if(lotes.length === 36){
    // MIGRAÇÃO: cidade antiga 6x6 vira o centro da cidade GIGANTE 12x12
    var novo = [];
    for(var i=0;i<TOTAL;i++) novo.push(loteNovoPadrao(i));
    for(var r=0;r<6;r++) for(var c=0;c<6;c++){
        var velho = lotes[r*6+c];
        if(velho !== 'trancado') novo[(r+3)*LADO + (c+3)] = velho; // prédio ou vazio comprado
    }
    lotes = novo;
}

// ============ PRODUÇÃO ============
function taxa(){
    var m = 0, c = 0, felic = 0;
    lotes.forEach(function(l){
        if(!l || l === 'trancado') return;
        var p = PREDIOS[l.t];
        if(l.t === 'parque'){ felic += l.nv * 0.15; return; }
        if(l.t === 'praca'){ felic += l.nv * 0.05; return; }
        m += p.moedas * l.nv;
        c += p.comida * l.nv;
    });
    var mult = 1 + felic;
    var fome = comida <= 0 && c < 0; // sem comida = cidade PARA de gerar moedas!
    return { moedas: fome ? 0 : m * mult, comida: c, mult: mult, fome: fome };
}
function produz(seg){
    var t = taxa();
    var ganhoM = 0;
    if(t.comida >= 0){
        comida += t.comida * seg;
        ganhoM = t.moedas * seg;
    } else {
        // comida caindo: produz moeda só enquanto tem comida
        var segComComida = comida > 0 ? Math.min(seg, comida / -t.comida) : 0;
        comida = Math.max(0, comida + t.comida * seg);
        ganhoM = t.moedas * segComComida;
    }
    moedas += ganhoM;
    return ganhoM;
}

// ============ OFFLINE (produz dormindo!) ============
(function(){
    var antes = lsGet('quando', 0);
    var agora = Date.now();
    if(antes > 0){
        var seg = Math.min((agora - antes)/1000, 8*3600); // até 8 horas de produção offline
        if(seg > 60){
            var g = produz(seg);
            if(g >= 1){
                document.getElementById('voltouTexto').innerHTML =
                    'Sua cidade trabalhou por <b>' + (seg>3600 ? Math.floor(seg/3600)+'h'+Math.floor(seg%3600/60)+'min' : Math.floor(seg/60)+' minutos') + '</b><br>' +
                    'e produziu <b style="color:#1a8c3a">🪙 ' + Math.floor(g).toLocaleString('pt-BR') + '</b>!';
                document.getElementById('voltouBox').style.display = 'flex';
            }
        }
    }
})();

function salva(){
    lsSet('lotes', lotes); lsSet('moedas', moedas); lsSet('comida', comida); lsSet('quando', Date.now());
}

// ============ MAPA ============
var mapaEl = document.getElementById('mapa');
function desenhaMapa(){
    mapaEl.innerHTML = '';
    var t = taxa();
    lotes.forEach(function(l, i){
        var d = document.createElement('div');
        if(l === 'trancado'){ d.className = 'lote trancado'; d.onclick = function(){ abreDestrancar(i); }; }
        else if(!l){ d.className = 'lote vazio'; d.onclick = function(){ abreConstruir(i); }; }
        else {
            d.className = 'lote' + (t.fome && PREDIOS[l.t].moedas > 0 ? ' parado' : '');
            d.innerHTML = '<div class="emo">' + emojiDe(l) + '</div><div class="nv">nv ' + l.nv + '</div>';
            d.onclick = function(){ abrePredio(i); };
        }
        mapaEl.appendChild(d);
    });
}
var msgTimer=null;
function mostraMsg(txt, ms){
    var m=document.getElementById('msg');
    m.textContent=txt; m.style.display='block';
    if(msgTimer) clearTimeout(msgTimer);
    msgTimer=setTimeout(function(){ m.style.display='none'; }, ms||2000);
}

// ============ PAINÉIS ============
var painel = document.getElementById('painel'), painelIn = document.getElementById('painelIn');
function fechaPainel(){ painel.style.display='none'; }
function abreConstruir(i){
    var html = '<h2>🏗️ Construir aqui</h2><p>Pense: já tem 🌽 suficiente pra mais bocas?</p><div class="opcoes">';
    Object.keys(PREDIOS).forEach(function(k){
        var p = PREDIOS[k];
        html += '<button ' + (moedas < p.custo ? 'disabled' : '') + ' onclick="constroi(' + i + ',\'' + k + '\')">' +
            '<b>' + p.emoji + '</b>' + p.nome + '<br>🪙 ' + p.custo.toLocaleString('pt-BR') +
            '<br><span style="font-size:10px; font-weight:normal">' + p.desc + '</span></button>';
    });
    html += '</div><button class="cinza" onclick="fechaPainel()">Fechar</button>';
    painelIn.innerHTML = html;
    painel.style.display = 'flex';
}
function constroi(i, k){
    var p = PREDIOS[k];
    if(moedas < p.custo) return;
    moedas -= p.custo;
    lotes[i] = { t:k, nv:1 };
    fechaPainel(); desenhaMapa(); salva();
    mostraMsg(p.emoji + ' ' + p.nome + ' construído!');
}
function custoUp(l){ return Math.floor(PREDIOS[l.t].custo * 0.8 * Math.pow(1.7, l.nv)); }
function abrePredio(i){
    var l = lotes[i], p = PREDIOS[l.t];
    var cu = custoUp(l);
    painelIn.innerHTML = '<h2>' + p.emoji + ' ' + p.nome + ' — nível ' + l.nv + '</h2>' +
        '<p>' + p.desc + '</p>' +
        '<p><b>Agora:</b> ' + (p.moedas ? '🪙 ' + (p.moedas*l.nv).toFixed(1) + '/s ' : '') +
        (p.comida ? '🌽 ' + (p.comida*l.nv).toFixed(1) + '/s' : '') +
        (l.t==='parque' ? '😊 +' + (l.nv*15) + '% de moedas' : '') + '</p>' +
        '<button ' + (moedas < cu ? 'disabled' : '') + ' onclick="melhora(' + i + ')">⬆️ Melhorar (🪙 ' + cu.toLocaleString('pt-BR') + ')</button>' +
        '<button class="vermelho" onclick="demole(' + i + ')">💥 Demolir (devolve metade)</button>' +
        '<button class="cinza" onclick="fechaPainel()">Fechar</button>';
    painel.style.display = 'flex';
}
function melhora(i){
    var l = lotes[i], cu = custoUp(l);
    if(moedas < cu) return;
    moedas -= cu;
    l.nv++;
    fechaPainel(); desenhaMapa(); salva();
    mostraMsg('⬆️ ' + PREDIOS[l.t].nome + ' nível ' + l.nv + '!');
}
function demole(i){
    var l = lotes[i];
    moedas += Math.floor(PREDIOS[l.t].custo/2);
    lotes[i] = null;
    fechaPainel(); desenhaMapa(); salva();
    mostraMsg('💥 Demolido!');
}
function abreDestrancar(i){
    var c = custoLote(i);
    painelIn.innerHTML = '<h2>🔒 Terreno trancado</h2><p>Compre pra sua cidade crescer!</p>' +
        '<button ' + (moedas < c ? 'disabled' : '') + ' onclick="destranca(' + i + ',' + c + ')">🔓 Comprar terreno (🪙 ' + c.toLocaleString('pt-BR') + ')</button>' +
        '<button class="cinza" onclick="fechaPainel()">Fechar</button>';
    painel.style.display = 'flex';
}
function destranca(i, c){
    if(moedas < c) return;
    moedas -= c;
    lotes[i] = null;
    fechaPainel(); desenhaMapa(); salva();
    mostraMsg('🔓 Terreno novo!');
}
window.constroi=constroi; window.melhora=melhora; window.demole=demole;
window.destranca=destranca; window.fechaPainel=fechaPainel;

// ============ RELÓGIO ============
function desenhaHud(){
    var t = taxa();
    document.getElementById('hMoedas').textContent = Math.floor(moedas).toLocaleString('pt-BR');
    document.getElementById('hComida').textContent = Math.floor(comida).toLocaleString('pt-BR');
    document.getElementById('hMoedasTx').textContent = (t.fome ? '⚠️ SEM COMIDA!' : '+' + t.moedas.toFixed(1) + '/s');
    document.getElementById('hComidaTx').textContent = (t.comida>=0?'+':'') + t.comida.toFixed(1) + '/s';
    document.getElementById('hFelic').textContent = 'x' + t.mult.toFixed(2);
}
var avisouFome = false;
setInterval(function(){
    produz(1);
    var t = taxa();
    if(t.fome && !avisouFome){ avisouFome = true; mostraMsg('⚠️ ACABOU A COMIDA! A cidade parou — construa FAZENDAS! 🌾', 3500); desenhaMapa(); }
    if(!t.fome && avisouFome){ avisouFome = false; desenhaMapa(); }
    desenhaHud();
}, 1000);
setInterval(salva, 5000);
addEventListener('beforeunload', salva);

desenhaMapa();
desenhaHud();
</script>
<script src="/mascote.js"></script>
</body>
</html>
