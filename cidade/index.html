* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

body.mundo-espaco a.voltar { color:#aaf; }
h1 { font-size:26px; margin-bottom:2px; color:#1a5c2a; text-shadow:0 2px 0 rgba(255,255,255,0.5); }

#mapa {

.lote {
    aspect-ratio:1; border-radius:10px; background:#8fce7a; border:2px solid rgba(0,0,0,0.12);

}
body.mundo-praia .lote { background:#f0d998; }
body.mundo-praia .lote.vazio { background:#f7e6b0; }
body.mundo-praia .lote.trancado { background:#c9b478; }
body.mundo-neve .lote { background:#dceaf5; }
body.mundo-neve .lote.vazio { background:#eef6fc; }
body.mundo-neve .lote.trancado { background:#a8bfd0; }
body.mundo-espaco .lote { background:#3a3a6a; }
body.mundo-espaco .lote.vazio { background:#4a4a7a; }
body.mundo-espaco .lote.trancado { background:#252548; }

.lote.vazio::after { content:'➕'; opacity:0.3; font-size:13px; }
.lote.trancado { background:#6a8a5a; }
.lote.trancado::after { content:attr(data-arvore); font-size:min(4vw,22px); opacity:0.9; }
.lote.parado::before { content:'💤'; position:absolute; top:2px; right:3px; font-size:13px; }

#capiPasseio { position:fixed; bottom:8px; font-size:34px; z-index:2; pointer-events:none;

// o prédio EVOLUI de aparência conforme o nível (mais realista!)
function emojiDe(l){
    var t=l.t, n=l.nv;
    if(t==='casa')    return n>=10?'🏘️':n>=5?'🏡':'🏠';
    if(t==='fazenda') return n>=10?'🏞️':n>=5?'🚜':'🌾';
    if(t==='mercado') return n>=8?'🏬':'🏪';
    if(t==='fabrica') return n>=8?'🏗️':'🏭';
    if(t==='predio')  return n>=8?'🌆':'🏢';
    return PREDIOS[t].emoji;
}

function custoLote(i){
    var r = Math.floor(i/LADO), c = i%LADO;
    var anel = Math.max(Math.abs(r-5.5), Math.abs(c-5.5)); // 1.5=centro ... 5.5=beirada
    if(anel <= 2.5) return 150;
    if(anel <= 3.5) return 600;
    if(anel <= 4.5) return 2500;
    return 9000;
}

// ============ MUNDOS ============
var MUNDOS = {
    cidade: { nome:'Cidade',  emoji:'🏙️', custo:0,      arvore:'🌲', titulo:'🦫🏗️ Cidade Capivara' },
    praia:  { nome:'Praia',   emoji:'🏖️', custo:30000,  arvore:'🌴', titulo:'🦫🏖️ Praia Capivara' },
    neve:   { nome:'Neve',    emoji:'⛄',  custo:150000, arvore:'🎄', titulo:'🦫⛄ Neve Capivara' },
    espaco: { nome:'Espaço',  emoji:'🚀',  custo:800000, arvore:'☄️', titulo:'🦫🚀 Espaço Capivara' }
};

function lsGet(k,d){ try{ var v=localStorage.getItem('cidade_'+k); return v===null?d:JSON.parse(v); }catch(e){ return d; } }
function lsSet(k,v){ try{ localStorage.setItem('cidade_'+k, JSON.stringify(v)); }catch(e){} }

// jogador NOVO = nunca salvou nada da cidade neste navegador (checar ANTES de qualquer salva!)
var jogadorNovo = localStorage.getItem('cidade_moedas') === null;

var moedas = lsGet('moedas', 120);
var comida = lsGet('comida', 30);
var mundosComprados = lsGet('mundos', ['cidade']);
var mundoAtual = lsGet('mundoAtual', 'cidade');
if(mundosComprados.indexOf(mundoAtual) < 0) mundoAtual = 'cidade';

function loteNovoPadrao(i){
    var r = Math.floor(i/LADO), c = i%LADO;
    return (Math.max(Math.abs(r-5.5), Math.abs(c-5.5)) <= 1.5) ? null : 'trancado'; // centro 4x4 livre
}
function mapaNovo(){
    var v = [];
    for(var i=0;i<TOTAL;i++) v.push(loteNovoPadrao(i));
    return v;
}

// lotes de TODOS os mundos comprados ficam na memória (todos produzem juntos!)
var lotesPor = {};
mundosComprados.forEach(function(m){
    lotesPor[m] = lsGet('lotes_'+m, null);
});
// MIGRAÇÃO: cidade antiga salva em 'lotes' vira o mundo 'cidade'
if(!lotesPor.cidade){
    var antigo = lsGet('lotes', null);
    if(antigo && antigo.length === 36){
        var novo = mapaNovo();
        for(var r=0;r<6;r++) for(var c=0;c<6;c++){
            var velho = antigo[r*6+c];
            if(velho !== 'trancado') novo[(r+3)*LADO + (c+3)] = velho;
        }
        lotesPor.cidade = novo;
    } else if(antigo && antigo.length === TOTAL){
        lotesPor.cidade = antigo;
    } else {
        lotesPor.cidade = mapaNovo();
    }
}
mundosComprados.forEach(function(m){ if(!lotesPor[m]) lotesPor[m] = mapaNovo(); });

function lotes(){ return lotesPor[mundoAtual]; }

function temAeroporto(){
    var tem = false;
    mundosComprados.forEach(function(m){
        lotesPor[m].forEach(function(l){ if(l && l !== 'trancado' && l.t === 'aeroporto') tem = true; });
    });
    return tem;
}

// ============ PRODUÇÃO (soma TODOS os mundos!) ============
function taxa(){
    var m = 0, c = 0, felic = 0, pop = 0;
    mundosComprados.forEach(function(mu){
        lotesPor[mu].forEach(function(l){
            if(!l || l === 'trancado') return;
            var p = PREDIOS[l.t];
            pop += (p.pop || 0) * l.nv;
            if(l.t === 'parque'){ felic += l.nv * 0.15; return; }
            if(l.t === 'praca'){ felic += l.nv * 0.05; return; }
            if(l.t === 'escola'){ felic += l.nv * 0.10; c += p.comida * l.nv; return; }
            m += p.moedas * l.nv;
            c += p.comida * l.nv;
        });
    });
    var multPop = 1 + pop * 0.01; // cada morador = +1% de moedas!
    var mult = (1 + felic) * multPop;
    var fome = comida <= 0 && c < 0; // sem comida = cidade PARA de gerar moedas!
    return { moedas: fome ? 0 : m * mult, comida: c, mult: 1 + felic, pop: pop, multPop: multPop, fome: fome };
}
function produz(seg){
    var t = taxa();
    var ganhoM = 0;
    if(t.comida >= 0){
        comida += t.comida * seg;
        ganhoM = t.moedas * seg;
    } else {
        // comida caindo: produz moeda só enquanto tem comida
        var segComComida = comida > 0 ? Math.min(seg, comida / -t.comida) : 0;
        comida = Math.max(0, comida + t.comida * seg);
        ganhoM = t.moedas * segComComida;
    }
    moedas += ganhoM;
    return ganhoM;
}

// ============ OFFLINE (produz dormindo!) ============
(function(){
    var antes = lsGet('quando', 0);
    var agora = Date.now();
    if(antes > 0){
        var seg = Math.min((agora - antes)/1000, 8*3600); // até 8 horas de produção offline
        if(seg > 60){
            var g = produz(seg);
            if(g >= 1){
                document.getElementById('voltouTexto').innerHTML =
                    'Sua cidade trabalhou por <b>' + (seg>3600 ? Math.floor(seg/3600)+'h'+Math.floor(seg%3600/60)+'min' : Math.floor(seg/60)+' minutos') + '</b><br>' +
                    'e produziu <b style="color:#1a8c3a">🪙 ' + Math.floor(g).toLocaleString('pt-BR') + '</b>!';
                document.getElementById('voltouBox').style.display = 'flex';
            }
        }
    }
})();

function salva(){
    mundosComprados.forEach(function(m){ lsSet('lotes_'+m, lotesPor[m]); });
    lsSet('moedas', moedas); lsSet('comida', comida);
    lsSet('mundos', mundosComprados); lsSet('mundoAtual', mundoAtual);
    lsSet('quando', Date.now());
}

// ============ MODO MOEDA INFINITA (fica ligado PRA SEMPRE — o dinheiro nunca diminui!) ============
var modoInfinito = lsGet('modoInfinito', false);
(function(){
    if(location.search.indexOf('moedas=infinito') < 0) return;
    modoInfinito = true;
    lsSet('modoInfinito', true);
    moedas = 1e33;
    salva();
    document.getElementById('voltouBox').querySelector('h2').textContent = '♾️ MODO INFINITO LIGADO!';
    document.getElementById('voltouTexto').innerHTML =
        'Agora seu dinheiro é <b style="color:#1a8c3a; font-size:20px">♾️ INFINITO</b><br>' +
        'Um número que NUNCA acaba — pode gastar o quanto quiser que ele não diminui! 🤯';
    document.getElementById('voltouBox').style.display = 'flex';
})();
if(modoInfinito) moedas = 1e33;

// ============ LINK SECRETO DO DONO (só funciona 1 vez por navegador) ============
(function(){
    if(location.search.indexOf('presente=davi') < 0) return;
    if(lsGet('presenteDono', false)) return;
    moedas += 1000000000000000000;
    lsSet('presenteDono', true);
    salva();

    document.getElementById('voltouTexto').innerHTML =
        'Você é o DONO do jogo e ganhou<br>' +
        '<b style="color:#1a8c3a; font-size:17px">🪙 1.000.000.000.000.000.000</b><br>(UM QUINTILHÃO de moedas!) 🤯';
    document.getElementById('voltouBox').style.display = 'flex';
})();

// ============ PRESENTE DO DAVI (só pros 2 PRIMEIROS jogadores novos!) ============
(function(){
    if(lsGet('presenteVip', false) || lsGet('presenteChecado', false)) return;
    if(!jogadorNovo){ lsSet('presenteChecado', true); return; }
    fetch('https://api.counterapi.dev/v1/cogumelogames-br/cidade-presente-davi/up')
        .then(function(r){ return r.json(); })

                document.getElementById('voltouBox').style.display = 'flex';
            }
        }).catch(function(){});
})();

// ============ MAPA ============
var mapaEl = document.getElementById('mapa');
function aplicaTema(){
    document.body.className = mundoAtual === 'cidade' ? '' : 'mundo-' + mundoAtual;
    document.getElementById('titulo').textContent = MUNDOS[mundoAtual].titulo;
    document.getElementById('btnMundos').firstChild.textContent = MUNDOS[mundoAtual].emoji;
}
function desenhaMapa(){
    mapaEl.innerHTML = '';
    var t = taxa();
    var arv = MUNDOS[mundoAtual].arvore;
    lotes().forEach(function(l, i){
        var d = document.createElement('div');
        if(l === 'trancado'){ d.className = 'lote trancado'; d.setAttribute('data-arvore', arv); d.onclick = function(){ abreDestrancar(i); }; }
        else if(!l){ d.className = 'lote vazio'; d.onclick = function(){ abreConstruir(i); }; }
        else {
            d.className = 'lote' + (t.fome && PREDIOS[l.t].moedas > 0 ? ' parado' : '');
            d.innerHTML = '<div class="emo">' + emojiDe(l) + '</div><div class="nv">nv ' + l.nv + '</div>';
            d.onclick = function(){ abrePredio(i); };
        }
        mapaEl.appendChild(d);
    });
}
var msgTimer=null;
function mostraMsg(txt, ms){
    var m=document.getElementById('msg');
    m.textContent=txt; m.style.display='block';
    if(msgTimer) clearTimeout(msgTimer);
    msgTimer=setTimeout(function(){ m.style.display='none'; }, ms||2000);
}

// ============ PAINÉIS ============
var painel = document.getElementById('painel'), painelIn = document.getElementById('painelIn');
function fechaPainel(){ painel.style.display='none'; }
function abreConstruir(i){
    var html = '<h2>🏗️ Construir aqui</h2><p>Pense: já tem 🌽 suficiente pra mais bocas?</p><div class="opcoes">';
    Object.keys(PREDIOS).forEach(function(k){
        var p = PREDIOS[k];
        html += '<button ' + (moedas < p.custo ? 'disabled' : '') + ' onclick="constroi(' + i + ',\'' + k + '\')">' +
            '<b>' + p.emoji + '</b>' + p.nome + (p.pop ? ' 👥' + p.pop : '') + '<br>🪙 ' + p.custo.toLocaleString('pt-BR') +
            '<br><span style="font-size:10px; font-weight:normal">' + p.desc + '</span></button>';
    });
    html += '</div><button class="cinza" onclick="fechaPainel()">Fechar</button>';
    painelIn.innerHTML = html;
    painel.style.display = 'flex';
}
function constroi(i, k){
    var p = PREDIOS[k];
    if(moedas < p.custo) return;
    moedas -= p.custo;
    lotes()[i] = { t:k, nv:1 };
    fechaPainel(); desenhaMapa(); salva();
    if(k === 'aeroporto') mostraMsg('🛫 Aeroporto pronto! Agora você pode VIAJAR pra outros mundos! Clica no botão do canto! 🌍', 4000);
    else mostraMsg(p.emoji + ' ' + p.nome + ' construído!' + (p.pop ? ' +' + p.pop + ' moradores 👥' : ''));
}
function custoUp(l){ return Math.floor(PREDIOS[l.t].custo * 0.8 * Math.pow(1.7, l.nv)); }
function abrePredio(i){
    var l = lotes()[i], p = PREDIOS[l.t];
    var cu = custoUp(l);
    painelIn.innerHTML = '<h2>' + p.emoji + ' ' + p.nome + ' — nível ' + l.nv + '</h2>' +
        '<p>' + p.desc + '</p>' +
        '<p><b>Agora:</b> ' + (p.moedas ? '🪙 ' + (p.moedas*l.nv).toFixed(1) + '/s ' : '') +
        (p.comida ? '🌽 ' + (p.comida*l.nv).toFixed(1) + '/s ' : '') +
        (p.pop ? '👥 ' + (p.pop*l.nv) + ' moradores ' : '') +
        (l.t==='parque' ? '😊 +' + (l.nv*15) + '% de moedas' : '') +
        (l.t==='escola' ? '😊 +' + (l.nv*10) + '% de moedas' : '') + '</p>' +
        '<button ' + (moedas < cu ? 'disabled' : '') + ' onclick="melhora(' + i + ')">⬆️ Melhorar (🪙 ' + cu.toLocaleString('pt-BR') + ')</button>' +
        '<button class="azul" onclick="mostraMulti(' + i + ')">⬆️⬆️ Evoluir VÁRIAS vezes</button>' +
        '<div id="multiBox" style="display:none; margin-top:8px">' +
            '<input id="multiN" type="number" inputmode="numeric" pattern="[0-9]*" min="1" placeholder="escreva um número aqui" ' +
                'style="width:100%; padding:12px; font-size:16px; font-weight:bold; text-align:center; border:3px solid #2a6acc; border-radius:14px; outline:none">' +
            '<button class="azul" onclick="melhoraVarias(' + i + ')">🚀 EVOLUIR!</button>' +
        '</div>' +
        '<button class="vermelho" onclick="demole(' + i + ')">💥 Demolir (devolve metade)</button>' +
        '<button class="cinza" onclick="fechaPainel()">Fechar</button>';
    painel.style.display = 'flex';
}
function mostraMulti(i){
    var box = document.getElementById('multiBox');
    box.style.display = 'block';
    var inp = document.getElementById('multiN');
    inp.focus(); // no celular isso abre o teclado numérico
    inp.onkeydown = function(e){ if(e.key === 'Enter') melhoraVarias(i); };
}
function melhoraVarias(i){
    var n = parseInt(document.getElementById('multiN').value, 10);
    if(!n || n < 1){ mostraMsg('✏️ Escreve um número primeiro!'); return; }
    var l = lotes()[i], subiu = 0, gasto = 0;
    for(var k=0; k<n; k++){
        var cu = custoUp(l);
        if(moedas < cu) break;
        moedas -= cu; gasto += cu;
        l.nv++; subiu++;
    }
    fechaPainel(); desenhaMapa(); desenhaHud(); salva();
    if(subiu === 0) mostraMsg('😢 Moedas não deram nem pra 1 nível!');
    else if(subiu < n) mostraMsg('⬆️ Subiu ' + subiu + ' níveis (as moedas acabaram!) — nível ' + l.nv + '! Gastou 🪙 ' + gasto.toLocaleString('pt-BR'), 3500);
    else mostraMsg('🚀 ' + PREDIOS[l.t].nome + ' subiu ' + subiu + ' níveis de uma vez! Agora é nível ' + l.nv + '!', 3000);
}
function melhora(i){
    var l = lotes()[i], cu = custoUp(l);
    if(moedas < cu) return;
    moedas -= cu;
    l.nv++;
    fechaPainel(); desenhaMapa(); salva();
    mostraMsg('⬆️ ' + PREDIOS[l.t].nome + ' nível ' + l.nv + '!');
}
function demole(i){
    var l = lotes()[i];
    moedas += Math.floor(PREDIOS[l.t].custo/2);
    lotes()[i] = null;
    fechaPainel(); desenhaMapa(); salva();
    mostraMsg('💥 Demolido!');
}
function abreDestrancar(i){
    var c = custoLote(i);
    painelIn.innerHTML = '<h2>🔒 Terreno trancado</h2><p>Compre pra sua cidade crescer!</p>' +
        '<button ' + (moedas < c ? 'disabled' : '') + ' onclick="destranca(' + i + ',' + c + ')">🔓 Comprar terreno (🪙 ' + c.toLocaleString('pt-BR') + ')</button>' +
        '<button class="cinza" onclick="fechaPainel()">Fechar</button>';
    painel.style.display = 'flex';
}
function destranca(i, c){
    if(moedas < c) return;
    moedas -= c;
    lotes()[i] = null;
    fechaPainel(); desenhaMapa(); salva();
    mostraMsg('🔓 Terreno novo!');
}

// ============ TROCAR DE MUNDO ============
function abreMundos(){
    var aero = temAeroporto();
    var html = '<h2>🌍 Mundos</h2>';
    if(!aero) html += '<p>⚠️ Construa um <b>🛫 Aeroporto</b> pra poder viajar e comprar mundos novos!</p>';
    else html += '<p>Cada mundo tem seu próprio mapa — e TODOS produzem juntos, até os que você não tá vendo! 🤑</p>';
    Object.keys(MUNDOS).forEach(function(k){
        var m = MUNDOS[k];
        if(mundosComprados.indexOf(k) >= 0){
            html += '<button class="azul" ' + (k === mundoAtual ? 'disabled' : '') + ' onclick="vaiMundo(\'' + k + '\')">' +
                m.emoji + ' ' + m.nome + (k === mundoAtual ? ' (você tá aqui!)' : ' — VIAJAR ✈️') + '</button>';
        } else {
            html += '<button ' + (!aero || moedas < m.custo ? 'disabled' : '') + ' onclick="compraMundo(\'' + k + '\')">' +
                m.emoji + ' ' + m.nome + ' — 🔓 comprar 🪙 ' + m.custo.toLocaleString('pt-BR') +
                (!aero ? ' (precisa de 🛫)' : '') + '</button>';
        }
    });
    html += '<button class="cinza" onclick="fechaPainel()">Fechar</button>';
    painelIn.innerHTML = html;
    painel.style.display = 'flex';
}
function compraMundo(k){
    var m = MUNDOS[k];
    if(!temAeroporto() || moedas < m.custo) return;
    moedas -= m.custo;
    mundosComprados.push(k);
    lotesPor[k] = mapaNovo();
    mundoAtual = k;
    fechaPainel(); aplicaTema(); desenhaMapa(); salva();
    mostraMsg(m.emoji + ' Bem-vindo ao mundo ' + m.nome + '! Construa tudo de novo aqui! 🎉', 3500);
}
function vaiMundo(k){
    mundoAtual = k;
    fechaPainel(); aplicaTema(); desenhaMapa(); salva();
    mostraMsg(MUNDOS[k].emoji + ' Você viajou pra ' + MUNDOS[k].nome + '! ✈️');
}
window.constroi=constroi; window.melhora=melhora; window.demole=demole;
window.mostraMulti=mostraMulti; window.melhoraVarias=melhoraVarias;
window.destranca=destranca; window.fechaPainel=fechaPainel;
window.abreMundos=abreMundos; window.compraMundo=compraMundo; window.vaiMundo=vaiMundo;

// ============ RELÓGIO ============
function desenhaHud(){
    var t = taxa();
    if(modoInfinito) moedas = 1e33; // nunca diminui!
    document.getElementById('hMoedas').textContent = modoInfinito ? '♾️' : Math.floor(moedas).toLocaleString('pt-BR');
    document.getElementById('hComida').textContent = Math.floor(comida).toLocaleString('pt-BR');
    document.getElementById('hMoedasTx').textContent = modoInfinito ? 'nunca acaba!' : (t.fome ? '⚠️ SEM COMIDA!' : '+' + t.moedas.toFixed(1) + '/s');
    document.getElementById('hComidaTx').textContent = (t.comida>=0?'+':'') + t.comida.toFixed(1) + '/s';
    document.getElementById('hPop').textContent = t.pop.toLocaleString('pt-BR');
    document.getElementById('hPopTx').textContent = 'x' + t.multPop.toFixed(2) + ' no 🪙';
    document.getElementById('hFelic').textContent = 'x' + t.mult.toFixed(2);
}
var avisouFome = false;
setInterval(function(){
    produz(1);
    var t = taxa();
    if(t.fome && !avisouFome){ avisouFome = true; mostraMsg('⚠️ ACABOU A COMIDA! A cidade parou — construa FAZENDAS! 🌾', 3500); desenhaMapa(); }
    if(!t.fome && avisouFome){ avisouFome = false; desenhaMapa(); }
    desenhaHud();
}, 1000);
setInterval(salva, 5000);
addEventListener('beforeunload', salva);

aplicaTema();
desenhaMapa();
desenhaHud();
</script>
