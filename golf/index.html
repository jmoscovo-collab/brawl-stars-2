<style>

  h2 { font-size:clamp(22px,5vw,36px); color:#e8ffd8; text-shadow:2px 2px 0 #0006; }

  .btn { font-family:inherit; font-size:clamp(18px,4vw,26px); padding:12px 34px; border:none; border-radius:18px; cursor:pointer; color:#fff; background:#ff8a2b; box-shadow:0 5px 0 #b35a10; transition:transform .08s; }
  .btn:active { transform:translateY(4px); box-shadow:0 1px 0 #0006; }
  .btn.azul { background:#4a7bd6; box-shadow:0 5px 0 #2b4f9e; }
  .btn.verde { background:#3fbb63; box-shadow:0 5px 0 #237a3c; }
  .btn.roxo { background:#9b59d6; box-shadow:0 5px 0 #5e2f8a; }
  .tag { font-size:clamp(16px,4vw,22px); color:#fff6d8; background:#153d1cbb; border:2px solid #7cff6a; border-radius:14px; padding:6px 18px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }

  /* HUD */
  #hud { position:absolute; top:0; left:0; right:0; padding:6px 8px; display:flex; flex-direction:column; gap:4px; z-index:5; color:#fff; }
  #hud .hudRow { display:flex; justify-content:center; align-items:center; gap:6px; flex-wrap:wrap; }
  #hud .pill { font-size:clamp(15px,4.2vw,22px); font-weight:bold; background:rgba(0,0,0,0.45); border-radius:14px; padding:5px 11px; text-shadow:0 2px 0 #000; border:2px solid rgba(255,255,255,0.25); white-space:nowrap; }
  #hud .pill.power { background:#6a2fb8cc; border-color:#d9a5ff; }
  #hud .pill.power.on { animation:pulse 1s infinite; }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.1)} }
  #hud .mini { font-family:inherit; font-size:clamp(16px,4.5vw,22px); padding:5px 11px; border:none; border-radius:12px; color:#fff; background:#4a7bd6; box-shadow:0 3px 0 #2b4f9e; cursor:pointer; }
  #hud .mini:active { transform:translateY(2px); box-shadow:none; }
  #hudRec { text-align:center; font-size:clamp(12px,3.4vw,16px); color:#ffe14a; text-shadow:0 1px 2px #000; }

  /* banner fim de fase */
  #banner { position:absolute; top:84px; left:50%; transform:translateX(-50%); z-index:6; background:rgba(10,30,15,0.85); border:3px solid #ffe14a; border-radius:18px; padding:10px 16px; color:#fff; font-size:clamp(17px,4.5vw,24px); display:flex; align-items:center; gap:12px; white-space:nowrap; box-shadow:0 6px 20px #0008; animation:drop .35s ease-out; }

  #banner .mini { font-family:inherit; font-size:20px; padding:4px 10px; border:none; border-radius:10px; color:#fff; background:#3fbb63; box-shadow:0 3px 0 #237a3c; cursor:pointer; }

  /* seleção de fases */
  #lvGroups { display:flex; flex-direction:column; gap:14px; width:min(96vw,520px); }
  .grp { border-radius:20px; padding:10px; border:3px solid #fff3; }
  .grp h3 { color:#fff; font-size:clamp(18px,4.5vw,24px); text-shadow:2px 2px 0 #0008; margin-bottom:8px; }
  .grpGrid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .lv { background:rgba(0,0,0,0.35); border:3px solid #fff5; border-radius:14px; padding:6px 4px; color:#fff; cursor:pointer; font-family:inherit; font-size:17px; display:flex; flex-direction:column; align-items:center; gap:3px; }
  .lv canvas { border-radius:8px; border:2px solid #0006; }
  .lv .st { font-size:clamp(13px,3.6vw,18px); color:#ffe14a; letter-spacing:-1px; }
  .lv .best { font-size:12px; color:#cfeec4; }
  .lv.lock { opacity:.45; }
  .lv:active { transform:scale(.96); }
</style>

</div>

var FW=600, FH=900, BALL_R=12, HOLE_R=19;
var FRICTION=0.52, MAX_SP=1150, SPEED_CAP=1500;   // atrito = fração da velocidade que sobra após 1s
var POWERS={ turbo:{icon:'🚀',nome:'Turbo'}, magnet:{icon:'🧲',nome:'Ímã'}, ghost:{icon:'👻',nome:'Fantasma'} };

// ---- SOM ----
var AC=null;
function ac(){ if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}} if(AC&&AC.state==='suspended')AC.resume(); return AC; }
function beep(f,d,t,v,slide,delay){ var c=ac(); if(!c)return; var st=c.currentTime+(delay||0); var o=c.createOscillator(),g=c.createGain(); o.type=t||'square'; o.frequency.setValueAtTime(f,st); if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),st+d); g.gain.setValueAtTime(v||0.1,st); g.gain.exponentialRampToValueAtTime(0.0001,st+d); o.connect(g); g.connect(c.destination); o.start(st); o.stop(st+d); }
var snd={
  hit:function(p){ beep(160+p*320,0.14,'triangle',0.14,70); beep(900,0.03,'square',0.04); },
  wall:function(){ beep(300,0.05,'square',0.05); },
  bumper:function(){ beep(520,0.08,'square',0.1,900); beep(1040,0.06,'square',0.05,0,0.05); },
  hole:function(){ [523,659,784,1046].forEach(function(f,i){ beep(f,0.14,'triangle',0.13,0,i*0.09); }); beep(1568,0.35,'triangle',0.1,0,0.36); },
  fanfare:function(){ [523,659,784,1046,784,1046,1318].forEach(function(f,i){ beep(f,0.16,'square',0.08,0,i*0.1); beep(f/2,0.16,'triangle',0.08,0,i*0.1); }); },

  lava:function(){ beep(90,0.45,'sawtooth',0.15,40); beep(400,0.2,'square',0.05,60,0.1); },

function $(id){ return document.getElementById(id); }
function show(id){ ['scrMenu','scrLevels','scrEnd','scrShop'].forEach(function(s){ $(s).classList.add('hidden'); }); if(id) $(id).classList.remove('hidden'); }
function totalStars(){ var t=0; for(var i=0;i<LEVELS.length;i++) t+=(stars[i]||0); return t; }
function levelOpen(i){ return i===0 || (stars[i-1]||0)>0; }
function refreshMenu(){ $('menuStars').textContent='⭐ '+totalStars()+' / '+(LEVELS.length*3); $('menuCoins').textContent='🪙 '+coins; }
function starStr(st){ return (st>=1?'⭐':'☆')+(st>=2?'⭐':'☆')+(st>=3?'⭐':'☆'); }

// ---- CANVAS ----
var cv=$('cv'), ctx=cv.getContext('2d'), W=0,H=0,DPR=1, S=1, offX=0, offY=0;
function resize(){ DPR=window.devicePixelRatio||1; W=window.innerWidth; H=window.innerHeight; cv.width=W*DPR; cv.height=H*DPR; cv.style.width=W+'px'; cv.style.height=H+'px'; ctx.setTransform(DPR,0,0,DPR,0,0);
  var top=82; S=Math.min((W-16)/FW,(H-top-12)/FH); offX=(W-FW*S)/2; offY=top+((H-top)-FH*S)/2; }
window.addEventListener('resize', resize); resize();

function rnd(a,b){ return a+Math.random()*(b-a); }
function inRect(px,py,r){ return px>=r.x && px<=r.x+r.w && py>=r.y && py<=r.y+r.h; }
function dist(ax,ay,bx,by){ return Math.hypot(ax-bx,ay-by); }
function speed(){ return Math.hypot(ball.vx,ball.vy); }

function placeBall(x,y){ ball.x=x; ball.y=y; ball.vx=0; ball.vy=0; ball.state='idle'; ball.timer=0; ball.scale=1; ball.portalCd=0; ball.ghost=false; ball.magnet=false; ball.turbo=false; trail=[]; }

function loadLevel(i){
  clearTimeout(finishTimer); $('banner').classList.add('hidden');
  lvIndex=i; L=LEVELS[i]; shots=0; t=0; lvToken++; particles=[]; floaters=[]; msg=null; aiming=false; lvCoins=0; power=null; powerGot=false; zoom=1; zoomTarget=1; shakeT=0;
  (L.coins||[]).forEach(function(c){ c.got=false; });
  (L.bumpers||[]).forEach(function(b){ b._p=0; });
  placeBall(L.start.x,L.start.y); lastShot={x:L.start.x,y:L.start.y};
  // decorações em cantos livres
  decos=[]; var tries=0;
  while(decos.length<6 && tries<80){ tries++; var mx=rnd(30,FW-30), my=rnd(30,FH-30); if(spotFree(mx,my,40) && dist(mx,my,L.hole.x,L.hole.y)>90 && dist(mx,my,L.start.x,L.start.y)>80) decos.push({x:mx,y:my,s:rnd(0.7,1.2),k:Math.floor(rnd(0,3))}); }
  playing=true; $('hud').classList.remove('hidden'); show(null); updateHud();
}
function spotFree(px,py,m){
  var r,i;
  var lists=[L.walls,L.water,L.lava,L.sand,L.fans,L.boosters,L.movers];
  for(var k=0;k<lists.length;k++){ var arr=lists[k]||[]; for(i=0;i<arr.length;i++){ r=arr[i]; var ex=(r.dx?Math.abs(r.dx):0), ey=(r.dy?Math.abs(r.dy):0); if(px>r.x-m-ex && px<r.x+r.w+m+ex && py>r.y-m-ey && py<r.y+r.h+m+ey) return false; } }
  var circ=[L.bumpers,L.volcanoes,L.cannons,L.coins,L.power?[L.power]:[]]; for(k=0;k<circ.length;k++){ var ca=circ[k]||[]; for(i=0;i<ca.length;i++){ if(dist(px,py,ca[i].x,ca[i].y)<(ca[i].r||30)+m) return false; } }
  var ps=L.portals||[]; for(i=0;i<ps.length;i++){ if(dist(px,py,ps[i].ax,ps[i].ay)<30+m || dist(px,py,ps[i].bx,ps[i].by)<30+m) return false; }
  return true;
}
function updateHud(){
  $('hudLv').textContent=themeOf(lvIndex).emoji+' '+(lvIndex+1);
  $('hudShots').textContent='🏏 '+shots+' / '+L.par;
  $('hudCoins').textContent='🪙 '+(coins+lvCoins);
  var hp=$('hudPower'); hp.textContent=power?POWERS[power].icon+' '+POWERS[power].nome:'✨ —'; hp.classList.toggle('on',!!power);
  $('hudRec').textContent=L.nome+' · 🏆 Recorde: '+(best[lvIndex]?best[lvIndex]+' tacada'+(best[lvIndex]>1?'s':''):'—');
}

// ---- FÍSICA ----
function moverRect(m,idx){ var p=moverPos[idx]||{x:m.x,y:m.y}; return {x:p.x,y:p.y,w:m.w,h:m.h}; }
function collideRect(r){
  var cx=Math.max(r.x,Math.min(ball.x,r.x+r.w)), cy=Math.max(r.y,Math.min(ball.y,r.y+r.h));
  var dx=ball.x-cx, dy=ball.y-cy, d=Math.hypot(dx,dy);
  if(d>=BALL_R) return false;
  var nx,ny;
  if(d<0.0001){ // centro dentro do retângulo: empurra pelo lado mais próximo
    var l=ball.x-r.x, rt=r.x+r.w-ball.x, tp=ball.y-r.y, bt=r.y+r.h-ball.y, mn=Math.min(l,rt,tp,bt);
    nx=(mn===l)?-1:(mn===rt)?1:0; ny=(mn===tp)?-1:(mn===bt)?1:0; d=0;
    if(nx!==0) ball.x=(nx<0?r.x:r.x+r.w)+nx*BALL_R; else ball.y=(ny<0?r.y:r.y+r.h)+ny*BALL_R;
  } else { nx=dx/d; ny=dy/d; ball.x=cx+nx*BALL_R; ball.y=cy+ny*BALL_R; }
  var vn=ball.vx*nx+ball.vy*ny;
  if(vn<0){ ball.vx-=(1+0.78)*vn*nx; ball.vy-=(1+0.78)*vn*ny; if(-vn>60){ snd.wall(); spawnParticles(ball.x,ball.y,4,'#fff',true); } if(-vn>500) shakeT=Math.max(shakeT,0.25); }
  return true;
}
function collideCircle(c,r,boost){
  var dx=ball.x-c.x, dy=ball.y-c.y, d=Math.hypot(dx,dy), min=r+BALL_R;
  if(d>=min||d===0) return false;
  var nx=dx/d, ny=dy/d; ball.x=c.x+nx*min; ball.y=c.y+ny*min;
  var vn=ball.vx*nx+ball.vy*ny;
  if(vn<0){ ball.vx-=2*vn*nx; ball.vy-=2*vn*ny; }
  if(boost){ var sp=Math.max(speed()*1.1,420); var a=Math.atan2(ball.vy,ball.vx); ball.vx=Math.cos(a)*sp; ball.vy=Math.sin(a)*sp; snd.bumper(); spawnParticles(ball.x,ball.y,10,'#ffe14a'); c._p=1; shakeT=Math.max(shakeT,0.3); }
  return true;
}
function randomLanding(){
  for(var k=0;k<80;k++){ var px=rnd(40,FW-40), py=rnd(40,FH-40); if(spotFree(px,py,20) && dist(px,py,L.hole.x,L.hole.y)>60) return {x:px,y:py}; }
  return {x:L.start.x,y:L.start.y};
}
function resetBall(toStart,penalty){
  if(penalty) shots++;
  var p=toStart?L.start:lastShot; placeBall(p.x,p.y); updateHud();
}
function hitsWall(px,py){ // usado pela prévia da tacada
  var i,ws=L.walls||[]; for(i=0;i<ws.length;i++){ var r=ws[i]; if(px>r.x-BALL_R&&px<r.x+r.w+BALL_R&&py>r.y-BALL_R&&py<r.y+r.h+BALL_R) return true; }
  var ms=L.movers||[]; for(i=0;i<ms.length;i++){ var m=moverRect(ms[i],i); if(px>m.x-BALL_R&&px<m.x+m.w+BALL_R&&py>m.y-BALL_R&&py<m.y+m.h+BALL_R) return true; }
  return false;
}

function step(dt){
  t+=dt;
  var i;
  moverPos=[]; (L.movers||[]).forEach(function(m,idx){ moverPos[idx]={x:m.x+(m.dx||0)*Math.sin(t*m.speed), y:m.y+(m.dy||0)*Math.sin(t*m.speed)}; });
  if(ball.portalCd>0) ball.portalCd-=dt;
  // lava borbulhando
  (L.lava||[]).forEach(function(r){ if(Math.random()<dt*5) particles.push({x:rnd(r.x+6,r.x+r.w-6),y:rnd(r.y+6,r.y+r.h-6),vx:rnd(-10,10),vy:rnd(-70,-30),life:rnd(0.5,1),c:Math.random()<0.5?'#ffd23a':'#ff8a2b',r:rnd(2,5),g:false}); });

  // estados especiais (animações que travam a bola)
  if(ball.state==='sink'){ ball.timer-=dt; ball.scale=Math.max(0,ball.scale-dt*2.5); return; }
  if(ball.state==='splash'){ ball.timer-=dt; ball.scale=Math.max(0,ball.scale-dt*2.5); if(ball.timer<=0) resetBall(ball.toStart,ball.penalty); return; }
  if(ball.state==='cannon'){ ball.timer-=dt; if(ball.timer<=0){ var c=ball.cannon; ball.state='moving'; ball.x=c.ex; ball.y=c.ey; ball.vx=c.vx; ball.vy=c.vy; ball.scale=1; snd.cannon(); spawnParticles(c.x,c.y,18,'#bbb',false,true); spawnParticles(c.ex,c.ey,14,'#ffb347'); shakeT=0.35; } return; }
  if(ball.state==='volcano'){ ball.timer-=dt; var ph=1-ball.timer/1.1; ball.scale=1+Math.sin(ph*Math.PI)*1.6;
    if(ph>0.5 && !ball.landed){ ball.landed=true; var lp=randomLanding(); ball.x=lp.x; ball.y=lp.y; }
    if(ball.timer<=0){ ball.state='idle'; ball.scale=1; ball.vx=0; ball.vy=0; ball.landed=false; spawnParticles(ball.x,ball.y,10,'#ff5a1f'); }
    return; }

  if(ball.state!=='moving') return;

  // rastro
  if(speed()>60){ trail.push({x:ball.x,y:ball.y,life:0.45}); if(trail.length>40) trail.shift(); }

  var steps=4, sdt=dt/steps;
  for(var s=0;s<steps;s++){
    // forças de área
    var onSand=false;
    (L.sand||[]).forEach(function(r){ if(inRect(ball.x,ball.y,r)) onSand=true; });
    (L.fans||[]).forEach(function(f){ if(inRect(ball.x,ball.y,f)){ ball.vx+=f.fx*sdt; ball.vy+=f.fy*sdt; } });
    (L.boosters||[]).forEach(function(b){ if(inRect(ball.x,ball.y,b)){ var ax=b.dir==='right'?1:b.dir==='left'?-1:0, ay=b.dir==='down'?1:b.dir==='up'?-1:0; ball.vx+=ax*2600*sdt; ball.vy+=ay*2600*sdt; if(!b._s){ b._s=true; snd.boost(); } } else b._s=false; });
    // ímã
    var dh=dist(ball.x,ball.y,L.hole.x,L.hole.y);
    if(ball.magnet && dh<260 && ball.magnetT>0){ ball.magnetT-=sdt; var mg=1400*sdt/Math.max(dh,1); ball.vx+=(L.hole.x-ball.x)*mg; ball.vy+=(L.hole.y-ball.y)*mg; if(Math.random()<sdt*30) particles.push({x:ball.x,y:ball.y,vx:rnd(-30,30),vy:rnd(-30,30),life:0.4,c:'#d9a5ff',r:3,g:false}); }
    // atrito
    var fr=onSand?0.006:FRICTION; var k=Math.pow(fr,sdt); ball.vx*=k; ball.vy*=k;
    var sp=speed(); if(sp>SPEED_CAP){ ball.vx*=SPEED_CAP/sp; ball.vy*=SPEED_CAP/sp; }
    ball.x+=ball.vx*sdt; ball.y+=ball.vy*sdt;
    // bordas
    if(ball.x<BALL_R){ ball.x=BALL_R; if(ball.vx<0){ ball.vx=-ball.vx*0.78; snd.wall(); } }
    if(ball.x>FW-BALL_R){ ball.x=FW-BALL_R; if(ball.vx>0){ ball.vx=-ball.vx*0.78; snd.wall(); } }
    if(ball.y<BALL_R){ ball.y=BALL_R; if(ball.vy<0){ ball.vy=-ball.vy*0.78; snd.wall(); } }
    if(ball.y>FH-BALL_R){ ball.y=FH-BALL_R; if(ball.vy>0){ ball.vy=-ball.vy*0.78; snd.wall(); } }
    // paredes e muros (fantasma atravessa)
    if(!ball.ghost){ (L.walls||[]).forEach(collideRect); (L.movers||[]).forEach(function(m,idx){ collideRect(moverRect(m,idx)); }); }
    (L.bumpers||[]).forEach(function(b){ collideCircle(b,b.r,true); });
    // moedas e poder
    (L.coins||[]).forEach(function(c){ if(!c.got && dist(ball.x,ball.y,c.x,c.y)<BALL_R+12){ c.got=true; lvCoins++; snd.coin(); spawnParticles(c.x,c.y,10,'#ffd23a'); floaters.push({x:c.x,y:c.y-20,text:'+1 🪙',life:0.9}); updateHud(); } });
    if(L.power && !powerGot && dist(ball.x,ball.y,L.power.x,L.power.y)<BALL_R+16){ powerGot=true; power=L.power.type; snd.power(); spawnParticles(L.power.x,L.power.y,16,'#d9a5ff'); floaters.push({x:L.power.x,y:L.power.y-24,text:POWERS[power].icon+' '+POWERS[power].nome+'!',life:1.3}); updateHud(); }
    // buraco
    dh=dist(ball.x,ball.y,L.hole.x,L.hole.y);
    if(dh<HOLE_R){ if(speed()<520 || dh<8){ sink(); return; } ball.vx+=(L.hole.x-ball.x)*30*sdt; ball.vy+=(L.hole.y-ball.y)*30*sdt; }
    // água / lava
    for(i=0;i<(L.water||[]).length;i++){ if(inRect(ball.x,ball.y,L.water[i])){ ball.state='splash'; ball.timer=0.6; ball.penalty=true; ball.toStart=false; snd.splash(); spawnParticles(ball.x,ball.y,16,'#6ec6ff'); flash('💧 Splash! +1 tacada'); return; } }
    for(i=0;i<(L.lava||[]).length;i++){ if(inRect(ball.x,ball.y,L.lava[i])){ ball.state='splash'; ball.timer=0.6; ball.penalty=false; ball.toStart=true; snd.lava(); spawnParticles(ball.x,ball.y,16,'#ff5a1f'); flash('🔥 Lava! Volta pro início'); shakeT=0.3; return; } }
    // canhão
    for(i=0;i<(L.cannons||[]).length;i++){ var c=L.cannons[i]; if(dist(ball.x,ball.y,c.x,c.y)<26){ ball.state='cannon'; ball.timer=0.6; ball.cannon=c; ball.scale=0; ball.x=c.x; ball.y=c.y; beep(200,0.3,'sine',0.08,60); flash('💣 Canhão!'); return; } }
    // portal A→B
    if(ball.portalCd<=0){ for(i=0;i<(L.portals||[]).length;i++){ var p=L.portals[i]; if(dist(ball.x,ball.y,p.ax,p.ay)<22){ spawnParticles(ball.x,ball.y,12,'#c77dff'); ball.x=p.bx; ball.y=p.by; ball.portalCd=1; trail=[]; snd.portal(); spawnParticles(ball.x,ball.y,12,'#7dffea'); flash('🌀 Teletransporte!'); break; } } }
    // vulcão
    for(i=0;i<(L.volcanoes||[]).length;i++){ var v=L.volcanoes[i]; if(dist(ball.x,ball.y,v.x,v.y)<v.r*0.5){ ball.state='volcano'; ball.timer=1.1; ball.landed=false; ball.vx=0; ball.vy=0; snd.volcano(); spawnParticles(ball.x,ball.y,20,'#ff5a1f'); flash('🌋 ERUPÇÃO!'); shakeT=0.5; return; } }
  }
  // parada rápida: abaixo de 30 px/s já para; entre 30 e 90 freia forte
  var spd=speed();
  if(spd<30){ ball.vx=0; ball.vy=0; ball.state='idle'; ball.ghost=false; ball.magnet=false; ball.turbo=false; }
  else if(spd<90){ var kk=Math.pow(0.02,dt); ball.vx*=kk; ball.vy*=kk; }
}

function sink(){
  ball.state='sink'; ball.timer=1.5; ball.x=L.hole.x; ball.y=L.hole.y; ball.vx=0; ball.vy=0; trail=[];
  zoomTarget=1.8; shakeT=0.15;
  var hio=(shots===1), diff=shots-L.par;
  var label=hio?'HOLE IN ONE!':diff<=-2?'🦅 EAGLE!':diff===-1?'🐦 BIRDIE!':diff===0?'⛳ PAR!':'⛳ BURACO!';
  msg={text:hio?'⭐ HOLE IN ONE! ⭐':label,t:0};
  if(hio){ snd.fanfare(); spawnParticles(L.hole.x,L.hole.y,120,null); confetti(); }
  else if(diff<0){ snd.fanfare(); spawnParticles(L.hole.x,L.hole.y,60,null); }
  else { snd.hole(); spawnParticles(L.hole.x,L.hole.y,30,null); }
  // resultado salvo na hora
  var st=starsFor(shots,L.par), prev=stars[lvIndex]||0, gained=lvCoins;
  if(st>prev){ gained+=(st-prev)*5; stars[lvIndex]=st; LS.set('stars',stars); }
  if(hio) gained+=10;
  var rec=!best[lvIndex]||shots<best[lvIndex]; if(rec){ best[lvIndex]=shots; LS.set('best',best); }
  coins+=gained; lvCoins=0; LS.set('coins',coins); updateHud();
  $('bannerTxt').textContent=starStr(st)+'  +'+gained+' 🪙'+(rec?'  🏆 Recorde!':'');
  $('banner').classList.remove('hidden');
  var tk=lvToken; finishTimer=setTimeout(function(){ if(playing && tk===lvToken) advance(); },1500);
}
function starsFor(sh,par){ return sh<=par-1?3:sh<=par?2:1; }
function advance(){
  clearTimeout(finishTimer); $('banner').classList.add('hidden');
  if(lvIndex<LEVELS.length-1) loadLevel(lvIndex+1); else showEnd();
}
function showEnd(){
  playing=false; $('hud').classList.add('hidden');
  $('endStars').textContent='⭐ '+totalStars()+' / '+(LEVELS.length*3);
  var tot=0; for(var i=0;i<LEVELS.length;i++) tot+=(best[i]||0);
  $('endStats').innerHTML='Você venceu as 12 fases! 🎉<br>Total de tacadas (recordes): <b>'+tot+'</b><br>🪙 '+coins+' moedas';
  show('scrEnd'); snd.fanfare();
}
function confetti(){ for(var i=0;i<90;i++){ particles.push({x:rnd(0,FW),y:rnd(-200,0),vx:rnd(-60,60),vy:rnd(100,300),life:rnd(1.2,2.2),c:'hsl('+Math.floor(rnd(0,360))+',90%,60%)',r:rnd(4,8),sq:true}); } }

// ---- PARTÍCULAS / MENSAGENS ----
function spawnParticles(x,y,n,color,tiny,smoke){
  for(var i=0;i<n;i++){ var a=rnd(0,Math.PI*2), sp=tiny?rnd(40,120):rnd(80,320); particles.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-(smoke?60:100),life:smoke?rnd(0.8,1.5):rnd(0.5,1.1),c:color||('hsl('+Math.floor(rnd(0,360))+',90%,60%)'),r:tiny?rnd(1.5,3):smoke?rnd(6,12):rnd(3,7),g:smoke?false:undefined}); }
}
function flash(text){ msg={text:text,t:0,small:true}; }

// ---- INPUT ----
function toField(cx,cy){ return {x:(cx-offX)/S, y:(cy-offY)/S}; }
function canAim(){ return playing && ball.state==='idle'; }
cv.addEventListener('pointerdown', function(e){ e.preventDefault(); ac();
  if(playing && ball.state==='sink'){ advance(); return; }
  if(!canAim()) return; var p=toField(e.clientX,e.clientY); if(dist(p.x,p.y,ball.x,ball.y)>150) return; aiming=true; anchorX=p.x; anchorY=p.y; aimX=p.x; aimY=p.y; });
cv.addEventListener('pointermove', function(e){ if(!aiming) return; e.preventDefault(); var p=toField(e.clientX,e.clientY); aimX=p.x; aimY=p.y; });
function aimVector(){ var dx=anchorX-aimX, dy=anchorY-aimY, d=Math.hypot(dx,dy); var pw=Math.min(d/200,1); return {dx:d?dx/d:0, dy:d?dy/d:0, pw:pw}; }
function shotSpeed(pw){ return pw*MAX_SP*(power==='turbo'?1.5:1); }
function release(){ if(!aiming) return; aiming=false; if(!canAim()) return; var a=aimVector(); if(a.pw<0.06) return;
  var sp=shotSpeed(a.pw); ball.vx=a.dx*sp; ball.vy=a.dy*sp; ball.state='moving'; shots++; lastShot={x:ball.x,y:ball.y};
  if(power==='turbo'){ ball.turbo=true; spawnParticles(ball.x,ball.y,16,'#ff8a2b'); flash('🚀 TURBO!'); }
  if(power==='magnet'){ ball.magnet=true; ball.magnetT=2; flash('🧲 Ímã ligado!'); }
  if(power==='ghost'){ ball.ghost=true; flash('👻 Atravessa paredes!'); }
  power=null; updateHud(); snd.hit(a.pw); }
cv.addEventListener('pointerup', function(e){ e.preventDefault(); release(); });
cv.addEventListener('pointercancel', function(){ aiming=false; });
cv.addEventListener('contextmenu', function(e){ e.preventDefault(); });
window.addEventListener('keydown', function(e){
  if(!playing) return;
  if(e.key==='r'||e.key==='R'){ loadLevel(lvIndex); }
  if(e.key===' '&&ball.state==='sink'){ e.preventDefault(); advance(); }
});

// ---- DESENHO ----
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function drawDeco(d,th){
  ctx.save(); ctx.translate(d.x,d.y); ctx.scale(d.s,d.s);
  if(th.sky==='day'){ // cogumelo
    ctx.fillStyle='rgba(0,0,0,0.18)'; ctx.beginPath(); ctx.ellipse(0,14,12,4,0,0,7); ctx.fill();
    ctx.fillStyle='#fff1d6'; rr(-7,-2,14,16,4); ctx.fill();
    ctx.fillStyle=d.k===1?'#e8433f':d.k===2?'#f0a020':'#c94ad9'; ctx.beginPath(); ctx.arc(0,-2,16,Math.PI,0); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(-6,-9,3,0,7); ctx.arc(5,-6,3.5,0,7); ctx.arc(1,-13,2.5,0,7); ctx.fill();
  } else if(th.sky==='ember'){ // pedra
    ctx.fillStyle='rgba(0,0,0,0.25)'; ctx.beginPath(); ctx.ellipse(2,10,16,5,0,0,7); ctx.fill();
    ctx.fillStyle='#5a5560'; ctx.beginPath(); ctx.moveTo(-16,8); ctx.lineTo(-10,-8); ctx.lineTo(2,-12); ctx.lineTo(14,-4); ctx.lineTo(16,8); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#8a8494'; ctx.beginPath(); ctx.moveTo(-10,-8); ctx.lineTo(2,-12); ctx.lineTo(6,-2); ctx.lineTo(-6,0); ctx.closePath(); ctx.fill();
    if(d.k===0){ ctx.fillStyle='#ff6a1f'; ctx.beginPath(); ctx.arc(8,4,2.5,0,7); ctx.fill(); }
  } else { // cristal
    ctx.fillStyle='rgba(0,0,0,0.25)'; ctx.beginPath(); ctx.ellipse(0,12,10,4,0,0,7); ctx.fill();
    var c=d.k===0?'#7dffea':d.k===1?'#d9a5ff':'#ffe14a';
    ctx.fillStyle=c; ctx.beginPath(); ctx.moveTo(0,-20); ctx.lineTo(9,-2); ctx.lineTo(5,12); ctx.lineTo(-5,12); ctx.lineTo(-9,-2); ctx.closePath(); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.7)'; ctx.beginPath(); ctx.moveTo(0,-20); ctx.lineTo(-9,-2); ctx.lineTo(-2,-2); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}
function drawBall(x,y,r,sk,time){
  var g=ctx.createRadialGradient(x-r*0.35,y-r*0.35,r*0.1,x,y,r);
  if(sk.rainbow){ var h=(time*120)%360; g.addColorStop(0,'#fff'); g.addColorStop(0.5,'hsl('+h+',95%,60%)'); g.addColorStop(1,'hsl('+((h+90)%360)+',95%,40%)'); }
  else { g.addColorStop(0,sk.c1); g.addColorStop(1,sk.c2); }
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.clip();
  if(sk.id==='galaxia'){ ctx.fillStyle='#fff'; for(var i=0;i<5;i++){ var a=time*2+i*1.3; ctx.beginPath(); ctx.arc(x+Math.cos(a)*r*0.55,y+Math.sin(a*1.3)*r*0.55,r*0.12,0,7); ctx.fill(); } }

function wall(r,c1,c2,hi){ ctx.fillStyle='rgba(0,0,0,0.3)'; rr(r.x+3,r.y+6,r.w,r.h,6); ctx.fill(); ctx.fillStyle=c2; rr(r.x,r.y+4,r.w,r.h,6); ctx.fill(); ctx.fillStyle=c1; rr(r.x,r.y,r.w,r.h,6); ctx.fill(); ctx.fillStyle=hi; rr(r.x+3,r.y+2,r.w-6,Math.max(3,r.h*0.3),3); ctx.fill();

function portal(x,y,c,label,tt){ ctx.save(); ctx.translate(x,y); ctx.rotate(tt*2.5); var g=ctx.createRadialGradient(0,0,3,0,0,24); g.addColorStop(0,'#fff'); g.addColorStop(0.5,c); g.addColorStop(1,'rgba(0,0,0,0.6)'); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,24,0,7); ctx.fill(); ctx.strokeStyle=c; ctx.lineWidth=3; ctx.setLineDash([10,6]); ctx.beginPath(); ctx.arc(0,0,29,0,7); ctx.stroke(); ctx.setLineDash([]); ctx.strokeStyle='rgba(255,255,255,0.7)'; ctx.lineWidth=2; for(var i=0;i<3;i++){ ctx.beginPath(); ctx.arc(0,0,8+i*5,i*2.1,i*2.1+2); ctx.stroke(); } ctx.restore(); ctx.fillStyle='#fff'; ctx.font='bold 16px sans-serif'; ctx.textAlign='center'; ctx.fillText(label,x,y+6); }

function trailColor(sk,time,a){ if(sk.rainbow) return 'hsla('+((time*120)%360)+',95%,60%,'+a+')'; var c=sk.c1; if(c.length===4) c='#'+c[1]+c[1]+c[2]+c[2]+c[3]+c[3]; var r=parseInt(c.substr(1,2),16),g=parseInt(c.substr(3,2),16),b=parseInt(c.substr(5,2),16); return 'rgba('+r+','+g+','+b+','+a+')'; }

function drawAim(){
  if(!(aiming && ball.state==='idle')) return; var a=aimVector(); if(a.pw<0.06) return;
  var col='hsl('+Math.round(120-a.pw*120)+',95%,55%)';
  // limite de força
  ctx.strokeStyle='rgba(255,255,255,0.25)'; ctx.lineWidth=2; ctx.setLineDash([6,8]); ctx.beginPath(); ctx.arc(anchorX,anchorY,200,0,7); ctx.stroke(); ctx.setLineDash([]);
  // prévia da trajetória (pontinhos que somem)
  var sp=shotSpeed(a.pw), vx=a.dx*sp, vy=a.dy*sp, px=ball.x, py=ball.y, sdt=0.045;
  for(var i=0;i<30;i++){ var k=Math.pow(FRICTION,sdt); vx*=k; vy*=k; px+=vx*sdt; py+=vy*sdt; if(px<BALL_R||px>FW-BALL_R||py<BALL_R||py>FH-BALL_R) break; if(!(power==='ghost') && hitsWall(px,py)) break; if(Math.hypot(vx,vy)<40) break; ctx.globalAlpha=(1-i/30)*0.9; ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(px,py,5-i*0.1,0,7); ctx.fill(); }
  ctx.globalAlpha=1;
  // seta de força (atrás da bola)
  var bx=ball.x-a.dx*a.pw*110, by=ball.y-a.dy*a.pw*110;
  ctx.strokeStyle='rgba(0,0,0,0.35)'; ctx.lineWidth=12; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(ball.x,ball.y); ctx.lineTo(bx,by); ctx.stroke();
  ctx.strokeStyle=col; ctx.lineWidth=8; ctx.beginPath(); ctx.moveTo(ball.x,ball.y); ctx.lineTo(bx,by); ctx.stroke(); ctx.lineCap='butt';
  ctx.fillStyle=col; ctx.beginPath(); ctx.arc(bx,by,9,0,7); ctx.fill(); ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke();
  ctx.fillStyle='#fff'; ctx.font='bold 20px sans-serif'; ctx.textAlign='center'; ctx.lineWidth=4; ctx.strokeStyle='rgba(0,0,0,0.6)'; var txt=Math.round(a.pw*100)+'%'+(power==='turbo'?' 🚀':''); ctx.strokeText(txt,bx,by-16); ctx.fillText(txt,bx,by-16);
}

function draw(){
  var th=themeOf(lvIndex);
  drawSky(th,t);
  if(!L) return;
  var sx=shakeT>0?rnd(-1,1)*shakeT*10:0, sy=shakeT>0?rnd(-1,1)*shakeT*10:0;
  ctx.save(); ctx.translate(offX+sx,offY+sy); ctx.scale(S,S);
  if(zoom>1.001){ ctx.translate(L.hole.x,L.hole.y); ctx.scale(zoom,zoom); ctx.translate(-L.hole.x,-L.hole.y); }
  drawCourse(L,th,t,moverPos,true);
  drawAim();
  // rastro
  var sk=curSkin(); trail.forEach(function(p,i){ ctx.fillStyle=trailColor(sk,t,p.life*1.2); ctx.beginPath(); ctx.arc(p.x,p.y,BALL_R*0.85*(i/trail.length),0,7); ctx.fill(); });
  // ímã ativo
  if(ball.state==='moving' && ball.magnet && ball.magnetT>0 && dist(ball.x,ball.y,L.hole.x,L.hole.y)<260){ ctx.setLineDash([4,6]); ctx.strokeStyle='rgba(217,165,255,0.8)'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(ball.x,ball.y); ctx.lineTo(L.hole.x,L.hole.y); ctx.stroke(); ctx.setLineDash([]); }
  // bola
  if(ball.scale>0){ ctx.fillStyle='rgba(0,0,0,0.28)'; ctx.beginPath(); ctx.ellipse(ball.x+3,ball.y+5+ball.scale*3,BALL_R*ball.scale,BALL_R*ball.scale*0.7,0,0,7); ctx.fill();
    if(ball.ghost) ctx.globalAlpha=0.55; drawBall(ball.x,ball.y-(ball.scale-1)*30,BALL_R*ball.scale,sk,t); ctx.globalAlpha=1;
    if(ball.ghost||ball.turbo){ ctx.font='16px sans-serif'; ctx.textAlign='center'; ctx.fillText(ball.ghost?'👻':'🚀',ball.x,ball.y-18); } }
  // partículas
  particles.forEach(function(p){ ctx.globalAlpha=Math.max(0,Math.min(1,p.life)); ctx.fillStyle=p.c; if(p.sq){ ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.life*5); ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*0.6); ctx.restore(); } else { ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill(); } }); ctx.globalAlpha=1;
  // textos flutuantes
  floaters.forEach(function(f){ ctx.globalAlpha=Math.max(0,Math.min(1,f.life*1.5)); ctx.font='bold 22px sans-serif'; ctx.textAlign='center'; ctx.lineWidth=5; ctx.strokeStyle='rgba(0,0,0,0.6)'; ctx.strokeText(f.text,f.x,f.y); ctx.fillStyle='#ffe14a'; ctx.fillText(f.text,f.x,f.y); }); ctx.globalAlpha=1;
  // mensagem
  if(msg){ var k=Math.min(1,msg.t*4), sc=msg.small?1:0.6+k*0.5+Math.sin(msg.t*6)*0.03; ctx.save(); ctx.translate(FW/2,FH*0.42); ctx.scale(sc,sc); ctx.globalAlpha=msg.small?Math.max(0,1-msg.t/1.6):1; ctx.font='bold '+(msg.small?30:54)+'px sans-serif'; ctx.textAlign='center'; ctx.lineWidth=9; ctx.strokeStyle='#1a1a2e'; ctx.strokeText(msg.text,0,0); ctx.fillStyle=msg.small?'#fff':'#ffe14a'; ctx.fillText(msg.text,0,0); ctx.restore(); }
  // dica na 1ª fase
  if(lvIndex===0 && shots===0 && ball.state==='idle' && !aiming){ ctx.fillStyle='rgba(0,0,0,0.5)'; rr(60,FH-190,FW-120,60,14); ctx.fill(); ctx.fillStyle='#fff'; ctx.font='22px sans-serif'; ctx.textAlign='center'; ctx.fillText('👆 Arraste a partir da bola e solte!',FW/2,FH-152); }
  ctx.restore();
}

// ---- LOOP ----
var last=performance.now();
function loop(now){
  var dt=Math.min(0.05,(now-last)/1000); last=now;
  if(playing){ step(dt); } else t+=dt;
  particles.forEach(function(p){ p.x+=p.vx*dt; p.y+=p.vy*dt; if(p.g!==false) p.vy+=300*dt; p.life-=dt; }); particles=particles.filter(function(p){ return p.life>0; });
  floaters.forEach(function(f){ f.y-=40*dt; f.life-=dt; }); floaters=floaters.filter(function(f){ return f.life>0; });
  trail.forEach(function(p){ p.life-=dt; }); trail=trail.filter(function(p){ return p.life>0; });
  if(L) (L.bumpers||[]).forEach(function(b){ if(b._p>0) b._p=Math.max(0,b._p-dt*4); });
  if(shakeT>0) shakeT=Math.max(0,shakeT-dt);
  zoom+=(zoomTarget-zoom)*Math.min(1,dt*6);
  if(msg){ msg.t+=dt; if(msg.small && msg.t>1.6) msg=null; }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function thumb(lv,i){
  var tw=64, th=96, c=document.createElement('canvas'); c.width=tw*2; c.height=th*2; c.style.width=tw+'px'; c.style.height=th+'px';
  var g=c.getContext('2d'); g.scale(tw*2/FW,th*2/FH);
  var saved=ctx; ctx=g; try{ drawCourse(lv,themeOf(i),0,[],false); } finally { ctx=saved; }
  return c;
}
function renderLevels(){
  var box=$('lvGroups'); box.innerHTML='';
  THEMES.forEach(function(th,gi){
    var grp=document.createElement('div'); grp.className='grp'; grp.style.background=th.css;
    var h=document.createElement('h3'); h.textContent=th.emoji+' '+th.nome; grp.appendChild(h);
    var grid=document.createElement('div'); grid.className='grpGrid';
    for(var i=gi*4;i<gi*4+4 && i<LEVELS.length;i++){ (function(i){
      var lv=LEVELS[i], b=document.createElement('button'); b.className='lv'+(levelOpen(i)?'':' lock');
      b.appendChild(thumb(lv,i));
      var n=document.createElement('div'); n.textContent=(levelOpen(i)?(i+1):'🔒')+' · par '+lv.par; n.style.fontSize='13px'; b.appendChild(n);
      var st=document.createElement('div'); st.className='st'; st.textContent=starStr(stars[i]||0); b.appendChild(st);
      var be=document.createElement('div'); be.className='best'; be.textContent=best[i]?'🏆 '+best[i]:'—'; b.appendChild(be);
      b.title=lv.nome;
      b.onclick=function(){ if(!levelOpen(i)){ snd.no(); return; } loadLevel(i); };
      grid.appendChild(b);
    })(i); }
    grp.appendChild(grid); box.appendChild(grp);
  });
}
function nextUnfinished(){ for(var i=0;i<LEVELS.length;i++){ if(!(stars[i]||0)) return i; } return 0; }

var shopFrom='scrMenu';
function shopMsg(m){ var el=$('shopMsg'); el.textContent=m; el.style.opacity=1; clearTimeout(shopMsg._t); shopMsg._t=setTimeout(function(){ el.style.opacity=0; },1500); }
function renderShop(){
  $('shopCoins').textContent='🪙 '+coins;
  var box=$('shopList'); box.innerHTML='';
  SKINS.forEach(function(sk){
    var owned=unlocked.indexOf(sk.id)>=0;
    var card=document.createElement('div');
    card.style.cssText='background:#153d1c;border:3px solid '+(sk.id===selSkin?'#ffe14a':(owned?'#4a7bd6':'#3a5a3a'))+';border-radius:16px;padding:8px;width:112px;display:flex;flex-direction:column;align-items:center;gap:5px';
    var pc=document.createElement('canvas'); pc.width=160; pc.height=160; pc.style.width='80px'; pc.style.height='80px';
    var g=pc.getContext('2d'); g.scale(2,2); var saved=ctx; ctx=g; try{ drawBall(40,40,30,sk,1); } finally { ctx=saved; }
    card.appendChild(pc);
    var nm=document.createElement('div'); nm.textContent=sk.nome; nm.style.cssText='color:#fff;font-size:14px'; card.appendChild(nm);
    var b=document.createElement('button'); b.className='btn'; b.style.cssText='font-size:14px;padding:7px 12px;box-shadow:0 3px 0 #0006';
    if(sk.id===selSkin){ b.textContent='✅ USANDO'; b.style.background='#3fbb63'; }
    else if(owned){ b.textContent='USAR'; b.style.background='#4a7bd6'; }
    else { b.textContent='🪙 '+sk.preco; b.style.background=coins>=sk.preco?'#e0a52a':'#666'; }
    b.onclick=function(){
      if(owned){ selSkin=sk.id; LS.set('skin',selSkin); snd.buy(); renderShop(); }
      else if(coins>=sk.preco){ coins-=sk.preco; LS.set('coins',coins); unlocked.push(sk.id); LS.set('unlocked',unlocked); selSkin=sk.id; LS.set('skin',selSkin); snd.buy(); shopMsg('Comprou '+sk.nome+'! 🎉'); renderShop(); }
      else { snd.no(); shopMsg('Faltam '+(sk.preco-coins)+' moedas 😅'); }
    };
    card.appendChild(b); box.appendChild(card);
  });
}
