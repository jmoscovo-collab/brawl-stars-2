<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teste de Controle — Cogumelo Games</title>
<style>
body { background:#101028; color:#fff; font-family:Arial,sans-serif; text-align:center; padding:20px; }
h1 { font-size:34px; margin-bottom:6px; }
#status { font-size:60px; margin:12px 0; }
#nome { font-size:16px; color:#8ff; min-height:22px; }
#botoes { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin:18px auto; max-width:600px; }
.b { width:64px; height:64px; border-radius:14px; background:#2a2a4a; display:flex; flex-direction:column; align-items:center; justify-content:center; font-weight:bold; font-size:18px; }
.b small { font-size:10px; color:#889; }
.b.on { background:#22cc66; color:#fff; box-shadow:0 0 16px #22cc66; }
#eixos { font-size:26px; font-weight:bold; margin-top:8px; }
#tecla { font-size:22px; color:#ffd700; min-height:30px; margin-top:14px; }
a { color:#8ff; }
</style>
</head>
<body>
<h1>🎮 Teste de Controle</h1>
<div id="status">❌</div>
<div id="nome">Nenhum controle detectado... aperte um botão do controle!</div>
<div id="eixos">🕹️ 0.0 , 0.0</div>
<div id="botoes"></div>
<div id="tecla"></div>
<a href="/">← Voltar</a>
<script>
var NOMES = ['❌','⭕','⬜','🔺','L1','R1','L2','R2','SH','OP','L3','R3','⬆️','⬇️','⬅️','➡️','PS','TP'];
var bx = document.getElementById('botoes');
for(var i=0;i<18;i++){
    var d = document.createElement('div');
    d.className = 'b'; d.id = 'b'+i;
    d.innerHTML = NOMES[i] + '<small>'+i+'</small>';
    bx.appendChild(d);
}
addEventListener('keydown', function(e){
    document.getElementById('tecla').textContent = '⌨️ tecla: ' + e.key + ' (' + e.code + ')';
});
function loop(){
    var pads = navigator.getGamepads ? navigator.getGamepads() : [];
    var p = null;
    for(var i=0;i<pads.length;i++) if(pads[i] && pads[i].connected){ p = pads[i]; break; }
    if(p){
        document.getElementById('status').textContent = '✅🎮';
        document.getElementById('nome').textContent = p.id;
        document.getElementById('eixos').textContent = '🕹️ ' + (p.axes[0]||0).toFixed(1) + ' , ' + (p.axes[1]||0).toFixed(1);
        for(var i=0;i<18;i++){
            var el = document.getElementById('b'+i);
            if(el) el.className = 'b' + (p.buttons[i] && p.buttons[i].pressed ? ' on' : '');
        }
    } else {
        document.getElementById('status').textContent = '❌';
    }
    requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
