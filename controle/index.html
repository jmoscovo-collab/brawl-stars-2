<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Espião do PS5 — Cogumelo Games</title>
<style>
body { background:#0a1230; color:#fff; font-family:Arial,sans-serif; padding:16px; font-size:20px; }
h1 { font-size:26px; color:#7fd4ff; margin-bottom:12px; }
.linha { background:rgba(255,255,255,0.08); border-radius:12px; padding:12px 16px; margin:8px 0; }
.ok { color:#4dff88; font-weight:bold; }
.ruim { color:#ff6666; font-weight:bold; }
b { color:#ffd700; }
</style>
</head>
<body>
<h1>🕵️ Espião do PS5</h1>
<div class="linha">1️⃣ Aparelho: <b id="ua">...</b></div>
<div class="linha">2️⃣ É PlayStation? <span id="ps">...</span></div>
<div class="linha">3️⃣ Modo PS5 ligado (cg_ps5)? <span id="flag">...</span></div>
<div class="linha">4️⃣ Cursor mexendo? <span id="cursor">mexe o analógico...</span></div>
<div class="linha">5️⃣ Clique (❌)? <span id="clique">aperta o ❌...</span></div>
<div class="linha">6️⃣ Controle direto (gamepad)? <span id="gp">...</span></div>
<div class="linha">7️⃣ Versão desta página: <b>E2</b></div>
<script>
document.getElementById('ua').textContent = navigator.userAgent;
var ehPs = /PlayStation/i.test(navigator.userAgent);
document.getElementById('ps').innerHTML = ehPs ? '<span class="ok">SIM ✅</span>' : '<span class="ruim">NÃO ❌</span>';
try { if (ehPs) localStorage.setItem('cg_ps5','1'); } catch(e){}
var flag = '?';
try { flag = localStorage.getItem('cg_ps5'); } catch(e){}
document.getElementById('flag').innerHTML = flag === '1' ? '<span class="ok">SIM ✅</span>' : '<span class="ruim">NÃO ❌ (' + flag + ')</span>';
var nMove = 0;
addEventListener('pointermove', function(e){
    nMove++;
    document.getElementById('cursor').innerHTML = '<span class="ok">SIM ✅</span> x=' + Math.round(e.clientX) + ' y=' + Math.round(e.clientY) + ' (' + nMove + ' vezes)';
});
addEventListener('mousemove', function(e){
    if(nMove === 0) document.getElementById('cursor').innerHTML = '<span class="ok">SÓ MOUSEMOVE ✅</span> x=' + Math.round(e.clientX);
});
addEventListener('pointerdown', function(){ document.getElementById('clique').innerHTML = '<span class="ok">SIM ✅ (pointerdown)</span>'; });
addEventListener('mousedown', function(){ if(document.getElementById('clique').textContent.indexOf('SIM')<0) document.getElementById('clique').innerHTML = '<span class="ok">SIM ✅ (mousedown)</span>'; });
(function gp(){
    var pads = navigator.getGamepads ? navigator.getGamepads() : [];
    var p = null;
    for(var i=0;i<pads.length;i++) if(pads[i] && pads[i].connected) p = pads[i];
    document.getElementById('gp').innerHTML = p ? '<span class="ok">SIM ✅</span> ' + p.id + ' 🕹️' + (p.axes[0]||0).toFixed(1) : '<span class="ruim">NÃO ❌</span>';
    requestAnimationFrame(gp);
})();
</script>
</body>
</html>
