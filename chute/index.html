<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// =====================================================================
//  SUPER CHUTE 3D — chute longe, compre melhorias, atravesse biomas
// =====================================================================
var $ = function (id) { return document.getElementById(id); };
var celular = /Android|iPhone|iPad|Mobile/i.test(navigator.userAgent);

// ---------------- SAVE ----------------
var save = { moedas: 0, rec: 0, lv: { forca: 0, quique: 0, rola: 0, grana: 0, rampa: 0 }, biomas: 0, chutes: 0 };
try { var sv = JSON.parse(localStorage.getItem('superchute_save')); if (sv) { save.moedas = sv.moedas || 0; save.rec = sv.rec || 0; save.biomas = sv.biomas || 0; save.chutes = sv.chutes || 0; for (var k in save.lv) save.lv[k] = (sv.lv && sv.lv[k]) || 0; } } catch (e) {}
function grava() { try { localStorage.setItem('superchute_save', JSON.stringify(save)); } catch (e) {} }

// ---------------- MELHORIAS ----------------
var UPS = [
  { id: 'forca', ic: '🦵', nome: 'Força do Chute', desc: function (l) { return 'Velocidade do chute: ' + Math.round(vel(l)) + ' → ' + Math.round(vel(l + 1)) + ' m/s'; }, custo: function (l) { return Math.round(15 * Math.pow(1.42, l)); } },
  { id: 'quique', ic: '🏀', nome: 'Bola Saltitante', max: 30, desc: function (l) { return 'A bola quica mais: ' + Math.round(quique(l) * 100) + '% → ' + Math.round(quique(l + 1) * 100) + '%'; }, custo: function (l) { return Math.round(40 * Math.pow(1.6, l)); } },
  { id: 'rola', ic: '🛼', nome: 'Bola Lisa', max: 30, desc: function (l) { return 'Rola mais longe no chão (atrito ' + atrito(l).toFixed(2) + ' → ' + atrito(l + 1).toFixed(2) + ')'; }, custo: function (l) { return Math.round(30 * Math.pow(1.55, l)); } },
  { id: 'grana', ic: '💰', nome: 'Patrocínio', desc: function (l) { return 'Ganha ' + mult(l).toFixed(2) + 'x → ' + mult(l + 1).toFixed(2) + 'x moedas por metro'; }, custo: function (l) { return Math.round(100 * Math.pow(1.7, l)); } },
  { id: 'rampa', ic: '🚀', nome: 'Rampas Turbo', max: 20, desc: function (l) { return l ? 'A bola usa até ' + l + ' → ' + (l + 1) + ' rampas por chute' : 'Aparecem rampas no caminho que jogam a bola pro alto!'; }, custo: function (l) { return Math.round(250 * Math.pow(1.9, l)); } }
];
function vel(l) { return 14 * Math.pow(1.13, l); }
function quique(l) { return 0.3 + 0.5 * (1 - Math.pow(0.9, l)); }
function atrito(l) { return Math.max(0.03, 0.6 * Math.pow(0.88, l)); }
function mult(l) { return 1 + 0.25 * l; }
function fmt(n) {
  n = Math.floor(n);
  if (n >= 1e9) return (n / 1e9).toFixed(2).replace('.', ',') + ' bi';
  if (n >= 1e6) return (n / 1e6).toFixed(2).replace('.', ',') + ' mi';
  return n.toLocaleString('pt-BR');
}

// ---------------- BIOMAS (muda a cada 3000 m) ----------------
var TAM = 3000;
var BIOMAS = [
  { n: 'Campo', e: '🌱', c1: '#6cc04a', c2: '#62b442', ceu: 0x8fd3ff, prop: 'arvore', part: null, g: 1 },
  { n: 'Floresta', e: '🌲', c1: '#3f8f3a', c2: '#388434', ceu: 0x86c4a4, prop: 'pinheiro', part: 'folha', g: 1 },
  { n: 'Deserto', e: '🏜️', c1: '#e8c27a', c2: '#e0b86e', ceu: 0xffd29a, prop: 'cacto', part: null, g: 1 },
  { n: 'Neve', e: '❄️', c1: '#f4f8fc', c2: '#e4eef6', ceu: 0xb8d2ea, prop: 'pinheiroNeve', part: 'neve', g: 1 },
  { n: 'Praia', e: '🏖️', c1: '#f3dfa6', c2: '#ecd597', ceu: 0x6fd0ff, prop: 'coqueiro', part: null, g: 1 },
  { n: 'Vulcão', e: '🌋', c1: '#3a2a26', c2: '#30231f', ceu: 0x5a1e10, prop: 'pedraLava', part: 'brasa', g: 1 },
  { n: 'Terra dos Doces', e: '🍭', c1: '#ffb3d9', c2: '#ffa6d1', ceu: 0xffd0ee, prop: 'pirulito', part: null, g: 1 },
  { n: 'Lua', e: '🌕', c1: '#a0a0a8', c2: '#96969e', ceu: 0x070818, prop: 'cratera', part: 'estrela', g: 0.5 },
  { n: 'Cristais', e: '💎', c1: '#5a3a8a', c2: '#52347e', ceu: 0x2a1a4a, prop: 'cristal', part: 'brilho', g: 1 }
];
function bIdx(d) { return Math.floor(Math.max(0, d) / TAM); }
function bDe(d) { return BIOMAS[bIdx(d) % BIOMAS.length]; }
function nomeB(i) { var b = BIOMAS[i % BIOMAS.length], v = Math.floor(i / BIOMAS.length); return b.e + ' ' + b.n + (v ? ' ' + (v + 1) : ''); }
function hash(a, b) { var x = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return x - Math.floor(x); }

// ---------------- SOM ----------------
var AC = null;
function audio() { try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch (e) {} }
function tom(f, d, tipo, vol, f2) {
  if (!AC) return;
  try { var o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime; o.type = tipo || 'sine'; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(vol || .15, t); g.gain.exponentialRampToValueAtTime(.0008, t + d); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + .02); } catch (e) {}
}
var som = {
  chute: function (p) { tom(160, .18, 'sine', .4, 50); tom(900 * p, .06, 'square', .05); },
  quica: function () { tom(220, .1, 'sine', .15, 90); },
  rampa: function () { tom(300, .35, 'sawtooth', .08, 1200); },
  bioma: function () { [523, 659, 784, 1046, 1318].forEach(function (f, i) { setTimeout(function () { tom(f, .2, 'triangle', .12); }, i * 90); }); },
  moeda: function () { tom(1200, .08, 'square', .05); setTimeout(function () { tom(1600, .12, 'square', .05); }, 80); },
  compra: function () { tom(700, .08, 'triangle', .12); setTimeout(function () { tom(1050, .14, 'triangle', .12); }, 70); }
};

// ---------------- THREE ----------------
var cv = $('c3d');
var ren = new THREE.WebGLRenderer({ canvas: cv, antialias: !celular });
ren.setPixelRatio(Math.min(1.5, window.devicePixelRatio || 1));
var cena = new THREE.Scene();
var cam = new THREE.PerspectiveCamera(60, 1, 0.1, 3000);
cena.background = new THREE.Color(0x8fd3ff);
cena.fog = new THREE.Fog(0x8fd3ff, 60, 320);
var hemi = new THREE.HemisphereLight(0xffffff, 0x557744, 0.75); cena.add(hemi);
var sol = new THREE.DirectionalLight(0xffffff, 0.75); sol.position.set(30, 60, 20); cena.add(sol);
function redim() { var w = window.innerWidth, h = window.innerHeight; ren.setSize(w, h, false); cam.aspect = w / h; cam.fov = w < h ? 72 : 60; cam.updateProjectionMatrix(); }
window.addEventListener('resize', redim); redim();

// estado (o loop começa ANTES de montar o mundo)
var estado = 'carregando', D = 0.75, bY = 0.35, vZ = 0, vY = 0, rampasUsadas = 0, tChute = 0, potencia = 1, agulha = 0, agDir = 1;
var hudT = 0, ultimo = 0, acum = 0, giro = 0, biomaAtual = 0, maxD = 0, bannerT = null;
var corCeu = new THREE.Color(0x8fd3ff), corAlvo = new THREE.Color(0x8fd3ff);
var BOLA_R = 0.35;

// ---------------- TEXTURAS ----------------
function texChao(b) {
  var c = document.createElement('canvas'); c.width = 128; c.height = 128; var g = c.getContext('2d');
  g.fillStyle = b.c1; g.fillRect(0, 0, 128, 64); g.fillStyle = b.c2; g.fillRect(0, 64, 128, 64);
  for (var i = 0; i < 120; i++) { g.fillStyle = 'rgba(0,0,0,' + (0.03 + Math.random() * 0.05) + ')'; g.fillRect(Math.random() * 128, Math.random() * 128, 2 + Math.random() * 3, 2 + Math.random() * 3); }
  if (b.prop === 'pedraLava') { g.strokeStyle = '#ff6a1a'; g.lineWidth = 2; for (var j = 0; j < 6; j++) { g.beginPath(); var x = Math.random() * 128, y = Math.random() * 128; g.moveTo(x, y); for (var s = 0; s < 4; s++) { x += (Math.random() - .5) * 30; y += (Math.random() - .5) * 30; g.lineTo(x, y); } g.stroke(); } }
  if (b.prop === 'cratera') { for (var k = 0; k < 8; k++) { g.fillStyle = 'rgba(60,60,70,.35)'; g.beginPath(); g.arc(Math.random() * 128, Math.random() * 128, 3 + Math.random() * 8, 0, 7); g.fill(); } }
  if (b.prop === 'cristal') { for (var m = 0; m < 25; m++) { g.fillStyle = 'rgba(180,140,255,.5)'; g.fillRect(Math.random() * 128, Math.random() * 128, 2, 2); } }
  if (b.prop === 'pirulito') { for (var p = 0; p < 30; p++) { g.fillStyle = ['#fff', '#7fd4ff', '#ffe066', '#b5ff9a'][p % 4]; g.fillRect(Math.random() * 128, Math.random() * 128, 3, 1.5); } }
  var t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(14, 1); return t;
}
var MAT_CHAO = BIOMAS.map(function (b) { return new THREE.MeshLambertMaterial({ map: texChao(b) }); });

// ---------------- PROPS (árvores, cactos...) ----------------
function mL(c, em) { return new THREE.MeshLambertMaterial({ color: c, emissive: em || 0x000000, flatShading: true }); }
var G = {
  tronco: new THREE.CylinderGeometry(0.25, 0.35, 2, 6), copa: new THREE.IcosahedronGeometry(1.6, 0), cone: new THREE.ConeGeometry(1.5, 3, 7),
  cacto: new THREE.CylinderGeometry(0.4, 0.45, 3, 7), braco: new THREE.CylinderGeometry(0.25, 0.25, 1.2, 6), pedra: new THREE.DodecahedronGeometry(1.2, 0),
  palito: new THREE.CylinderGeometry(0.1, 0.1, 3, 6), disco: new THREE.CylinderGeometry(1.1, 1.1, 0.3, 14), anel: new THREE.TorusGeometry(1.8, 0.45, 5, 12),
  cristal: new THREE.OctahedronGeometry(1, 0), folha: new THREE.ConeGeometry(0.5, 2.4, 4), nuvem: new THREE.IcosahedronGeometry(3, 0)
};
var M = {
  tronco: mL(0x8a5a32), verde: mL(0x4caf50), escuro: mL(0x2e6b34), neve: mL(0xffffff), cacto: mL(0x4f9a3c), pedra: mL(0x8a7a6a),
  lava: mL(0x2a1a18), brasa: mL(0xff5a1a, 0xff3a00), branco: mL(0xffffff), lua: mL(0x8c8c95), cr1: mL(0x9a6aff, 0x3a1a8a), cr2: mL(0x5ae0ff, 0x10507a),
  palmeira: mL(0x3fae4a), nuvem: new THREE.MeshLambertMaterial({ color: 0xffffff, flatShading: true, transparent: true, opacity: 0.9 })
};
var DOCES = [mL(0xff4a8a), mL(0x7a5aff), mL(0xffb02a), mL(0x2ac0ff)];
function mesh(g, m, x, y, z, s) { var o = new THREE.Mesh(g, m); o.position.set(x || 0, y || 0, z || 0); if (s) o.scale.set(s[0], s[1], s[2]); return o; }
function criaProp(tipo) {
  var g = new THREE.Group();
  if (tipo === 'arvore') { g.add(mesh(G.tronco, M.tronco, 0, 1, 0)); g.add(mesh(G.copa, M.verde, 0, 3, 0)); }
  else if (tipo === 'pinheiro' || tipo === 'pinheiroNeve') {
    g.add(mesh(G.tronco, M.tronco, 0, 1, 0, [1, 0.8, 1]));
    g.add(mesh(G.cone, tipo === 'pinheiro' ? M.escuro : M.escuro, 0, 2.6, 0, [1.1, 1, 1.1])); g.add(mesh(G.cone, tipo === 'pinheiro' ? M.escuro : M.neve, 0, 4, 0, [0.8, 0.8, 0.8]));
  }
  else if (tipo === 'cacto') { g.add(mesh(G.cacto, M.cacto, 0, 1.5, 0)); var b1 = mesh(G.braco, M.cacto, 0.6, 1.8, 0); b1.rotation.z = -0.9; g.add(b1); var b2 = mesh(G.braco, M.cacto, -0.55, 2.2, 0); b2.rotation.z = 0.9; g.add(b2); }
  else if (tipo === 'coqueiro') { var t = mesh(G.tronco, M.tronco, 0.3, 2, 0, [0.7, 2, 0.7]); t.rotation.z = -0.15; g.add(t);
    for (var i = 0; i < 6; i++) { var f = mesh(G.folha, M.palmeira, 0.9, 4.1, 0); f.rotation.set(0, i * Math.PI / 3, 1.9); var p = new THREE.Group(); p.add(f); p.position.set(0, 0, 0); p.rotation.y = i * Math.PI / 3; f.position.set(1, 4, 0); g.add(p); } }
  else if (tipo === 'pedraLava') { g.add(mesh(G.pedra, M.lava, 0, 0.8, 0, [1.3, 1, 1.2])); g.add(mesh(G.pedra, M.brasa, 0.4, 1.4, 0.3, [0.35, 0.35, 0.35])); }
  else if (tipo === 'pirulito') { g.add(mesh(G.palito, M.branco, 0, 1.5, 0)); var d = mesh(G.disco, DOCES[Math.floor(Math.random() * 4)], 0, 3.3, 0); d.rotation.x = Math.PI / 2; g.add(d); }
  else if (tipo === 'cratera') { var a = mesh(G.anel, M.lua, 0, 0.1, 0, [1, 1, 0.5]); a.rotation.x = Math.PI / 2; g.add(a); g.add(mesh(G.pedra, M.lua, 2.5, 0.4, 1, [0.5, 0.4, 0.5])); }
  else if (tipo === 'cristal') { g.add(mesh(G.cristal, M.cr1, 0, 1.8, 0, [0.7, 2, 0.7])); g.add(mesh(G.cristal, M.cr2, 0.9, 1, 0.3, [0.4, 1.1, 0.4])); }
  else if (tipo === 'nuvem') { g.add(mesh(G.nuvem, M.nuvem, 0, 0, 0, [1.4, 0.6, 1])); g.add(mesh(G.nuvem, M.nuvem, 2.5, 0.3, 0.5, [1, 0.5, 0.9])); g.add(mesh(G.nuvem, M.nuvem, -2.4, 0.1, -0.3, [0.9, 0.45, 0.8])); }
  cena.add(g); return g;
}
var POOL = {}, ATIVOS = {};      // ATIVOS: chave -> {o, z}
function pega(tipo) { var p = POOL[tipo] || (POOL[tipo] = []); var o = p.pop() || criaProp(tipo); o.visible = true; o.userData.tipo = tipo; return o; }
function devolve(o) { o.visible = false; (POOL[o.userData.tipo] || (POOL[o.userData.tipo] = [])).push(o); }

// ---------------- CHÃO (pedaços de 25 m) ----------------
var TILE = 25, TILES = {}, poolTile = [];
var geoTile = new THREE.PlaneGeometry(400, TILE);

    $('fS').innerHTML = '💰 +' + fmt(ganho) + ' moedas<br>' + nomeB(bIdx(D)) + (potencia > 1 ? '<br>⚡ Chute perfeito!' : '') +
      (proximaMelhoria() ? '<br><b style="color:#2fbf5a">Dá pra comprar melhoria! 🛒</b>' : '');
    $('pFim').classList.add('on'); hud(true);
  }, 700);
}
function volta() {
  $('pFim').classList.remove('on');
  D = 0.75; bY = BOLA_R; vZ = vY = 0; biomaAtual = 0; estado = 'pronto'; giro = 0; rastroHist = [];
  $('baixo').style.visibility = 'visible'; $('dist').style.display = 'none';
  pernaD.rotation.x = 0; bracoD.rotation.x = bracoE.rotation.x = 0; bracoD.rotation.z = bracoE.rotation.z = 0;
  hud(true);
}
function proximaMelhoria() { return UPS.some(function (u) { var l = save.lv[u.id]; return (!u.max || l < u.max) && save.moedas >= u.custo(l); }); }

// ---------------- HUD / LOJA ----------------
function hud(forca) {
  $('hMoedas').textContent = '💰 ' + fmt(save.moedas);
  $('hRec').textContent = '🏆 ' + fmt(save.rec) + ' m';
  var b = nomeB(bIdx(D)); if ($('bioma').textContent !== b) $('bioma').textContent = b;
  if (estado === 'voando' || estado === 'fim') $('dist').firstChild.nodeValue = fmt(Math.max(0, D - 0.75)) + ' m';
  $('bLoja').querySelector('.ponto').style.display = proximaMelhoria() ? 'block' : 'none';
}
function mostraBanner(t, s) {
  var b = $('banner'); b.innerHTML = t + (s ? '<small>' + s + '</small>' : ''); b.classList.add('on');
  clearTimeout(bannerT); bannerT = setTimeout(function () { b.classList.remove('on'); }, 1800);
}
function abreLoja() {
  if (estado !== 'pronto' && estado !== 'fim') return;
  audio();
  $('pFim').classList.remove('on'); if (estado === 'fim') volta();
  pintaLoja(); $('pLoja').classList.add('on');
}
function pintaLoja() {
  $('lMoedas').textContent = '💰 ' + fmt(save.moedas) + ' moedas';
  $('lLista').innerHTML = UPS.map(function (u) {
    var l = save.lv[u.id], max = u.max && l >= u.max, c = u.custo(l);
    return '<div class="up"><div class="ic">' + u.ic + '</div><div class="tx"><b>' + u.nome + ' <span style="color:#c7861a">nv ' + l + '</span></b><div>' + (max ? 'NÍVEL MÁXIMO! 🏆' : u.desc(l)) + '</div></div>' +
      '<button data-u="' + u.id + '"' + (max || save.moedas < c ? ' disabled' : '') + '>' + (max ? 'MÁX' : '💰 ' + fmt(c)) + '</button></div>';
  }).join('');
  $('lLista').querySelectorAll('[data-u]').forEach(function (b) {
    b.onclick = function () {
      var u = UPS.filter(function (x) { return x.id === b.getAttribute('data-u'); })[0], l = save.lv[u.id], c = u.custo(l);
      if (save.moedas < c || (u.max && l >= u.max)) return;
      save.moedas -= c; save.lv[u.id]++; grava(); som.compra(); pintaLoja(); hud(true); atualizaRampas();
    };
  });
}
$('bChutar').onclick = chuta;
$('bLoja').onclick = abreLoja;
$('bFimLoja').onclick = abreLoja;
$('bDeNovo').onclick = function () { audio(); volta(); };
$('bFechaLoja').onclick = function () { $('pLoja').classList.remove('on'); };
window.addEventListener('keydown', function (e) {
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); if ($('pLoja').classList.contains('on')) return; if (estado === 'pronto') chuta(); else if (estado === 'fim') volta(); }
  if (e.key === 'm' || e.key === 'M') { if ($('pLoja').classList.contains('on')) $('pLoja').classList.remove('on'); else abreLoja(); }
});

// ---------------- LOOP ----------------
var camPos = new THREE.Vector3(4, 2.2, 5.5), camOlha = new THREE.Vector3(0, 0.8, -3), tmpV = new THREE.Vector3(), tempo = 0;
function loop(t) {
  requestAnimationFrame(loop);
  var dt = Math.min(0.05, ultimo ? (t - ultimo) / 1000 : 0.016); ultimo = t;
  if (celular) { acum += dt; if (acum < 1 / 31) return; dt = Math.min(0.05, acum); acum = 0; }
  if (estado === 'carregando') return;
  tempo += dt;
  // agulha do medidor
  if (estado === 'pronto') {
    agulha += agDir * dt * 1.25; if (agulha > 1) { agulha = 1; agDir = -1; } if (agulha < 0) { agulha = 0; agDir = 1; }
    $('agulha').style.left = (agulha * 100) + '%';
    pernaD.rotation.x = Math.sin(tempo * 2) * 0.05; bracoD.rotation.x = -Math.sin(tempo * 2) * 0.08; bracoE.rotation.x = Math.sin(tempo * 2) * 0.08;
  }
  // animação do chute
  if (estado === 'chutando') {
    tChute += dt;
    if (tChute < 0.28) { pernaD.rotation.x = -1.1 * (tChute / 0.28); bracoE.rotation.x = 0.8 * (tChute / 0.28); bracoD.rotation.x = -0.6 * (tChute / 0.28); }
    else { var k = Math.min(1, (tChute - 0.28) / 0.1); pernaD.rotation.x = -1.1 + 2.6 * k; if (k >= 1) solta(); }
  } else if (estado === 'voando' || estado === 'fim') {
    if (estado === 'voando') fisica(dt);
    pernaD.rotation.x += (0 - pernaD.rotation.x) * Math.min(1, dt * 4);
    bracoD.rotation.z = bracoE.rotation.z = 0;
    var com = Math.min(1, tempo % 0.6 / 0.3); bracoD.rotation.x = -2.6 + Math.sin(tempo * 8) * 0.3; bracoE.rotation.x = -2.6 - Math.sin(tempo * 8) * 0.3;   // comemorando
  }
  // posições (o mundo anda; a bola fica perto do zero)
  bola.position.set(0, bY, 0); bola.rotation.x = -giro;
  sombraB.position.set(0, 0.025, 0); var sh = Math.max(0.2, 1 - bY / 25); sombraB.scale.set(sh, sh, sh); sombraB.visible = bY < 40;
  menino.position.z = D - 0.75 + 0.55; sombraM.position.z = menino.position.z; menino.visible = sombraM.visible = D < 260;
  atualizaMundo();
  // rastro
  if (estado === 'voando') {
    rastroHist.unshift([D, bY]); if (rastroHist.length > RASTRO) rastroHist.pop();
    for (var r = 0; r < RASTRO; r++) { var hh = rastroHist[r] || [D, bY]; rastroPos[r * 3] = 0; rastroPos[r * 3 + 1] = hh[1]; rastroPos[r * 3 + 2] = -(hh[0] - D); }
    rastroGeo.attributes.position.needsUpdate = true; rastro.visible = Math.hypot(vZ, vY) > 12;
  } else rastro.visible = false;
  // câmera
  if (estado === 'pronto' || estado === 'chutando') { camPos.set(2.6, 1.5, 2.6); camOlha.set(-0.2, 0.95, -1.2); }
  else { var y = bY, af = Math.min(18, y * 0.12); camPos.set(5 + af, y + 2.2 + af * 0.5 + Math.min(4, vZ * 0.03), 8 + af); camOlha.set(0, y - Math.min(4, y * 0.1), -8); }
  cam.position.lerp(camPos, Math.min(1, dt * (estado === 'voando' ? 6 : 3)));
  tmpV.copy(camOlha); cam.lookAt(tmpV);
  // céu e neblina do bioma (troca suave)
  var bb = bDe(D); corAlvo.setHex(bb.ceu); corCeu.lerp(corAlvo, Math.min(1, dt * 2));
  cena.background.copy(corCeu); cena.fog.color.copy(corCeu);
  cena.fog.far = 320 + bY * 1.6; cena.fog.near = 60 + bY * 0.4;
  hemi.intensity = bb.prop === 'cratera' ? 0.55 : 0.75;
  // partículas
  var pt = PART[bb.part];
  parts.visible = !!pt;
  if (pt) {
    pMat.color.setHex(pt[0]); pMat.size = pt[1];
    var mov = vZ * dt * Math.max(1, Math.min(150, Math.hypot(vZ, vY) / 12));
    for (var i = 0; i < NP; i++) {
      var iz = i * 3 + 2, iy = i * 3 + 1;
      pPos[iz] += mov; pPos[iy] += pt[2] * dt;
      if (pPos[iz] > 25) pPos[iz] -= 140;
      if (pPos[iy] < bY - 10) pPos[iy] += 50; if (pPos[iy] > bY + 40) pPos[iy] -= 50;
    }
    pGeo.attributes.position.needsUpdate = true;
  }
  hudT -= dt; if (hudT <= 0) { hudT = 0.25; hud(); }
  ren.render(cena, cam);
}
requestAnimationFrame(loop);

// tudo pronto
estado = 'pronto'; bY = BOLA_R; atualizaMundo(); hud(true);
cam.position.set(2.6, 1.5, 2.6);
$('carregando').style.display = 'none';
if (!save.chutes) setTimeout(function () { mostraBanner('Aperte CHUTAR!', 'quando a agulha estiver no verde ⚡'); }, 600);
</script>
