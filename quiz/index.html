function embaralhaOpcoes(p){
  // retorna {opcoes, correta} com ordem embaralhada mantendo qual é a certa
  const idx = p.opcoes.map((_,i)=>i);
  for(let i=idx.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [idx[i],idx[j]]=[idx[j],idx[i]]; }
  const novas = idx.map(i=>p.opcoes[i]);
  const novaCorreta = idx.indexOf(p.correta);
  return {q:p.q, opcoes:novas, correta:novaCorreta, nivel:p.nivel, materia:p.materia};
}
function sorteiaPerguntas(nivel, materia, n){
  let pool = PERGUNTAS.filter(p=>p.nivel===nivel && (materia==='todas' || !materia || p.materia===materia)).slice();
  // fallback: se o filtro por matéria vier vazio, cai pra todas do nível
  if(pool.length===0) pool = PERGUNTAS.filter(p=>p.nivel===nivel).slice();
  // fallback final: se ainda vazio (nível sem perguntas), usa tudo
  if(pool.length===0) pool = PERGUNTAS.slice();
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  const escolhidas = [];
  let i=0;
  while(escolhidas.length<n){ escolhidas.push(pool[i % pool.length]); i++; }
  return escolhidas.map(embaralhaOpcoes);
}

function soltaConfete(n){
  n=n||30;
  const em=['🎉','🎊','⭐','🍄','🏆','✨','🎈'];
  for(let i=0;i<n;i++){

    c.style.animationDuration=(1.5+Math.random()*2)+'s';

}
let audioCtx=null;
function som(freq,dur,tipo){
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type=tipo||'sine'; o.frequency.value=freq;
    o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(0.15,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+(dur||0.2));
    o.start(); o.stop(audioCtx.currentTime+(dur||0.2));
  }catch(e){}
}
function somAcerto(){ som(600,0.1); setTimeout(()=>som(800,0.12),90); setTimeout(()=>som(1000,0.2),190); }
function somErro(){ som(160,0.35,'sawtooth'); }

function iniciaSolo(nivel, materia){
  materia = materia || 'todas';
  localStorage.setItem('quiz_nivel', nivel);
  localStorage.setItem('quiz_materia', materia);
  solo = {
    nivel, materia, cfg:CFG[nivel],
    perguntas: sorteiaPerguntas(nivel, materia, 40),
    idx:0, ptsVoce:0, ptsBot:0,
    respondido:false, tRestante:0, crono:null, botTimer:null,
    moedasGanhas:0, inicioRodada:0,
  };
  document.getElementById('nomeA').textContent='VOCÊ 😎';
  document.getElementById('nomeB').textContent='BOT 🤖';
  atualizaPlacarSolo();
  mostraTela('telaJogo');
  proximaSolo();
}
function atualizaPlacarSolo(){
  document.getElementById('ptsA').textContent=solo.ptsVoce;
  document.getElementById('ptsB').textContent=solo.ptsBot;
}
function proximaSolo(){
  if(solo.ptsVoce>=5 || solo.ptsBot>=5){ return fimSolo(); }
  const p = solo.perguntas[solo.idx % solo.perguntas.length];
  solo.pergAtual=p; solo.respondido=false; solo.botRespondeu=false;
  document.getElementById('statusRodada').textContent='';
  document.getElementById('numPergunta').innerHTML='Pergunta '+(solo.idx+1)+' • '+niveLabel(solo.nivel)+' '+seloMateriaHtml(p.materia);
  document.getElementById('perguntaTxt').textContent=p.q;
  renderOpcoes(p, respondeSolo);
  solo.inicioRodada=Date.now();
  // cronômetro
  iniciaCrono(solo.cfg.tempo, ()=>{ if(!solo.respondido) respondeSolo(-1); });
  // bot decide quando responde e se acerta
  const botDelay = solo.cfg.botMin + Math.random()*(solo.cfg.botMax-solo.cfg.botMin);
  const botAcerta = Math.random() < solo.cfg.botAcerto;
  solo.botTimer = setTimeout(()=>{
    solo.botRespondeu = true; solo.botAcertou = botAcerta;
    if(!solo.respondido && botAcerta){
      // bot acertou primeiro
      resolveRodadaSolo('bot');
    }
  }, botDelay);
}
function niveLabel(n){ return n==='facil'?'😀 Fácil':n==='medio'?'🤔 Médio':'🤯 Difícil'; }

function respondeSolo(escolha){
  if(solo.respondido) return;
  solo.respondido=true;
  paraCrono();
  const p=solo.pergAtual;
  const acertou = escolha===p.correta;
  marcaOpcoes(p.correta, escolha);
  if(acertou){
    // você acertou. Ganha o ponto se o bot ainda não acertou antes
    if(solo.botRespondeu && solo.botAcertou){
      resolveRodadaSolo('bot','O bot respondeu primeiro! 🤖');
    } else {
      clearTimeout(solo.botTimer);
      resolveRodadaSolo('voce');
    }
  } else {
    // você errou (ou estourou o tempo) → ponto do bot se ele acertar
    clearTimeout(solo.botTimer);
    if(solo.botAcertou){
      resolveRodadaSolo('bot', escolha===-1?'⏰ Tempo esgotado!':'Você errou! 😅');
    } else {
      resolveRodadaSolo('ninguem', escolha===-1?'⏰ Tempo esgotado! O bot também errou.':'Os dois erraram! 😆');
    }
  }
}
function resolveRodadaSolo(quem, extra){
  const st=document.getElementById('statusRodada');
  if(quem==='voce'){
    solo.ptsVoce++; solo.moedasGanhas+=5; moedas+=5; salvaMoedas();
    st.textContent='✅ Você marcou o ponto! (+5 🪙)'; somAcerto(); soltaConfete(12);
  } else if(quem==='bot'){
    solo.ptsBot++;
    st.textContent='🤖 Ponto do bot! '+(extra||''); somErro();
  } else {
    st.textContent='😐 Ninguém pontuou. '+(extra||'');
  }
  atualizaPlacarSolo();
  setTimeout(()=>{ solo.idx++; proximaSolo(); }, 2100);
}

function fimSolo(){
  paraCrono(); clearTimeout(solo.botTimer);

  if(venceu){
    const b=solo.cfg.moedaVit; moedas+=b; solo.moedasGanhas+=b; salvaMoedas();
    recorde++; localStorage.setItem('quiz_recorde', recorde);
  }
  document.getElementById('fimTitulo').textContent = venceu ? '🏆 VOCÊ VENCEU!' : '😢 O bot venceu...';
  document.getElementById('fimPlacar').textContent = `VOCÊ ${solo.ptsVoce} × ${solo.ptsBot} BOT`;
  document.getElementById('fimMoedas').textContent = venceu
    ? `Você ganhou 🪙 ${solo.moedasGanhas} moedas nessa partida!`
    : `Você ganhou 🪙 ${solo.moedasGanhas} moedas. Tenta de novo! 💪`;
  if(venceu){ soltaConfete(60); somAcerto(); }
  else somErro();
  atualizaSaldo();
  mostraTela('telaFim');
}

/* ------- render de opções e cronômetro (compartilhado) ------- */
function renderOpcoes(p, cb){
  const box=document.getElementById('opcoes');
  box.innerHTML='';
  p.opcoes.forEach((op,i)=>{
    const b=document.createElement('button');
    b.className='opcao'; b.textContent=String.fromCharCode(65+i)+') '+op;
    b.onclick=()=>cb(i);
    box.appendChild(b);
  });
}
function marcaOpcoes(correta, escolha){
  const bts=document.querySelectorAll('#opcoes .opcao');
  bts.forEach((b,i)=>{
    b.disabled=true;
    if(i===correta) b.classList.add('certa');
    else if(i===escolha) b.classList.add('errada');
  });
}
let cronoState={raf:null, fim:0, dur:0, cb:null};
function iniciaCrono(dur, cb){
  paraCrono();
  cronoState.dur=dur; cronoState.fim=Date.now()+dur; cronoState.cb=cb;
  const fill=document.getElementById('cronoFill');
  function tick(){
    const resta=cronoState.fim-Date.now();
    const pct=Math.max(0, resta/cronoState.dur*100);
    fill.style.width=pct+'%';
    if(resta<=0){ cronoState.raf=null; const c=cronoState.cb; cronoState.cb=null; if(c)c(); return; }
    cronoState.raf=requestAnimationFrame(tick);
  }
  tick();
}
function paraCrono(){
  if(cronoState.raf){ cancelAnimationFrame(cronoState.raf); cronoState.raf=null; }
  cronoState.cb=null;
}

const MP_API = 'https://y67msybrr8.execute-api.sa-east-1.amazonaws.com';
const MP_WS  = 'wss://zxbmtlkq6b.execute-api.sa-east-1.amazonaws.com/prod?jogo=quiz';
let mp = { ativo:false, comecou:false, ws:null, sala:'', souHost:false, meuNome:'', opNome:'',
  ptsEu:0, ptsEle:0, idx:0, respondido:false, minhaMs:0, respostas:{}, perguntasHost:[],
  lastMsg:0, pollConvites:null, ping:null, vigia:null, checaSala:null };

function mpLogado(){ return !!localStorage.getItem('cg_usuario'); }
async function mpApi(payload){
  const r = await fetch(MP_API, { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(Object.assign({
      nome: localStorage.getItem('cg_usuario'),
      senhaHash: localStorage.getItem('cg_senhaHash')
    }, payload)) });
  return r.json();
}
function abreOnline(){
  mostraTela('telaOnline');
  const area=document.getElementById('onlineArea');
  if(!mpLogado()){
    area.innerHTML=`<div class="card"><p style="font-size:20px;">🔒 Faça login na sua conta pra jogar online com amigos!</p>
      <p class="sub" style="margin-top:10px;">Volte pra página inicial e entre na sua conta 😉</p></div>`;
    return;
  }
  area.innerHTML=`<div class="card">
      <button class="btn verde" style="width:100%;margin:6px 0;font-size:19px;" onclick="mpCriarSala()">➕ CRIAR SALA</button>
      <button class="btn azul" style="width:100%;margin:6px 0;font-size:19px;" onclick="mpVerConvites()">📬 MEUS CONVITES</button>
    </div>
    <div id="mpArea"></div>`;
}
function mpCodigoSala(){
  const L='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s='';
  for(let i=0;i<6;i++) s+=L[Math.floor(Math.random()*L.length)];
  return s;
}
async function mpCriarSala(){
  if(mp.pollConvites){ clearInterval(mp.pollConvites); mp.pollConvites=null; }
  const sala=mpCodigoSala();
  mpConecta(sala, true);
  const area=document.getElementById('mpArea');
  area.innerHTML=`<div class="card"><h2>Sala <span style="color:#00ff88">${sala}</span></h2>
    <p style="color:#00ccff;">⏳ esperando amigo entrar...</p>
    <div id="mpAmigos"><p>carregando seus amigos...</p></div></div>`;
  try{
    const d=await mpApi({acao:'entrar'});
    const amigos=d.amigos||[];
    const el=document.getElementById('mpAmigos'); if(!el) return;
    el.innerHTML = amigos.length
      ? `<h2 style="font-size:18px;margin:8px 0;">Convide um amigo:</h2>`+amigos.map(a=>
          `<div class="amigoLinha">🧠 <b>${a}</b>
           <button class="btn pequeno" onclick="mpConvidar('${a}','${sala}',this)">📨 Convidar</button></div>`).join('')
      : `<p>Você ainda não tem amigos adicionados 😅</p>`;
  }catch(e){
    const el=document.getElementById('mpAmigos'); if(el) el.innerHTML='<p>Não deu pra carregar os amigos 😢</p>';
  }
}
async function mpConvidar(alvo, sala, btn){
  btn.disabled=true; btn.textContent='...';
  try{
    const d=await mpApi({acao:'convidar', alvo, sala, jogo:'quiz'});
    if(d.ok){ btn.textContent='✅ Convidado!'; }
    else { btn.textContent='😢 não deu'; mostraMsg(d.erro||d.message||'Não deu pra convidar 😢','#ffaa00',2500); }
  }catch(e){ btn.textContent='😢 erro'; btn.disabled=false; }
}
function mpVerConvites(){
  mpFechaWs();
  const area=document.getElementById('mpArea');
  area.innerHTML=`<div class="card"><h2>📬 Meus convites</h2><div id="mpConvites"><p>procurando convites...</p></div></div>`;
  const busca=async ()=>{
    try{
      const d=await mpApi({acao:'convites'});
      const el=document.getElementById('mpConvites'); if(!el) return;
      const agora=Date.now();
      const cs=(d.convites||[]).filter(c=>agora-(c.ts||0)<30000);
      el.innerHTML = cs.length ? cs.map(c=>{
        const resta=Math.max(0,Math.ceil((30000-(agora-(c.ts||0)))/1000));
        return `<div class="conviteLinha">🧠 <b>${c.de}</b> te chamou!
          <span><button class="btn pequeno verde" onclick="mpEntrarSala('${c.sala}')">ENTRAR</button>
          <span style="color:#ffaa00;">⏱️ ${resta}s</span></span></div>`;
      }).join('') : '<p>Nenhum convite ainda... peça pro seu amigo criar uma sala! 😄</p>';
    }catch(e){}
  };
  busca();
  if(mp.pollConvites) clearInterval(mp.pollConvites);
  mp.pollConvites=setInterval(busca,1000);
}
function mpEntrarSala(sala){
  if(mp.pollConvites){ clearInterval(mp.pollConvites); mp.pollConvites=null; }
  const area=document.getElementById('mpArea');
  if(area) area.innerHTML=`<div class="card"><p style="color:#00ccff;">⏳ Entrando na sala ${sala}...</p></div>`;
  mpConecta(sala, false);
}
function mpConecta(sala, souHost){
  mpFechaWs();
  mp.sala=sala; mp.souHost=souHost;
  mp.meuNome=localStorage.getItem('cg_usuario')||'VOCÊ';
  mp.opNome=''; mp.comecou=false; mp.ativo=false;
  mp.ws=new WebSocket(MP_WS);
  mp.ws.onopen=()=>{
    mp.lastMsg=Date.now();
    mpEnvia({t:'oi', nome:mp.meuNome});
    if(!souHost){
      if(mp.checaSala) clearTimeout(mp.checaSala);
      mp.checaSala=setTimeout(()=>{ if(!mp.comecou && !mp.opNome) mpDesliga('🚪 SALA INDISPONÍVEL!'); }, 8000);
    }
    mp.ping=setInterval(()=>mpEnvia({t:'ping'}),4000);
    mp.vigia=setInterval(()=>{ if(mp.ativo && Date.now()-mp.lastMsg>10000) mpDesliga('🚪 SALA INDISPONÍVEL! Seu amigo saiu.'); },2000);
  };
  mp.ws.onmessage=mpRecebe;
  mp.ws.onclose=()=>{
    if(mp.checaSala){ clearTimeout(mp.checaSala); mp.checaSala=null; }
    if(mp.ativo) mpDesliga('🚪 SALA INDISPONÍVEL!');
  };
}
function mpEnvia(o){
  if(mp.ws && mp.ws.readyState===1)
    mp.ws.send(JSON.stringify(Object.assign({acao:'mp', sala:mp.sala}, o)));
}
function mpRecebe(ev){
  let m; try{ m=JSON.parse(ev.data); }catch(e){ return; }
  if(!m || m.sala!==mp.sala) return; // ignora sala diferente
  mp.lastMsg=Date.now();
  if(m.t==='ping') return;
  if(m.t==='oi'){
    if(mp.checaSala){ clearTimeout(mp.checaSala); mp.checaSala=null; }
    if(mp.comecou) return;
    mp.opNome=m.nome||'AMIGO';
    if(mp.souHost){
      mpEnvia({t:'oi', nome:mp.meuNome});
      mpComecaHost();
    }
    return;
  }
  if(m.t==='comeca'){ if(!mp.comecou && !mp.souHost){ mpComecaConvidado(m.nomeHost); } return; }
  if(m.t==='pergunta'){ mpMostraPergunta(m); return; }
  if(m.t==='resposta'){ if(mp.souHost) mpHostRecebeResposta(m); return; }
  if(m.t==='placar'){ mpAtualizaPlacar(m); return; }
  if(m.t==='fim'){ mpFim(m.vencedor===mp.meuNome, m.a, m.b, m.nomeA, m.nomeB); return; }
}
function mpComecaHost(){
  mp.comecou=true; mp.ativo=true;
  if(mp.pollConvites){ clearInterval(mp.pollConvites); mp.pollConvites=null; }
  mp.ptsEu=0; mp.ptsEle=0; mp.idx=0;
  // host escolhe as perguntas: mistura de todos níveis pra online
  mp.perguntasHost = sorteiaOnline(9);
  mpEnvia({t:'comeca', nomeHost:mp.meuNome});
  mpAbreTelaJogoOnline(mp.meuNome, mp.opNome);
  mostraMsg(`🧠 ${mp.meuNome} × ${mp.opNome}! Pela diversão!`, '#fff', 1800);
  setTimeout(mpHostEnviaPergunta, 1900);
}
function mpComecaConvidado(nomeHost){
  mp.comecou=true; mp.ativo=true;
  if(mp.pollConvites){ clearInterval(mp.pollConvites); mp.pollConvites=null; }
  mp.ptsEu=0; mp.ptsEle=0;
  mp.opNome=nomeHost||mp.opNome;
  mpAbreTelaJogoOnline(mp.meuNome, mp.opNome);
  mostraMsg(`🧠 ${mp.meuNome} × ${mp.opNome}! Pela diversão!`, '#fff', 1800);
}
function sorteiaOnline(n){
  // mistura equilibrada: pega de vários níveis
  const todas = PERGUNTAS.slice();
  for(let i=todas.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [todas[i],todas[j]]=[todas[j],todas[i]]; }
  return todas.slice(0,n).map(embaralhaOpcoes);
}
function ehOperador(n){ return ['samuel9','ovo gostoso','davi0'].indexOf(String(n||'').trim().toLowerCase())>=0; }
function mpAbreTelaJogoOnline(a,b){
  document.getElementById('nomeA').textContent=a.toUpperCase()+' 😎';
  document.getElementById('nomeA').style.color=ehOperador(a)?'#ff2222':'';
  document.getElementById('nomeB').textContent=b.toUpperCase()+' 🧑';
  document.getElementById('nomeB').style.color=ehOperador(b)?'#ff2222':'';
  document.getElementById('ptsA').textContent='0';
  document.getElementById('ptsB').textContent='0';
  mostraTela('telaJogo');
}
// HOST envia a próxima pergunta sincronizada
function mpHostEnviaPergunta(){
  if(!mp.ativo) return;
  if(mp.ptsEu>=5 || mp.ptsEle>=5) return;
  const p=mp.perguntasHost[mp.idx % mp.perguntasHost.length];
  mp.respostas={}; mp.respondido=false;
  const msg={t:'pergunta', idx:mp.idx, q:p.q, opcoes:p.opcoes, correta:p.correta, n:niveLabel(p.nivel), mat:p.materia};
  mpEnvia(msg);
  mpMostraPergunta(msg); // host também mostra
}
// os dois mostram a MESMA pergunta
function mpMostraPergunta(m){
  mp.respondido=false; mp.idxAtual=m.idx; mp.corretaAtual=m.correta;
  document.getElementById('statusRodada').textContent='';
  document.getElementById('numPergunta').innerHTML='Pergunta '+(m.idx+1)+' '+seloMateriaHtml(m.mat);
  document.getElementById('perguntaTxt').textContent=m.q;
  const p={opcoes:m.opcoes, correta:m.correta};
  mp.inicioRodada=Date.now();
  renderOpcoes(p, (i)=>mpResponde(i, m.correta));
  iniciaCrono(12000, ()=>{ if(!mp.respondido) mpResponde(-1, m.correta); });
}
function mpResponde(escolha, correta){
  if(mp.respondido) return;
  mp.respondido=true; paraCrono();
  const acertou=escolha===correta;
  const ms=Date.now()-mp.inicioRodada;
  marcaOpcoes(correta, escolha);
  document.getElementById('statusRodada').textContent = acertou?'✅ Acertou! Esperando o resultado...':'❌ Errou! Esperando...';
  mpEnvia({t:'resposta', idx:mp.idxAtual, nome:mp.meuNome, correta:acertou, ms});
  if(mp.souHost) mpHostRecebeResposta({idx:mp.idxAtual, nome:mp.meuNome, correta:acertou, ms});
}
// HOST decide o vencedor da rodada
function mpHostRecebeResposta(m){
  if(m.idx!==mp.idx) return;
  mp.respostas[m.nome]={correta:m.correta, ms:m.ms};
  // espera os dois OU decide se der pra decidir
  const nomes=Object.keys(mp.respostas);
  if(nomes.length<2){
    // se o único que respondeu acertou rápido, ainda espera o outro (pode acertar mais rápido? não, já passou o tempo dele)
    return; // aguarda o segundo (ou timeout do crono do outro cliente que enviará -1)
  }
  mpHostDecideRodada();
}
function mpHostDecideRodada(){
  if(mp._decidindo) return; mp._decidindo=true;
  const rEu=mp.respostas[mp.meuNome]||{correta:false,ms:999999};
  const rEle=mp.respostas[mp.opNome]||{correta:false,ms:999999};
  let ponto=null;
  if(rEu.correta && rEle.correta) ponto = rEu.ms<=rEle.ms ? mp.meuNome : mp.opNome;
  else if(rEu.correta) ponto=mp.meuNome;
  else if(rEle.correta) ponto=mp.opNome;
  if(ponto===mp.meuNome) mp.ptsEu++;
  else if(ponto===mp.opNome) mp.ptsEle++;
  const placar={t:'placar', ponto:ponto||'', a:mp.ptsEu, b:mp.ptsEle, nomeA:mp.meuNome, nomeB:mp.opNome};
  mpEnvia(placar);
  mpAtualizaPlacar(placar);
  mp._decidindo=false;
  mp.idx++;
  if(mp.ptsEu>=5 || mp.ptsEle>=5){
    const vencedor = mp.ptsEu>=5 ? mp.meuNome : mp.opNome;
    const fim={t:'fim', vencedor, a:mp.ptsEu, b:mp.ptsEle, nomeA:mp.meuNome, nomeB:mp.opNome};
    setTimeout(()=>{ mpEnvia(fim); mpFim(vencedor===mp.meuNome, mp.ptsEu, mp.ptsEle, mp.meuNome, mp.opNome); }, 2000);
  } else {
    setTimeout(mpHostEnviaPergunta, 2200);
  }
}
function mpAtualizaPlacar(m){
  // a/b são do ponto de vista do HOST (nomeA=host). Ajusta pra minha tela.
  const souA = (m.nomeA===mp.meuNome);
  const meus = souA ? m.a : m.b;
  const dele = souA ? m.b : m.a;
  mp.ptsEu=meus; mp.ptsEle=dele;
  document.getElementById('ptsA').textContent=meus;
  document.getElementById('ptsB').textContent=dele;
  const st=document.getElementById('statusRodada');
  if(m.ponto===mp.meuNome){ st.textContent='✅ Você ganhou o ponto!'; somAcerto(); soltaConfete(12); }
  else if(m.ponto===mp.opNome){ st.textContent='😅 Ponto de '+mp.opNome+'!'; somErro(); }
  else { st.textContent='😐 Ninguém pontuou nessa!'; }
}
function mpFim(venceu, a, b, nomeA, nomeB){
  mp.ativo=false; mp.comecou=false;
  const souA=(nomeA===mp.meuNome);
  const meus=souA?a:b, dele=souA?b:a;
  document.getElementById('fimTitulo').textContent = venceu ? '🏆 VOCÊ VENCEU!' : `😢 ${mp.opNome} venceu...`;
  document.getElementById('fimPlacar').textContent = `${mp.meuNome.toUpperCase()} ${meus} × ${dele} ${mp.opNome.toUpperCase()}`;
  document.getElementById('fimMoedas').textContent = 'Amistoso é pela diversão! 🤝 (sem moedas)';
  document.getElementById('telaFim').dataset.online='1';
  if(venceu){ soltaConfete(60); somAcerto(); } else somErro();
  mpFechaWs();
  mostraTela('telaFim');
}
function mpFechaWs(){
  if(mp.ping){ clearInterval(mp.ping); mp.ping=null; }
  if(mp.vigia){ clearInterval(mp.vigia); mp.vigia=null; }
  if(mp.ws){ try{ mp.ws.onclose=null; mp.ws.close(); }catch(e){} mp.ws=null; }
}
function mpDesliga(aviso){
  const estava=mp.ativo;
  mp.ativo=false; mp.comecou=false;
  if(mp.pollConvites){ clearInterval(mp.pollConvites); mp.pollConvites=null; }
  paraCrono();
  mpFechaWs();
  if(aviso) mostraMsg(aviso,'#ffaa00',2600);
  if(estava){ mostraTela('telaMenu'); atualizaSaldo(); }
}
