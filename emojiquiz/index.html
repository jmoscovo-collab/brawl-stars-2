function embaralha(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
// gera 4 alternativas: a certa + 3 respostas diferentes da mesma categoria
function montaPergunta(p){
  const outras = embaralha(PERGUNTAS.filter(x=>x.c===p.c && x.r!==p.r).map(x=>x.r));
  const distintas=[]; outras.forEach(r=>{ if(distintas.length<3 && !distintas.includes(r)) distintas.push(r); });
  const opcoes = embaralha([p.r].concat(distintas));
  return {e:p.e, r:p.r, c:p.c, opcoes, correta:opcoes.indexOf(p.r)};
}
// sorteia n perguntas SEM repetir dentro da partida
function sorteiaPerguntas(cat, n){
  let pool = PERGUNTAS.filter(p=>cat==='tudo' || !cat || p.c===cat);
  if(pool.length===0) pool = PERGUNTAS.slice();
  return embaralha(pool).slice(0, Math.min(n, pool.length)).map(montaPergunta);
}
function mostraMsg(txt,cor,ms){
  const el=document.getElementById('msg');
  el.textContent=txt; el.style.color=cor||'#fff'; el.style.display='block';
  clearTimeout(el._t); el._t=setTimeout(()=>el.style.display='none', ms||1800);
}
function soltaConfete(n){
  n=n||30;
  const em=['🎉','🎊','⭐','🍄','🏆','✨','😂','🎈'];
  for(let i=0;i<n;i++){
    const c=document.createElement('div');
    c.className='confete'; c.textContent=em[Math.floor(Math.random()*em.length)];
    c.style.left=Math.random()*100+'vw';
    c.style.animationDuration=(1.5+Math.random()*2)+'s';
    c.style.fontSize=(18+Math.random()*20)+'px';
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),3800);
  }
}
function mostraCombo(n){
  const d=document.createElement('div'); d.className='combo';
  d.textContent = n>=5 ? `🔥 COMBO x${n} INSANO!` : `🔥 COMBO x${n}!`;
  document.body.appendChild(d); setTimeout(()=>d.remove(),1200);
}
let audioCtx=null;
function som(freq,dur,tipo){
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type=tipo||'sine'; o.frequency.value=freq;
    o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(0.15,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+(dur||0.2));
    o.start(); o.stop(audioCtx.currentTime+(dur||0.2));
  }catch(e){}
}

/* =========================================================
   PONTUAÇÃO (compartilhada solo/online)
   acerto = 100 base + até 100 por velocidade + 10 por nível de combo
   ========================================================= */
const TEMPO_PERGUNTA = 15000;
const TEMPO_OBJETOS = 10000; // Objetos é DIFÍCIL: menos tempo
function tempoDe(p){ return (p && p.c==='objetos') ? TEMPO_OBJETOS : TEMPO_PERGUNTA; }
const CUSTO_LETRA = 10, CUSTO_TIRA = 15;
function calculaPontos(ms, combo){
  const rapidez = Math.max(0, 1 - ms/TEMPO_PERGUNTA);
  return 100 + Math.round(rapidez*100) + Math.min(combo,10)*10;
}

function proximaSolo(){
  if(solo.idx>=solo.perguntas.length){ return fimSolo(); }
  const p=solo.perguntas[solo.idx];

  document.getElementById('numPergunta').innerHTML='Pergunta '+(solo.idx+1)+'/'+solo.perguntas.length+' '+seloCatHtml(p.c);
  mostraPergunta(p, respondeSolo);
  solo.inicioRodada=Date.now();
  iniciaCrono(tempoDe(p), ()=>{ if(!solo.respondido) respondeSolo(-1); });

function respondeSolo(escolha){
  if(solo.respondido) return;
  solo.respondido=true; paraCrono();
  const p=solo.pergAtual;
  const acertou = escolha===p.correta;
  const ms=Date.now()-solo.inicioRodada;
  marcaOpcoes(p.correta, escolha);
  travaDicas();
  const st=document.getElementById('statusRodada');
  if(acertou){
    solo.combo++; solo.melhorCombo=Math.max(solo.melhorCombo, solo.combo);
    const pts=calculaPontos(ms, solo.combo);
    solo.pontos+=pts; solo.acertos++;
    let ganho=5; if(solo.combo>=3) ganho+=2;
    solo.moedasGanhas+=ganho; moedas+=ganho; salvaMoedas();
    st.textContent=`✅ ${p.r}! +${pts} pontos (+${ganho} 🪙)`;
    animaCard('acertou'); somAcerto(); soltaConfete(12);
    if(solo.combo>=2){ mostraCombo(solo.combo); if(solo.combo>=3) setTimeout(somCombo,200); }
  } else {
    solo.combo=0;
    st.textContent = (escolha===-1 ? '⏰ Tempo esgotado! ' : '❌ Errou! ') + 'Era: '+p.r;
    animaCard('errou'); somErro();
  }
  atualizaHudSolo();
  setTimeout(()=>{ solo.idx++; proximaSolo(); }, 2000);
}
function fimSolo(){
  paraCrono();
  const total=solo.perguntas.length;
  const venceu = solo.acertos >= Math.ceil(total*0.7);
  if(venceu){ const b=10+total; moedas+=b; solo.moedasGanhas+=b; salvaMoedas(); }
  if(solo.pontos>recorde){ recorde=solo.pontos; localStorage.setItem('emojiquiz_recorde', recorde); mostraMsg('🏆 NOVO RECORDE!','#ffe700',2200); }

  document.getElementById('fimMoedas').textContent = `Você ganhou 🪙 ${solo.moedasGanhas} moedas nessa partida!` + (venceu?' 🎉':' Tenta de novo! 💪');

let cronoState={raf:null, fim:0, dur:0, cb:null, ultTique:0};
function iniciaCrono(dur, cb){
  paraCrono();
  cronoState.dur=dur; cronoState.fim=Date.now()+dur; cronoState.cb=cb; cronoState.ultTique=0;
  const fill=document.getElementById('cronoFill');
  function tick(){
    const resta=cronoState.fim-Date.now();
    const pct=Math.max(0, resta/cronoState.dur*100);
    fill.style.width=pct+'%';
    // tique nos últimos 3 segundos
    const seg=Math.ceil(resta/1000);
    if(resta>0 && seg<=3 && seg!==cronoState.ultTique){ cronoState.ultTique=seg; somTique(); }
    if(resta<=0){ cronoState.raf=null; const c=cronoState.cb; cronoState.cb=null; if(c)c(); return; }
    cronoState.raf=requestAnimationFrame(tick);
  }
  tick();
}
function paraCrono(){
  if(cronoState.raf){ cancelAnimationFrame(cronoState.raf); cronoState.raf=null; }
  cronoState.cb=null;
}

/* ------- conexão ------- */
function mpConecta(sala, souHost){
  mpFechaWs();
  mp.sala=sala; mp.souHost=souHost;
  mp.meuNome=localStorage.getItem('cg_usuario')||'VOCÊ';
  mp.jogadores = souHost ? [mp.meuNome] : [];
  mp.comecou=false; mp.ativo=false;
  mp.ws=new WebSocket(MP_WS);
  mp.ws.onopen=()=>{
    mp.lastMsg=Date.now();
    mpEnvia({t:'oi', nome:mp.meuNome});
    if(!souHost){
      if(mp.checaSala) clearTimeout(mp.checaSala);
      mp.checaSala=setTimeout(()=>{ if(!mp.comecou && mp.jogadores.length<=1) mpDesliga('🚪 SALA INDISPONÍVEL!'); }, 8000);
    }
    mp.ping=setInterval(()=>mpEnvia({t:'ping'}),4000);
    mp.vigia=setInterval(()=>{ if(mp.ativo && Date.now()-mp.lastMsg>12000) mpDesliga('🚪 SALA INDISPONÍVEL! Alguém saiu.'); },2000);
  };
  mp.ws.onmessage=mpRecebe;
  mp.ws.onclose=()=>{
    if(mp.checaSala){ clearTimeout(mp.checaSala); mp.checaSala=null; }
    if(mp.ativo) mpDesliga('🚪 SALA INDISPONÍVEL!');
  };
}
function mpEnvia(o){
  if(mp.ws && mp.ws.readyState===1)
    mp.ws.send(JSON.stringify(Object.assign({acao:'mp', sala:mp.sala}, o)));
}
function mpRecebe(ev){
  let m; try{ m=JSON.parse(ev.data); }catch(e){ return; }
  if(!m || m.sala!==mp.sala) return; // ignora sala diferente
  mp.lastMsg=Date.now();
  switch(m.t){
    case 'ping': return;
    case 'oi':
      if(mp.checaSala){ clearTimeout(mp.checaSala); mp.checaSala=null; }
      if(mp.souHost && !mp.comecou){
        if(!mp.jogadores.includes(m.nome) && mp.jogadores.length<MP_MAX) mp.jogadores.push(m.nome);
        mpEnvia({t:'jogadores', lista:mp.jogadores});
        renderSalaJogadores();
      }
      return;
    case 'jogadores':
      if(!mp.souHost){ mp.jogadores=m.lista||[]; renderSalaJogadores(); }
      return;
    case 'comeca':
      if(!mp.souHost && !mp.comecou) mpComecaConvidado(m);
      return;
    case 'pergunta':
      if(!mp.souHost) mpMostraPergunta(m);
      return;
    case 'resposta':
      if(mp.souHost) mpHostRecebeResposta(m);
      return;
    case 'placar':
      if(!mp.souHost) mpAplicaPlacar(m);
      return;
    case 'fim':
      if(!mp.souHost) mpFim(m.ranking);
      return;
  }
}

/* ------- início ------- */
function mpHostComeca(){
  if(!mp.souHost || mp.jogadores.length<2) return;
  mp.perguntasHost = sorteiaPerguntas(mp.cfgCat, mp.cfgQtd);
  mp.idx=0; mp.placar={}; mp.combos={};
  mp.jogadores.forEach(n=>{ mp.placar[n]=0; mp.combos[n]=0; });
  mpEnvia({t:'comeca', jogadores:mp.jogadores, total:mp.perguntasHost.length, cat:mp.cfgCat});
  mpIniciaJogoUI(mp.jogadores, mp.perguntasHost.length);
  setTimeout(mpHostEnviaPergunta, 1900);
}
function mpComecaConvidado(m){
  mp.jogadores=m.jogadores||mp.jogadores;
  mp.placar={}; mp.jogadores.forEach(n=>mp.placar[n]=0);
  mpIniciaJogoUI(mp.jogadores, m.total||10);
}
function mpIniciaJogoUI(jogadores, total){
  mp.comecou=true; mp.ativo=true; mp.total=total; mp.meuCombo=0; mp.meusPts=0;
  if(mp.pollConvites){ clearInterval(mp.pollConvites); mp.pollConvites=null; }
  document.getElementById('hudLabelB').textContent='JOGADORES 👥';
  document.getElementById('hudB').textContent=jogadores.length;
  document.getElementById('hudPts').textContent='0';
  document.getElementById('hudCombo').textContent='0';
  document.getElementById('dicasBox').style.display='none'; // online: sem dicas, é justo pra todos
  document.getElementById('telaFim').dataset.online='1';
  renderRankingVivo([]);
  mostraTela('telaJogo');
  mostraMsg(`😂 ${jogadores.length} jogadores! Boa sorte!`, '#fff', 1800);
}

/* ------- rodadas (host autoritativo) ------- */
function mpHostEnviaPergunta(){
  if(!mp.ativo || !mp.souHost) return;
  if(mp.idx>=mp.perguntasHost.length) return mpHostFim();
  const p=mp.perguntasHost[mp.idx];
  mp.respostas={}; mp._decidindo=false;
  const msg={t:'pergunta', idx:mp.idx, total:mp.perguntasHost.length, e:p.e, r:p.r, c:p.c, opcoes:p.opcoes, correta:p.correta};
  mpEnvia(msg);
  mpMostraPergunta(msg);
  // timer autoritativo: tempo da pergunta + folga pra rede
  if(mp.roundTimer) clearTimeout(mp.roundTimer);
  mp.roundTimer=setTimeout(mpHostDecideRodada, tempoDe(p)+2500);
}
function mpMostraPergunta(m){
  mp.respondido=false; mp.idxAtual=m.idx; mp.corretaAtual=m.correta; mp.respAtual=m.r;
  document.getElementById('numPergunta').innerHTML='Pergunta '+(m.idx+1)+'/'+m.total+' '+seloCatHtml(m.c);
  renderRankingVivo([]);
  mostraPergunta({e:m.e, r:m.r, c:m.c, opcoes:m.opcoes, correta:m.correta}, (i)=>mpResponde(i));
  mp.inicioRodada=Date.now();
  iniciaCrono(tempoDe(m), ()=>{ if(!mp.respondido) mpResponde(-1); });
}
function mpResponde(escolha){
  if(mp.respondido) return;
  mp.respondido=true; paraCrono();
  const acertou = escolha===mp.corretaAtual;
  const ms=Date.now()-mp.inicioRodada;
  marcaOpcoes(mp.corretaAtual, escolha);
  const st=document.getElementById('statusRodada');
  st.textContent = acertou ? '✅ Acertou! Esperando os outros...' : (escolha===-1?'⏰ Tempo esgotado! ':'❌ Errou! ')+'Era: '+mp.respAtual;
  if(acertou){ animaCard('acertou'); somAcerto(); } else { animaCard('errou'); somErro(); }
  const r={t:'resposta', idx:mp.idxAtual, nome:mp.meuNome, correta:acertou, ms};
  if(mp.souHost) mpHostRecebeResposta(r); else mpEnvia(r);
}
function mpHostRecebeResposta(m){
  if(m.idx!==mp.idx || mp._decidindo) return;
  if(mp.respostas[m.nome]) return; // já respondeu
  mp.respostas[m.nome]={correta:!!m.correta, ms:m.ms||TEMPO_PERGUNTA};
  // ranking ao vivo: quem já respondeu
  const parcial={t:'placar', parcial:true, idx:mp.idx, placar:mp.placar, responderam:Object.keys(mp.respostas)};
  mpEnvia(parcial); mpAplicaPlacar(parcial);
  if(mp.jogadores.every(n=>mp.respostas[n])) mpHostDecideRodada();
}
function mpHostDecideRodada(){
  if(mp._decidindo || !mp.ativo) return;
  mp._decidindo=true;
  if(mp.roundTimer){ clearTimeout(mp.roundTimer); mp.roundTimer=null; }
  const ganhos={};
  mp.jogadores.forEach(n=>{
    const r=mp.respostas[n];
    if(r && r.correta){
      mp.combos[n]=(mp.combos[n]||0)+1;
      const pts=calculaPontos(r.ms, mp.combos[n]);
      mp.placar[n]=(mp.placar[n]||0)+pts; ganhos[n]=pts;
    } else { mp.combos[n]=0; ganhos[n]=0; }
  });
  const msg={t:'placar', parcial:false, idx:mp.idx, placar:mp.placar, ganhos, combos:mp.combos, correta:mp.corretaAtual};
  mpEnvia(msg); mpAplicaPlacar(msg);
  mp.idx++;
  if(mp.idx>=mp.perguntasHost.length) setTimeout(mpHostFim, 2600);
  else setTimeout(mpHostEnviaPergunta, 2600);
}
function mpHostFim(){
  const ranking=Object.entries(mp.placar).sort((a,b)=>b[1]-a[1]).map(([nome,pts])=>({nome,pts}));
  mpEnvia({t:'fim', ranking});
  mpFim(ranking);
}

/* ------- placar / ranking (todos) ------- */
function mpAplicaPlacar(m){
  mp.placar=m.placar||mp.placar;
  if(m.parcial){
    renderRankingVivo(m.responderam||[]);
    return;
  }
  const ganho=(m.ganhos||{})[mp.meuNome]||0;
  mp.meusPts=mp.placar[mp.meuNome]||0;
  mp.meuCombo=(m.combos||{})[mp.meuNome]||0;
  document.getElementById('hudPts').textContent=mp.meusPts;
  document.getElementById('hudCombo').textContent=mp.meuCombo>0?('x'+mp.meuCombo):'0';
  if(ganho>0){
    document.getElementById('statusRodada').textContent=`✅ +${ganho} pontos!`;
    soltaConfete(10);
    if(mp.meuCombo>=2){ mostraCombo(mp.meuCombo); if(mp.meuCombo>=3) somCombo(); }
  }
  renderRankingVivo(mp.jogadores);
}
function renderRankingVivo(responderam){
  const box=document.getElementById('rankingVivo');
  if(!mp.ativo){ box.innerHTML=''; return; }
  const ordem=Object.entries(mp.placar).sort((a,b)=>b[1]-a[1]);
  const medalhas=['🥇','🥈','🥉'];
  box.innerHTML=ordem.map(([n,p],i)=>
    `<span class="rankItem${n===mp.meuNome?' eu':''}${responderam.includes(n)?' ok':''}">${medalhas[i]||'•'} ${n}: <b>${p}</b>${responderam.includes(n)?' ✔':''}</span>`).join('');
}
function mpFim(ranking){
  paraCrono();
  mp.ativo=false; mp.comecou=false;
  if(mp.roundTimer){ clearTimeout(mp.roundTimer); mp.roundTimer=null; }
  const minhaPos=ranking.findIndex(r=>r.nome===mp.meuNome);
  const venci = minhaPos===0 && ranking.length>1 && (ranking.length<2 || ranking[0].pts>ranking[1].pts);
  const empate = ranking.length>1 && ranking[0].pts===ranking[1].pts && ranking[0].pts>0 && (ranking[minhaPos]||{}).pts===ranking[0].pts;
  // moedas por participar: 1º ganha 30, 2º 20, 3º 10, resto 5
  const premio=[30,20,10][minhaPos]!==undefined?[30,20,10][minhaPos]:5;
  moedas+=premio; salvaMoedas();
  document.getElementById('fimTitulo').textContent = venci ? '🏆 VOCÊ VENCEU!' : empate ? '🤝 EMPATE!' : `${['🥇','🥈','🥉'][minhaPos]||'🎖️'} Você ficou em ${minhaPos+1}º!`;
  document.getElementById('fimPodio').innerHTML=podioHtml(ranking);
  document.getElementById('fimPlacar').innerHTML=ranking.slice(3).map((r,i)=>`<div class="medalha">${i+4}º <b>${r.nome}</b> — ${r.pts} pts</div>`).join('');
  document.getElementById('fimMoedas').textContent=`Você ganhou 🪙 ${premio} moedas!`;
  document.getElementById('fimBotoes').innerHTML = mp.souHost
    ? `<button class="btn verde" style="font-size:22px;padding:16px 30px;" onclick="mpHostJogarDeNovo()">🔁 JOGAR DE NOVO</button>`
    : `<p class="sub">Espere o host começar de novo ou volte ao menu 😉</p>`;
  if(venci){ soltaConfete(70); somAcerto(); } else somErro();
  if(!mp.souHost){ /* convidado continua conectado esperando 'comeca' */ mp.ativo=false; }
  mostraTela('telaFim');
}
function podioHtml(ranking){
  const top=[ranking[1],ranking[0],ranking[2]]; // 2º, 1º, 3º
  const alt=[90,130,70], cor=['#b0bec5','#ffd600','#cd7f32'], med=['🥈','🥇','🥉'];
  return `<div class="podio">`+top.map((r,i)=> r ? `<div class="podioCol">
      <div class="podioNome">${r.nome}</div><div class="podioPts">${r.pts} pts</div>
      <div class="podioBase" style="height:${alt[i]}px;background:${cor[i]}">${med[i]}</div>
    </div>` : `<div class="podioCol"></div>`).join('')+`</div>`;
}
function mpHostJogarDeNovo(){
  if(!mp.souHost) return;
  if(!mp.ws || mp.ws.readyState!==1){ mostraMsg('Conexão caiu, crie uma sala nova 😅','#ffaa00'); abreOnline(); return; }
  mpHostComeca();
}
function mpFechaWs(){
  if(mp.ping){ clearInterval(mp.ping); mp.ping=null; }
  if(mp.vigia){ clearInterval(mp.vigia); mp.vigia=null; }
  if(mp.checaSala){ clearTimeout(mp.checaSala); mp.checaSala=null; }
  if(mp.roundTimer){ clearTimeout(mp.roundTimer); mp.roundTimer=null; }
  if(mp.ws){ try{ mp.ws.onclose=null; mp.ws.close(); }catch(e){} mp.ws=null; }
}
function mpDesliga(aviso){
  const estava=mp.ativo || mp.comecou || document.getElementById('telaOnline').classList.contains('on');
  mp.ativo=false; mp.comecou=false;
  if(mp.pollConvites){ clearInterval(mp.pollConvites); mp.pollConvites=null; }
  paraCrono();
  mpFechaWs();
  if(aviso) mostraMsg(aviso,'#ffaa00',2600);
  if(estava){ mostraTela('telaMenu'); atualizaSaldo(); }
}

/* =========================================================
   ENTRADA POR ?sala=XXXX (convite aceito)
   ========================================================= */
(function(){
  const q=new URLSearchParams(location.search);
  const salaConvite=q.get('sala');
  if(salaConvite && mpLogado()){
    setTimeout(()=>{
      try{
        abreOnline();
        mpEntrarSala(salaConvite.replace(/[^A-Za-z0-9]/g,'').toUpperCase().slice(0,10));
        const de=q.get('de'); if(de) mostraMsg(`😂 Entrando na sala de ${de}!`, '#00ff88', 2000);
      }catch(e){}
    }, 300);
  }
})();
