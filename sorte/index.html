<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="description" content="Sorte do Cogumelo — clique no cogumelo, ganhe moedas e gire a Máquina Maluca! Três 7 = prêmio gigante! Cogumelo Games.">
<title>🎰 Sorte do Cogumelo — Cogumelo Games</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
    background:linear-gradient(135deg, #0a0a2a 0%, #2a0a33 50%, #0d1b2a 100%);
    font-family:Arial, sans-serif; color:#fff; min-height:100vh;
    display:flex; flex-direction:column; align-items:center; padding:14px; overflow-x:hidden;
}
h1 { font-size:30px; margin:6px 0;
    background:linear-gradient(to right,#ffd700,#ff8800); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
#saldo { font-size:26px; color:#ffd700; font-weight:bold; margin:6px 0 14px; }
.area {
    display:flex; gap:24px; flex-wrap:wrap; justify-content:center; align-items:flex-start;
    width:100%; max-width:860px;
}
.card {
    background:rgba(20,20,50,0.85); border:2px solid #333; border-radius:22px;
    padding:22px; text-align:center; flex:1; min-width:300px;
}
.card h2 { margin-bottom:8px; }
.card .sub { color:#889; font-size:13px; margin-bottom:12px; }
#cogumelo {
    font-size:110px; cursor:pointer; user-select:none; -webkit-user-select:none;
    display:inline-block; transition:transform .08s;
}
#cogumelo.apertado { transform:scale(0.85); }
#ganhoClick { font-size:15px; color:#00ff88; font-weight:bold; min-height:22px; }
#maquina {
    display:flex; gap:12px; justify-content:center; margin:14px 0;
    background:#111128; border:4px solid #ffd700; border-radius:18px; padding:18px;
}
.rolo {
    width:84px; height:100px; background:linear-gradient(#fff, #ddd);
    border-radius:12px; border:3px solid #888;
    display:flex; align-items:center; justify-content:center;
    font-size:56px; font-weight:900; color:#222; font-family:monospace;
}
.rolo.girando { color:#999; }
.rolo.brilha { border-color:#ffd700; box-shadow:0 0 22px #ffd700; color:#cc8800; }
#btnGirar {
    font-size:22px; font-weight:bold; padding:14px 40px; border:none; border-radius:14px; cursor:pointer;
    background:linear-gradient(135deg,#ffd700,#ff8800); color:#332200;
}
#btnGirar:disabled { opacity:0.4; }
#resultado { font-size:20px; font-weight:bold; min-height:56px; margin-top:10px; }
.premios { font-size:13px; color:#9ad; text-align:left; display:inline-block; margin-top:10px; line-height:1.7; }
.premios b { color:#ffd700; }
.ficha-btn {
    font-size:14px; font-weight:bold; padding:10px 14px; border:2px solid #444; border-radius:12px; cursor:pointer;
    background:rgba(30,30,70,0.9); color:#fff;
}
.ficha-btn.sel { border-color:#ffd700; background:rgba(80,60,0,0.6); }
#melhorias { display:flex; flex-direction:column; gap:6px; margin-top:6px; }
#melhorias button {
    font-size:13px; font-weight:bold; padding:9px 10px; border:none; border-radius:10px; cursor:pointer;
    background:linear-gradient(135deg,#00cc66,#00ff88); color:#04220f; text-align:left;
}
#melhorias button:disabled { opacity:0.45; }
#melhorias button.comprada { background:#333; color:#00ff88; border:1px solid #00ff88; }
a.voltar { position:fixed; top:8px; left:10px; color:#888; text-decoration:none; z-index:40; font-size:14px; }
#confeteBox { position:fixed; inset:0; pointer-events:none; z-index:50; }
@media (max-width:700px){
    h1 { font-size:24px; }
    #cogumelo { font-size:90px; }
    .rolo { width:64px; height:80px; font-size:42px; }
}
</style>
</head>
<body>
<a class="voltar" href="/">← Cogumelo Games</a>
<h1>🎰 Sorte do Cogumelo</h1>
<div id="saldo">🪙 0</div>

<div class="area">
    <div class="card">
        <h2>🍄 Clica no Cogumelo!</h2>
        <div class="sub">💻 ESPAÇO ou mouse · 📱 toca perto do cogumelo</div>
        <div id="areaCog" style="padding:24px 30px; margin:-10px; border-radius:20px;">
            <div id="cogumelo">🍄</div>
            <div id="ganhoClick"></div>
        </div>
        <div class="sub" style="margin-top:10px">⬆️ Melhorias (clique rende mais!)</div>
        <div id="melhorias"></div>
    </div>

    <div class="card">
        <h2>🎰 Máquina Maluca</h2>
        <div class="sub">Escolha a ficha (preços fixos!):</div>
        <div id="fichas" style="display:flex; gap:8px; justify-content:center; margin-bottom:10px;"></div>
        <div id="maquina">
            <div class="rolo" id="r0">7</div>
            <div class="rolo" id="r1">7</div>
            <div class="rolo" id="r2">7</div>
        </div>
        <button id="btnGirar" onclick="girar()">🎰 GIRAR</button>
        <div id="resultado"></div>
        <div class="premios" id="tabelaPremios"></div>
    </div>
</div>
<canvas id="confeteBox"></canvas>

<script src="/stats.js?v=354"></script>
<script src="/avisos.js?v=6"></script>
<script>
if (window.initStats) initStats('sorte');

let moedas = parseInt(localStorage.getItem('sorte_moedas')||'0');
let melhorias = JSON.parse(localStorage.getItem('sorte_melhorias')||'[]');
const MELHORIAS = [
    { id:'dedo',    nome:'💪 Dedo Forte',       preco:100,    bonus:1 },
    { id:'luva',    nome:'🧤 Luva Turbo',        preco:500,    bonus:2 },
    { id:'duplo',   nome:'🍄🍄 Cogumelo Duplo',  preco:2000,   bonus:5 },
    { id:'bionica', nome:'🦾 Mão Biônica',       preco:8000,   bonus:10 },
    { id:'esporos', nome:'✨ Chuva de Esporos',  preco:25000,  bonus:25 },
    { id:'rei',     nome:'👑 Toque do Rei',      preco:100000, bonus:100 },
    { id:'mouse',   nome:'🖱️ Mouse de Ouro',     preco:300000,  bonus:250 },
    { id:'trovao',  nome:'🌩️ Dedo Trovão',       preco:800000,  bonus:600 },
    { id:'polvo',   nome:'🐙 Polvo Ajudante',    preco:2000000, bonus:1500 },
    { id:'foguete', nome:'🚀 Clique Foguete',    preco:5000000, bonus:4000 },
    { id:'galaxia', nome:'🌌 Mão Galáctica',     preco:12000000, bonus:10000 },
    { id:'supremo', nome:'🍄👑 COGUMELO SUPREMO', preco:30000000, bonus:30000 }
];
function bonusClique(){ return MELHORIAS.filter(m=>melhorias.includes(m.id)).reduce((s,m)=>s+m.bonus, 0); }
let girando = false;
let audio;
function som(freq, dur, tipo='square', vol=0.12){
    try{
        audio = audio || new (window.AudioContext||window.webkitAudioContext)();
        const o=audio.createOscillator(), g=audio.createGain();
        o.type=tipo; o.frequency.value=freq; g.gain.value=vol;
        g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime+dur);
        o.connect(g); g.connect(audio.destination); o.start(); o.stop(audio.currentTime+dur);
    }catch(e){}
}
function salva(){
    localStorage.setItem('sorte_moedas', moedas);
    localStorage.setItem('sorte_melhorias', JSON.stringify(melhorias));
}
function atualiza(){ document.getElementById('saldo').textContent = `🪙 ${moedas}`; }

// ============ CLICKER ============
let combo = 0, ultimoClick = 0;
const cog = document.getElementById('cogumelo');
function clicou(e){
    if(e) e.preventDefault();
    const agora = Date.now();
    combo = (agora - ultimoClick < 600) ? Math.min(combo+1, 50) : 1;
    ultimoClick = agora;
    const ganho = (1 + bonusClique()) * (1 + Math.floor(combo/10)); // melhorias + combo!
    moedas += ganho; salva(); atualiza();
    cog.classList.add('apertado');
    setTimeout(()=>cog.classList.remove('apertado'), 70);
    document.getElementById('ganhoClick').textContent = `+${ganho} 🪙` + (combo>=10 ? ` (combo x${Math.floor(combo/10)+1}!)` : '');
    som(300+combo*8, 0.05, 'square', 0.06);
}
// 💻 mouse no cogumelo OU barra de ESPAÇO | 📱 tocar em qualquer lugar perto do cogumelo
const areaCog = document.getElementById('areaCog');
areaCog.addEventListener('mousedown', clicou);
areaCog.addEventListener('touchstart', clicou, {passive:false});
document.addEventListener('keydown', e=>{
    if(e.code==='Space' && !e.repeat){ e.preventDefault(); clicou(); }
});

// ============ MÁQUINA MALUCA ============
function girar(){
    if(girando) return;
    const FICHA = FICHAS[fichaIdx].valor;
    const MULT = FICHAS[fichaIdx].mult;   // trava o prêmio da ficha PAGA (sem troca no meio!)
    if(moedas < FICHA){
        document.getElementById('resultado').textContent = 'Moedas de menos! Clica no cogumelo! 🍄';
        som(180,0.3,'sawtooth');
        return;
    }
    moedas -= FICHA; salva(); atualiza();
    girando = true;
    document.getElementById('btnGirar').disabled = true;
    document.getElementById('resultado').textContent = '';
    const rolos = [0,1,2].map(i=>document.getElementById('r'+i));
    rolos.forEach(r=>{ r.classList.remove('brilha'); r.classList.add('girando'); });
    // sorteia o resultado final (1 a 7 em cada rolo)
    const fin = [0,1,2].map(()=>1+Math.floor(Math.random()*7));
    // animação: números girando, cada rolo para numa hora
    let frame = 0;
    const anim = setInterval(()=>{
        frame++;
        rolos.forEach((r,i)=>{
            if(frame < 14 + i*10) r.textContent = 1+Math.floor(Math.random()*7);
            else { r.textContent = fin[i]; r.classList.remove('girando'); }
        });
        if(frame % 3 === 0) som(200+frame*10, 0.04, 'square', 0.05);
        if(frame >= 14 + 2*10 + 2){
            clearInterval(anim);
            resolve(fin, rolos, MULT);
        }
    }, 70);
}
function resolve(fin, rolos, mult){
    girando = false;
    document.getElementById('btnGirar').disabled = false;
    const [a,b,c] = fin;
    const res = document.getElementById('resultado');
    let ganho = 0;
    if(a===7 && b===7 && c===7){
        ganho = 10000*mult;
        res.innerHTML = '🎆 <span style="color:#ffd700">JACKPOT!!! 7-7-7!!! +🪙 10.000</span> 🎆';
        rolos.forEach(r=>r.classList.add('brilha'));
        for(let i=0;i<8;i++) setTimeout(()=>som(500+i*120,0.15),i*120);
        soltaConfete(200);
    } else if(a===b && b===c){
        ganho = 1000*mult;
        res.innerHTML = `⭐ TRÊS IGUAIS! ${a}-${b}-${c}! <span style="color:#ffd700">+🪙 ${(1000*mult).toLocaleString('pt-BR')}</span> ⭐`;
        rolos.forEach(r=>r.classList.add('brilha'));
        som(500,0.1); setTimeout(()=>som(700,0.1),120); setTimeout(()=>som(900,0.3),240);
        soltaConfete(80);
    } else if(a===b || b===c || a===c){
        ganho = 75*mult;
        res.innerHTML = `Dois iguais! <span style="color:#00ff88">+🪙 ${75*mult}</span> 😄`;
        som(500,0.15);
    } else {
        res.textContent = 'Quase! Tenta de novo! 😅';
        som(200,0.25,'sawtooth');
    }
    moedas += ganho; salva(); atualiza();
}

// ============ CONFETE ============
const ccv = document.getElementById('confeteBox'), cctx = ccv.getContext('2d');
function ajustaConfete(){ ccv.width=innerWidth; ccv.height=innerHeight; }
ajustaConfete(); addEventListener('resize', ajustaConfete);
let confetes=[];
function soltaConfete(n){
    for(let i=0;i<n;i++) confetes.push({
        x:Math.random()*ccv.width, y:-10-Math.random()*150,
        vy:2+Math.random()*4, vx:(Math.random()-0.5)*3,
        cor:`hsl(${Math.random()*360},90%,60%)`, tam:5+Math.random()*7
    });
}
(function animaConfete(){
    cctx.clearRect(0,0,ccv.width,ccv.height);
    confetes.forEach(c=>{ c.y+=c.vy; c.x+=c.vx; cctx.fillStyle=c.cor; cctx.fillRect(c.x,c.y,c.tam,c.tam); });
    confetes = confetes.filter(c=>c.y<ccv.height+20);
    requestAnimationFrame(animaConfete);
})();

function montaMelhorias(){
    const el = document.getElementById('melhorias');
    el.innerHTML='';
    MELHORIAS.forEach(m=>{
        const tem = melhorias.includes(m.id);
        const b = document.createElement('button');
        if(tem){ b.className='comprada'; b.textContent = `✅ ${m.nome} (+${m.bonus}/clique)`; b.disabled=true; }
        else {
            b.textContent = `${m.nome} — +${m.bonus}/clique — 🪙 ${m.preco}`;
            b.disabled = moedas < m.preco;
            b.onclick = ()=>{
                if(moedas<m.preco) return;
                moedas-=m.preco; melhorias.push(m.id); salva(); atualiza(); montaMelhorias();
                som(600,0.1); setTimeout(()=>som(900,0.2),100);
            };
        }
        el.appendChild(b);
    });
}

// ============ FICHAS (preços FIXOS — sem digitar aposta!) ============
const FICHAS = [
    { nome:'🥉 Bronze', valor:50,   mult:1 },
    { nome:'🥈 Prata',  valor:250,  mult:5 },
    { nome:'🥇 Ouro',   valor:1000, mult:20 },
    { nome:'💎 Diamante', valor:10000, mult:250 }
];
let fichaIdx = 0;
function montaFichas(){
    const el = document.getElementById('fichas');
    el.innerHTML='';
    FICHAS.forEach((f,i)=>{
        const b = document.createElement('button');
        b.className = 'ficha-btn' + (i===fichaIdx?' sel':'');
        b.textContent = `${f.nome} 🪙${f.valor}`;
        b.onclick = ()=>{ if(girando) return; fichaIdx=i; montaFichas(); som(500,0.06); };
        el.appendChild(b);
    });
    const f = FICHAS[fichaIdx];
    document.getElementById('btnGirar').textContent = `🎰 GIRAR (🪙 ${f.valor})`;
    document.getElementById('tabelaPremios').innerHTML =
        `<b>7 7 7</b> = 🪙 ${(10000*f.mult).toLocaleString('pt-BR')} — JACKPOT!!! 🎆<br>` +
        `Três iguais (sem ser 7) = 🪙 ${(1000*f.mult).toLocaleString('pt-BR')} ⭐<br>` +
        `Dois iguais = 🪙 ${75*f.mult}<br>` +
        `Nada igual = tenta de novo! 😅`;
}

atualiza();
montaMelhorias();
montaFichas();
setInterval(montaMelhorias, 3000); // atualiza botões conforme junta moedas
</script>
<script src="/mascote.js"></script>
<script src="/gamepad.js?v=354"></script>
</body>
</html>
