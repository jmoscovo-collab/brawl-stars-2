<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Cogumelo Espacial — Cogumelo Games</title>
<meta name="description" content="Cogumelo Espacial: pilote a nave-cogumelo, quebre meteoros, pegue esporos e enfrente o chefão alienígena de cada planeta! Jogo grátis do Cogumelo Games.">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { width:100%; height:100%; overflow:hidden; background:#05030f; font-family:Arial,sans-serif; color:#fff; user-select:none; touch-action:none; }
#jogo { position:fixed; inset:0; width:100%; height:100%; display:block; }
.tela { position:fixed; inset:0; display:none; flex-direction:column; align-items:center; justify-content:flex-start; overflow-y:auto;
    padding:14px 14px 30px; background:radial-gradient(circle at 50% 30%, rgba(60,20,110,0.85), rgba(5,3,15,0.95) 75%); touch-action:pan-y; }
.tela.on { display:flex; }
h1 { font-size:30px; margin:6px 0 2px; text-align:center;
    background:linear-gradient(to right,#ff5a5a,#ffe14a,#5affd0); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.sub { color:#abc; font-size:14px; margin-bottom:10px; text-align:center; }
button { font-family:inherit; font-size:16px; font-weight:bold; padding:11px 18px; border:none; border-radius:12px; cursor:pointer;
    background:linear-gradient(135deg,#ffe14a,#ff9a2a); color:#3a1a00; box-shadow:0 3px 0 rgba(0,0,0,0.4); }
button:active { transform:translateY(2px); box-shadow:none; }
button.cinza { background:#3a3f5a; color:#fff; }
button.verde { background:linear-gradient(135deg,#7dff6a,#2fd0a0); color:#06281a; }
button:disabled { opacity:0.4; cursor:default; }
.linha { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin:10px 0; }
a.voltar { color:#889; text-decoration:none; margin-top:14px; font-size:14px; }
#mapa { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; max-width:640px; margin-top:6px; }
.planeta { width:140px; padding:8px; border-radius:16px; background:rgba(255,255,255,0.06); border:2px solid #334; text-align:center; cursor:pointer; }
.planeta canvas { width:80px; height:80px; display:block; margin:0 auto 4px; }
.planeta b { display:block; font-size:14px; }
.planeta span { font-size:12px; color:#bcd; }
.planeta.trancado { opacity:0.4; cursor:default; }
.planeta.feito { border-color:#7dff6a; }
#saldoEsp { font-size:17px; font-weight:bold; color:#ffe14a; margin:4px 0; }
#oficina { display:flex; flex-direction:column; gap:8px; width:min(94vw,420px); }
.up { display:flex; align-items:center; gap:8px; background:rgba(255,255,255,0.07); border-radius:12px; padding:8px 10px; }
.up .ic { font-size:26px; }
.up .tx { flex:1; font-size:14px; }
.up .tx small { color:#abc; display:block; }
.up button { padding:8px 12px; font-size:14px; }
#hud { position:fixed; top:0; left:0; right:0; display:none; justify-content:space-between; align-items:flex-start; padding:8px 10px; pointer-events:none; font-weight:bold; font-size:16px; text-shadow:0 2px 3px #000; }
#hud.on { display:flex; }
#hudDir { text-align:right; }
#btPausa { pointer-events:auto; padding:6px 10px; font-size:16px; margin-left:8px; }
#barraChefe { position:fixed; top:44px; left:50%; transform:translateX(-50%); width:min(80vw,420px); display:none; text-align:center; font-weight:bold; font-size:14px; text-shadow:0 2px 3px #000; pointer-events:none; }
#barraChefe .fundo { height:14px; background:#311; border:2px solid #a44; border-radius:8px; overflow:hidden; margin-top:2px; }
#barraChefe .fundo div { height:100%; background:linear-gradient(90deg,#ff3a3a,#ffb03a); width:100%; }
#aviso { position:fixed; top:38%; left:0; right:0; text-align:center; font-size:30px; font-weight:bold; text-shadow:0 3px 6px #000; pointer-events:none; opacity:0; transition:opacity .3s; }
#especial { position:fixed; right:18px; bottom:96px; width:84px; height:84px; border-radius:50%; font-size:32px; padding:0; display:none;
    background:radial-gradient(circle,#ff6ad0,#8a2aff); color:#fff; box-shadow:0 0 16px #ff6ad0; }
#especial.on { display:block; }
#especial.carregando { filter:grayscale(1); opacity:.5; box-shadow:none; }
.caixa { background:rgba(20,10,45,0.95); border:3px solid #5a3a8a; border-radius:18px; padding:16px; max-width:440px; width:100%; text-align:center; margin-top:6vh; }
.caixa ul { text-align:left; padding-left:20px; color:#cde; font-size:14px; line-height:1.55; }
.grande { font-size:44px; }
</style>
<script src="/cogucoins.js?v=551"></script>
</head>
<body>
<canvas id="jogo"></canvas>

<div id="hud">
    <div id="hudEsq"></div>
    <div id="hudDir"><span id="hudInfo"></span><button class="cinza" id="btPausa" onclick="pausar()">⏸️</button></div>
</div>
<div id="barraChefe"><span id="nomeChefe"></span><div class="fundo"><div id="vidaChefe"></div></div></div>
<div id="aviso"></div>
<button id="especial" onclick="usaEspecial()">💥</button>

<!-- ======== MAPA DA GALÁXIA ======== -->
<div class="tela on" id="telaMapa">
    <h1>🍄🚀 Cogumelo Espacial</h1>
    <div class="sub">Voe pela galáxia, quebre meteoros e vença o chefão de cada planeta!</div>
    <div id="saldoEsp"></div>
    <div id="mapa"></div>
    <div class="linha">
        <button class="verde" onclick="abreOficina()">🔧 Oficina da nave</button>
        <button class="cinza" onclick="abreComoJogar()">❓ Como jogar</button>
    </div>
    <a class="voltar" href="/">← Voltar pros jogos</a>
</div>

<!-- ======== OFICINA ======== -->
<div class="tela" id="telaOficina">
    <h1>🔧 Oficina da Nave</h1>
    <div class="sub">Use os ✨ esporos que você pegou pra melhorar a nave-cogumelo</div>
    <div id="saldoOf" style="font-size:18px; font-weight:bold; color:#ffe14a; margin-bottom:8px"></div>
    <div id="oficina"></div>
    <div class="linha"><button class="cinza" onclick="abreMapa()">↩️ Voltar</button></div>
</div>

<!-- ======== RESULTADO / PAUSA / COMO JOGAR ======== -->
<div class="tela" id="telaMsg"><div class="caixa" id="msgCaixa"></div></div>

<script src="/stats.js?v=496"></script>
<script>
if (window.initStats) initStats('espacial');

/* ================= DADOS ================= */
var SAVE_KEY = 'espacial_save';
var dados = { esporos: 0, liberado: 1, estrelas: {}, up: { vida: 0, tiro: 0, motor: 0, ima: 0, especial: 0 } };
function carrega() {
    try {
        var d = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
        if (d && d.up) { dados = d; dados.estrelas = dados.estrelas || {}; }
    } catch (e) {}
}
function salva() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(dados)); } catch (e) {} }
carrega();

var PLANETAS = [
    { nome: 'Lua Cogumelo', cor: '#c8c0e0', cor2: '#8a80b0', fundo: '#0b0820', chefe: 'Polvo Lunar', chefeCor: '#b06aff', tipo: 'polvo', meteoros: 1, inimigos: 0.6, precisa: 25 },
    { nome: 'Marte Picante', cor: '#ff6a3a', cor2: '#a8301a', fundo: '#1a0606', chefe: 'Caranguejo de Lava', chefeCor: '#ff3a1a', tipo: 'carangueijo', meteoros: 1.2, inimigos: 0.8, precisa: 30 },
    { nome: 'Planeta Gelado', cor: '#9ae8ff', cor2: '#3a8ab0', fundo: '#04121e', chefe: 'Olhão de Gelo', chefeCor: '#5ad0ff', tipo: 'olho', meteoros: 1.3, inimigos: 1, precisa: 35 },
    { nome: 'Selva Verde', cor: '#5aff6a', cor2: '#1a8a3a', fundo: '#03140a', chefe: 'Planta Carnívora', chefeCor: '#3ad84a', tipo: 'planta', meteoros: 1.3, inimigos: 1.2, precisa: 40 },
    { nome: 'Anéis Dourados', cor: '#ffd84a', cor2: '#b08a1a', fundo: '#14100a', chefe: 'Robô Real', chefeCor: '#ffcc33', tipo: 'robo', meteoros: 1.5, inimigos: 1.3, precisa: 45 },
    { nome: 'Buraco Roxo', cor: '#c84aff', cor2: '#4a1a8a', fundo: '#0a0414', chefe: 'Rei Alienígena', chefeCor: '#7dff6a', tipo: 'rei', meteoros: 1.7, inimigos: 1.5, precisa: 50 }
];

var UPS = [
    { id: 'vida', ic: '❤️', nome: 'Casco forte', desc: '+1 coração', max: 5, preco: function (n) { return 40 + n * 40; } },
    { id: 'tiro', ic: '🔫', nome: 'Canhão', desc: 'tiro mais forte e mais rápido', max: 5, preco: function (n) { return 50 + n * 50; } },
    { id: 'motor', ic: '🔥', nome: 'Motor turbo', desc: 'nave mais rápida', max: 4, preco: function (n) { return 40 + n * 35; } },
    { id: 'ima', ic: '🧲', nome: 'Ímã de esporos', desc: 'puxa os esporos de longe', max: 4, preco: function (n) { return 30 + n * 30; } },
    { id: 'especial', ic: '💥', nome: 'Bomba de esporos', desc: 'especial carrega mais rápido', max: 4, preco: function (n) { return 60 + n * 50; } }
];

/* ================= TELAS ================= */
function mostraTela(id) {
    ['telaMapa', 'telaOficina', 'telaMsg'].forEach(function (t) { document.getElementById(t).classList.toggle('on', t === id); });
    var jogando = !id;
    document.getElementById('hud').classList.toggle('on', jogando || id === 'telaMsg' && J && J.pausado);
    document.getElementById('especial').classList.toggle('on', jogando);
}
function desenhaPlaneta(c, x, y, r, p, t) {
    var g = c.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.1, x, y, r);
    g.addColorStop(0, '#fff'); g.addColorStop(0.15, p.cor); g.addColorStop(1, p.cor2);
    c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill();
    c.fillStyle = 'rgba(0,0,0,0.15)';
    for (var i = 0; i < 3; i++) { c.beginPath(); c.arc(x + Math.cos(i * 2.1 + (t || 0)) * r * 0.5, y + Math.sin(i * 2.1) * r * 0.4, r * 0.18, 0, 7); c.fill(); }
    if (p.nome === 'Anéis Dourados') {
        c.strokeStyle = 'rgba(255,230,140,0.8)'; c.lineWidth = r * 0.12;
        c.beginPath(); c.ellipse(x, y, r * 1.5, r * 0.4, -0.3, 0, 7); c.stroke();
    }
}
function abreMapa() {
    document.getElementById('saldoEsp').textContent = '✨ ' + dados.esporos + ' esporos';
    var m = document.getElementById('mapa'); m.innerHTML = '';
    PLANETAS.forEach(function (p, i) {
        var d = document.createElement('div');
        var livre = i < dados.liberado, est = dados.estrelas[i] || 0;
        d.className = 'planeta' + (livre ? '' : ' trancado') + (est ? ' feito' : '');
        var cv = document.createElement('canvas'); cv.width = 80; cv.height = 80; d.appendChild(cv);
        desenhaPlaneta(cv.getContext('2d'), 40, 40, 26, p);
        var b = document.createElement('b'); b.textContent = (i + 1) + '. ' + p.nome; d.appendChild(b);
        var s = document.createElement('span');
        s.textContent = livre ? ('⭐'.repeat(est) + '☆'.repeat(3 - est) + ' · 👾 ' + p.chefe) : '🔒 vença o planeta antes';
        d.appendChild(s);
        if (livre) d.onclick = function () { comeca(i); };
        m.appendChild(d);
    });
    if (dados.liberado > PLANETAS.length) {
        var f = document.createElement('div'); f.className = 'planeta feito';
        f.innerHTML = '<div class="grande">♾️</div><b>Modo Infinito</b><span>ondas sem fim!</span>';
        f.onclick = function () { comeca(-1); };
        m.appendChild(f);
    }
    mostraTela('telaMapa');
}
function abreOficina() {
    document.getElementById('saldoOf').textContent = '✨ ' + dados.esporos + ' esporos';
    var o = document.getElementById('oficina'); o.innerHTML = '';
    UPS.forEach(function (u) {
        var n = dados.up[u.id] || 0, d = document.createElement('div'); d.className = 'up';
        var preco = u.preco(n), cheio = n >= u.max;
        d.innerHTML = '<div class="ic">' + u.ic + '</div><div class="tx"><b>' + u.nome + '</b> ' + '🟩'.repeat(n) + '⬜'.repeat(u.max - n) + '<small>' + u.desc + '</small></div>';
        var bt = document.createElement('button');
        bt.textContent = cheio ? 'MÁX' : ('✨ ' + preco);
        bt.disabled = cheio || dados.esporos < preco;
        bt.onclick = function () { dados.esporos -= preco; dados.up[u.id] = n + 1; salva(); som('up'); abreOficina(); };
        d.appendChild(bt); o.appendChild(d);
    });
    mostraTela('telaOficina');
}
function msg(html) { document.getElementById('msgCaixa').innerHTML = html; mostraTela('telaMsg'); }
function abreComoJogar() {
    msg('<h2>❓ Como jogar</h2><ul>' +
        '<li>🖱️ <b>PC:</b> WASD ou setas pra voar. A nave atira sozinha no inimigo mais perto! <b>Espaço</b> = bomba de esporos 💥</li>' +
        '<li>📱 <b>Celular:</b> encoste o dedo e arraste pra pilotar (aparece um joystick). Botão 💥 = bomba</li>' +
        '<li>🎮 <b>Controle:</b> analógico pra voar, X/A pra bomba</li>' +
        '<li>☄️ Quebre meteoros e aliens pra soltar <b>✨ esporos</b></li>' +
        '<li>Encha a barra de esporos do planeta e o <b>👾 CHEFÃO</b> aparece!</li>' +
        '<li>Vença o chefão pra liberar o próximo planeta. Sem tomar dano = ⭐⭐⭐</li>' +
        '<li>Na 🔧 <b>Oficina</b> use os esporos pra melhorar a nave</li>' +
        '<li>Venceu os 6 planetas? Abre o ♾️ <b>Modo Infinito</b>!</li></ul>' +
        '<div class="linha"><button onclick="abreMapa()">Bora! 🚀</button></div>');
}

/* ================= SOM ================= */
var AC = null;
function som(tipo) {
    try {
        if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
        var o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
        o.connect(g); g.connect(AC.destination);
        var cfg = { tiro: ['square', 880, 440, 0.03, 0.06], boom: ['sawtooth', 160, 40, 0.12, 0.25], pega: ['sine', 900, 1400, 0.06, 0.08],
            dano: ['sawtooth', 300, 80, 0.15, 0.3], up: ['triangle', 500, 1000, 0.12, 0.2], bomba: ['sawtooth', 90, 30, 0.2, 0.6], chefe: ['square', 120, 240, 0.1, 0.5] }[tipo];
        if (!cfg) return;
        o.type = cfg[0]; o.frequency.setValueAtTime(cfg[1], t); o.frequency.exponentialRampToValueAtTime(cfg[2], t + cfg[4]);
        g.gain.setValueAtTime(cfg[3], t); g.gain.exponentialRampToValueAtTime(0.001, t + cfg[4]);
        o.start(t); o.stop(t + cfg[4]);
    } catch (e) {}
}

/* ================= JOGO ================= */
var cv = document.getElementById('jogo'), ctx = cv.getContext('2d');
var W = 0, H = 0, DPR = 1, CELULAR = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
function tam() {
    DPR = Math.min(window.devicePixelRatio || 1, 1.5);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.floor(W * DPR); cv.height = Math.floor(H * DPR);
}
window.addEventListener('resize', tam); tam();

var ESTRELAS = [];
for (var i = 0; i < 160; i++) ESTRELAS.push({ x: Math.random() * 2000, y: Math.random() * 2000, z: 0.2 + Math.random() * 0.8 });

var J = null; // estado da partida
var teclas = {};
window.addEventListener('keydown', function (e) {
    teclas[e.key.toLowerCase()] = true;
    if (e.key === ' ' && J && !J.fim) { usaEspecial(); e.preventDefault(); }
    if ((e.key === 'Escape' || e.key === 'p') && J && !J.fim) pausar();
});
window.addEventListener('keyup', function (e) { teclas[e.key.toLowerCase()] = false; });

// joystick de toque (aparece onde encostar)
var toque = { ativo: false, id: null, ox: 0, oy: 0, dx: 0, dy: 0 };
cv.addEventListener('pointerdown', function (e) {
    if (!J || J.pausado) return;
    toque.ativo = true; toque.id = e.pointerId; toque.ox = e.clientX; toque.oy = e.clientY; toque.dx = 0; toque.dy = 0;
    try { cv.setPointerCapture(e.pointerId); } catch (er) {}
});
cv.addEventListener('pointermove', function (e) {
    if (!toque.ativo || e.pointerId !== toque.id) return;
    toque.dx = e.clientX - toque.ox; toque.dy = e.clientY - toque.oy;
    var d = Math.hypot(toque.dx, toque.dy), max = 60;
    if (d > max) { // joystick "segue" o dedo
        toque.ox += toque.dx * (1 - max / d); toque.oy += toque.dy * (1 - max / d);
        toque.dx = e.clientX - toque.ox; toque.dy = e.clientY - toque.oy;
    }
});
function soltaToque(e) { if (e.pointerId === toque.id) { toque.ativo = false; toque.dx = toque.dy = 0; } }
cv.addEventListener('pointerup', soltaToque); cv.addEventListener('pointercancel', soltaToque);

function comeca(idx) {
    var inf = idx < 0, p = inf ? PLANETAS[Math.floor(Math.random() * PLANETAS.length)] : PLANETAS[idx];
    var up = dados.up;
    J = {
        idx: idx, inf: inf, p: p, t: 0, fim: false, pausado: false,
        nave: { x: 0, y: 0, vx: 0, vy: 0, ang: -Math.PI / 2, r: 18, vida: 3 + up.vida, vidaMax: 3 + up.vida, inv: 0, cadencia: 0 },
        tiros: [], tirosInim: [], meteoros: [], inimigos: [], esporos: [], parts: [], textos: [],
        pegou: 0, precisa: inf ? 999999 : p.precisa, ganhouEsp: 0, danoTomado: 0,
        chefe: null, chefeVencido: false, especial: 0, tremer: 0,
        spawnM: 0, spawnI: 0, onda: 1, abates: 0
    };
    for (var k = 0; k < 6; k++) criaMeteoro(true);
    document.getElementById('barraChefe').style.display = 'none';
    mostraTela(null);
    avisa(inf ? '♾️ Modo Infinito!' : ('🪐 ' + p.nome), 2);
    if (window.cgHalloween && cgHalloween.partida) try { cgHalloween.partida('espacial'); } catch (e) {}
}

function avisa(txt, seg) {
    var a = document.getElementById('aviso'); a.textContent = txt; a.style.opacity = 1;
    clearTimeout(avisa.t); avisa.t = setTimeout(function () { a.style.opacity = 0; }, (seg || 1.5) * 1000);
}

function longeDaNave(dist) {
    var a = Math.random() * Math.PI * 2, n = J.nave;
    return { x: n.x + Math.cos(a) * dist, y: n.y + Math.sin(a) * dist };
}
function criaMeteoro(perto, tam) {
    var pos = longeDaNave(perto ? 250 + Math.random() * 300 : Math.max(W, H) * 0.7 + 60);
    var r = tam || (18 + Math.random() * 30);
    var pts = [];
    for (var i = 0; i < 9; i++) pts.push(0.75 + Math.random() * 0.35);
    var alvo = Math.atan2(J.nave.y - pos.y, J.nave.x - pos.x) + (Math.random() - 0.5) * 1.2;
    var vel = 30 + Math.random() * 50 * J.p.meteoros;
    J.meteoros.push({ x: pos.x, y: pos.y, vx: Math.cos(alvo) * vel, vy: Math.sin(alvo) * vel, r: r, vida: Math.ceil(r / 12), pts: pts, rot: 0, vr: (Math.random() - 0.5) * 2 });
}
function criaInimigo() {
    var pos = longeDaNave(Math.max(W, H) * 0.7 + 60);
    var tipos = ['ufo', 'ufo', 'bicho'];
    if (J.idx >= 2 || J.inf) tipos.push('atirador');
    var tp = tipos[Math.floor(Math.random() * tipos.length)];
    var forca = 1 + (J.inf ? J.onda * 0.25 : J.idx * 0.3);
    J.inimigos.push({ x: pos.x, y: pos.y, vx: 0, vy: 0, tipo: tp, r: tp === 'bicho' ? 14 : 18, vida: Math.round((tp === 'bicho' ? 1 : 3) * forca),
        vel: (tp === 'bicho' ? 120 : 80) + Math.random() * 30, recarga: 1 + Math.random() * 2, fase: Math.random() * 7 });
}

var CHEFES = {
    polvo: { vida: 60, r: 55 }, carangueijo: { vida: 90, r: 60 }, olho: { vida: 110, r: 55 },
    planta: { vida: 140, r: 60 }, robo: { vida: 170, r: 62 }, rei: { vida: 230, r: 66 }
};
function chamaChefe() {
    var cfg = CHEFES[J.p.tipo], pos = longeDaNave(Math.min(W, H) * 0.45 + 120);
    var vida = cfg.vida * (J.inf ? 0.6 + J.onda * 0.3 : 1);
    J.chefe = { x: pos.x, y: pos.y, r: cfg.r, vida: vida, vidaMax: vida, tipo: J.p.tipo, cor: J.p.chefeCor, t: 0, ataque: 2, fase: 0, flash: 0 };
    J.inimigos.length = 0;
    document.getElementById('nomeChefe').textContent = '👾 ' + J.p.chefe;
    document.getElementById('barraChefe').style.display = 'block';
    avisa('⚠️ CHEFÃO: ' + J.p.chefe + '!', 2.5); som('chefe'); J.tremer = 0.6;
}

function tiroInimigo(x, y, ang, vel, r, cor) {
    J.tirosInim.push({ x: x, y: y, vx: Math.cos(ang) * vel, vy: Math.sin(ang) * vel, r: r || 7, cor: cor || '#ff4a6a', vida: 6 });
}
function ataqueChefe(c) {
    var n = J.nave, angN = Math.atan2(n.y - c.y, n.x - c.x), i, f = c.vida < c.vidaMax / 2 ? 1.4 : 1;
    switch (c.tipo) {
        case 'polvo': // anel de bolhas
            for (i = 0; i < 10; i++) tiroInimigo(c.x, c.y, i / 10 * Math.PI * 2 + c.fase, 140 * f, 8, '#d08aff');
            c.fase += 0.3; return 1.8 / f;
        case 'carangueijo': // leque de lava

}

/* ---------- atualização ---------- */
function alvoMaisPerto() {
    var n = J.nave, best = null, bd = 520;
    function testa(o) { var d = Math.hypot(o.x - n.x, o.y - n.y) - (o.r || 0); if (d < bd) { bd = d; best = o; } }
    if (J.chefe) testa(J.chefe);
    J.inimigos.forEach(testa);
    if (!best || best === J.chefe && bd > 400) J.meteoros.forEach(testa);
    return best;
}

function atualiza(dt) {
    var n = J.nave, up = dados.up;
    J.t += dt;
    // controle
    var ax = 0, ay = 0;
    if (teclas['a'] || teclas['arrowleft']) ax -= 1;
    if (teclas['d'] || teclas['arrowright']) ax += 1;
    if (teclas['w'] || teclas['arrowup']) ay -= 1;
    if (teclas['s'] || teclas['arrowdown']) ay += 1;
    if (toque.ativo) { ax = toque.dx / 60; ay = toque.dy / 60; }
    var gp = navigator.getGamepads ? navigator.getGamepads() : [];
    for (var g = 0; g < gp.length; g++) if (gp[g]) {
        var gx = gp[g].axes[0] || 0, gy = gp[g].axes[1] || 0;
        if (Math.abs(gx) > 0.2 || Math.abs(gy) > 0.2) { ax = gx; ay = gy; }
        if (gp[g].buttons[0] && gp[g].buttons[0].pressed) usaEspecial();
        if (gp[g].buttons[9] && gp[g].buttons[9].pressed && !J.fim) pausar();
    }
    var mag = Math.hypot(ax, ay); if (mag > 1) { ax /= mag; ay /= mag; }
    var vmax = 230 + up.motor * 40;
    n.vx += (ax * vmax - n.vx) * Math.min(1, dt * 5);
    n.vy += (ay * vmax - n.vy) * Math.min(1, dt * 5);
    if (!J.fim) { n.x += n.vx * dt; n.y += n.vy * dt; }
    if (Math.hypot(n.vx, n.vy) > 20) n.ang = Math.atan2(n.vy, n.vx);
    if (n.inv > 0) n.inv -= dt;

    // tiro automático
    n.cadencia -= dt;
    var alvo = alvoMaisPerto();
    if (alvo && n.cadencia <= 0 && !J.fim) {
        n.cadencia = 0.32 - up.tiro * 0.035;
        var a = Math.atan2(alvo.y - n.y, alvo.x - n.x);
        var dano = 1 + up.tiro * 0.5, nt = up.tiro >= 3 ? 2 : 1;
        for (var k = 0; k < nt; k++) {
            var off = nt > 1 ? (k - 0.5) * 0.12 : 0;
            J.tiros.push({ x: n.x, y: n.y, vx: Math.cos(a + off) * 620, vy: Math.sin(a + off) * 620, vida: 0.9, dano: dano });
        }
        som('tiro');
    }
    // especial carrega
    if (J.especial < 1) J.especial = Math.min(1, J.especial + dt / (22 - up.especial * 3.5));

    // spawns
    if (!J.chefe && !J.fim) {

        if (J.spawnM <= 0 && J.meteoros.length < 14) { criaMeteoro(false); J.spawnM = 1.6 / (J.p.meteoros * dif); }
        if (J.spawnI <= 0 && J.inimigos.length < 10) { criaInimigo(); J.spawnI = 3 / (J.p.inimigos * dif); }
        if (J.pegou >= J.precisa) chamaChefe();
        if (J.inf && J.abates >= 15 + J.onda * 5) { J.abates = 0; J.onda++; avisa('🌊 Onda ' + J.onda + '!'); if (J.onda % 3 === 0) { J.p = PLANETAS[Math.floor(Math.random() * PLANETAS.length)]; chamaChefe(); } }
    }

    // tiros
    J.tiros = J.tiros.filter(function (t) {
        t.x += t.vx * dt; t.y += t.vy * dt; t.vida -= dt;
        var i, o;
        for (i = 0; i < J.meteoros.length; i++) { o = J.meteoros[i]; if (o.vida > 0 && Math.hypot(o.x - t.x, o.y - t.y) < o.r) { o.vida -= t.dano; explode(t.x, t.y, '#c9a27a', 4); return false; } }
        for (i = 0; i < J.inimigos.length; i++) { o = J.inimigos[i]; if (o.vida > 0 && Math.hypot(o.x - t.x, o.y - t.y) < o.r + 4) { o.vida -= t.dano; o.flash = 0.1; return false; } }
        o = J.chefe;
        if (o && o.vida > 0 && Math.hypot(o.x - t.x, o.y - t.y) < o.r) { o.vida -= t.dano; o.flash = 0.08; explode(t.x, t.y, o.cor, 3); return false; }
        return t.vida > 0;
    });

    // meteoros
    var novos = [];
    J.meteoros = J.meteoros.filter(function (m) {
        m.x += m.vx * dt; m.y += m.vy * dt; m.rot += m.vr * dt;
        if (m.vida <= 0) {
            som('boom'); explode(m.x, m.y, '#c9a27a', 14); soltaEsporos(m.x, m.y, m.r > 30 ? 3 : 1);
            if (m.r > 28) for (var k = 0; k < 2; k++) novos.push({ x: m.x, y: m.y, r: m.r * 0.5 });
            J.abates++;
            return false;
        }
        if (Math.hypot(m.x - n.x, m.y - n.y) < m.r + n.r * 0.7) { danoNave(); m.vida = 0; }
        return Math.hypot(m.x - n.x, m.y - n.y) < Math.max(W, H) * 1.6;
    });
    novos.forEach(function (q) { criaMeteoro(false, q.r); var m = J.meteoros[J.meteoros.length - 1]; m.x = q.x; m.y = q.y; m.vida = 1; });

    // inimigos
    J.inimigos = J.inimigos.filter(function (e) {
        e.fase += dt; if (e.flash) e.flash -= dt;
        var a = Math.atan2(n.y - e.y, n.x - e.x), d = Math.hypot(n.x - e.x, n.y - e.y);
        if (e.tipo === 'atirador') {
            var querDist = 260, s = d > querDist ? 1 : -0.6;
            e.vx = Math.cos(a) * e.vel * s + Math.cos(a + 1.57) * 50; e.vy = Math.sin(a) * e.vel * s + Math.sin(a + 1.57) * 50;
            e.recarga -= dt;
            if (e.recarga <= 0 && d < 500) { tiroInimigo(e.x, e.y, a, 220); e.recarga = 2.2; }
        } else if (e.tipo === 'ufo') {
            e.vx = Math.cos(a + Math.sin(e.fase * 2) * 0.8) * e.vel; e.vy = Math.sin(a + Math.sin(e.fase * 2) * 0.8) * e.vel;
            e.recarga -= dt;
            if (e.recarga <= 0 && d < 420 && (J.idx >= 1 || J.inf)) { tiroInimigo(e.x, e.y, a, 180); e.recarga = 3.5; }
        } else { e.vx = Math.cos(a) * e.vel; e.vy = Math.sin(a) * e.vel; }
        e.x += e.vx * dt; e.y += e.vy * dt;
        if (e.vida <= 0) { som('boom'); explode(e.x, e.y, e.tipo === 'bicho' ? '#ff6a9a' : '#7dff6a', 16); soltaEsporos(e.x, e.y, e.tipo === 'bicho' ? 1 : 3); J.abates++; return false; }
        if (d < e.r + n.r * 0.7) { danoNave(); e.vida = 0; }
        return true;
    });

    // tiros inimigos
    J.tirosInim = J.tirosInim.filter(function (t) {
        t.x += t.vx * dt; t.y += t.vy * dt; t.vida -= dt;
        if (Math.hypot(t.x - n.x, t.y - n.y) < t.r + n.r * 0.6) { danoNave(); return false; }
        return t.vida > 0;
    });
    if (J.tirosInim.length > 300) J.tirosInim.splice(0, J.tirosInim.length - 300);

    // chefe
    var c = J.chefe;
    if (c) {
        c.t += dt; if (c.flash > 0) c.flash -= dt;
        var dc = Math.hypot(n.x - c.x, n.y - c.y), ac = Math.atan2(n.y - c.y, n.x - c.x);
        var vc = dc > 450 ? 320 : (c.tipo === 'carangueijo' ? 90 : 55); // se a nave fugir longe, o chefão vem atrás
        var sc = dc > 280 ? 1 : (dc < 180 ? -0.5 : 0);
        c.x += (Math.cos(ac) * vc * sc + Math.cos(ac + 1.57) * Math.sin(c.t) * 70) * dt;
        c.y += (Math.sin(ac) * vc * sc + Math.sin(ac + 1.57) * Math.sin(c.t) * 70) * dt;
        c.ataque -= dt;
        if (c.ataque <= 0 && !J.fim) c.ataque = ataqueChefe(c);
        if (dc < c.r + n.r * 0.6) danoNave();
        document.getElementById('vidaChefe').style.width = Math.max(0, c.vida / c.vidaMax * 100) + '%';
        if (c.vida <= 0) {
            som('bomba'); J.tremer = 1; explode(c.x, c.y, c.cor, 120, 3); explode(c.x, c.y, '#fff', 40, 2);
            soltaEsporos(c.x, c.y, 25); J.chefe = null; J.tirosInim.length = 0;
            document.getElementById('barraChefe').style.display = 'none';
            if (J.inf) { avisa('💥 Chefão derrotado!'); J.onda++; }
            else { avisa('🎉 VENCEU!', 2); J.chefeVencido = true; setTimeout(function () { if (J && !J.fim && J.chefeVencido) acaba(true); }, 1600); }
        }
    }

    // esporos
    var ima = 90 + up.ima * 70;
    J.esporos = J.esporos.filter(function (e) {
        e.t += dt;
        var d = Math.hypot(n.x - e.x, n.y - e.y);
        if (d < ima && e.t > 0.3) { var a = Math.atan2(n.y - e.y, n.x - e.x), f = 500; e.vx += Math.cos(a) * f * dt; e.vy += Math.sin(a) * f * dt; }
        else { e.vx *= 0.96; e.vy *= 0.96; }
        e.x += e.vx * dt; e.y += e.vy * dt;
        if (d < n.r + 8) { J.pegou++; J.ganhouEsp++; J.especial = Math.min(1, J.especial + 0.02); som('pega'); return false; }
        return e.t < 14;
    });
    if (J.esporos.length > 200) J.esporos.splice(0, J.esporos.length - 200);

    // partículas e textos
    J.parts = J.parts.filter(function (p) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.95; p.vy *= 0.95; p.vida -= dt; return p.vida > 0; });
    J.textos = J.textos.filter(function (t) { t.y -= 30 * dt; t.vida -= dt; return t.vida > 0; });
    if (J.bomba) { J.bomba.r += 900 * dt; if (J.bomba.r > J.bomba.max) J.bomba = null; }
    if (J.tremer > 0) J.tremer -= dt;
}

/* ---------- desenho ---------- */
function desenhaNave(c, n) {
    if (n.inv > 0 && Math.floor(n.inv * 12) % 2) return;
    c.save(); c.translate(n.x, n.y); c.rotate(n.ang + Math.PI / 2);
    // fogo do motor
    var sp = Math.hypot(n.vx, n.vy) / 250;
    if (sp > 0.1) {
        c.fillStyle = '#ffb03a'; c.beginPath(); c.moveTo(-8, 16); c.lineTo(0, 16 + 18 * sp + Math.random() * 8); c.lineTo(8, 16); c.fill();
        c.fillStyle = '#fff6a0'; c.beginPath(); c.moveTo(-4, 16); c.lineTo(0, 16 + 9 * sp); c.lineTo(4, 16); c.fill();
    }
    // asinhas
    c.fillStyle = '#7a8aa8'; c.beginPath(); c.moveTo(-10, 6); c.lineTo(-22, 18); c.lineTo(-8, 16); c.fill();
    c.beginPath(); c.moveTo(10, 6); c.lineTo(22, 18); c.lineTo(8, 16); c.fill();
    // talo (corpo)
    c.fillStyle = '#f4e6c8'; c.beginPath(); c.roundRect ? c.roundRect(-9, -2, 18, 20, 6) : c.rect(-9, -2, 18, 20); c.fill();
    // janela
    c.fillStyle = '#5ad0ff'; c.beginPath(); c.arc(0, 7, 5, 0, 7); c.fill();
    c.fillStyle = '#fff'; c.beginPath(); c.arc(-1.5, 5.5, 1.6, 0, 7); c.fill();
    // chapéu do cogumelo
    c.fillStyle = '#e8322a'; c.beginPath(); c.ellipse(0, -4, 20, 16, 0, Math.PI, 0); c.closePath(); c.fill();
    c.fillStyle = '#fff';
    [[-10, -9, 3.5], [3, -14, 4], [11, -7, 3], [-2, -6, 2.5]].forEach(function (b) { c.beginPath(); c.arc(b[0], b[1], b[2], 0, 7); c.fill(); });
    c.restore();
}
function desenhaInimigo(c, e) {
    c.save(); c.translate(e.x, e.y);
    var piscar = e.flash > 0;
    if (e.tipo === 'bicho') {
        c.fillStyle = piscar ? '#fff' : '#ff6a9a'; c.beginPath(); c.arc(0, 0, e.r, 0, 7); c.fill();
        c.strokeStyle = '#ff6a9a'; c.lineWidth = 3;
        for (var i = 0; i < 4; i++) { var a = i * 1.57 + e.fase * 3; c.beginPath(); c.moveTo(Math.cos(a) * e.r, Math.sin(a) * e.r); c.lineTo(Math.cos(a) * (e.r + 7), Math.sin(a) * (e.r + 7)); c.stroke(); }
        c.fillStyle = '#000'; c.beginPath(); c.arc(-4, -2, 3, 0, 7); c.arc(4, -2, 3, 0, 7); c.fill();
    } else {
        var corpo = e.tipo === 'atirador' ? '#ff9a2a' : '#7dff6a';
        c.fillStyle = 'rgba(160,230,255,0.7)'; c.beginPath(); c.ellipse(0, -5, 10, 10, 0, Math.PI, 0); c.fill();
        c.fillStyle = '#3a8a3a'; c.beginPath(); c.arc(0, -6, 5, 0, 7); c.fill();
        c.fillStyle = '#000'; c.beginPath(); c.arc(0, -7, 2, 0, 7); c.fill();
        c.fillStyle = piscar ? '#fff' : '#8a90a8'; c.beginPath(); c.ellipse(0, 0, e.r + 4, 7, 0, 0, 7); c.fill();
        c.fillStyle = corpo;
        for (var k = -1; k <= 1; k++) { c.beginPath(); c.arc(k * 9, 1, 2.5, 0, 7); c.fill(); }
    }
    c.restore();
}
function desenhaChefe(c, b) {
    c.save(); c.translate(b.x, b.y);
    var r = b.r, cor = b.flash > 0 ? '#fff' : b.cor, t = b.t, i;
    c.fillStyle = cor; c.strokeStyle = cor; c.lineCap = 'round';
    if (b.tipo === 'polvo') {
        c.lineWidth = 10;
        for (i = 0; i < 8; i++) { var a = i / 8 * Math.PI * 2; c.beginPath(); c.moveTo(Math.cos(a) * r * 0.6, Math.sin(a) * r * 0.6);
            c.quadraticCurveTo(Math.cos(a + Math.sin(t * 3 + i) * 0.4) * r * 1.2, Math.sin(a + Math.sin(t * 3 + i) * 0.4) * r * 1.2, Math.cos(a + 0.3) * r * 1.5, Math.sin(a + 0.3) * r * 1.5); c.stroke(); }
        c.beginPath(); c.arc(0, 0, r * 0.8, 0, 7); c.fill();

            c.beginPath(); c.moveTo(i * r * 0.6, 0); c.lineTo(i * r * 1.1, -r * 0.6); c.stroke();
            c.beginPath(); c.arc(i * r * 1.15, -r * 0.75, r * 0.3, 0, 7); c.fill();
            for (var p = 0; p < 3; p++) { c.beginPath(); c.moveTo(i * r * 0.5, r * 0.2 + p * 8); c.lineTo(i * r * 1.1, r * 0.5 + p * 10 + Math.sin(t * 8 + p) * 4); c.stroke(); }
        }
        c.beginPath(); c.ellipse(0, 0, r * 0.8, r * 0.55, 0, 0, 7); c.fill();
    } else if (b.tipo === 'olho') {
        for (i = 0; i < 8; i++) { var a2 = i / 8 * Math.PI * 2 + t * 0.5; c.beginPath(); c.moveTo(Math.cos(a2) * r * 0.9, Math.sin(a2) * r * 0.9);
            c.lineTo(Math.cos(a2 + 0.15) * r * 1.35, Math.sin(a2 + 0.15) * r * 1.35); c.lineTo(Math.cos(a2 + 0.3) * r * 0.9, Math.sin(a2 + 0.3) * r * 0.9); c.fill(); }
        c.beginPath(); c.arc(0, 0, r * 0.95, 0, 7); c.fill();
        c.fillStyle = '#fff'; c.beginPath(); c.arc(0, 0, r * 0.7, 0, 7); c.fill();
    } else if (b.tipo === 'planta') {
        c.fillStyle = '#1a6a2a';
        for (i = 0; i < 6; i++) { var a3 = i / 6 * Math.PI * 2 + Math.sin(t) * 0.2; c.beginPath(); c.ellipse(Math.cos(a3) * r * 0.9, Math.sin(a3) * r * 0.9, r * 0.5, r * 0.22, a3, 0, 7); c.fill(); }
        c.fillStyle = cor; c.beginPath(); c.arc(0, 0, r * 0.75, 0, 7); c.fill();
        var boca = 0.3 + Math.abs(Math.sin(t * 3)) * 0.5;
        c.fillStyle = '#8a1a2a'; c.beginPath(); c.moveTo(0, 0); c.arc(0, 0, r * 0.6, -boca, boca); c.fill();
    } else if (b.tipo === 'robo') {
        c.fillStyle = '#8a8aa0'; c.fillRect(-r * 0.8, -r * 0.7, r * 1.6, r * 1.4);
        c.fillStyle = cor; c.fillRect(-r * 0.65, -r * 0.55, r * 1.3, r * 0.5);
        for (i = -2; i <= 2; i++) { c.beginPath(); c.moveTo(i * r * 0.3, -r * 0.7); c.lineTo(i * r * 0.3 + r * 0.12, -r * 1.05); c.lineTo(i * r * 0.3 + r * 0.24, -r * 0.7); c.fill(); }
        c.fillStyle = '#ff3a3a'; c.beginPath(); c.arc(-r * 0.3, -r * 0.3, r * 0.12, 0, 7); c.arc(r * 0.3, -r * 0.3, r * 0.12, 0, 7); c.fill();
        c.fillStyle = '#333'; c.fillRect(-r * 0.5, r * 0.2, r, r * 0.2);
    } else { // rei
        c.beginPath(); c.ellipse(0, 0, r * 0.8, r, 0, 0, 7); c.fill();
        c.fillStyle = '#ffd84a'; c.beginPath(); c.moveTo(-r * 0.6, -r * 0.8);
        for (i = 0; i <= 4; i++) c.lineTo(-r * 0.6 + i * r * 0.3, -r * (i % 2 ? 1.0 : 1.35));
        c.lineTo(r * 0.6, -r * 0.8); c.fill();
        c.fillStyle = '#000'; c.beginPath(); c.ellipse(-r * 0.32, -r * 0.1, r * 0.22, r * 0.32, 0.4, 0, 7); c.ellipse(r * 0.32, -r * 0.1, r * 0.22, r * 0.32, -0.4, 0, 7); c.fill();
    }
    if (b.tipo !== 'robo' && b.tipo !== 'rei') { // olho que segue a nave
        var an = Math.atan2(J.nave.y - b.y, J.nave.x - b.x), er = b.tipo === 'olho' ? r * 0.4 : r * 0.28;
        c.fillStyle = '#fff'; if (b.tipo !== 'olho') { c.beginPath(); c.arc(0, -r * 0.15, er, 0, 7); c.fill(); }
        c.fillStyle = '#111'; c.beginPath(); c.arc(Math.cos(an) * er * 0.45, (b.tipo === 'olho' ? 0 : -r * 0.15) + Math.sin(an) * er * 0.45, er * 0.5, 0, 7); c.fill();
    }
    c.restore();
}

function desenha() {
    var c = ctx, n = J.nave, p = J.p;
    c.setTransform(DPR, 0, 0, DPR, 0, 0);
    c.fillStyle = p.fundo; c.fillRect(0, 0, W, H);
    // estrelas com paralaxe
    c.fillStyle = '#fff';
    ESTRELAS.forEach(function (s) {
        var x = ((s.x - n.x * s.z * 0.3) % 2000 + 2000) % 2000 * W / 2000, y = ((s.y - n.y * s.z * 0.3) % 2000 + 2000) % 2000 * H / 2000;
        c.globalAlpha = s.z; c.fillRect(x, y, s.z * 2.2, s.z * 2.2);
    });
    c.globalAlpha = 1;
    // planeta grande no fundo
    var px = W * 0.8 - n.x * 0.05, py = H * 0.25 - n.y * 0.05;
    c.globalAlpha = 0.55; desenhaPlaneta(c, px, py, Math.min(W, H) * 0.22, p, J.t * 0.05); c.globalAlpha = 1;

    var tx = W / 2 - n.x, ty = H / 2 - n.y;
    if (J.tremer > 0) { tx += (Math.random() - 0.5) * 14 * J.tremer; ty += (Math.random() - 0.5) * 14 * J.tremer; }
    c.translate(tx, ty);
    var vx0 = n.x - W / 2 - 80, vx1 = n.x + W / 2 + 80, vy0 = n.y - H / 2 - 80, vy1 = n.y + H / 2 + 80;
    function visivel(o) { return o.x > vx0 && o.x < vx1 && o.y > vy0 && o.y < vy1; }

    // esporos
    J.esporos.forEach(function (e) {
        if (!visivel(e)) return;
        c.fillStyle = '#ffe14a'; c.beginPath(); c.arc(e.x, e.y, 5 + Math.sin(e.t * 8) * 1.5, 0, 7); c.fill();
        c.fillStyle = '#fff'; c.beginPath(); c.arc(e.x, e.y, 2, 0, 7); c.fill();
    });
    // meteoros
    J.meteoros.forEach(function (m) {
        if (!visivel(m)) return;
        c.save(); c.translate(m.x, m.y); c.rotate(m.rot);
        c.fillStyle = '#8a6a4a'; c.beginPath();
        m.pts.forEach(function (q, i) { var a = i / m.pts.length * Math.PI * 2; c[i ? 'lineTo' : 'moveTo'](Math.cos(a) * m.r * q, Math.sin(a) * m.r * q); });
        c.closePath(); c.fill();
        c.fillStyle = '#6a4a32'; c.beginPath(); c.arc(m.r * 0.25, -m.r * 0.2, m.r * 0.22, 0, 7); c.arc(-m.r * 0.3, m.r * 0.25, m.r * 0.15, 0, 7); c.fill();
        c.restore();
    });
    J.inimigos.forEach(function (e) { if (visivel(e)) desenhaInimigo(c, e); });
    if (J.chefe) desenhaChefe(c, J.chefe);
    // tiros
    c.fillStyle = '#9affff';
    J.tiros.forEach(function (t) { c.beginPath(); c.arc(t.x, t.y, 4, 0, 7); c.fill(); });
    J.tirosInim.forEach(function (t) { if (!visivel(t)) return; c.fillStyle = t.cor; c.beginPath(); c.arc(t.x, t.y, t.r, 0, 7); c.fill(); c.fillStyle = '#fff'; c.beginPath(); c.arc(t.x, t.y, t.r * 0.4, 0, 7); c.fill(); });
    if (!J.fim || n.vida > 0) desenhaNave(c, n);
    J.parts.forEach(function (q) { c.globalAlpha = Math.max(0, q.vida * 2); c.fillStyle = q.cor; c.fillRect(q.x - q.r / 2, q.y - q.r / 2, q.r, q.r); });
    c.globalAlpha = 1;
    if (J.bomba) { c.strokeStyle = 'rgba(255,106,208,' + (1 - J.bomba.r / J.bomba.max) + ')'; c.lineWidth = 10; c.beginPath(); c.arc(J.bomba.x, J.bomba.y, J.bomba.r, 0, 7); c.stroke(); }
    c.setTransform(DPR, 0, 0, DPR, 0, 0);

    // seta apontando pro chefão quando fora da tela
    if (J.chefe) {
        var dx = J.chefe.x - n.x, dy = J.chefe.y - n.y;
        if (Math.abs(dx) > W / 2 || Math.abs(dy) > H / 2) {
            var a = Math.atan2(dy, dx), sx = W / 2 + Math.cos(a) * Math.min(W, H) * 0.4, sy = H / 2 + Math.sin(a) * Math.min(W, H) * 0.4;
            c.save(); c.translate(sx, sy); c.rotate(a); c.fillStyle = '#ff3a3a';
            c.beginPath(); c.moveTo(18, 0); c.lineTo(-10, -12); c.lineTo(-10, 12); c.fill(); c.restore();
        }
    }
    // joystick
    if (toque.ativo) {
        c.strokeStyle = 'rgba(255,255,255,0.35)'; c.lineWidth = 3; c.beginPath(); c.arc(toque.ox, toque.oy, 60, 0, 7); c.stroke();
        c.fillStyle = 'rgba(255,255,255,0.4)'; c.beginPath(); c.arc(toque.ox + toque.dx, toque.oy + toque.dy, 24, 0, 7); c.fill();
    }
    // barra de esporos do planeta + barra do especial
    if (!J.inf && !J.chefe && !J.chefeVencido) {
        var bw = Math.min(W * 0.6, 320), bx = (W - bw) / 2, by = 48;
        c.fillStyle = 'rgba(0,0,0,0.5)'; c.fillRect(bx - 2, by - 2, bw + 4, 14);
        c.fillStyle = '#ffe14a'; c.fillRect(bx, by, bw * Math.min(1, J.pegou / J.precisa), 10);
        c.fillStyle = '#fff'; c.font = 'bold 12px Arial'; c.textAlign = 'center'; c.fillText('✨ esporos pro chefão: ' + Math.min(J.pegou, J.precisa) + '/' + J.precisa, W / 2, by + 26);
    }
}

var hudT = 0;
function hud() {
    var n = J.nave;
    document.getElementById('hudEsq').textContent = '❤️'.repeat(Math.max(0, n.vida)) + '🖤'.repeat(Math.max(0, n.vidaMax - Math.max(0, n.vida)));
    document.getElementById('hudInfo').textContent = (J.inf ? '🌊 ' + J.onda + '  ' : '') + '✨ ' + J.ganhouEsp;
    var b = document.getElementById('especial');
    b.classList.toggle('carregando', J.especial < 1);
    b.textContent = J.especial < 1 ? Math.floor(J.especial * 100) + '%' : '💥';
}

var ultimo = performance.now(), acum = 0;
function loop(agora) {
    requestAnimationFrame(loop);
    var dt = Math.min(0.05, (agora - ultimo) / 1000);
    if (CELULAR && agora - ultimo < 30) return; // 30fps no celular
    ultimo = agora;
    if (!J) { // fundo animado no menu
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.fillStyle = '#05030f'; ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#fff'; var tt = agora / 1000;
        ESTRELAS.forEach(function (s) { ctx.globalAlpha = s.z; ctx.fillRect(s.x / 2000 * W, ((s.y + tt * 40 * s.z) % 2000) / 2000 * H, 2, 2); });
        ctx.globalAlpha = 1; return;
    }
    if (!J.pausado) atualiza(dt);
    desenha();
    hudT -= dt; if (hudT <= 0) { hudT = 0.25; hud(); }
}

/* ================= COMEÇO ================= */
if (!localStorage.getItem(SAVE_KEY)) { salva(); abreComoJogar(); } else abreMapa();
requestAnimationFrame(loop);

// ganchos de teste
window._espTeste = { dados: function () { return dados; }, J: function () { return J; }, comeca: comeca, chamaChefe: chamaChefe, PLANETAS: PLANETAS };
</script>
