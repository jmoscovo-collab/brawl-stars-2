<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Portas Misteriosas — Cogumelo Games</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
html,body { height:100%; overflow:hidden; }
body { background:#141428; font-family:Arial,sans-serif; color:#fff; user-select:none; }
canvas { display:block; position:fixed; inset:0; touch-action:none; }

/* ===== LOJA (sem texto) ===== */
#loja { position:fixed; inset:0; z-index:20; background:rgba(8,8,24,0.9); display:none; align-items:center; justify-content:center; }
#loja .cartao { background:linear-gradient(180deg,#2d1b4e,#1a1a3e); border:3px solid #ffaa00; border-radius:22px; padding:18px;
    width:min(94vw,420px); max-height:86vh; overflow:auto; text-align:center; }
#loja h2 { font-size:34px; margin-bottom:10px; }
.espada { display:flex; align-items:center; gap:10px; width:100%; margin:7px 0; padding:10px 14px; border:none; border-radius:14px; cursor:pointer;
    background:rgba(255,255,255,0.08); border:2px solid rgba(255,255,255,0.25); color:#fff; font-size:18px; font-weight:bold; }
.espada:active { transform:scale(0.96); }
.espada .ic { font-size:32px; }
.espada .info { flex:1; text-align:left; display:flex; gap:12px; }
.espada.minha { border-color:#4dff88; }
.espada.equipada { border-color:#ffd700; background:rgba(255,215,0,0.15); box-shadow:0 0 12px rgba(255,215,0,0.4); }
.espada.caro { opacity:0.45; }
#fecharLoja { font-size:26px; margin-top:8px; padding:8px 26px; border:none; border-radius:14px; cursor:pointer; background:#556; color:#fff; }

/* ===== CONTROLES TOUCH (sem texto) ===== */
.ctl { position:fixed; bottom:calc(14px + env(safe-area-inset-bottom)); z-index:6; width:76px; height:76px; border-radius:50%; border:none; font-size:36px;
    background:rgba(255,255,255,0.18); backdrop-filter:blur(3px); color:#fff; align-items:center; justify-content:center; }
.ctl:active { background:rgba(255,255,255,0.45); transform:scale(1.08); }
#bEsq { left:14px; } #bDir { left:104px; } #bPulo { right:104px; } #bAtq { right:14px; background:rgba(255,120,60,0.35); }
#bSair { position:fixed; top:12px; right:12px; z-index:6; font-size:24px; width:46px; height:46px; border-radius:12px; border:none;
    background:rgba(255,255,255,0.15); color:#fff; display:none; }
#bLoja { position:fixed; top:12px; right:12px; z-index:6; font-size:26px; width:52px; height:52px; border-radius:14px; border:2px solid #ffaa00;
    background:rgba(255,170,0,0.2); color:#fff; display:none; cursor:pointer; }
#bFoguete { position:fixed; top:12px; right:74px; z-index:6; font-size:26px; width:52px; height:52px; border-radius:14px; border:2px solid #5fd0ff;
    background:rgba(95,208,255,0.2); color:#fff; display:none; cursor:pointer; }
#bMundo { position:fixed; top:12px; right:136px; z-index:6; font-size:26px; width:52px; height:52px; border-radius:14px; border:2px solid #4dff88;
    background:rgba(77,255,136,0.2); color:#fff; display:none; cursor:pointer; }
#mundos { position:fixed; inset:0; z-index:26; background:rgba(8,8,24,0.85); display:none; align-items:center; justify-content:center; }
#mundos .cartao { background:linear-gradient(180deg,#0e2e1a,#123420); border:3px solid #4dff88; border-radius:22px; padding:20px; text-align:center; width:min(92vw,360px); }
#mundos .cartao > div { font-size:44px; margin-bottom:10px; }
#gradeMundos { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
#gradeMundos button { aspect-ratio:1; font-size:22px; font-weight:bold; border:2px solid rgba(255,255,255,0.3); border-radius:14px; cursor:pointer;
    background:rgba(255,255,255,0.1); color:#fff; }
#gradeMundos button.aqui { border-color:#ffd700; background:rgba(255,215,0,0.2); }
#gradeMundos button:disabled { opacity:0.35; }
#xMundos { font-size:24px; margin-top:12px; padding:8px 26px; border:none; border-radius:14px; cursor:pointer; background:#556; color:#fff; }
#foguete { position:fixed; inset:0; z-index:25; background:rgba(8,8,24,0.85); display:none; align-items:center; justify-content:center; }
#foguete .cartao { background:linear-gradient(180deg,#123, #1a2a4e); border:3px solid #5fd0ff; border-radius:22px; padding:22px; text-align:center; width:min(90vw,340px); }
#foguete .cartao div { font-size:52px; margin-bottom:10px; }
#nPorta { width:100%; padding:14px; font-size:26px; font-weight:bold; text-align:center; border:3px solid #5fd0ff; border-radius:14px; outline:none; background:#0c1830; color:#fff; }
#foguete button { font-size:26px; margin-top:12px; padding:10px 30px; border:none; border-radius:14px; cursor:pointer; color:#fff; }
#irFoguete { background:linear-gradient(135deg,#2a9aee,#5fd0ff); }
#xFoguete { background:#556; margin-left:8px; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<button class="ctl" id="bEsq" style="display:none">◀️</button>
<button class="ctl" id="bDir" style="display:none">▶️</button>
<button class="ctl" id="bPulo" style="display:none">🦵</button>
<button class="ctl" id="bAtq" style="display:none">⚔️</button>
<button id="bSair">🚪</button>
<button id="bLoja" onclick="abreLoja()">🛒</button>
<button id="bFoguete" onclick="abreFoguete()">🚀</button>
<button id="bMundo" onclick="abreMundos()">🌍</button>

<div id="mundos">
    <div class="cartao">
        <div>🌍</div>
        <div id="gradeMundos"></div>
        <button id="xMundos" onclick="fechaMundos()">❌</button>
    </div>
</div>

<div id="foguete">
    <div class="cartao">
        <div>🚀</div>
        <input id="nPorta" type="number" inputmode="numeric" pattern="[0-9]*" min="1">
        <br>
        <button id="irFoguete" onclick="voaFoguete()">🚀</button>
        <button id="xFoguete" onclick="fechaFoguete()">❌</button>
    </div>
</div>

<div id="novaFase" style="position:fixed; inset:0; z-index:28; display:none; align-items:center; justify-content:center; flex-direction:column; background:rgba(5,5,20,0.9); text-align:center; padding:20px">
    <div style="font-size:64px">🌀🎉</div>
    <div id="novaFaseTitulo" style="font-size:min(9vw,46px); font-weight:900; color:#5fd0ff; text-shadow:0 0 22px rgba(95,208,255,0.8); margin:12px 0">FASE 2!</div>
    <div id="novaFasePremio" style="font-size:min(7vw,32px); font-weight:bold; color:#ffd700; text-shadow:0 0 14px rgba(255,215,0,0.7)">+🪙 1.000</div>
    <button onclick="document.getElementById('novaFase').style.display='none'" style="margin-top:22px; font-size:28px; padding:10px 32px; border:none; border-radius:16px; cursor:pointer; background:linear-gradient(135deg,#2a9aee,#5fd0ff); color:#fff">▶️</button>
</div>

<div id="zerou" style="position:fixed; inset:0; z-index:30; display:none; align-items:center; justify-content:center; flex-direction:column; background:rgba(5,5,20,0.92); text-align:center; padding:20px">
    <div style="font-size:70px">🏆👑🎉</div>
    <div style="font-size:min(8vw,44px); font-weight:900; color:#ffd700; text-shadow:0 0 24px rgba(255,215,0,0.8); margin:14px 0">PARABÉNS VOCÊ ZEROU O JOGO</div>
    <div style="font-size:44px">🦫⚔️✨</div>
    <button onclick="document.getElementById('zerou').style.display='none'; iniciaHub(0);" style="margin-top:22px; font-size:30px; padding:12px 34px; border:none; border-radius:16px; cursor:pointer; background:linear-gradient(135deg,#ffaa00,#ff6600); color:#fff">🎮</button>
</div>

<div id="loja">
    <div class="cartao">
        <h2>🛒⚔️</h2>
        <div id="listaEspadas"></div>
        <button id="fecharLoja" onclick="fechaLoja()">❌</button>
    </div>
</div>

<script src="/stats.js?v=358"></script>
<script src="/avisos.js?v=6"></script>
<script>
if (window.initStats) initStats('portas');

// ============ SAVE ============
function lsGet(k,d){ try{ var v=localStorage.getItem('portas_'+k); return v===null?d:JSON.parse(v); }catch(e){ return d; } }
function lsSet(k,v){ try{ localStorage.setItem('portas_'+k, JSON.stringify(v)); }catch(e){} }
var moedas = lsGet('moedas', 0);
var minhas = lsGet('espadas', [true]);
var eq = lsGet('eq', 0);
// ===== SISTEMA DE 10 VIDAS DA CAPIVARA =====
var VIDAS_MAX = 10;
var vidas = lsGet('vidas', VIDAS_MAX);
function salvaVidas(){ lsSet('vidas', vidas); }
function curaVidas(qtd){
    if(vidas < VIDAS_MAX){ vidas = Math.min(VIDAS_MAX, vidas + qtd); salvaVidas(); return true; }
    return false;
}
// ===== ANDARES: 10 fases, cada uma com +100 portas (100, 200, ... 1000) =====
var andar = lsGet('andar', 1);
var zeradas = lsGet('zeradas_' + andar, andar === 1 ? lsGet('zeradas', []) : []);
// portas SECRETAS que levam pro próximo andar (ninguém sabe qual é... só você!)
var SECRETA = { 1:84, 2:178, 3:113, 4:367, 5:555, 6:481, 7:676, 8:874, 9:990 };
// portas trancadas por 1 hora depois que você sai da sala
var travas = lsGet('travas_' + andar, {});
function trancaPorta(n){
    travas[n] = Date.now() + 3600*1000; // 1 hora
    lsSet('travas_' + andar, travas);
}
function portaTrancada(n){
    if(n === 84 || SECRETA[andar] === n) return false; // a 84 e as portas secretas NUNCA trancam!
    return travas[n] && travas[n] > Date.now();
}

// ============ ESPADAS ============
var ESPADAS = [
    { e:'🥢', d:1,  p:0 },
    { e:'🗡️', d:2,  p:60 },
    { e:'⚔️', d:4,  p:250 },
    { e:'🪓', d:7,  p:700 },
    { e:'🔱', d:12, p:1800 },
    { e:'⚡', d:20, p:4500 },
    { e:'🔥', d:35, p:12000 },
    { e:'🌈', d:60, p:30000 }
];

// ============ LOJA ============
function abreLoja(){
    rodando = false; // pausa o jogo enquanto a loja tá aberta
    var el = document.getElementById('listaEspadas');
    el.innerHTML = '';
    ESPADAS.forEach(function(s, i){
        var b = document.createElement('button');
        var tem = minhas[i];
        b.className = 'espada' + (tem ? ' minha' : (moedas < s.p ? ' caro' : '')) + (eq === i ? ' equipada' : '');
        b.innerHTML = '<span class="ic">' + s.e + '</span><span class="info"><span>💥' + s.d + '</span>' +
            (tem ? (eq===i ? '<span>✅</span>' : '<span>👆</span>') : '<span>🪙' + s.p.toLocaleString('pt-BR') + '</span>') + '</span>';
        b.onclick = function(){
            if(minhas[i]){ eq = i; lsSet('eq', eq); }
            else if(moedas >= s.p){ moedas -= s.p; minhas[i] = true; eq = i; lsSet('moedas',moedas); lsSet('espadas',minhas); lsSet('eq',eq); }
            abreLoja();
        };
        el.appendChild(b);
    });
    document.getElementById('loja').style.display = 'flex';
}
function fechaLoja(){
    document.getElementById('loja').style.display = 'none';
    rodando = true; ultimoT = performance.now();
    requestAnimationFrame(loop);
}
window.abreLoja = abreLoja; window.fechaLoja = fechaLoja;

// ============ FOGUETE GRÁTIS: voa direto pra frente de qualquer porta! ============
function abreFoguete(){
    rodando = false;
    var inp = document.getElementById('nPorta');
    inp.value = ''; inp.max = andar*100; inp.placeholder = '1 - ' + (andar*100);
    document.getElementById('foguete').style.display = 'flex';
    setTimeout(function(){ inp.focus(); }, 50); // abre o teclado no celular
    inp.onkeydown = function(e){ if(e.key === 'Enter') voaFoguete(); };
}
function fechaFoguete(){
    document.getElementById('foguete').style.display = 'none';
    rodando = true; ultimoT = performance.now();
    requestAnimationFrame(loop);
}
function voaFoguete(){
    var n = parseInt(document.getElementById('nPorta').value, 10);
    if(!n || n < 1 || n > andar*100) return;
    pl.x = 260 + (n-1)*ESPACO - 60; // chega do ladinho da porta (pra não entrar sem querer)
    pl.y = CHAO_Y - 160; pl.vy = 0; pl.vx = 0;
    dwell = 0; dwellAlvo = null;
    for(var i=0;i<14;i++) fx.push({x:pl.x+(Math.random()-0.5)*140, y:pl.y+Math.random()*160, t:['🚀','💨','🔥'][Math.floor(Math.random()*3)], vida:1});
    fechaFoguete();
}
window.abreFoguete = abreFoguete; window.fechaFoguete = fechaFoguete; window.voaFoguete = voaFoguete;

// ============ TROCAR DE MUNDO (andar) — só os que você já desbloqueou ============
var maxAndar = Math.max(lsGet('maxAndar', 1), andar);
function abreMundos(){
    rodando = false;
    var g = document.getElementById('gradeMundos');
    g.innerHTML = '';
    for(var k=1; k<=10; k++){
        var b = document.createElement('button');
        b.textContent = k <= maxAndar ? k : '🔒';
        if(k === andar) b.className = 'aqui';
        if(k > maxAndar) b.disabled = true;
        else (function(kk){ b.onclick = function(){ vaiMundo(kk); }; })(k);
        g.appendChild(b);
    }
    document.getElementById('mundos').style.display = 'flex';
}
function fechaMundos(){
    document.getElementById('mundos').style.display = 'none';
    rodando = true; ultimoT = performance.now();
    requestAnimationFrame(loop);
}
function vaiMundo(k){
    andar = k;
    lsSet('andar', andar);
    zeradas = lsGet('zeradas_' + andar, []);
    travas = lsGet('travas_' + andar, {});
    document.getElementById('mundos').style.display = 'none';
    iniciaHub(0);
}
window.abreMundos = abreMundos; window.fechaMundos = fechaMundos; window.vaiMundo = vaiMundo;

// ============ RNG com semente ============
function rnd(seed){
    var a = seed >>> 0;
    return function(){
        a |= 0; a = a + 0x6D2B79F5 | 0;
        var t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
}
function tipoDe(n){
    if(n % 10 === 0) return 'boss';
    var t = rnd(n*7+3)();
    if(t < 0.4) return 'parkour';
    if(t < 0.75) return 'arena';
    return 'tesouro';
}
var ICONE = { parkour:'🏃', arena:'👾', tesouro:'🎁', boss:'👹' };

// ============ SALÃO DAS 100 PORTAS (o "mundo" onde você nasce) ============
var ESPACO = 170;
function geraHub(){
    var total = andar * 100;
    var L = { plats:[], espinhos:[], inimigos:[], moedinhas:[], baus:[], portas:[], tipo:'hub', n:0 };
    L.fim = total*ESPACO + 500;
    L.plats.push({x:0, y:0, w:L.fim, h:400, chao:true});
    for(var n=1; n<=total; n++) L.portas.push({ n:n, x:260 + (n-1)*ESPACO });
    return L;
}

// ============ GERADOR DAS FASES (dentro de cada porta) ============
var CHAO_Y = 0;
function gera(n){
    var r = rnd(n * 1337 + andar * 777 + 42);
    var tipo = tipoDe(n);
    var paraiso = (n === 50); // porta 50 de TODO andar: chuva de moedas e nenhum bicho!
    if(paraiso) tipo = 'tesouro';
    var dif = r()*1.6 + (andar-1)*0.05; // dificuldade SORTEADA — a porta 3 pode ser mais difícil que a 90!
    var L = { plats:[], espinhos:[], inimigos:[], moedinhas:[], baus:[], portas:[], tipo:tipo, n:n };
    var fim = 1800 + n * 25;
    if(tipo === 'arena' || tipo === 'boss') fim = 1300;
    L.fim = fim;
    var x = 0, buracoChance = paraiso ? 0 : (tipo==='parkour' ? 0.42 : (tipo==='boss'||tipo==='arena' ? 0 : 0.22));
    while(x < fim){
        var w = 220 + r()*320;
        L.plats.push({x:x, y:0, w:w, h:400, chao:true});
        var gap = (r() < buracoChance) ? (90 + r()*(70 + dif*80)) : 0;
        x += w + gap;
    }
    var qp = tipo==='parkour' ? 10 + Math.floor(dif*14) : 5;
    for(var i=0;i<qp;i++){
        var px = 200 + r()*(fim-400);
        L.plats.push({x:px, y:110 + r()*160, w:90 + r()*110, h:18});
    }
    var qe = paraiso ? 0 : (tipo==='parkour' ? 6 + Math.floor(dif*12) : (tipo==='tesouro' ? 4 : 2));
    for(var i=0;i<qe;i++) L.espinhos.push({x:320 + r()*(fim-500), w:40 + r()*50});
    var semBicho = paraiso || n === 84; // porta 84 nunca tem bicho!
    var qi = semBicho ? 0 : (tipo==='arena' ? 3 + Math.floor(dif*7) : (tipo==='boss' ? 0 : 1 + Math.floor(dif*4)));
    var EMO = ['👾','🧟','🤖','👻','💀','🐗','🦂'];
    for(var i=0;i<qi;i++){
        var hp = Math.ceil(1 + dif*14 + r()*3);
        L.inimigos.push({x:380 + r()*(fim-560), y:0, hp:hp, hpMax:hp, e:EMO[Math.floor(r()*EMO.length)],
            vel:(40 + r()*60 + dif*80) * (r()<0.5?-1:1), tam:38, vivo:true, dropa:2 + Math.floor(r()*4 + dif*6)});
    }
    if(tipo === 'boss'){
        var bhp = 15 + Math.floor(r()*90);
        L.inimigos.push({x:fim-350, y:0, hp:bhp, hpMax:bhp, e:'👹', vel:60 + dif*120, tam:86, vivo:true, boss:true, dropa:40 + n});
    }
    var qm = paraiso ? 70 : 8 + Math.floor(r()*8);
    for(var i=0;i<qm;i++) L.moedinhas.push({x:150 + r()*(fim-300), y:60 + r()*200, pega:false});
    var qb = paraiso ? 6 : (tipo==='tesouro' ? 3 + Math.floor(r()*3) : (r()<0.3 ? 1 : 0));
    for(var i=0;i<qb;i++) L.baus.push({x:300 + r()*(fim-450), aberto:false, valor:15 + Math.floor(r()*35 + dif*60)});
    return L;
}

// ============ CANVAS ============
function ehCelular(){ return matchMedia('(pointer:coarse)').matches || ('ontouchstart' in window) || navigator.maxTouchPoints > 0; }
var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
var W, H;
function resize(){
    W = innerWidth; H = innerHeight;
    cv.width = W*devicePixelRatio; cv.height = H*devicePixelRatio;
    cv.style.width = W + 'px'; cv.style.height = H + 'px'; // sem isso o canvas fica 2x maior que a tela!
    ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
    CHAO_Y = H - (ehCelular() ? 185 : 90);
    if(pl && pl.y > CHAO_Y){ pl.y = CHAO_Y; pl.vy = 0; } // não deixa a capivara cair pra fora quando a tela muda
}
addEventListener('resize', resize);
addEventListener('orientationchange', function(){ setTimeout(resize, 300); });
if(window.visualViewport) visualViewport.addEventListener('resize', resize);
resize();

// ============ ESTADO ============
var fase = null, rodando = false, cam = 0, portaAtual = 0, modo = 'hub';
var pl = {}, fx = [], dwell = 0, dwellAlvo = null, lojaCooldown = 0, puloAntes = false;

function iniciaHub(voltandoDaPorta){
    modo = 'hub';
    fase = geraHub();
    // volta DO LADO da porta, não em cima dela
    var px = voltandoDaPorta ? 260 + (voltandoDaPorta-1)*ESPACO - 70 : 60;
    pl = { x:px, y:CHAO_Y-40, vx:0, vy:0, dir:1, chao:false, inv:0.6, atq:0, extra:1 };
    dwell = 0; dwellAlvo = null;
    document.getElementById('bSair').style.display = 'none';
    document.getElementById('bLoja').style.display = 'block';
    document.getElementById('bFoguete').style.display = 'block';
    document.getElementById('bMundo').style.display = 'block';
    mostraTouch(true);
    rodando = true; ultimoT = performance.now();
    requestAnimationFrame(loop);
}
function inicia(n){
    modo = 'fase';
    portaAtual = n;
    fase = gera(n);
    if(n % 50 === 0) { vidas = VIDAS_MAX; salvaVidas(); } // sala do paraíso cura todas as vidas!
    pl = { x:60, y:CHAO_Y-100, vx:0, vy:0, dir:1, chao:false, inv:0, atq:0, extra:1 };
    cam = 0; dwell = 0; dwellAlvo = null;
    document.getElementById('bSair').style.display = 'block';
    document.getElementById('bLoja').style.display = 'none';
    document.getElementById('bFoguete').style.display = 'none';
    document.getElementById('bMundo').style.display = 'none';
    rodando = true; ultimoT = performance.now();
    requestAnimationFrame(loop);
}
function mostraTouch(sim){
    var d = (sim && ehCelular()) ? 'flex' : 'none';
    ['bEsq','bDir','bPulo','bAtq'].forEach(function(id){ document.getElementById(id).style.display = d; });
}
document.getElementById('bSair').onclick = function(){
    lsSet('moedas', moedas); lsSet('zeradas_' + andar, zeradas);
    trancaPorta(portaAtual);
    iniciaHub(portaAtual);
};

// ============ CONTROLES ============
var tec = {};
addEventListener('keydown', function(e){ tec[e.key.toLowerCase()] = true; if(e.key===' ') e.preventDefault(); var k = e.key.toLowerCase(); if((k==='e'||k==='x'||k==='j') && rodando && modo==='fase') ataca(); });
// clique do mouse também ataca!
cv.addEventListener('pointerdown', function(e){ if(rodando && modo==='fase' && !matchMedia('(pointer:coarse)').matches) ataca(); });
addEventListener('keyup', function(e){ tec[e.key.toLowerCase()] = false; });
function segura(id, prop){
    var el = document.getElementById(id);
    el.addEventListener('pointerdown', function(e){ e.preventDefault(); tec[prop] = true; });
    el.addEventListener('pointerup', function(){ tec[prop] = false; });
    el.addEventListener('pointercancel', function(){ tec[prop] = false; });
    el.addEventListener('pointerleave', function(){ tec[prop] = false; });
}
segura('bEsq','arrowleft'); segura('bDir','arrowright'); segura('bPulo',' ');
// segurar o mouse (ou o dedo) — é assim que se entra nas portas!
var mouseSegurando = false;
cv.addEventListener('pointerdown', function(){ mouseSegurando = true; });
addEventListener('pointerup', function(){ mouseSegurando = false; });
addEventListener('pointercancel', function(){ mouseSegurando = false; });
document.getElementById('bAtq').addEventListener('pointerdown', function(e){ e.preventDefault(); if(rodando && modo==='fase') ataca(); });

function ataca(){
    if(pl.atq > 0) return;
    pl.atq = 0.28;
    var alcance = 78, dano = ESPADAS[eq].d;
    fase.inimigos.forEach(function(ii){
        if(!ii.vivo) return;
        var dx = ii.x - pl.x, dy = Math.abs((CHAO_Y - ii.tam/2) - pl.y);
        if(dy < 90 && dx*pl.dir > -20 && Math.abs(dx) < alcance + ii.tam/2){
            ii.hp -= dano;
            fx.push({x:ii.x, y:CHAO_Y-ii.tam-14, t:'💥', vida:0.5});
            if(ii.hp <= 0){
                ii.vivo = false;
                moedas += ii.dropa;
                fx.push({x:ii.x, y:CHAO_Y-ii.tam-30, t:'🪙+' + ii.dropa, vida:1.2});
            }
        }
    });
}
function machuca(){
    if(pl.inv > 0) return;
    vidas--; salvaVidas(); pl.inv = 1.4;
    pl.vy = -420; pl.vx = -pl.dir * 260;
    fx.push({x:pl.x, y:pl.y-40, t:'💔', vida:0.9});
    if(vidas <= 0){
        fx.push({x:pl.x, y:pl.y, t:'💀', vida:1});
        rodando = false;
        lsSet('moedas', moedas);
        setTimeout(function(){ vidas = VIDAS_MAX; salvaVidas(); trancaPorta(portaAtual); iniciaHub(portaAtual); }, 900);
    }
}

// ============ LOOP ============
var ultimoT = 0;
function loop(agora){
    if(!rodando){ desenha(); return; }
    var dt = Math.min((agora-ultimoT)/1000, 0.04);
    ultimoT = agora;
    var ACEL = 1600, MAXV = 340, PULO = 660, GRAV = 1800;

    if(tec['arrowleft']||tec['a']) { pl.vx -= ACEL*dt; pl.dir = -1; }
    else if(tec['arrowright']||tec['d']) { pl.vx += ACEL*dt; pl.dir = 1; }
    else pl.vx *= (pl.chao ? 0.78 : 0.96);
    pl.vx = Math.max(-MAXV, Math.min(MAXV, pl.vx));
    // pulo + PULO DUPLO no ar!
    var puloKey = tec[' ']||tec['arrowup']||tec['w'];
    if(puloKey && !puloAntes){
        if(pl.chao){ pl.vy = -PULO; pl.chao = false; }
        else if(pl.extra > 0){ pl.vy = -PULO*0.92; pl.extra--; fx.push({x:pl.x, y:pl.y+4, t:'💨', vida:0.4}); }
    }
    puloAntes = puloKey;

    pl.vy += GRAV*dt;
    pl.x += pl.vx*dt; pl.y += pl.vy*dt;
    if(pl.x < 20) pl.x = 20;
    if(pl.x > fase.fim - 20) pl.x = fase.fim - 20;
    if(pl.atq > 0) pl.atq -= dt;
    if(pl.inv > 0) pl.inv -= dt;
    if(lojaCooldown > 0) lojaCooldown -= dt;

    pl.chao = false;
    fase.plats.forEach(function(p){
        var py = p.chao ? CHAO_Y : CHAO_Y - p.y;
        if(pl.x > p.x-16 && pl.x < p.x+p.w+16 && pl.y >= py-4 && pl.y - pl.vy*dt <= py+6 && pl.vy >= 0){
            pl.y = py; pl.vy = 0; pl.chao = true; pl.extra = 1;
        }
    });

    if(modo === 'hub'){
        if(pl.y > H + 40){ pl.y = CHAO_Y - 10; pl.vy = 0; } // caiu pra fora? volta!
        // parado na frente de uma porta = ENTRA (enche o anelzinho)
        var perto = null;
        for(var i=0;i<fase.portas.length;i++){
            if(Math.abs(fase.portas[i].x - pl.x) < 26 && pl.chao){ perto = fase.portas[i]; break; }
        }
        if(perto && !portaTrancada(perto.n) && mouseSegurando){
            // segure o mouse por 5 segundos na frente da porta pra entrar!
            if(dwellAlvo === perto.n) dwell += dt; else { dwellAlvo = perto.n; dwell = 0; }
            if(dwell > 5){
                lsSet('moedas',moedas);
                // 🤫 PORTA SECRETA: sobe pro próximo andar!
                if(SECRETA[andar] === perto.n && andar < 10){
                    andar++;
                    lsSet('andar', andar);
                    maxAndar = Math.max(maxAndar, andar);
                    lsSet('maxAndar', maxAndar);
                    zeradas = lsGet('zeradas_' + andar, []);
                    travas = lsGet('travas_' + andar, {});
                    // 🎉 prêmio por descobrir a porta secreta!
                    var premioFase = andar * 500;
                    moedas += premioFase;
                    lsSet('moedas', moedas);
                    document.getElementById('novaFaseTitulo').textContent = 'VOCÊ ACHOU A PORTA SECRETA! FASE ' + andar + '!';
                    document.getElementById('novaFasePremio').textContent = '+🪙 ' + premioFase.toLocaleString('pt-BR');
                    document.getElementById('novaFase').style.display = 'flex';
                    for(var s=0;s<30;s++) fx.push({x:pl.x+(Math.random()-0.5)*300, y:pl.y-Math.random()*260, t:['🌀','✨','🌟','💫'][Math.floor(Math.random()*4)], vida:1.6});
                    vidas = VIDAS_MAX; salvaVidas(); // achar o andar novo cura todas as vidas!
                    iniciaHub(0);
                    return;
                }
                inicia(perto.n); return;
            }
        } else { dwell = 0; dwellAlvo = null; }
    } else {
        // ===== dentro da porta =====
        if(pl.y > H + 60){
            vidas--; salvaVidas();
            if(vidas <= 0){ rodando=false; lsSet('moedas',moedas); setTimeout(function(){ vidas = VIDAS_MAX; salvaVidas(); trancaPorta(portaAtual); iniciaHub(portaAtual); }, 600); }
            else { pl.x = Math.max(40, pl.x - 260); pl.y = CHAO_Y - 200; pl.vy = 0; pl.inv = 1.5; }
        }
        fase.espinhos.forEach(function(s){
            if(pl.y > CHAO_Y - 26 && pl.x > s.x-10 && pl.x < s.x+s.w+10) machuca();
        });
        fase.inimigos.forEach(function(ii){
            if(!ii.vivo) return;
            ii.x += ii.vel*dt;
            if(ii.x < 140 || ii.x > fase.fim-60) ii.vel *= -1;
            if(ii.boss) ii.vel = (pl.x > ii.x ? 1 : -1) * Math.abs(ii.vel);
            var dx = Math.abs(ii.x-pl.x), dy = Math.abs((CHAO_Y-ii.tam/2)-(pl.y-20));
            if(dx < ii.tam/2+14 && dy < ii.tam/2+22) machuca();
        });
        fase.moedinhas.forEach(function(m){
            if(m.pega) return;
            if(Math.abs(m.x-pl.x)<28 && Math.abs((CHAO_Y-m.y)-(pl.y-20))<34){ m.pega = true; moedas++; }
        });
        fase.baus.forEach(function(bb){
            if(bb.aberto) return;
            if(Math.abs(bb.x-pl.x) < 34 && pl.y > CHAO_Y-40){
                bb.aberto = true; moedas += bb.valor;
                fx.push({x:bb.x, y:CHAO_Y-70, t:'🪙+'+bb.valor, vida:1.4});
                if(Math.random() < 0.4 && curaVidas(1)) fx.push({x:bb.x, y:CHAO_Y-110, t:'❤️+1', vida:1.4});
            }
        });
        var vivos = fase.inimigos.filter(function(i){ return i.vivo; }).length;
        var portaAberta = (fase.tipo==='arena'||fase.tipo==='boss') ? vivos===0 : true;
        if(portaAberta && Math.abs(fase.fim - 40 - pl.x) < 34 && pl.y > CHAO_Y - 60){
            var premio = 10 + portaAtual*2 + (andar-1)*50;
            moedas += premio;
            zeradas[portaAtual-1] = true;
            lsSet('moedas', moedas); lsSet('zeradas_' + andar, zeradas);
            rodando = false;
            fx.push({x:pl.x, y:pl.y-80, t:'🏆', vida:1.5});
            for(var i=0;i<26;i++) fx.push({x:pl.x+(Math.random()-0.5)*220, y:pl.y-Math.random()*220, t:['🎊','✨','🎉','⭐'][Math.floor(Math.random()*4)], vida:1.6});
            // 👑 zerou a porta 1000 do andar 10 = ZEROU O JOGO!!!
            if(andar === 10 && portaAtual === 1000){
                lsSet('zerouTudo', true);
                setTimeout(function(){ document.getElementById('zerou').style.display = 'flex'; }, 1200);
            } else {
                setTimeout(function(){ trancaPorta(portaAtual); iniciaHub(portaAtual); }, 1400);
            }
        }
    }

    cam = Math.max(0, Math.min(pl.x - W*0.38, fase.fim - W + 60));
    desenha();
    if(rodando) requestAnimationFrame(loop);
    else if(fx.length) (function anim(){ desenha(); if(fx.length) requestAnimationFrame(anim); })();
}

// ============ DESENHO DO CHEFÃO — um monstro diferente por mundo! ============
function desenhaBoss(ii, hue){
    var t = performance.now()/1000;
    var flip = ii.vel > 0 ? -1 : 1;
    var boca = Math.sin(t*4)*0.15 + 0.15;
    var flut = Math.sin(t*2.4) * 6;
    var corCorpo = 'hsl(' + hue + ',70%,40%)';
    var corCorpo2 = 'hsl(' + hue + ',80%,55%)';
    var corChifre = 'hsl(' + ((hue+180)%360) + ',80%,70%)';
    ctx.save();
    ctx.translate(ii.x, CHAO_Y - ii.tam*0.02 + flut);
    ctx.scale(flip, 1);
    var s = ii.tam / 60; // escala geral do desenho
    ctx.scale(s, s);

    // aura pulsante atrás do chefão
    var auraR = 46 + Math.sin(t*3)*5;
    var grad = ctx.createRadialGradient(0,-20,4, 0,-20,auraR);
    grad.addColorStop(0, 'hsla(' + hue + ',100%,65%,0.55)');
    grad.addColorStop(1, 'hsla(' + hue + ',100%,50%,0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(0,-20,auraR,0,7); ctx.fill();

    // sombra no chão
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath(); ctx.ellipse(0, 4-flut*0.3, 34, 8, 0, 0, 7); ctx.fill();

    // pernas grossas
    ctx.fillStyle = corCorpo;
    ctx.fillRect(-24, -18, 14, 22);
    ctx.fillRect(10, -18, 14, 22);

    // corpo musculoso
    ctx.beginPath();
    ctx.ellipse(0, -46, 30, 34, 0, 0, 7);
    ctx.fill();
    // barriga mais clara
    ctx.fillStyle = corCorpo2;
    ctx.beginPath(); ctx.ellipse(0, -38, 18, 20, 0, 0, 7); ctx.fill();

    // braços
    ctx.fillStyle = corCorpo;
    ctx.beginPath(); ctx.ellipse(-30, -50, 10, 18, 0.5, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(30, -50, 10, 18, -0.5, 0, 7); ctx.fill();
    // garras
    ctx.fillStyle = '#fff';
    for(var g=-1;g<=1;g++){ ctx.beginPath(); ctx.moveTo(-34+g*4,-38); ctx.lineTo(-32+g*4,-30); ctx.lineTo(-30+g*4,-38); ctx.fill(); }
    for(var g=-1;g<=1;g++){ ctx.beginPath(); ctx.moveTo(34+g*4,-38); ctx.lineTo(32+g*4,-30); ctx.lineTo(30+g*4,-38); ctx.fill(); }

    // cabeça
    ctx.fillStyle = corCorpo;
    ctx.beginPath(); ctx.arc(0, -78, 22, 0, 7); ctx.fill();

    // chifres
    ctx.fillStyle = corChifre;
    ctx.beginPath(); ctx.moveTo(-14,-92); ctx.quadraticCurveTo(-26,-112,-8,-118); ctx.quadraticCurveTo(-14,-100,-4,-90); ctx.fill();
    ctx.beginPath(); ctx.moveTo(14,-92); ctx.quadraticCurveTo(26,-112,8,-118); ctx.quadraticCurveTo(14,-100,4,-90); ctx.fill();

    // orelhas pontudas
    ctx.fillStyle = corCorpo2;
    ctx.beginPath(); ctx.moveTo(-20,-84); ctx.lineTo(-30,-96); ctx.lineTo(-14,-90); ctx.fill();
    ctx.beginPath(); ctx.moveTo(20,-84); ctx.lineTo(30,-96); ctx.lineTo(14,-90); ctx.fill();

    // olhos brilhantes (piscam de vez em quando)
    var pisca = (Math.sin(t*1.3) > 0.94);
    ctx.fillStyle = pisca ? corCorpo : '#fff';
    ctx.beginPath(); ctx.ellipse(-9,-80,6,pisca?1:6.5,0,0,7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(9,-80,6,pisca?1:6.5,0,0,7); ctx.fill();
    if(!pisca){
        ctx.fillStyle = '#ff2020';
        ctx.beginPath(); ctx.arc(-9,-80,3,0,7); ctx.fill();
        ctx.beginPath(); ctx.arc(9,-80,3,0,7); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(-10.5,-81.5,1.1,0,7); ctx.fill();
        ctx.beginPath(); ctx.arc(7.5,-81.5,1.1,0,7); ctx.fill();
    }
    // sobrancelhas bravas
    ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(-17,-88); ctx.lineTo(-4,-85); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(17,-88); ctx.lineTo(4,-85); ctx.stroke();

    // boca com presas
    ctx.fillStyle = '#3a0a0a';
    ctx.beginPath(); ctx.ellipse(0,-66,10,4+boca*10,0,0,7); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.moveTo(-7,-68); ctx.lineTo(-5,-60); ctx.lineTo(-3,-68); ctx.fill();
    ctx.beginPath(); ctx.moveTo(7,-68); ctx.lineTo(5,-60); ctx.lineTo(3,-68); ctx.fill();

    ctx.restore();
}
function desenha(){
    if(!fase) return;
    var n = fase.n;
    var hue = modo==='hub' ? (262 + (andar-1)*36)%360 : (n*23 + andar*57)%360;
    var g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'hsl('+hue+',45%,'+(modo==='hub'?22:16)+'%)');
    g.addColorStop(1,'hsl('+((hue+40)%360)+',50%,'+(modo==='hub'?34:30)+'%)');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
    ctx.save(); ctx.translate(-cam,0);

    fase.plats.forEach(function(p){
        var py = p.chao ? CHAO_Y : CHAO_Y - p.y;
        ctx.fillStyle = p.chao ? 'hsl('+hue+',35%,22%)' : 'hsl('+hue+',45%,38%)';
        ctx.fillRect(p.x, py, p.w, p.chao ? H-py : p.h);
        ctx.fillStyle = 'hsl('+((hue+90)%360)+',55%,45%)';
        ctx.fillRect(p.x, py, p.w, 8);
    });
    ctx.textAlign = 'center';

    if(modo === 'hub'){
        // as 100 portas — todas iguais, só com o número!
        fase.portas.forEach(function(p){
            ctx.fillStyle = '#7a4620';
            ctx.fillRect(p.x-26, CHAO_Y-86, 52, 86);
            ctx.fillStyle = '#a0622d';
            ctx.fillRect(p.x-22, CHAO_Y-82, 44, 82);
            ctx.fillStyle = '#ffd700';
            ctx.beginPath(); ctx.arc(p.x+12, CHAO_Y-42, 3.5, 0, 7); ctx.fill();
            ctx.fillStyle = '#ffe9c8'; ctx.font = 'bold 17px Arial';
            ctx.fillText(p.n, p.x, CHAO_Y-52);
            // trancada por 1 hora: mostra a ampulheta e os minutos que faltam
            if(portaTrancada(p.n)){
                var min = Math.ceil((travas[p.n] - Date.now())/60000);
                ctx.font = '18px Arial';
                ctx.fillText('⏳' + min, p.x, CHAO_Y-96);
            }
            // anel de entrar enchendo
            if(dwellAlvo === p.n && dwell > 0.05){
                ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 5;
                ctx.beginPath(); ctx.arc(p.x, CHAO_Y-120, 15, -Math.PI/2, -Math.PI/2 + (dwell/5)*Math.PI*2); ctx.stroke();
            }
        });
    } else {
        fase.espinhos.forEach(function(s){
            ctx.fillStyle = '#dfe3ee';
            for(var xx=s.x; xx<s.x+s.w; xx+=16){
                ctx.beginPath(); ctx.moveTo(xx,CHAO_Y); ctx.lineTo(xx+8,CHAO_Y-20); ctx.lineTo(xx+16,CHAO_Y); ctx.fill();
            }
        });
        fase.baus.forEach(function(b){ ctx.font='36px Arial'; ctx.fillText(b.aberto?'📭':'🎁', b.x, CHAO_Y-6); });
        fase.moedinhas.forEach(function(m){ if(!m.pega){ ctx.font='26px Arial'; ctx.fillText('🪙', m.x, CHAO_Y - m.y); } });
        var vivos = fase.inimigos.filter(function(i){ return i.vivo; }).length;
        var aberta = (fase.tipo==='arena'||fase.tipo==='boss') ? vivos===0 : true;
        ctx.font = '64px Arial';
        ctx.fillText(aberta ? '🚪' : '🔒', fase.fim-40, CHAO_Y-4);
        if(!aberta){ ctx.font='26px Arial'; ctx.fillText('👾×'+vivos, fase.fim-40, CHAO_Y-80); }
        fase.inimigos.forEach(function(ii){
            if(!ii.vivo) return;
            if(ii.boss){
                desenhaBoss(ii, hue);
            } else {
                ctx.font = ii.tam + 'px Arial';
                ctx.save();
                ctx.translate(ii.x, CHAO_Y-2);
                if(ii.vel > 0) ctx.scale(-1,1);
                ctx.fillText(ii.e, 0, 0);
                ctx.restore();
            }
            var bw = ii.boss ? ii.tam*1.5 : ii.tam;
            ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(ii.x-bw/2, CHAO_Y-ii.tam-(ii.boss?34:16), bw, ii.boss?10:7);
            ctx.fillStyle = ii.boss ? '#ff4444' : '#4dff88';
            ctx.fillRect(ii.x-bw/2, CHAO_Y-ii.tam-(ii.boss?34:16), bw*Math.max(0,ii.hp/ii.hpMax), ii.boss?10:7);
        });
    }

    // jogador — a Capivara Aventureira, desenhada só pra esse jogo!
    if(!(pl.inv > 0 && Math.floor(pl.inv*10)%2===0)){
        ctx.save();
        ctx.translate(pl.x, pl.y);
        if(pl.dir < 0) ctx.scale(-1,1);
        var andando = Math.abs(pl.vx) > 30 && pl.chao;
        var passo = andando ? Math.sin(performance.now()/70)*4 : 0;
        var respira = Math.sin(performance.now()/450)*1.2;
        // rabinho fofo
        ctx.fillStyle = '#8a5c3a';
        ctx.beginPath(); ctx.ellipse(-24, -22-passo*0.3, 6, 5, 0.3, 0, 7); ctx.fill();
        // perninhas
        ctx.fillStyle = '#6b4529';
        ctx.fillRect(-16, -10 + passo, 8, 10 - passo);
        ctx.fillRect(2,   -10 - passo, 8, 10 + passo);
        // corpo redondinho com sombra de barriga
        ctx.fillStyle = '#a9744f';
        ctx.beginPath(); ctx.ellipse(-3, -26+respira*0.3, 22, 17+respira*0.3, 0, 0, 7); ctx.fill();
        ctx.fillStyle = '#c69269';
        ctx.beginPath(); ctx.ellipse(-4, -19, 15, 8, 0, 0, 7); ctx.fill();
        // pelinho no lombo (textura)
        ctx.strokeStyle = 'rgba(90,58,36,0.4)'; ctx.lineWidth = 1.5;
        for(var pp=-14; pp<12; pp+=6){ ctx.beginPath(); ctx.moveTo(pp,-36); ctx.lineTo(pp-2,-30); ctx.stroke(); }
        // cabeça quadradinha de capivara
        ctx.fillStyle = '#a9744f';
        ctx.beginPath(); ctx.ellipse(15, -36, 13, 11, -0.15, 0, 7); ctx.fill();
        // bochecha
        ctx.fillStyle = '#bb8760';
        ctx.beginPath(); ctx.ellipse(17, -30, 8, 6, 0, 0, 7); ctx.fill();
        // focinho claro
        ctx.fillStyle = '#dcb28c';
        ctx.beginPath(); ctx.ellipse(25, -32, 7, 6, 0, 0, 7); ctx.fill();
        // narina
        ctx.fillStyle = '#4a2c18';
        ctx.beginPath(); ctx.ellipse(27.5, -33, 1.6, 1.1, 0, 0, 7); ctx.fill();
        // bigodinhos
        ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(28,-31); ctx.lineTo(36,-33); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(28,-29); ctx.lineTo(36,-28); ctx.stroke();
        // orelha de trás (mais escura, dá profundidade)
        ctx.fillStyle = '#6b4529';
        ctx.beginPath(); ctx.arc(6, -47, 3, 0, 7); ctx.fill();
        // orelhinha da frente
        ctx.fillStyle = '#8a5a3a';
        ctx.beginPath(); ctx.arc(10, -47, 4, 0, 7); ctx.fill();
        ctx.fillStyle = '#5a3a24';
        ctx.beginPath(); ctx.arc(10, -47, 2, 0, 7); ctx.fill();
        // olho com brilho
        ctx.fillStyle = '#1e1208';
        ctx.beginPath(); ctx.ellipse(17.5, -39, 2.6, 3, 0, 0, 7); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(18.6, -40.2, 0.9, 0, 7); ctx.fill();
        // sobrancelha fofa
        ctx.strokeStyle = '#5a3a24'; ctx.lineWidth = 1.4;
        ctx.beginPath(); ctx.moveTo(14,-44); ctx.quadraticCurveTo(18,-46,21,-44); ctx.stroke();
        // faixa de aventureira na testa com nozinho
        ctx.strokeStyle = '#d8322a'; ctx.lineWidth = 3.5;
        ctx.beginPath(); ctx.moveTo(4, -44); ctx.lineTo(26, -41); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(5, -44); ctx.lineTo(-2, -50); ctx.stroke();
        ctx.fillStyle = '#d8322a';
        ctx.beginPath(); ctx.arc(4, -44, 2.6, 0, 7); ctx.fill();
        // espada na patinha, com leve rastro quando ataca
        if(pl.atq > 0){
            ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.arc(20,-20, 26, -0.3, 0.9); ctx.stroke();
        }
        ctx.font = '30px Arial'; ctx.textAlign = 'center';
        ctx.save();
        ctx.translate(24, -18);
        ctx.rotate(pl.atq > 0 ? 0.9 : 0.15);
        ctx.fillText(ESPADAS[eq].e, 0, 0);
        ctx.restore();
        ctx.restore();
    }
    // efeitos
    ctx.font = '26px Arial';
    for(var i=fx.length-1; i>=0; i--){
        var f = fx[i];
        f.y -= 0.7; f.vida -= 0.016;
        ctx.globalAlpha = Math.max(0, Math.min(1, f.vida));
        ctx.fillText(f.t, f.x, f.y);
        if(f.vida <= 0) fx.splice(i,1);
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    // HUD sem palavras
    ctx.textAlign = 'left'; ctx.font = 'bold 24px Arial'; ctx.fillStyle = '#fff';
    ctx.fillText('🪙' + Math.floor(moedas).toLocaleString('pt-BR'), 14, 34);
    ctx.fillText(ESPADAS[eq].e + '💥' + ESPADAS[eq].d, 14, 64);
    if(modo === 'hub'){
        ctx.fillText('🏛️' + andar, 14, 94);
    }
    ctx.font = 'bold 20px Arial';
    ctx.fillText('❤️' + Math.max(0,vidas) + '/' + VIDAS_MAX, 14, modo==='hub' ? 122 : 152);
    ctx.font = 'bold 24px Arial';
    if(modo === 'fase'){
        ctx.fillText('🚪' + fase.n, 14, 94);
    }
}

iniciaHub(0);
</script>
