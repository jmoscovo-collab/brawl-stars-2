<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>100 Portas — Cogumelo Games</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
html,body { height:100%; overflow:hidden; }
body { background:#141428; font-family:Arial,sans-serif; color:#fff; user-select:none; }
canvas { display:block; position:fixed; inset:0; touch-action:none; }

/* ===== LOJA (sem texto) ===== */
#loja { position:fixed; inset:0; z-index:20; background:rgba(8,8,24,0.9); display:none; align-items:center; justify-content:center; }
#loja .cartao { background:linear-gradient(180deg,#2d1b4e,#1a1a3e); border:3px solid #ffaa00; border-radius:22px; padding:18px;
    width:min(94vw,420px); max-height:86vh; overflow:auto; text-align:center; }
#loja h2 { font-size:34px; margin-bottom:10px; }
.espada { display:flex; align-items:center; gap:10px; width:100%; margin:7px 0; padding:10px 14px; border:none; border-radius:14px; cursor:pointer;
    background:rgba(255,255,255,0.08); border:2px solid rgba(255,255,255,0.25); color:#fff; font-size:18px; font-weight:bold; }
.espada:active { transform:scale(0.96); }
.espada .ic { font-size:32px; }
.espada .info { flex:1; text-align:left; display:flex; gap:12px; }
.espada.minha { border-color:#4dff88; }
.espada.equipada { border-color:#ffd700; background:rgba(255,215,0,0.15); box-shadow:0 0 12px rgba(255,215,0,0.4); }
.espada.caro { opacity:0.45; }
#fecharLoja { font-size:26px; margin-top:8px; padding:8px 26px; border:none; border-radius:14px; cursor:pointer; background:#556; color:#fff; }

/* ===== CONTROLES TOUCH (sem texto) ===== */
.ctl { position:fixed; bottom:18px; z-index:6; width:64px; height:64px; border-radius:50%; border:none; font-size:30px;
    background:rgba(255,255,255,0.16); backdrop-filter:blur(3px); color:#fff; align-items:center; justify-content:center; }
.ctl:active { background:rgba(255,255,255,0.4); }
#bEsq { left:16px; } #bDir { left:94px; } #bPulo { right:94px; } #bAtq { right:16px; background:rgba(255,120,60,0.3); }
#bSair { position:fixed; top:12px; right:12px; z-index:6; font-size:24px; width:46px; height:46px; border-radius:12px; border:none;
    background:rgba(255,255,255,0.15); color:#fff; display:none; }
#bLoja { position:fixed; top:12px; right:12px; z-index:6; font-size:26px; width:52px; height:52px; border-radius:14px; border:2px solid #ffaa00;
    background:rgba(255,170,0,0.2); color:#fff; display:none; cursor:pointer; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<button class="ctl" id="bEsq" style="display:none">◀️</button>
<button class="ctl" id="bDir" style="display:none">▶️</button>
<button class="ctl" id="bPulo" style="display:none">🦵</button>
<button class="ctl" id="bAtq" style="display:none">⚔️</button>
<button id="bSair">🚪</button>
<button id="bLoja" onclick="abreLoja()">🛒</button>

<div id="loja">
    <div class="cartao">
        <h2>🛒⚔️</h2>
        <div id="listaEspadas"></div>
        <button id="fecharLoja" onclick="fechaLoja()">❌</button>
    </div>
</div>

<script src="/stats.js"></script>
<script src="/avisos.js?v=6"></script>
<script>
if (window.initStats) initStats('portas');

// ============ SAVE ============
function lsGet(k,d){ try{ var v=localStorage.getItem('portas_'+k); return v===null?d:JSON.parse(v); }catch(e){ return d; } }
function lsSet(k,v){ try{ localStorage.setItem('portas_'+k, JSON.stringify(v)); }catch(e){} }
var moedas = lsGet('moedas', 0);
var zeradas = lsGet('zeradas', []);
var minhas = lsGet('espadas', [true]);
var eq = lsGet('eq', 0);

// ============ ESPADAS ============
var ESPADAS = [
    { e:'🥢', d:1,  p:0 },
    { e:'🗡️', d:2,  p:60 },
    { e:'⚔️', d:4,  p:250 },
    { e:'🪓', d:7,  p:700 },
    { e:'🔱', d:12, p:1800 },
    { e:'⚡', d:20, p:4500 },
    { e:'🔥', d:35, p:12000 },
    { e:'🌈', d:60, p:30000 }
];

// ============ LOJA ============
function abreLoja(){
    rodando = false; // pausa o jogo enquanto a loja tá aberta
    var el = document.getElementById('listaEspadas');
    el.innerHTML = '';
    ESPADAS.forEach(function(s, i){
        var b = document.createElement('button');
        var tem = minhas[i];
        b.className = 'espada' + (tem ? ' minha' : (moedas < s.p ? ' caro' : '')) + (eq === i ? ' equipada' : '');
        b.innerHTML = '<span class="ic">' + s.e + '</span><span class="info"><span>💥' + s.d + '</span>' +
            (tem ? (eq===i ? '<span>✅</span>' : '<span>👆</span>') : '<span>🪙' + s.p.toLocaleString('pt-BR') + '</span>') + '</span>';
        b.onclick = function(){
            if(minhas[i]){ eq = i; lsSet('eq', eq); }
            else if(moedas >= s.p){ moedas -= s.p; minhas[i] = true; eq = i; lsSet('moedas',moedas); lsSet('espadas',minhas); lsSet('eq',eq); }
            abreLoja();
        };
        el.appendChild(b);
    });
    document.getElementById('loja').style.display = 'flex';
}
function fechaLoja(){
    document.getElementById('loja').style.display = 'none';
    rodando = true; ultimoT = performance.now();
    requestAnimationFrame(loop);
}
window.abreLoja = abreLoja; window.fechaLoja = fechaLoja;

// ============ RNG com semente ============
function rnd(seed){
    var a = seed >>> 0;
    return function(){
        a |= 0; a = a + 0x6D2B79F5 | 0;
        var t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
}
function tipoDe(n){
    if(n % 10 === 0) return 'boss';
    var t = rnd(n*7+3)();
    if(t < 0.4) return 'parkour';
    if(t < 0.75) return 'arena';
    return 'tesouro';
}
var ICONE = { parkour:'🏃', arena:'👾', tesouro:'🎁', boss:'👹' };

// ============ SALÃO DAS 100 PORTAS (o "mundo" onde você nasce) ============
var ESPACO = 170;
function geraHub(){
    var L = { plats:[], espinhos:[], inimigos:[], moedinhas:[], baus:[], portas:[], tipo:'hub', n:0 };
    L.fim = 100*ESPACO + 500;
    L.plats.push({x:0, y:0, w:L.fim, h:400, chao:true});
    for(var n=1; n<=100; n++) L.portas.push({ n:n, x:260 + (n-1)*ESPACO });
    return L;
}

// ============ GERADOR DAS FASES (dentro de cada porta) ============
var CHAO_Y = 0;
function gera(n){
    var r = rnd(n * 1337 + 42);
    var tipo = tipoDe(n);
    var dif = n / 100;
    var L = { plats:[], espinhos:[], inimigos:[], moedinhas:[], baus:[], portas:[], tipo:tipo, n:n };
    var fim = 1800 + n * 25;
    if(tipo === 'arena' || tipo === 'boss') fim = 1300;
    L.fim = fim;
    var x = 0, buracoChance = tipo==='parkour' ? 0.42 : (tipo==='boss'||tipo==='arena' ? 0 : 0.22);
    while(x < fim){
        var w = 220 + r()*320;
        L.plats.push({x:x, y:0, w:w, h:400, chao:true});
        var gap = (r() < buracoChance) ? (90 + r()*(70 + dif*80)) : 0;
        x += w + gap;
    }
    var qp = tipo==='parkour' ? 10 + Math.floor(dif*14) : 5;
    for(var i=0;i<qp;i++){
        var px = 200 + r()*(fim-400);
        L.plats.push({x:px, y:110 + r()*160, w:90 + r()*110, h:18});
    }
    var qe = tipo==='parkour' ? 6 + Math.floor(dif*12) : (tipo==='tesouro' ? 4 : 2);
    for(var i=0;i<qe;i++) L.espinhos.push({x:320 + r()*(fim-500), w:40 + r()*50});
    var qi = tipo==='arena' ? 3 + Math.floor(dif*7) : (tipo==='boss' ? 0 : 1 + Math.floor(dif*4));
    var EMO = ['👾','🧟','🤖','👻','💀','🐗','🦂'];
    for(var i=0;i<qi;i++){
        var hp = Math.ceil(1 + dif*14 + r()*3);
        L.inimigos.push({x:380 + r()*(fim-560), y:0, hp:hp, hpMax:hp, e:EMO[Math.floor(r()*EMO.length)],
            vel:(40 + r()*60 + dif*80) * (r()<0.5?-1:1), tam:38, vivo:true, dropa:2 + Math.floor(r()*4 + dif*6)});
    }
    if(tipo === 'boss'){
        var bhp = 10 + n;
        L.inimigos.push({x:fim-350, y:0, hp:bhp, hpMax:bhp, e:'👹', vel:60 + dif*120, tam:86, vivo:true, boss:true, dropa:40 + n});
    }
    var qm = 8 + Math.floor(r()*8);
    for(var i=0;i<qm;i++) L.moedinhas.push({x:150 + r()*(fim-300), y:60 + r()*200, pega:false});
    var qb = tipo==='tesouro' ? 3 + Math.floor(r()*3) : (r()<0.3 ? 1 : 0);
    for(var i=0;i<qb;i++) L.baus.push({x:300 + r()*(fim-450), aberto:false, valor:15 + Math.floor(r()*35 + dif*60)});
    return L;
}

// ============ CANVAS ============
var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
var W, H;
function resize(){
    W = innerWidth; H = innerHeight;
    cv.width = W*devicePixelRatio; cv.height = H*devicePixelRatio;
    cv.style.width = W + 'px'; cv.style.height = H + 'px'; // sem isso o canvas fica 2x maior que a tela!
    ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
    CHAO_Y = H - 90;
}
addEventListener('resize', resize); resize();

// ============ ESTADO ============
var fase = null, rodando = false, cam = 0, portaAtual = 0, modo = 'hub';
var pl = {}, fx = [], dwell = 0, dwellAlvo = null, lojaCooldown = 0;

function iniciaHub(voltandoDaPorta){
    modo = 'hub';
    fase = geraHub();
    var px = voltandoDaPorta ? 260 + (voltandoDaPorta-1)*ESPACO : 60;
    pl = { x:px, y:CHAO_Y-40, vx:0, vy:0, dir:1, chao:false, vidas:3, inv:0.6, atq:0 };
    dwell = 0; dwellAlvo = null;
    document.getElementById('bSair').style.display = 'none';
    document.getElementById('bLoja').style.display = 'block';
    mostraTouch(true);
    rodando = true; ultimoT = performance.now();
    requestAnimationFrame(loop);
}
function inicia(n){
    modo = 'fase';
    portaAtual = n;
    fase = gera(n);
    pl = { x:60, y:CHAO_Y-100, vx:0, vy:0, dir:1, chao:false, vidas:3, inv:0, atq:0 };
    cam = 0; dwell = 0; dwellAlvo = null;
    document.getElementById('bSair').style.display = 'block';
    document.getElementById('bLoja').style.display = 'none';
    rodando = true; ultimoT = performance.now();
    requestAnimationFrame(loop);
}
function mostraTouch(sim){
    var d = (sim && matchMedia('(pointer:coarse)').matches) ? 'flex' : 'none';
    ['bEsq','bDir','bPulo','bAtq'].forEach(function(id){ document.getElementById(id).style.display = d; });
}
document.getElementById('bSair').onclick = function(){
    lsSet('moedas', moedas); lsSet('zeradas', zeradas);
    iniciaHub(portaAtual);
};

// ============ CONTROLES ============
var tec = {};
addEventListener('keydown', function(e){ tec[e.key.toLowerCase()] = true; if(e.key===' ') e.preventDefault(); var k = e.key.toLowerCase(); if((k==='e'||k==='x'||k==='j') && rodando && modo==='fase') ataca(); });
// clique do mouse também ataca!
cv.addEventListener('pointerdown', function(e){ if(rodando && modo==='fase' && !matchMedia('(pointer:coarse)').matches) ataca(); });
addEventListener('keyup', function(e){ tec[e.key.toLowerCase()] = false; });
function segura(id, prop){
    var el = document.getElementById(id);
    el.addEventListener('pointerdown', function(e){ e.preventDefault(); tec[prop] = true; });
    el.addEventListener('pointerup', function(){ tec[prop] = false; });
    el.addEventListener('pointercancel', function(){ tec[prop] = false; });
    el.addEventListener('pointerleave', function(){ tec[prop] = false; });
}
segura('bEsq','arrowleft'); segura('bDir','arrowright'); segura('bPulo',' ');
document.getElementById('bAtq').addEventListener('pointerdown', function(e){ e.preventDefault(); if(rodando && modo==='fase') ataca(); });

function ataca(){
    if(pl.atq > 0) return;
    pl.atq = 0.28;
    var alcance = 78, dano = ESPADAS[eq].d;
    fase.inimigos.forEach(function(ii){
        if(!ii.vivo) return;
        var dx = ii.x - pl.x, dy = Math.abs((CHAO_Y - ii.tam/2) - pl.y);
        if(dy < 90 && dx*pl.dir > -20 && Math.abs(dx) < alcance + ii.tam/2){
            ii.hp -= dano;
            fx.push({x:ii.x, y:CHAO_Y-ii.tam-14, t:'💥', vida:0.5});
            if(ii.hp <= 0){
                ii.vivo = false;
                moedas += ii.dropa;
                fx.push({x:ii.x, y:CHAO_Y-ii.tam-30, t:'🪙+' + ii.dropa, vida:1.2});
            }
        }
    });
}
function machuca(){
    if(pl.inv > 0) return;
    pl.vidas--; pl.inv = 1.4;
    pl.vy = -420; pl.vx = -pl.dir * 260;
    if(pl.vidas <= 0){
        fx.push({x:pl.x, y:pl.y, t:'💀', vida:1});
        rodando = false;
        lsSet('moedas', moedas);
        setTimeout(function(){ iniciaHub(portaAtual); }, 900);
    }
}

// ============ LOOP ============
var ultimoT = 0;
function loop(agora){
    if(!rodando){ desenha(); return; }
    var dt = Math.min((agora-ultimoT)/1000, 0.04);
    ultimoT = agora;
    var ACEL = 1600, MAXV = 340, PULO = 660, GRAV = 1800;

    if(tec['arrowleft']||tec['a']) { pl.vx -= ACEL*dt; pl.dir = -1; }
    else if(tec['arrowright']||tec['d']) { pl.vx += ACEL*dt; pl.dir = 1; }
    else pl.vx *= (pl.chao ? 0.78 : 0.96);
    pl.vx = Math.max(-MAXV, Math.min(MAXV, pl.vx));
    if((tec[' ']||tec['arrowup']||tec['w']) && pl.chao){ pl.vy = -PULO; pl.chao = false; }

    pl.vy += GRAV*dt;
    pl.x += pl.vx*dt; pl.y += pl.vy*dt;
    if(pl.x < 20) pl.x = 20;
    if(pl.x > fase.fim - 20) pl.x = fase.fim - 20;
    if(pl.atq > 0) pl.atq -= dt;
    if(pl.inv > 0) pl.inv -= dt;
    if(lojaCooldown > 0) lojaCooldown -= dt;

    pl.chao = false;
    fase.plats.forEach(function(p){
        var py = p.chao ? CHAO_Y : CHAO_Y - p.y;
        if(pl.x > p.x-16 && pl.x < p.x+p.w+16 && pl.y >= py-4 && pl.y - pl.vy*dt <= py+6 && pl.vy >= 0){
            pl.y = py; pl.vy = 0; pl.chao = true;
        }
    });

    if(modo === 'hub'){
        // parado na frente de uma porta = ENTRA (enche o anelzinho)
        var perto = null;
        for(var i=0;i<fase.portas.length;i++){
            if(Math.abs(fase.portas[i].x - pl.x) < 26 && pl.chao){ perto = fase.portas[i]; break; }
        }
        if(perto){
            if(dwellAlvo === perto.n) dwell += dt; else { dwellAlvo = perto.n; dwell = 0; }
            if(dwell > 0.45){ lsSet('moedas',moedas); inicia(perto.n); return; }
        } else { dwell = 0; dwellAlvo = null; }
    } else {
        // ===== dentro da porta =====
        if(pl.y > H + 60){
            pl.vidas--;
            if(pl.vidas <= 0){ rodando=false; lsSet('moedas',moedas); setTimeout(function(){ iniciaHub(portaAtual); }, 600); }
            else { pl.x = Math.max(40, pl.x - 260); pl.y = CHAO_Y - 200; pl.vy = 0; pl.inv = 1.5; }
        }
        fase.espinhos.forEach(function(s){
            if(pl.y > CHAO_Y - 26 && pl.x > s.x-10 && pl.x < s.x+s.w+10) machuca();
        });
        fase.inimigos.forEach(function(ii){
            if(!ii.vivo) return;
            ii.x += ii.vel*dt;
            if(ii.x < 140 || ii.x > fase.fim-60) ii.vel *= -1;
            if(ii.boss) ii.vel = (pl.x > ii.x ? 1 : -1) * Math.abs(ii.vel);
            var dx = Math.abs(ii.x-pl.x), dy = Math.abs((CHAO_Y-ii.tam/2)-(pl.y-20));
            if(dx < ii.tam/2+14 && dy < ii.tam/2+22) machuca();
        });
        fase.moedinhas.forEach(function(m){
            if(m.pega) return;
            if(Math.abs(m.x-pl.x)<28 && Math.abs((CHAO_Y-m.y)-(pl.y-20))<34){ m.pega = true; moedas++; }
        });
        fase.baus.forEach(function(bb){
            if(bb.aberto) return;
            if(Math.abs(bb.x-pl.x) < 34 && pl.y > CHAO_Y-40){
                bb.aberto = true; moedas += bb.valor;
                fx.push({x:bb.x, y:CHAO_Y-70, t:'🪙+'+bb.valor, vida:1.4});
            }
        });
        var vivos = fase.inimigos.filter(function(i){ return i.vivo; }).length;
        var portaAberta = (fase.tipo==='arena'||fase.tipo==='boss') ? vivos===0 : true;
        if(portaAberta && Math.abs(fase.fim - 40 - pl.x) < 34 && pl.y > CHAO_Y - 60){
            var premio = 10 + portaAtual*2;
            moedas += premio;
            zeradas[portaAtual-1] = true;
            lsSet('moedas', moedas); lsSet('zeradas', zeradas);
            rodando = false;
            fx.push({x:pl.x, y:pl.y-80, t:'🏆', vida:1.5});
            for(var i=0;i<26;i++) fx.push({x:pl.x+(Math.random()-0.5)*220, y:pl.y-Math.random()*220, t:['🎊','✨','🎉','⭐'][Math.floor(Math.random()*4)], vida:1.6});
            setTimeout(function(){ iniciaHub(portaAtual); }, 1400);
        }
    }

    cam = Math.max(0, Math.min(pl.x - W*0.38, fase.fim - W + 60));
    desenha();
    if(rodando) requestAnimationFrame(loop);
    else if(fx.length) (function anim(){ desenha(); if(fx.length) requestAnimationFrame(anim); })();
}

// ============ DESENHO ============
function desenha(){
    if(!fase) return;
    var n = fase.n;
    var hue = modo==='hub' ? 262 : (n*23)%360;
    var g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'hsl('+hue+',45%,'+(modo==='hub'?22:16)+'%)');
    g.addColorStop(1,'hsl('+((hue+40)%360)+',50%,'+(modo==='hub'?34:30)+'%)');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
    ctx.save(); ctx.translate(-cam,0);

    fase.plats.forEach(function(p){
        var py = p.chao ? CHAO_Y : CHAO_Y - p.y;
        ctx.fillStyle = p.chao ? 'hsl('+hue+',35%,22%)' : 'hsl('+hue+',45%,38%)';
        ctx.fillRect(p.x, py, p.w, p.chao ? H-py : p.h);
        ctx.fillStyle = 'hsl('+((hue+90)%360)+',55%,45%)';
        ctx.fillRect(p.x, py, p.w, 8);
    });
    ctx.textAlign = 'center';

    if(modo === 'hub'){
        // as 100 portas — todas iguais, só com o número!
        fase.portas.forEach(function(p){
            ctx.fillStyle = '#7a4620';
            ctx.fillRect(p.x-26, CHAO_Y-86, 52, 86);
            ctx.fillStyle = '#a0622d';
            ctx.fillRect(p.x-22, CHAO_Y-82, 44, 82);
            ctx.fillStyle = '#ffd700';
            ctx.beginPath(); ctx.arc(p.x+12, CHAO_Y-42, 3.5, 0, 7); ctx.fill();
            ctx.fillStyle = '#ffe9c8'; ctx.font = 'bold 17px Arial';
            ctx.fillText(p.n, p.x, CHAO_Y-52);
            // anel de entrar enchendo
            if(dwellAlvo === p.n && dwell > 0.05){
                ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 5;
                ctx.beginPath(); ctx.arc(p.x, CHAO_Y-120, 15, -Math.PI/2, -Math.PI/2 + (dwell/0.45)*Math.PI*2); ctx.stroke();
            }
        });
    } else {
        fase.espinhos.forEach(function(s){
            ctx.fillStyle = '#dfe3ee';
            for(var xx=s.x; xx<s.x+s.w; xx+=16){
                ctx.beginPath(); ctx.moveTo(xx,CHAO_Y); ctx.lineTo(xx+8,CHAO_Y-20); ctx.lineTo(xx+16,CHAO_Y); ctx.fill();
            }
        });
        fase.baus.forEach(function(b){ ctx.font='36px Arial'; ctx.fillText(b.aberto?'📭':'🎁', b.x, CHAO_Y-6); });
        fase.moedinhas.forEach(function(m){ if(!m.pega){ ctx.font='26px Arial'; ctx.fillText('🪙', m.x, CHAO_Y - m.y); } });
        var vivos = fase.inimigos.filter(function(i){ return i.vivo; }).length;
        var aberta = (fase.tipo==='arena'||fase.tipo==='boss') ? vivos===0 : true;
        ctx.font = '64px Arial';
        ctx.fillText(aberta ? '🚪' : '🔒', fase.fim-40, CHAO_Y-4);
        if(!aberta){ ctx.font='26px Arial'; ctx.fillText('👾×'+vivos, fase.fim-40, CHAO_Y-80); }
        fase.inimigos.forEach(function(ii){
            if(!ii.vivo) return;
            ctx.font = ii.tam + 'px Arial';
            ctx.save();
            ctx.translate(ii.x, CHAO_Y-2);
            if(ii.vel > 0) ctx.scale(-1,1);
            ctx.fillText(ii.e, 0, 0);
            ctx.restore();
            var bw = ii.tam;
            ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(ii.x-bw/2, CHAO_Y-ii.tam-16, bw, 7);
            ctx.fillStyle = ii.boss ? '#ff4444' : '#4dff88';
            ctx.fillRect(ii.x-bw/2, CHAO_Y-ii.tam-16, bw*Math.max(0,ii.hp/ii.hpMax), 7);
        });
    }

    // jogador — a Capivara Aventureira, desenhada só pra esse jogo!
    if(!(pl.inv > 0 && Math.floor(pl.inv*10)%2===0)){
        ctx.save();
        ctx.translate(pl.x, pl.y);
        if(pl.dir < 0) ctx.scale(-1,1);
        var andando = Math.abs(pl.vx) > 30 && pl.chao;
        var passo = andando ? Math.sin(performance.now()/70)*4 : 0;
        // perninhas
        ctx.fillStyle = '#7c5236';
        ctx.fillRect(-16, -10 + passo, 8, 10 - passo);
        ctx.fillRect(2,   -10 - passo, 8, 10 + passo);
        // corpo redondinho
        ctx.fillStyle = '#a9744f';
        ctx.beginPath(); ctx.ellipse(-3, -26, 22, 17, 0, 0, 7); ctx.fill();
        // cabeça quadradinha de capivara
        ctx.beginPath(); ctx.ellipse(15, -36, 13, 11, -0.15, 0, 7); ctx.fill();
        // focinho claro
        ctx.fillStyle = '#c9987a';
        ctx.beginPath(); ctx.ellipse(24, -33, 6.5, 5.5, 0, 0, 7); ctx.fill();
        // narina
        ctx.fillStyle = '#5a3a24';
        ctx.beginPath(); ctx.arc(26, -34, 1.4, 0, 7); ctx.fill();
        // orelhinha
        ctx.fillStyle = '#8a5a3a';
        ctx.beginPath(); ctx.arc(10, -46, 3.5, 0, 7); ctx.fill();
        // olho
        ctx.fillStyle = '#1e1208';
        ctx.beginPath(); ctx.arc(17, -39, 2.2, 0, 7); ctx.fill();
        // faixa de aventureira na testa
        ctx.strokeStyle = '#d8322a'; ctx.lineWidth = 3.5;
        ctx.beginPath(); ctx.moveTo(4, -44); ctx.lineTo(26, -41); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(5, -44); ctx.lineTo(-2, -50); ctx.stroke();
        // espada na patinha
        ctx.font = '30px Arial'; ctx.textAlign = 'center';
        ctx.save();
        ctx.translate(24, -18);
        ctx.rotate(pl.atq > 0 ? 0.9 : 0.15);
        ctx.fillText(ESPADAS[eq].e, 0, 0);
        ctx.restore();
        ctx.restore();
    }
    // efeitos
    ctx.font = '26px Arial';
    for(var i=fx.length-1; i>=0; i--){
        var f = fx[i];
        f.y -= 0.7; f.vida -= 0.016;
        ctx.globalAlpha = Math.max(0, Math.min(1, f.vida));
        ctx.fillText(f.t, f.x, f.y);
        if(f.vida <= 0) fx.splice(i,1);
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    // HUD sem palavras
    ctx.textAlign = 'left'; ctx.font = 'bold 24px Arial'; ctx.fillStyle = '#fff';
    ctx.fillText('🪙' + Math.floor(moedas).toLocaleString('pt-BR'), 14, 34);
    ctx.fillText(ESPADAS[eq].e + '💥' + ESPADAS[eq].d, 14, 64);
    if(modo === 'fase'){
        ctx.fillText('🚪' + fase.n, 14, 94);
        var cor = '❤️'.repeat(Math.max(0,pl.vidas)) + '🖤'.repeat(Math.max(0, 3-pl.vidas));
        ctx.fillText(cor, 14, 124);
    }
}

iniciaHub(0);
</script>
