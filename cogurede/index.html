<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CoguRede 🍄 - Cogumelo Games</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'Segoe UI',Arial,sans-serif; min-height:100vh; color:#fff;
    background:linear-gradient(160deg,#12081f,#1a0b45 40%,#0f1a35);
    background-attachment:fixed;
  }
  header {
    position:sticky; top:0; z-index:50; backdrop-filter:blur(8px);
    background:rgba(18,8,31,.85); border-bottom:2px solid rgba(255,80,160,.4);
    padding:12px 16px; display:flex; align-items:center; gap:12px;
  }
  header h1 {
    font-size:26px;
    background:linear-gradient(90deg,#ff5588,#cc66ff,#66aaff);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  header a { margin-left:auto; color:#8fa; text-decoration:none; font-size:14px; }
  .wrap { max-width:560px; margin:0 auto; padding:16px; }

  .card {
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12);
    border-radius:18px; padding:14px; margin-bottom:14px;
    box-shadow:0 4px 20px rgba(0,0,0,.3);
  }
  .composer input[type=text] {
    width:100%; padding:12px; border-radius:12px; border:none; font-size:15px;
    background:rgba(255,255,255,.12); color:#fff; margin-bottom:8px;
  }
  .composer input::placeholder { color:#bbb; }
  .composer .row { display:flex; gap:8px; flex-wrap:wrap; }
  button {
    border:none; border-radius:12px; padding:10px 16px; font-weight:bold;
    cursor:pointer; font-size:14px; color:#fff;
  }
  .btnPost { background:linear-gradient(135deg,#ff5588,#cc44ff); flex:1; }
  .btnFoto { background:rgba(255,255,255,.15); }
  .post b { display:block; font-size:15px; margin-bottom:4px; }
  .post .txt { font-size:15px; line-height:1.45; word-wrap:break-word; }
  .post img { width:100%; border-radius:12px; margin-top:8px; }
  .post iframe { width:100%; height:280px; border:none; border-radius:12px; margin-top:8px; }
  .actions { display:flex; gap:8px; margin-top:10px; }
  .like { background:rgba(255,255,255,.1); }
  .like.liked { background:rgba(255,80,130,.45); }
  .del { background:rgba(255,255,255,.06); color:#f88; margin-left:auto; font-size:12px; }
  .time { font-size:11px; opacity:.5; font-weight:normal; }
  .avatar { font-size:22px; margin-right:4px; }
  #nameBox input {
    padding:10px; border-radius:10px; border:none; font-size:15px; width:100%;
    background:rgba(255,255,255,.12); color:#fff; margin:8px 0;
  }
  .hint { font-size:12px; opacity:.55; text-align:center; margin:14px 0 30px; line-height:1.6; }
</style>
</head>
<body>
<header>
  <span style="font-size:28px">🍄</span>
  <h1>CoguRede</h1>
  <a href="/">← Cogumelo Games</a>
</header>
<div class="wrap">

  <div class="card" id="nameBox" style="display:none">
    <b>Bem-vindo à CoguRede! 🎉</b>
    <div style="font-size:13px;opacity:.8">Escolha seu nome de usuário:</div>
    <input id="uName" placeholder="Ex: DaviGamer123" maxlength="20">
    <div style="display:flex;gap:8px;align-items:center">
      <span style="font-size:13px;opacity:.8">Seu emoji:</span>
      <select id="uEmoji" style="padding:8px;border-radius:10px;border:none;font-size:18px;background:rgba(255,255,255,.9)">
        <option>😎</option><option>🍄</option><option>🦫</option><option>🏎️</option><option>⚡</option>
        <option>🐉</option><option>👑</option><option>🔥</option><option>🌟</option><option>🎮</option>
      </select>
      <button class="btnPost" onclick="saveName()">ENTRAR</button>
    </div>
  </div>

  <div class="card composer" id="composer" style="display:none">
    <input type="text" id="pTxt" placeholder="No que você está pensando?" maxlength="300">
    <input type="text" id="pVid" placeholder="🎬 Link de vídeo do YouTube (opcional)">
    <input type="file" id="pImg" accept="image/*" style="display:none" onchange="fotoEscolhida()">
    <div class="row">
      <button class="btnFoto" onclick="document.getElementById('pImg').click()" id="fotoBtn">📸 Foto</button>
      <button class="btnPost" onclick="postar()">📢 POSTAR</button>
    </div>
  </div>

  <div id="feed"></div>

  <div class="hint">
    🍄 CoguRede — a rede social do Cogumelo Games, feita pelo Davi!<br>
    Seus posts ficam salvos neste navegador.
  </div>
</div>

<script>
const LS_POSTS='cogurede_posts_v1', LS_USER='cogurede_user', LS_LIKES='cogurede_likes';
let fotoData = null;

function load(k, def){ try{ return JSON.parse(localStorage.getItem(k)) ?? def; }catch(e){ return def; } }
function store(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

function seed(){
  return [
    {id:'s1', who:'🍄 Cogumelo Oficial', txt:'Bem-vindos à CoguRede! Poste suas conquistas dos jogos aqui! 🎉', likes:99, ts:0},
    {id:'s2', who:'🦫 Capivara Gamer', txt:'Zerei o Capy Dash de novo!! Ninguém me pega 😤🔥', likes:42, ts:0},
    {id:'s3', who:'🏎️ Turbo Max', txt:'Comprei o Super SP-1 no SP City... 220 km/h na Paulista! 💨', likes:31, ts:0},
    {id:'s4', who:'⚔️ Cavaleiro das Portas', txt:'Cheguei no mundo 7 do Portas Misteriosas, o chefão é MUITO difícil 😱', likes:27, ts:0},
    {id:'s5', who:'🎹 Mestre do Piano', txt:'Recorde novo no Piano Mágico: 143 teclas sem errar! Alguém bate?', likes:18, ts:0},
  ];
}
function ytId(url){
  const m = (url||'').match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/shorts\/)([\w-]{11})/);
  return m ? m[1] : null;
}
function user(){ return load(LS_USER, null); }
function saveName(){
  const n = document.getElementById('uName').value.trim();
  if (!n){ alert('Escolhe um nome!'); return; }
  store(LS_USER, {name:n, emoji:document.getElementById('uEmoji').value});
  render();
}
function fotoEscolhida(){
  const f = document.getElementById('pImg').files[0];
  if (!f) return;
  const img = new Image();
  const rd = new FileReader();
  rd.onload = ()=>{ img.src = rd.result; };
  img.onload = ()=>{
    const cv = document.createElement('canvas');
    const w = Math.min(640, img.width);
    cv.width = w; cv.height = Math.round(img.height*w/img.width);
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    fotoData = cv.toDataURL('image/jpeg',0.7);
    document.getElementById('fotoBtn').textContent = '✅ Foto pronta!';
  };
  rd.readAsDataURL(f);
}
function postar(){
  const txt = document.getElementById('pTxt').value.trim();
  const vid = ytId(document.getElementById('pVid').value.trim());
  if (!txt && !fotoData && !vid){ alert('Escreve algo, põe uma foto ou um vídeo!'); return; }
  const u = user();
  const posts = load(LS_POSTS, seed());
  posts.unshift({id:'p'+Date.now(), who:u.emoji+' '+u.name, txt, img:fotoData, vid, likes:0, ts:Date.now(), mine:true});
  store(LS_POSTS, posts.slice(0,80));
  document.getElementById('pTxt').value='';
  document.getElementById('pVid').value='';
  document.getElementById('pImg').value='';
  fotoData=null; document.getElementById('fotoBtn').textContent='📸 Foto';
  render();
}
function curtir(id){
  const likes = load(LS_LIKES, {});
  const posts = load(LS_POSTS, seed());
  const p = posts.find(p=>p.id===id);
  if (!p) return;
  if (likes[id]){ p.likes--; delete likes[id]; }
  else { p.likes++; likes[id]=1; }
  store(LS_POSTS, posts); store(LS_LIKES, likes);
  render();
}
function apagar(id){
  if (!confirm('Apagar esse post?')) return;
  store(LS_POSTS, load(LS_POSTS, seed()).filter(p=>p.id!==id));
  render();
}
function tempo(ts){
  if (!ts) return '';
  const m = Math.floor((Date.now()-ts)/60000);
  if (m<1) return 'agora';
  if (m<60) return m+' min';
  const h = Math.floor(m/60);
  if (h<24) return h+' h';
  return Math.floor(h/24)+' d';
}
function esc(t){ const d=document.createElement('div'); d.textContent=t||''; return d.innerHTML; }
function render(){
  const u = user();
  document.getElementById('nameBox').style.display = u?'none':'block';
  document.getElementById('composer').style.display = u?'block':'none';
  const posts = load(LS_POSTS, null) || (store(LS_POSTS, seed()), seed());
  const likes = load(LS_LIKES, {});
  document.getElementById('feed').innerHTML = posts.map(p=>`
    <div class="card post">
      <b>${esc(p.who)} <span class="time">· ${tempo(p.ts)}</span></b>
      ${p.txt?`<div class="txt">${esc(p.txt)}</div>`:''}
      ${p.img?`<img src="${p.img}">`:''}
      ${p.vid?`<iframe src="https://www.youtube-nocookie.com/embed/${p.vid}" allowfullscreen></iframe>`:''}
      <div class="actions">
        <button class="like ${likes[p.id]?'liked':''}" onclick="curtir('${p.id}')">❤️ ${p.likes}</button>
        ${p.mine?`<button class="del" onclick="apagar('${p.id}')">🗑️ apagar</button>`:''}
      </div>
    </div>`).join('');
}
render();
</script>
</body>
</html>
