// ============ ÁUDIO (piano sintetizado) ============
var actx = null;
var FREQ = {};
(function(){
    var nomes = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
    for(var oit=2; oit<=6; oit++) for(var i=0;i<12;i++){
        var semitons = (oit-4)*12 + i - 9; // distância do A4
        FREQ[nomes[i]+oit] = 440 * Math.pow(2, semitons/12);
    }
})();
function tocaNota(nome, dur){
    if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; } }
    var f = FREQ[nome] || 440, t = actx.currentTime;
    var g = actx.createGain();
    g.gain.setValueAtTime(0.001, t);
    g.gain.exponentialRampToValueAtTime(0.5, t+0.015);
    g.gain.exponentialRampToValueAtTime(0.001, t + Math.max(0.4, dur*0.9));
    g.connect(actx.destination);
    [[1,0.6,'triangle'],[2,0.25,'sine'],[3,0.08,'sine']].forEach(function(h){
        var o = actx.createOscillator();
        o.type = h[2]; o.frequency.value = f*h[0];
        var og = actx.createGain(); og.gain.value = h[1];
        o.connect(og); og.connect(g);
        o.start(t); o.stop(t + Math.max(0.5, dur));
    });
}

// ============ MODO INTERNET (busca músicas de verdade via iTunes/Apple) ============
// o jogo BAIXA a música, ESCUTA o som e cria as teclas em cima das batidas de verdade!
var modoNet = false, netNome = '', netUrl = '', recKey = '';
var netBuf = null, netFonte = null, netStartT = 0, netOnsets = [], netIdx = 0, netBufUrl = '';
function pararNet(){ try{ if(netFonte) netFonte.stop(); }catch(e){} netFonte = null; }

// detecta as BATIDAS da música (onde o som fica mais forte de repente)
function detectaBatidas(buf){
    var d = buf.getChannelData(0), sr = buf.sampleRate;
    var jan = Math.floor(sr*0.05), n = Math.floor(d.length/jan);
    var e = [];
    for(var i=0;i<n;i++){
        var s = 0;
        for(var j=i*jan;j<(i+1)*jan;j++) s += d[j]*d[j];
        e.push(Math.sqrt(s/jan));
    }
    var media = e.reduce(function(a,b){ return a+b; },0)/n;
    var onsets = [], ultimo = -1;
    for(var i=2;i<n;i++){
        var ini = Math.max(0,i-20), local = 0;
        for(var j=ini;j<i;j++) local += e[j];
        local /= (i-ini);
        var t = i*0.05;
        if(e[i] > local*1.3 && e[i] > media*0.55 && e[i] >= e[i-1] && t-ultimo >= 0.3){
            onsets.push(t); ultimo = t;
        }
    }
    // se a música tem pedaço calmo demais, preenche pra não ficar sem tecla
    var cheios = [];
    for(var i=0;i<onsets.length;i++){
        cheios.push(onsets[i]);
        var prox = onsets[i+1] || buf.duration;
        if(prox - onsets[i] > 1.4) cheios.push(onsets[i] + (prox-onsets[i])/2);
    }
    return cheios.length >= 8 ? cheios : onsets.concat();
}
function buscaNet(){
    var q = document.getElementById('busca').value.trim();
    if(!q){ document.getElementById('btnNet').innerHTML = '✏️ Primeiro escreve o nome da música na barra!'; return; }
    document.getElementById('btnNet').innerHTML = '🔄 Procurando "' + q + '"...';
    window.itunesCB = function(d){
        var el = document.getElementById('listaMusicas');
        el.innerHTML = '';
        var r = (d.results || []).filter(function(x){ return x.previewUrl; });
        if(!r.length){ el.innerHTML = '<p style="color:#ffd6ec; padding:16px">😢 Não achei essa... tenta escrever diferente!</p>'; }
        r.forEach(function(x){
            var b = document.createElement('button');
            b.className = 'musica';
            b.innerHTML = '<span>🌐 ' + x.trackName + '</span><small>' + x.artistName + '</small>';
            b.onclick = function(){ jogarNet(x.previewUrl, x.trackName); };
            el.appendChild(b);
        });
        document.getElementById('btnNet').innerHTML = '🌐 Procurar essa música na INTERNET';
    };
    var s = document.createElement('script');
    s.src = 'https://itunes.apple.com/search?term=' + encodeURIComponent(q) + '&media=music&limit=15&country=BR&callback=itunesCB';
    s.onerror = function(){ document.getElementById('btnNet').innerHTML = '😢 Deu erro — tenta de novo!'; };
    document.body.appendChild(s);
}
function jogarNet(url, nome){
    if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; } }
    if(actx.state === 'suspended') actx.resume();
    netNome = nome; netUrl = url; recKey = 'recnet_' + nome;
    if(netBufUrl === url && netBuf){ iniciaNet(); return; } // já baixou antes, vai direto
    var btn = document.getElementById('btnNet');
    btn.innerHTML = '🎧 Escutando "' + nome + '" pra achar as batidas...';
    fetch(url)
        .then(function(r){ return r.arrayBuffer(); })
        .then(function(ab){ return actx.decodeAudioData(ab); })
        .then(function(buf){
            netBuf = buf; netBufUrl = url;
            netOnsets = detectaBatidas(buf);
            btn.innerHTML = '🌐 Procurar essa música na INTERNET';
            iniciaNet();
        })
        .catch(function(){
            btn.innerHTML = '😢 Não consegui escutar essa — tenta outra!';
        });
}

    pararNet();
    document.getElementById('menu').style.display = 'none';
    document.getElementById('fimBox').style.display = 'none';
    document.getElementById('topo').style.display = 'flex';
    tiles = []; particulas = []; idxNota = 0; netIdx = 0;
    pontos = 0; combo = 0; flashErro = 0;
    ALTURA_BATIDA = H / 2.4; // pixels por SEGUNDO no modo internet
    document.getElementById('score').textContent = '0';
    document.getElementById('combo').textContent = '';
    document.getElementById('nivel').textContent = '🎵 0%';
    netFonte = actx.createBufferSource();
    netFonte.buffer = netBuf;
    netFonte.connect(actx.destination);
    netStartT = actx.currentTime + 2.2; // 2 segundinhos pra se preparar
    netFonte.start(netStartT);
    batida = -2.2;
    rodando = true; ultimoT = performance.now();
    agendaProximas();
    requestAnimationFrame(loop);
}
window.buscaNet = buscaNet; window.jogarNet = jogarNet;

function agendaProximas(){
    if(modoNet){
        // as teclas nascem EXATAMENTE nas batidas detectadas da música
        while(netIdx < netOnsets.length && netOnsets[netIdx] < batida + 3){
            var laneAnt = tiles.length ? tiles[tiles.length-1].lane : -1;
            var lane2;
            do { lane2 = Math.floor(Math.random()*LANES); } while(lane2 === laneAnt && Math.random() < 0.6);
            tiles.push({ b:netOnsets[netIdx], dur:0.32, nota:null, lane:lane2, hit:false, morto:false });
            netIdx++;
        }
        return;
    }
    // agenda tiles até 8 batidas à frente — a música tem FIM!
    var m = MUSICAS[musicaAtual];
    while(idxNota < m.notas.length){
        var proxBatida = tiles.length ? tiles[tiles.length-1].b + tiles[tiles.length-1].dur : batida + 3;
        if(proxBatida > batida + 9) break;
        var nota = m.notas[idxNota];
        var laneAnterior = tiles.length ? tiles[tiles.length-1].lane : -1;
        var lane;
        do { lane = Math.floor(Math.random()*LANES); } while(lane === laneAnterior && Math.random() < 0.6);
        tiles.push({ b:proxBatida, dur:nota[1], nota:nota[0], lane:lane, hit:false, morto:false });
        idxNota++;
    }
}

function jogar(i){
    modoNet = false; recKey = 'rec_' + i;
    pararNet();
    musicaAtual = i;
    var m = MUSICAS[i];
    document.getElementById('menu').style.display = 'none';
    document.getElementById('fimBox').style.display = 'none';
    document.getElementById('topo').style.display = 'flex';
    tiles = []; particulas = []; batida = 0; idxNota = 0; nivel = 1; bpm = m.bpm;
    pontos = 0; combo = 0; flashErro = 0;
    ALTURA_BATIDA = H / 4.5;
    document.getElementById('nivel').textContent = '🎵 0%';
    rodando = true; ultimoT = performance.now();
    agendaProximas();
    requestAnimationFrame(loop);
    if(actx && actx.state === 'suspended') actx.resume();
}
function voltaMenu(){
    pararNet();
    modoNet = false;
    document.getElementById('fimBox').style.display = 'none';
    document.getElementById('topo').style.display = 'none';
    montaMenu();
    document.getElementById('menu').style.display = 'flex';
}
window.jogar = jogar; window.voltaMenu = voltaMenu;

function fimDeJogo(venceu){
    rodando = false;
    if(modoNet && !venceu) pararNet(); // errou = a música PARA!
    var rec = lsGet(recKey, 0);
    var novoRec = pontos > rec;
    if(novoRec) lsSet(recKey, pontos);
    if(venceu && !modoNet) lsSet('venceu_'+musicaAtual, true);
    setTimeout(function(){
        document.getElementById('topo').style.display = 'none';
        document.getElementById('fimPontos').textContent = pontos;
        document.getElementById('fimRec').textContent = (novoRec ? '🏆 NOVO RECORDE!!! ' : '🏆 Recorde: ' + Math.max(rec, pontos)) +
            (venceu ? ' • ⭐ música completa!' : '');
        document.getElementById('fimTitulo').textContent = venceu ? '⭐ VOCÊ TOCOU A MÚSICA INTEIRA!' : (novoRec ? '🌟 INCRÍVEL!' : '💥 Errou!');
        document.querySelector('#fimBox button').onclick = modoNet ? function(){ jogarNet(netUrl, netNome); } : function(){ jogar(musicaAtual); };
        document.getElementById('fimBox').style.display = 'flex';
    }, venceu ? 900 : 550);
}
// fanfarra de vitória
function fanfarra(){
    ['C4','E4','G4','C5','E5','G5','C6'].forEach(function(n, i){
        setTimeout(function(){ tocaNota(n, 0.5); }, i*90);
    });
    for(var p=0;p<80;p++) particulas.push({ x:Math.random()*W, y:H*0.3+Math.random()*H*0.4, vx:(Math.random()-0.5)*9, vy:(Math.random()-0.9)*9, vida:1.6 });
}

function yDo(t){ return H - 130 - (t.b - batida) * ALTURA_BATIDA; }

function toque(x, y){
    if(!rodando) return;
    var lane = Math.floor(x / laneW);
    // procura o tile mais baixo NÃO tocado dessa lane que esteja na tela
    var alvo = null;
    for(var i=0;i<tiles.length;i++){
        var t = tiles[i];
        if(t.hit || t.lane !== lane) continue;
        var ty = yDo(t), th = t.dur * ALTURA_BATIDA;
        if(ty > -th && ty - th < H){ alvo = t; break; }
    }
    if(alvo){
        var ty = yDo(alvo), th = alvo.dur * ALTURA_BATIDA;
        if(y >= ty - th - 18 && y <= ty + 24){
            alvo.hit = true;
            combo++;
            pontos += (combo >= 10 ? 2 : 1);
            if(!modoNet) tocaNota(alvo.nota, alvo.dur * 60/bpm); // no modo internet a música já toca sozinha
            for(var p=0;p<10;p++) particulas.push({ x:lane*laneW+laneW/2, y:ty-th/2, vx:(Math.random()-0.5)*7, vy:(Math.random()-0.7)*7, vida:1 });
            document.getElementById('score').textContent = pontos;
            document.getElementById('combo').textContent = combo >= 5 ? '🔥 combo x' + combo + (combo>=10?' (2x pontos!)':'') : '';
            return;
        }
    }
    // tocou no lugar errado!
    flashErro = 1; combo = 0;
    tocaNota('C3', 0.3);
    fimDeJogo();
}
cv.addEventListener('pointerdown', function(e){
    var r = cv.getBoundingClientRect();
    toque(e.clientX - r.left, e.clientY - r.top);
});
// teclado no computador: D F J K
var TECLAS = { d:0, f:1, j:2, k:3, c:0, v:1, b:2, n:3 };
addEventListener('keydown', function(e){
    var l = TECLAS[e.key.toLowerCase()];
    if(l === undefined || !rodando) return;
    // simula toque no tile mais baixo da lane
    for(var i=0;i<tiles.length;i++){
        var t = tiles[i];
        if(!t.hit && t.lane === l){ toque(l*laneW + laneW/2, yDo(t) - 4); return; }
    }
    toque(l*laneW + laneW/2, H-60);
});

function loop(agora){
    if(!rodando) { desenha(); return; }
    var dt = Math.min((agora - ultimoT)/1000, 0.05);
    ultimoT = agora;
    if(modoNet) batida = actx.currentTime - netStartT; // sincronizado com a música de verdade
    else batida += dt * bpm/60;
    agendaProximas();
    // tile passou da linha sem ser tocado = fim!
    for(var i=0;i<tiles.length;i++){
        var t = tiles[i];
        if(!t.hit && yDo(t) > H - 40){
            t.morto = true; flashErro = 1;
            tocaNota('C3', 0.3);
            desenha(); fimDeJogo(false); return;
        }
    }
    // tocou a música INTEIRA = vitória!
    var m = MUSICAS[musicaAtual];
    var acabou = modoNet
        ? (netBuf && batida > netBuf.duration + 0.2)
        : idxNota >= m.notas.length;
    if(acabou && tiles.every(function(t){ return t.hit; })){
        fanfarra(); fimDeJogo(true);
        (function anim(){ desenha(); if(particulas.length) requestAnimationFrame(anim); })();
        return;
    }
    tiles = tiles.filter(function(t){ return yDo(t) < H + 300; });
    var prog = modoNet
        ? (netBuf ? Math.max(0, batida) / netBuf.duration : 0)
        : idxNota / m.notas.length;
    document.getElementById('nivel').textContent = '🎵 ' + Math.min(100, Math.floor(prog * 100)) + '%';
    desenha();
    requestAnimationFrame(loop);
}

function desenha(){
    // fundo
    var grad = ctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0,'#1a0533'); grad.addColorStop(0.6,'#3d1a6e'); grad.addColorStop(1,'#7a2a8a');
    ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);
    // divisórias das lanes
    ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.lineWidth = 1;
    for(var l=1;l<LANES;l++){ ctx.beginPath(); ctx.moveTo(l*laneW,0); ctx.lineTo(l*laneW,H); ctx.stroke(); }
    // linha de acerto
    ctx.strokeStyle = 'rgba(255,95,162,0.9)'; ctx.lineWidth = 3;
    ctx.shadowColor = '#ff5fa2'; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.moveTo(0,H-130); ctx.lineTo(W,H-130); ctx.stroke();
    ctx.shadowBlur = 0;
    // tiles
    tiles.forEach(function(t){
        var y = yDo(t), h = t.dur * ALTURA_BATIDA - 6;
        var x = t.lane*laneW + 3, w = laneW - 6;
        if(t.hit){
            ctx.fillStyle = 'rgba(255,95,162,0.25)';
            ctx.strokeStyle = 'rgba(255,95,162,0.5)';
        } else if(t.morto){
            ctx.fillStyle = '#cc2222'; ctx.strokeStyle = '#ff6666';
        } else {
            var g2 = ctx.createLinearGradient(0,y-h,0,y);
            g2.addColorStop(0,'#0a0a1e'); g2.addColorStop(1,'#20204a');
            ctx.fillStyle = g2; ctx.strokeStyle = '#5fd0ff';
        }
        ctx.lineWidth = 2;
        arredondado(x, y-h, w, h, 10);
        ctx.fill(); ctx.stroke();
        if(!t.hit && !t.morto){
            ctx.fillStyle = 'rgba(95,208,255,0.85)';
            ctx.beginPath(); ctx.arc(x+w/2, y-14, 5, 0, 7); ctx.fill();
        }
    });
    // partículas
    particulas.forEach(function(p){
        p.x += p.vx; p.y += p.vy; p.vy += 0.25; p.vida -= 0.035;
        ctx.globalAlpha = Math.max(p.vida,0);
        ctx.fillStyle = '#ffb3dd';
        ctx.beginPath(); ctx.arc(p.x, p.y, 3.5, 0, 7); ctx.fill();
    });
    ctx.globalAlpha = 1;
    particulas = particulas.filter(function(p){ return p.vida > 0; });
    // flash de erro
    if(flashErro > 0){
        ctx.fillStyle = 'rgba(255,0,40,' + flashErro*0.45 + ')';
        ctx.fillRect(0,0,W,H);
        flashErro -= 0.06;
    }
    // dica de teclado (só desktop)
    if(matchMedia('(pointer:fine)').matches){
        ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.font = 'bold 16px Arial'; ctx.textAlign = 'center';
        ['C ou D','V ou F','B ou J','N ou K'].forEach(function(k,i){ ctx.fillText(k, i*laneW+laneW/2, H-18); });
    }
}
function arredondado(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
desenha();
</script>
