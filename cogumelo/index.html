<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chuva de Cogumelos 3 🍄 - Cogumelo Games</title>
<meta name="description" content="Pegue os cogumelos que caem do céu com a sua cesta! Cuidado com os venenosos!">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#12261a; font-family:'Comic Sans MS','Chalkboard SE',cursive,sans-serif; touch-action:none; }
  body { background:linear-gradient(180deg,#1c3d57 0%,#2f6a7a 45%,#3a7a4a 52%,#1c3a22 100%); }
  #c { display:block; width:100%; height:100%; position:fixed; inset:0; z-index:1; }
  .overlay {
    position:fixed; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; justify-content:safe center; overflow-y:auto; z-index:10;
    background:linear-gradient(180deg, rgba(15,35,20,.93), rgba(45,20,40,.95));
    color:#fff; text-align:center; padding:20px;
  }
  .hidden { display:none !important; }
  h1.titulo {
    font-size:clamp(34px, 8.5vw, 70px); color:#ff6b81;
    text-shadow: 4px 4px 0 #6d1030, -2px -2px 0 #2e7d32;
    animation: balanca 2s ease-in-out infinite; margin-bottom:6px;
  }
  @keyframes balanca { 0%,100%{transform:rotate(-2deg) scale(1);} 50%{transform:rotate(2deg) scale(1.04);} }
  .subtitulo { font-size:clamp(15px,3.5vw,22px); color:#aef29b; margin-bottom:20px; text-shadow:2px 2px 0 #000; max-width:520px; }
  .btn {
    font-family:inherit; font-size:clamp(18px,4.5vw,28px); font-weight:bold;
    padding:14px 42px; margin:8px; border:none; border-radius:50px; cursor:pointer;
    color:#fff; background:linear-gradient(180deg,#ff7b91,#c2185b);
    box-shadow:0 6px 0 #7a0f3a, 0 10px 16px rgba(0,0,0,.4); transition:transform .08s;
  }
  .btn:active { transform:translateY(4px); box-shadow:0 2px 0 #7a0f3a; }
  .btn.verde { background:linear-gradient(180deg,#5ec24a,#2e7d32); box-shadow:0 6px 0 #1b4d1e,0 10px 16px rgba(0,0,0,.4); }
  .recorde { font-size:clamp(16px,4vw,24px); color:#ffd54a; margin-top:16px; text-shadow:2px 2px 0 #000; }
  .legenda { margin-top:22px; display:flex; gap:18px; flex-wrap:wrap; justify-content:center; font-size:clamp(14px,3.2vw,18px); }
  .legenda div { background:rgba(0,0,0,.35); border-radius:14px; padding:8px 14px; }
  #hud { position:fixed; top:0; left:0; right:0; z-index:5; padding:10px 14px; display:none; justify-content:space-between; pointer-events:none; }
  .hud-item { background:rgba(0,0,0,.45); border-radius:14px; padding:6px 14px; color:#fff; font-size:clamp(15px,3.8vw,22px); font-weight:bold; text-shadow:2px 2px 0 #000; }
  #msg-final { font-size:clamp(20px,5vw,34px); color:#ffd54a; margin-bottom:12px; text-shadow:2px 2px 0 #000; }
  .voltar { position:fixed; top:10px; left:50%; transform:translateX(-50%); z-index:11; color:#aef29b; font-size:14px; text-decoration:none; text-shadow:1px 1px 0 #000; }
</style>
<script src="/cogucoins.js?v=547"></script>
<script src="/top.js?v=1"></script>
<script src="/letra.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="hud-item" id="hud-pontos">🍄 0</div>
  <div class="hud-item" id="hud-nivel">Nível 1</div>
  <div class="hud-item" id="hud-vidas">❤️❤️❤️</div>
</div>

<div class="overlay" id="menu">
  <a class="voltar" href="/" style="position:static; margin-bottom:10px">⬅ Voltar pro site</a>
  <h1 class="titulo">🍄 Chuva de Cogumelos 3</h1>
  <div class="subtitulo">Cogumelos estão caindo do céu! Mova a cesta e pegue o máximo que puder. Mas cuidado: os roxos são VENENOSOS! ☠️</div>
  <button class="btn" id="btn-jogar">▶ JOGAR</button>
  <div class="legenda">
    <div>🍄 = 1 ponto</div>
    <div>✨ dourado = 5 pontos</div>
    <div>🟣 veneno = perde vida</div>
    <div>❤️ raro = vida extra</div>
  </div>
  <div class="recorde" id="recorde-menu"></div>
  <button class="btn" id="btn-top" style="margin-top:12px">🏆 TOP 10</button>
  <div id="top-menu" style="width:100%;display:none"></div>
</div>

<div class="overlay hidden" id="fim">
  <h1 class="titulo">🍄 Fim!</h1>
  <div id="msg-final"></div>
  <div id="top-final" style="width:100%"></div>
  <button class="btn verde" id="btn-denovo">🔄 JOGAR DE NOVO</button>
  <button class="btn" onclick="location.href='/'">🏠 OUTROS JOGOS</button>
</div>

<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H; function resize(){ W=cv.width=innerWidth; H=cv.height=innerHeight; } resize(); addEventListener('resize', resize);

const hud = document.getElementById('hud');
const KEY = 'cogumelo-chuva-recorde';
let recorde = +(localStorage.getItem(KEY)||0);
document.getElementById('recorde-menu').textContent = recorde ? '🏆 Recorde: '+recorde : '';

const VIDAS_INICIAIS = 3 + ((function(){try{return window.CoguCoins && window.CoguCoins.tem('vida_extra');}catch(e){return false;}})() ? 1 : 0);  // +1 com a Vida Extra da /loja/
let jogando=false, pontos=0, vidas=VIDAS_INICIAIS, nivel=1, itens=[], parts=[], tSpawn=0, tempo=0;
const cesta = { x:0, w:110, y:0 };
let teclas = {};

addEventListener('keydown', e=>teclas[e.key]=true);
addEventListener('keyup', e=>teclas[e.key]=false);
let alvoX=null;
function pointer(e){ const t=e.touches?e.touches[0]:e; alvoX=t.clientX; }
addEventListener('mousemove', pointer);
addEventListener('touchstart', pointer, {passive:true});
addEventListener('touchmove', pointer, {passive:true});

function iniciar(){
  pontos=0; vidas=VIDAS_INICIAIS; nivel=1; itens=[]; parts=[]; tSpawn=0; tempo=0;
  cesta.x=W/2; alvoX=null;
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('fim').classList.add('hidden');
  hud.style.display='flex';
  try { if(window.CoguCoins) window.CoguCoins.novaPartida(); } catch(e){}
  jogando=true;
}
document.getElementById('btn-jogar').onclick=iniciar;
document.getElementById('btn-denovo').onclick=iniciar;
document.getElementById('btn-top').onclick=()=>{ const t=document.getElementById('top-menu'); try { t.innerHTML=window.CoguTop?CoguTop.html('chuva3',' pts','🏆 Mais pontos'):''; } catch(e){} t.style.display=t.style.display==='none'?'block':'none'; };

// 💀 morreu: oferece reviver na hora, dentro do jogo
function fim(){
  jogando=false;
  try { if(window.CoguCoins && window.CoguCoins.reviver(reviveAgora, fimDeVerdade, 25)) return; } catch(e){}
  fimDeVerdade();
}

function reviveAgora(){
  vidas=VIDAS_INICIAIS; itens=[]; tSpawn=0;   // limpa a tela e devolve as vidas
  hud.style.display='flex';
  document.getElementById('fim').classList.add('hidden');
  jogando=true;
}

function fimDeVerdade(){
  jogando=false; hud.style.display='none';
  const novo = pontos>recorde;
  if(novo){ recorde=pontos; localStorage.setItem(KEY, recorde); }
  let posTop=0; try { if(window.CoguTop) posTop=CoguTop.registra('chuva3', pontos); } catch(e){}
  document.getElementById('msg-final').innerHTML =
    'Você pegou <b>'+pontos+'</b> pontos!' + (novo?'<br>🎉 NOVO RECORDE! 🎉':'<br>🏆 Recorde: '+recorde);
  try { document.getElementById('top-final').innerHTML=window.CoguTop?(posTop?'<div style="font-weight:bold;color:#ffd54a;margin-top:8px">🏆 Você ficou em '+posTop+'º no Top 10!</div>':'')+CoguTop.html('chuva3',' pts'):''; } catch(e){}
  document.getElementById('fim').classList.remove('hidden');
}

function spawn(){
  const r=Math.random();
  let tipo='normal';
  if(r<0.05 && vidas<VIDAS_INICIAIS) tipo='vida';
  else if(r<0.17) tipo='dourado';
  else if(r<0.17+Math.min(0.35, 0.12+nivel*0.03)) tipo='veneno';
  itens.push({ x:40+Math.random()*(W-80), y:-40, tipo,
    v:(2.2+nivel*0.55)*(0.8+Math.random()*0.5)*(H/700),
    ang:Math.random()*6.28, giro:(Math.random()-0.5)*0.08 });
}

function boom(x,y,cor,n){ for(let i=0;i<n;i++) parts.push({x,y,vx:(Math.random()-0.5)*7,vy:-Math.random()*6,vida:1,cor}); }

function desenhaCogu(it){
  ctx.save(); ctx.translate(it.x,it.y); ctx.rotate(it.ang);
  ctx.font='38px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  if(it.tipo==='veneno'){ ctx.filter='hue-rotate(260deg) saturate(2)'; ctx.fillText('🍄',0,0); ctx.filter='none'; ctx.font='18px serif'; ctx.fillText('☠️',0,-26); }
  else if(it.tipo==='dourado'){ ctx.shadowColor='#ffd54a'; ctx.shadowBlur=18; ctx.filter='hue-rotate(45deg) brightness(1.4)'; ctx.fillText('🍄',0,0); ctx.filter='none'; }
  else if(it.tipo==='vida'){ ctx.fillText('❤️',0,0); }
  else ctx.fillText('🍄',0,0);
  ctx.restore();
}

// ===== 3D: grama, cesta e cogumelos de verdade (Three.js). Sem Three, fica o desenho 2D de antes =====
const MOBILE=/Android|iPhone|iPad|Mobile/i.test(navigator.userAgent);
let T3=null;
function monta3D(){
  if(!window.THREE) return;
  try{
    const r=new THREE.WebGLRenderer({antialias:!MOBILE,alpha:true});
    r.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));
    r.domElement.style.cssText='position:fixed;inset:0;z-index:0;display:block';
    document.body.insertBefore(r.domElement,cv);
    const cena=new THREE.Scene();
    cena.fog=new THREE.Fog(0x3a7a5a,1200,4200);
    const cam=new THREE.PerspectiveCamera(40,1,5,8000);
    cena.add(new THREE.HemisphereLight(0xdff0ff,0x2a4a1a,0.8));
    const sol=new THREE.DirectionalLight(0xffffff,0.85); sol.position.set(-300,700,900); cena.add(sol);
    // chão e grama
    const campo=new THREE.Group(); cena.add(campo);
    const chao=new THREE.Mesh(new THREE.PlaneGeometry(14000,7000),new THREE.MeshLambertMaterial({color:0x2e7d32}));
    chao.rotation.x=-Math.PI/2; chao.position.z=-1800; campo.add(chao);
    const folha=new THREE.ConeGeometry(3.2,1,4); folha.translate(0,0.5,0);
    const NG=MOBILE?700:1500;
    const grama=new THREE.InstancedMesh(folha,new THREE.MeshLambertMaterial({color:0xffffff}),NG); campo.add(grama);
    const NF=MOBILE?40:90;
    const flores=new THREE.InstancedMesh(new THREE.SphereGeometry(4,8,6),new THREE.MeshLambertMaterial({color:0xffffff}),NF); campo.add(flores);
    // cesta
    const tc=document.createElement('canvas'); tc.width=tc.height=64; const tx=tc.getContext('2d');
    for(let i=0;i<8;i++) for(let j=0;j<8;j++){ tx.fillStyle=(i+j)%2?'#c8873e':'#9a6026'; tx.fillRect(i*8,j*8,8,8); }
    const trama=new THREE.CanvasTexture(tc); trama.wrapS=trama.wrapT=THREE.RepeatWrapping; trama.repeat.set(6,2);
    const matCesta=new THREE.MeshLambertMaterial({map:trama,side:THREE.DoubleSide});
    const matAro=new THREE.MeshLambertMaterial({color:0x7a4a1a});
    const cestaG=new THREE.Group();
    const perfil=[new THREE.Vector2(38,-24),new THREE.Vector2(44,-10),new THREE.Vector2(51,8),new THREE.Vector2(56,24)];
    cestaG.add(new THREE.Mesh(new THREE.LatheGeometry(perfil,28),matCesta));
    const fundo=new THREE.Mesh(new THREE.CircleGeometry(38,24),matAro); fundo.rotation.x=-Math.PI/2; fundo.position.y=-24; cestaG.add(fundo);
    const aro=new THREE.Mesh(new THREE.TorusGeometry(56,3.5,8,32),matAro); aro.rotation.x=Math.PI/2; aro.position.y=24; cestaG.add(aro);
    const aro2=new THREE.Mesh(new THREE.TorusGeometry(44.5,2.5,8,32),matAro); aro2.rotation.x=Math.PI/2; aro2.position.y=-10; cestaG.add(aro2);
    const alca=new THREE.Mesh(new THREE.TorusGeometry(52,3.5,8,24,Math.PI),matAro); alca.position.y=24; cestaG.add(alca);
    cestaG.rotation.x=0.38; cena.add(cestaG);
    // cogumelos
    const geoCaule=new THREE.CylinderGeometry(7,9,20,14); geoCaule.translate(0,-6,0);
    const geoChapeu=new THREE.SphereGeometry(19,22,12,0,Math.PI*2,0,Math.PI/2);
    const geoBaixo=new THREE.CircleGeometry(18.5,22);
    const geoBolinha=new THREE.SphereGeometry(3.4,8,6);
    const matCaule=new THREE.MeshLambertMaterial({color:0xfff1d6});
    const MAT={
      normal:[new THREE.MeshPhongMaterial({color:0xe53935,shininess:60}),new THREE.MeshLambertMaterial({color:0xffffff})],
      dourado:[new THREE.MeshPhongMaterial({color:0xffc928,emissive:0x664400,shininess:120,specular:0xffffaa}),new THREE.MeshLambertMaterial({color:0xfff6c0,emissive:0x443300})],
      veneno:[new THREE.MeshPhongMaterial({color:0x8e3ad6,shininess:40}),new THREE.MeshLambertMaterial({color:0x9cff57,emissive:0x1a4a00})]
    };
    const coracao=new THREE.Shape();
    coracao.moveTo(0,-14); coracao.bezierCurveTo(-4,-9,-18,-2,-18,8); coracao.bezierCurveTo(-18,16,-8,19,0,11);
    coracao.bezierCurveTo(8,19,18,16,18,8); coracao.bezierCurveTo(18,-2,4,-9,0,-14);
    const geoCoracao=new THREE.ExtrudeGeometry(coracao,{depth:9,bevelEnabled:true,bevelSize:2.5,bevelThickness:2.5,bevelSegments:3}); geoCoracao.center();
    const matCoracao=new THREE.MeshPhongMaterial({color:0xff3355,emissive:0x440010,shininess:90});
    const PONTOS=[[0,1],[1.25,0.55],[2.5,0.6],[3.8,0.55],[5.1,0.6]];
    function criaCogu(tipo){
      const g=new THREE.Group();
      if(tipo==='vida'){ g.add(new THREE.Mesh(geoCoracao,matCoracao)); return g; }
      const m=MAT[tipo]||MAT.normal;
      g.add(new THREE.Mesh(geoCaule,matCaule));
      const ch=new THREE.Mesh(geoChapeu,m[0]); ch.scale.y=0.78; ch.position.y=2; g.add(ch);
      const bx=new THREE.Mesh(geoBaixo,matCaule); bx.rotation.x=Math.PI/2; bx.position.y=2; g.add(bx);
      for(const [a,el] of PONTOS){
        const b=new THREE.Mesh(geoBolinha,m[1]);
        const rr=19*Math.sin(el*Math.PI/2*0.9+0.1);
        b.position.set(Math.cos(a)*rr*(el===1?0:1),2+19*0.78*Math.cos(el*Math.PI/2*0.9+0.1),Math.sin(a)*rr*(el===1?0:1));
        g.add(b);
      }
      return g;
    }
    T3={r,cena,cam,campo,grama,flores,cestaG,criaCogu,malhas:new Map(),w:0,h:0,dist:1};
  }catch(e){ T3=null; }
}
function arruma3D(){
  const t=T3; if(t.w===W&&t.h===H) return; t.w=W; t.h=H;
  t.r.setSize(W,H,false); t.r.domElement.style.width=W+'px'; t.r.domElement.style.height=H+'px';
  t.cam.aspect=W/H; t.dist=(H/2)/Math.tan(20*Math.PI/180);
  t.cam.position.set(0,0,t.dist); t.cam.lookAt(0,0,0); t.cam.updateProjectionMatrix();
  const gy=-(H/2-34); t.campo.position.y=gy;
  // folhas de grama espalhadas até o horizonte (mais largo lá no fundo, por causa da perspectiva)
  const m=new THREE.Matrix4(), q=new THREE.Quaternion(), s=new THREE.Vector3(), p=new THREE.Vector3(), cor=new THREE.Color();
  const verdes=[0x3f9a3a,0x4caf50,0x2e8a34,0x66bb4a,0x37803a];
  for(let i=0;i<t.grama.count;i++){
    const z=i<t.grama.count*0.35?-20+Math.random()*Math.min(260,t.dist*0.5):-2600+Math.random()*2580;
    const larg=(W/2)*(t.dist-z)/t.dist*1.1;
    p.set((Math.random()*2-1)*larg,0,z);
    q.setFromAxisAngle(new THREE.Vector3(Math.random()-.5,0,Math.random()-.5).normalize(),Math.random()*0.35);
    const h=12+Math.random()*26; s.set(1,h,1);
    m.compose(p,q,s); t.grama.setMatrixAt(i,m); t.grama.setColorAt(i,cor.setHex(verdes[i%verdes.length]));
  }
  t.grama.instanceMatrix.needsUpdate=true; if(t.grama.instanceColor) t.grama.instanceColor.needsUpdate=true;
  const cores=[0xffeb3b,0xffffff,0xff80ab,0x80d8ff];
  for(let i=0;i<t.flores.count;i++){
    const z=-30+Math.random()*-1400, larg=(W/2)*(t.dist-z)/t.dist;
    p.set((Math.random()*2-1)*larg,14+Math.random()*10,z); s.set(1,1,1); q.identity();
    m.compose(p,q,s); t.flores.setMatrixAt(i,m); t.flores.setColorAt(i,cor.setHex(cores[i%cores.length]));
  }
  t.flores.instanceMatrix.needsUpdate=true; if(t.flores.instanceColor) t.flores.instanceColor.needsUpdate=true;
}
let pulo=0;
function desenha3D(dt){
  const t=T3; arruma3D();
  // cogumelos: cria a malha quando nasce, tira quando some
  const vivos=new Set(itens);
  t.malhas.forEach((g,it)=>{ if(!vivos.has(it)){ t.cena.remove(g); t.malhas.delete(it); } });
  for(const it of itens){
    let g=t.malhas.get(it);
    if(!g){ g=t.criaCogu(it.tipo); g.scale.setScalar(1.3); t.malhas.set(it,g); t.cena.add(g); g.userData.giro=(Math.random()-.5)*0.08; }
    g.position.set(it.x-W/2,H/2-it.y,0);
    g.rotation.z=-it.ang*0.6; g.rotation.y+=(g.userData.giro+0.02)*dt; g.rotation.x=0.35;
  }
  // cesta
  const naMenu=!document.getElementById('menu').classList.contains('hidden');
  t.cestaG.visible=jogando||naMenu;
  const cx=jogando?cesta.x:W/2;
  if(pulo>0) pulo=Math.max(0,pulo-0.08*dt);
  t.cestaG.position.set(cx-W/2,H/2-(H-60),0);
  t.cestaG.scale.setScalar(1+Math.sin(pulo*Math.PI)*0.15);
  t.cestaG.rotation.y=Math.sin(performance.now()/700)*0.12;
  t.r.render(t.cena,t.cam);
}
monta3D();

let ultimo=0;
function loop(t){
  requestAnimationFrame(loop);
  const dt=Math.min((t-ultimo)/16.7,3); ultimo=t;

  if(T3){ ctx.clearRect(0,0,W,H); }
  else {
  // fundo
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#1c3d57'); g.addColorStop(0.7,'#2a5a35'); g.addColorStop(1,'#1c3a22');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // grama
  ctx.fillStyle='#2e7d32'; ctx.fillRect(0,H-46,W,46);
  ctx.font='24px serif';
  for(let x=10;x<W;x+=90){ ctx.fillText('🌿', x, H-14); }
  }

  if(jogando){
    tempo+=dt/60;
    nivel=1+Math.floor(tempo/15);
    // movimento cesta
    const vel=9*dt;
    if(teclas['ArrowLeft']||teclas['a']) cesta.x-=vel*1.4;
    if(teclas['ArrowRight']||teclas['d']) cesta.x+=vel*1.4;
    if(alvoX!==null) cesta.x += (alvoX-cesta.x)*Math.min(0.25*dt,1);
    cesta.x=Math.max(cesta.w/2, Math.min(W-cesta.w/2, cesta.x));
    cesta.y=H-64;

    tSpawn-=dt;
    if(tSpawn<=0){ spawn(); tSpawn=Math.max(38, 100-nivel*5)+Math.random()*34; }

    for(let i=itens.length-1;i>=0;i--){
      const it=itens[i], antes=it.y; it.y+=it.v*dt; it.ang+=it.giro*dt;
      // pegou? (olha o caminho todo que o cogumelo andou nesse quadro, senão quando ele cai rápido "atravessa" a cesta)
      if(it.y>cesta.y-18 && antes<cesta.y+26 && Math.abs(it.x-cesta.x)<cesta.w/2+12){
        if(it.tipo==='veneno'){ vidas--; boom(it.x,it.y,'#b04ad6',18); if(vidas<=0){ itens.splice(i,1); fim(); break; } }
        else if(it.tipo==='vida'){ vidas=Math.min(VIDAS_INICIAIS,vidas+1); boom(it.x,it.y,'#ff6b81',14); }
        else if(it.tipo==='dourado'){ pontos+=5; boom(it.x,it.y,'#ffd54a',16); }
        else { pontos++; boom(it.x,it.y,'#ff5252',10); }
        pulo=1;
        itens.splice(i,1); continue;
      }
      // caiu no chão: deixou escapar um cogumelo bom = perde uma vida
      if(it.y>H-40){
        if(it.tipo==='normal'||it.tipo==='dourado'){
          vidas--;
          boom(it.x,H-46,'#ff5252',14);
          itens.splice(i,1);
          if(vidas<=0){ fim(); break; }
          continue;
        }
        itens.splice(i,1);
      }
    }
    document.getElementById('hud-pontos').textContent='🍄 '+pontos;
    document.getElementById('hud-nivel').textContent='Nível '+nivel;
    document.getElementById('hud-vidas').textContent =
      vidas>5 ? ('❤️ x'+vidas) : '❤️'.repeat(Math.max(0,vidas));
  }

  // itens
  if(T3) desenha3D(dt); else itens.forEach(desenhaCogu);

  // partículas
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i]; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=0.25*dt; p.vida-=0.03*dt;
    if(p.vida<=0){ parts.splice(i,1); continue; }
    ctx.globalAlpha=p.vida; ctx.fillStyle=p.cor;
    ctx.beginPath(); ctx.arc(p.x,p.y,4,0,6.28); ctx.fill(); ctx.globalAlpha=1;
  }

  // cesta
  if(!T3 && (jogando || document.getElementById('menu').classList.contains('hidden')===false)){
    const cx=jogando?cesta.x:W/2, cy=H-64;
    ctx.font='56px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('🧺', cx, cy+8);
  }
}
requestAnimationFrame(loop);
</script>

<script src="/telacheia.js"></script>
