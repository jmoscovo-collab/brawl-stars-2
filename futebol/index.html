<style>

<script src="/stats.js?v=496"></script>
<script>
if (window.initStats) initStats('futebol');

/* ================= CONFIG ================= */
var SAVE_KEY = 'futebol_save';
var dados = { meu: 0, rival: 1, dif: 1, tempo: 0, copas: 0, vitorias: 0, jogos: 0 };
try { var dd = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); if (dd) for (var k in dd) dados[k] = dd[k]; } catch (e) {}
function salva() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(dados)); } catch (e) {} }

var TIMES = [
    { nome: 'Cogumelos FC', sigla: 'COG', cor: '#e8322a', cor2: '#ffffff', pele: 0 },
    { nome: 'Tubarões', sigla: 'TUB', cor: '#1a5ad8', cor2: '#ffffff', pele: 1 },
    { nome: 'Capivaras', sigla: 'CAP', cor: '#a8742a', cor2: '#ffe14a', pele: 2 },
    { nome: 'Dragões', sigla: 'DRA', cor: '#1a8a3a', cor2: '#ffe14a', pele: 0 },
    { nome: 'Robôs', sigla: 'ROB', cor: '#8a8aa0', cor2: '#1a1a2a', pele: 1 },
    { nome: 'Fantasmas', sigla: 'FAN', cor: '#f4f4f4', cor2: '#7a3ad8', pele: 2 },
    { nome: 'Abelhas', sigla: 'ABE', cor: '#ffd21a', cor2: '#1a1a1a', pele: 0 },
    { nome: 'Polvos', sigla: 'POL', cor: '#c84aff', cor2: '#ffffff', pele: 1 }
];
var PELES = ['#f4c8a0', '#c8875a', '#7a4a2a'];
var DIFS = [{ nome: '😊 Fácil', vel: 0.86, desarme: 0.55, mira: 0.5, pensa: 0.55 }, { nome: '😎 Médio', vel: 0.97, desarme: 0.95, mira: 0.75, pensa: 0.38 }, { nome: '😈 Difícil', vel: 1.06, desarme: 1.45, mira: 0.92, pensa: 0.25 }];
var TEMPOS = [{ nome: '⏱️ 4 min', seg: 240 }, { nome: '⏱️ 8 min', seg: 480 }, { nome: '⏱️ 2 min', seg: 120 }];

// medidas oficiais (metros)
var CX = 52.5, CY = 34, GOL = 3.66, TRAVE = 2.44;
// 4-4-2: fx = -1 (gol próprio) .. 1 (gol rival); fy = -1..1
var FORMACAO = [
    { fx: -0.96, fy: 0, papel: 'GOL', num: 1 },
    { fx: -0.66, fy: -0.66, papel: 'DEF', num: 2 }, { fx: -0.72, fy: -0.22, papel: 'DEF', num: 3 }, { fx: -0.72, fy: 0.22, papel: 'DEF', num: 4 }, { fx: -0.66, fy: 0.66, papel: 'DEF', num: 6 },
    { fx: -0.28, fy: -0.68, papel: 'MEI', num: 7 }, { fx: -0.36, fy: -0.2, papel: 'MEI', num: 5 }, { fx: -0.3, fy: 0.2, papel: 'MEI', num: 8 }, { fx: -0.28, fy: 0.68, papel: 'MEI', num: 11 },
    { fx: 0.08, fy: -0.22, papel: 'ATA', num: 9 }, { fx: 0.04, fy: 0.24, papel: 'ATA', num: 10 }
];

/* ================= MENU ================= */
function mostra(id) {
    ['telaMenu', 'telaMsg'].forEach(function (t) { document.getElementById(t).classList.toggle('on', t === id); });
    var jog = !id;
    document.getElementById('placar').classList.toggle('on', jog || (M && id === 'telaMsg'));
    document.getElementById('btPausa').style.display = jog ? 'block' : 'none';
    document.getElementById('controles').classList.toggle('on', jog && TOQUE);
}
function escudo(c, t, s) {
    c.save(); c.scale(s, s);
    c.beginPath(); c.moveTo(4, 4); c.lineTo(40, 4); c.lineTo(40, 22); c.quadraticCurveTo(40, 36, 22, 42); c.quadraticCurveTo(4, 36, 4, 22); c.closePath();
    c.fillStyle = t.cor; c.fill(); c.lineWidth = 3; c.strokeStyle = t.cor2; c.stroke();
    c.fillStyle = t.cor2; c.fillRect(19, 4, 6, 36);
    c.font = 'bold 11px Arial'; c.textAlign = 'center'; c.fillStyle = t.cor2; c.strokeStyle = '#000'; c.lineWidth = 3;
    c.strokeText(t.sigla, 22, 24); c.fillText(t.sigla, 22, 24);
    c.restore();
}
function montaMenu() {
    function times(id, campo) {
        var box = document.getElementById(id); box.innerHTML = '';
        TIMES.forEach(function (t, i) {
            var d = document.createElement('div'); d.className = 'time' + (dados[campo] === i ? ' sel' : '');
            var cv2 = document.createElement('canvas'); cv2.width = 44; cv2.height = 44; escudo(cv2.getContext('2d'), t, 1); d.appendChild(cv2);
            d.appendChild(document.createTextNode(t.nome));
            d.onclick = function () {
                dados[campo] = i;
                if (dados.meu === dados.rival) dados[campo === 'meu' ? 'rival' : 'meu'] = (i + 1) % TIMES.length;
                salva(); montaMenu();
            };
            box.appendChild(d);
        });
    }
    times('escMeu', 'meu'); times('escRival', 'rival');
    function chips(id, lista, campo) {
        var box = document.getElementById(id); box.innerHTML = '';
        lista.forEach(function (x, i) { var d = document.createElement('div'); d.className = 'chip' + (dados[campo] === i ? ' sel' : ''); d.textContent = x.nome; d.onclick = function () { dados[campo] = i; salva(); montaMenu(); }; box.appendChild(d); });
    }
    chips('escDif', DIFS, 'dif'); chips('escTempo', TEMPOS, 'tempo');
    document.getElementById('trofeus').textContent = '🏆 Copas: ' + dados.copas + ' · ✅ Vitórias: ' + dados.vitorias + ' · ⚽ Jogos: ' + dados.jogos;
    mostra('telaMenu');
}
function msg(h) { document.getElementById('msgCaixa').innerHTML = h; mostra('telaMsg'); }
function abreComoJogar() {
    msg('<h2>❓ Como jogar</h2><ul>' +
        '<li>🎮 Você controla o jogador com o <b>anel amarelo</b></li>' +
        '<li>⌨️ <b>PC:</b> WASD/setas = andar · <b>J</b> ou Espaço = passe · <b>K</b> = chute (SEGURE pra chutar mais forte) · <b>Shift</b> = correr</li>' +
        '<li>📱 <b>Celular:</b> arraste o dedo no lado esquerdo pra andar; botões Passe, Chute e Correr na direita</li>' +
        '<li>🎮 <b>Controle:</b> analógico anda · A = passe · X/B = chute · R2 = correr</li>' +
        '<li>👟 O passe vai pro amigo que está na direção que você aponta</li>' +
        '<li>🛡️ Sem a bola: <b>Chute = dar o bote</b> (roubar a bola) e <b>Passe = trocar de jogador</b></li>' +
        '<li>🥅 Chute segurando o direcional pra cima/baixo pra mirar no canto!</li>' +
        '<li>🏆 Na <b>Copa Cogumelo</b> são 3 jogos: quartas, semi e FINAL. Empate = gol de ouro!</li></ul>' +
        '<div class="linha"><button onclick="' + (M && !M.fim ? 'continua()' : 'montaMenu()') + '">Bora jogar! ⚽</button></div>');
}

/* ================= SOM ================= */
var AC = null, ruido = null;
function audio() { try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} return AC; }
function som(t, vol) {
    var a = audio(); if (!a) return;
    try {
        var n = a.currentTime;
        if (t === 'apito' || t === 'apitoLongo') {
            var o = a.createOscillator(), g = a.createGain(), d = t === 'apito' ? 0.35 : 1.0;
            o.type = 'square'; o.frequency.setValueAtTime(2600, n);
            var lfo = a.createOscillator(), lg = a.createGain(); lfo.frequency.value = 30; lg.gain.value = 120; lfo.connect(lg); lg.connect(o.frequency); lfo.start(n); lfo.stop(n + d);
            g.gain.setValueAtTime(0.05, n); g.gain.setValueAtTime(0.05, n + d - 0.05); g.gain.linearRampToValueAtTime(0, n + d);
            o.connect(g); g.connect(a.destination); o.start(n); o.stop(n + d); return;
        }
        if (t === 'torcida') {
            if (!ruido) { ruido = a.createBuffer(1, a.sampleRate * 2, a.sampleRate); var dt2 = ruido.getChannelData(0); for (var i = 0; i < dt2.length; i++) dt2[i] = Math.random() * 2 - 1; }
            var s = a.createBufferSource(), f = a.createBiquadFilter(), g2 = a.createGain(); s.buffer = ruido; f.type = 'bandpass'; f.frequency.value = 900; f.Q.value = 0.6;
            g2.gain.setValueAtTime(0.001, n); g2.gain.exponentialRampToValueAtTime(0.25 * (vol || 1), n + 0.3); g2.gain.exponentialRampToValueAtTime(0.001, n + 2.4);
            s.connect(f); f.connect(g2); g2.connect(a.destination); s.start(n); s.stop(n + 2.4); return;
        }
        var o2 = a.createOscillator(), g3 = a.createGain();
        o2.type = 'triangle'; o2.frequency.setValueAtTime(t === 'chute' ? 160 : 220, n); o2.frequency.exponentialRampToValueAtTime(60, n + 0.08);
        g3.gain.setValueAtTime((t === 'chute' ? 0.25 : 0.12) * (vol || 1), n); g3.gain.exponentialRampToValueAtTime(0.001, n + 0.1);
        o2.connect(g3); g3.connect(a.destination); o2.start(n); o2.stop(n + 0.1);
    } catch (e) {}
}

/* ================= PARTIDA ================= */
var M = null;
function novoTime(tIdx, lado) {
    return FORMACAO.map(function (f, i) {
        return { time: lado, i: i, papel: f.papel, num: f.num, fx: f.fx, fy: f.fy, x: 0, y: 0, vx: 0, vy: 0, ang: 0, folego: 1, pensa: Math.random() * 0.3, cd: 0, tonto: 0, seg: 0, corre: false };
    });
}
function criaPartida(meu, rival, dif, seg, copa) {
    M = { times: [TIMES[meu], TIMES[rival]], dif: DIFS[dif], segTotal: seg, t: 0, tempo: 1, gols: [0, 0], fase: 'pausa', pausaT: 1.5, depois: null,
        jog: novoTime(meu, 0).concat(novoTime(rival, 1)), bola: { x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, dono: null, ultimo: 0, chuteDe: null }, ctrl: 9,
        cam: { x: 0, y: 0 }, copa: copa || null, ouro: false, fim: false, pausado: false, chuteCarga: -1, trocaT: 0, chutesGol: [0, 0], posse: [0, 0] };
    document.getElementById('pNome0').textContent = M.times[0].sigla;
    document.getElementById('pNome1').textContent = M.times[1].sigla;
    saidaDeBola(0);
    mostra(null); atualizaPlacar();
    aviso('⚽ ' + M.times[0].nome + ' x ' + M.times[1].nome, 2);
    som('apito');
}
function comecaAmistoso() { audio(); criaPartida(dados.meu, dados.rival, dados.dif, TEMPOS[dados.tempo].seg, null); }
function comecaCopa() {
    audio();
    var outros = [];
    for (var i = 0; i < TIMES.length; i++) if (i !== dados.meu) outros.push(i);
    outros.sort(function () { return Math.random() - 0.5; });
    var copa = { rivais: outros.slice(0, 3), fase: 0, nomes: ['Quartas de final', 'Semifinal', 'FINAL'] };
    proximoCopa(copa);
}
function proximoCopa(copa) {
    msg('<h2>🏆 Copa Cogumelo</h2><div id="chave">' + copa.nomes.map(function (n, i) {
        return '<div style="' + (i === copa.fase ? 'border:2px solid #ffe14a' : '') + '">' + (i < copa.fase ? '✅ ' : i === copa.fase ? '⚽ ' : '🔒 ') + n + '<br><small>vs ' + TIMES[copa.rivais[i]].nome + '</small></div>';
    }).join('') + '</div><div class="linha"><button class="amarelo" onclick="jogaCopa()">▶️ Jogar ' + copa.nomes[copa.fase] + '</button><button class="cinza" onclick="M=null;montaMenu()">🏠 Menu</button></div>');
    window._copa = copa;
}
function jogaCopa() { var c = window._copa; criaPartida(dados.meu, c.rivais[c.fase], Math.min(2, dados.dif + (c.fase === 2 ? 1 : 0) * (dados.dif < 2 ? 0 : 0)), TEMPOS[dados.tempo].seg, c); }

function dirTime(t) { return (t === 0 ? 1 : -1) * (M.tempo === 1 ? 1 : -1); }
function jogadoresDe(t) { return M.jog.filter(function (p) { return p.time === t; }); }
function goleiro(t) { return M.jog[t * 11]; }

function saidaDeBola(timeComBola) {
    var b = M.bola; b.x = 0; b.y = 0; b.z = 0; b.vx = b.vy = b.vz = 0; b.dono = null; b.chuteDe = null;
    M.jog.forEach(function (p) {
        var d = dirTime(p.time);
        var fx = Math.min(-0.04, p.fx * 0.9 - 0.08);
        p.x = d * fx * CX; p.y = p.fy * CY * 0.75; p.vx = p.vy = 0; p.ang = d > 0 ? 0 : Math.PI; p.tonto = 0;
        if (p.papel === 'GOL') { p.x = -d * (CX - 1.5); p.y = 0; }
    });
    var ata = jogadoresDe(timeComBola).filter(function (p) { return p.papel === 'ATA'; });
    ata[0].x = -dirTime(timeComBola) * 0.6; ata[0].y = 0;
    ata[1].x = -dirTime(timeComBola) * 1.2; ata[1].y = 6;
    jogadoresDe(1 - timeComBola).forEach(function (p) { if (Math.hypot(p.x, p.y) < 9.6) { var a = Math.atan2(p.y, p.x); p.x = Math.cos(a) * 9.8; p.y = Math.sin(a) * 9.8; } });
    darBola(ata[0]); M.cobrador = ata[0];
    M.fase = 'pausa'; M.pausaT = 1.2;
    if (timeComBola === 0) setCtrl(ata[0]);
}
function darBola(p) { var b = M.bola; b.dono = p; b.ultimo = p.time; b.vx = b.vy = b.vz = 0; b.z = 0; p.seg = 0; b.chuteDe = null; }

function aviso(t, seg) {
    var a = document.getElementById('aviso'); a.textContent = t; a.style.opacity = 1;
    clearTimeout(aviso.t); aviso.t = setTimeout(function () { a.style.opacity = 0; }, (seg || 1.5) * 1000);
}
function relogioTxt() {
    if (M.ouro) return 'GOL DE OURO';
    var min = Math.floor(M.t / M.segTotal * 90);
    if (M.tempo === 1) min = Math.min(45, min); else min = Math.min(90, min);
    return min + "'";
}
var placarCache = '';
function atualizaPlacar() {
    var s = M.gols[0] + ' x ' + M.gols[1], r = relogioTxt();
    if (s + r === placarCache) return; placarCache = s + r;
    document.getElementById('pGols').textContent = s;
    document.getElementById('relogio').textContent = r;
    document.getElementById('pNome0').style.background = M.times[0].cor; document.getElementById('pNome0').style.color = M.times[0].cor2;
    document.getElementById('pNome1').style.background = M.times[1].cor; document.getElementById('pNome1').style.color = M.times[1].cor2;
}

/* ---------- chutes e passes ---------- */
function chuta(p, tx, ty, vel, vz) {
    var b = M.bola, a = Math.atan2(ty - p.y, tx - p.x);
    b.dono = null; b.x = p.x + Math.cos(a) * 0.6; b.y = p.y + Math.sin(a) * 0.6; b.z = 0.1;
    b.vx = Math.cos(a) * vel; b.vy = Math.sin(a) * vel; b.vz = vz || 0;
    b.ultimo = p.time; p.cd = 0.3; b.chuteDe = p; p.ang = a;
    som('chute', Math.min(1, vel / 25));
}
function passaPara(p, alvo, forte) {
    var d = Math.hypot(alvo.x - p.x, alvo.y - p.y);
    var vel = Math.min(28, Math.max(9, d * 0.9 + 6));
    var lider = d / vel * 0.8; // passe na frente do companheiro
    var tx = alvo.x + alvo.vx * lider, ty = alvo.y + alvo.vy * lider;

}

function parar(fn) {

/* ---------- passo principal ---------- */

    M.trocaT -= dt; if (M.trocaT <= 0) { M.trocaT = 0.4; trocaJogador(false); }
    var eu = M.jog[M.ctrl];

/* ================= DESENHO ================= */
var ctx = cv.getContext('2d'), W = 0, H = 0, DPR = 1, ESC = 14, CEL = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);

window.addEventListener('resize', tam); tam();

function desenhaCampo(c) {
    // gramado listrado

    c.fillStyle = '#2a7a34'; c.fillRect(-CX - 8, -CY - 6, 8 - 0.0, CY * 2 + 12); c.fillRect(CX, -CY - 6, 8, CY * 2 + 12);

    });
}
function desenhaGol(c, s, frente) {
    var x0 = s * CX;
    if (!frente) { // rede
        c.fillStyle = 'rgba(255,255,255,0.12)'; c.fillRect(Math.min(x0, x0 + s * 2), -GOL, 2, GOL * 2);

function desenhaMini(c) {

        c.fillStyle = i === M.ctrl ? '#ffe14a' : M.times[p.time].cor; c.beginPath(); c.arc(x0 + (p.x + CX) * sx, y0 + (p.y + CY) * sy, i === M.ctrl ? 3.5 : 2.5, 0, 7); c.fill();
    });
    c.fillStyle = '#fff'; c.beginPath(); c.arc(x0 + (M.bola.x + CX) * sx, y0 + (M.bola.y + CY) * sy, 2.5, 0, 7); c.fill();

    var mw = W / ESC / 2, mh = H / ESC / 2;

    for (var i = 0; i < 90; i++) { var cor = M.times[i % 2].cor; c.fillStyle = cor; var sx = -CX - 18 + (i * 1.27) % (CX * 2 + 36); c.beginPath(); c.arc(sx, -CY - 9 - (i % 3) * 3 + Math.sin(M.t * 6 + i) * 0.15, 0.45, 0, 7); c.arc(sx + 0.6, CY + 9 + (i % 3) * 3 + Math.cos(M.t * 6 + i) * 0.15, 0.45, 0, 7); c.fill(); }

}

var ult = performance.now(), hudT = 0, acum = 0;
function loop(t) {

}

montaMenu();
if (!localStorage.getItem(SAVE_KEY)) { salva(); abreComoJogar(); }
