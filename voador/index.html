<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="description" content="Cogumelo Voador — bata as asas, desvie dos canos e bata seu recorde! Cogumelo Games.">
<title>🍄🪽 Cogumelo Voador — Cogumelo Games</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
    background:#0a0a2a; font-family:Arial, sans-serif;
    display:flex; flex-direction:column; align-items:center;
    min-height:100vh; overflow:hidden; touch-action:none;
}
#hud {
    color:#fff; padding:8px; width:100%; max-width:520px;
    background:rgba(0,0,0,0.4); font-size:15px; font-weight:bold;
    display:flex; justify-content:space-around; align-items:center;
}
#moedasHud { color:#ffd700; }
canvas { background:#000; border-radius:10px; max-width:100vw; max-height:calc(100vh - 56px); cursor:pointer; }
.painel {
    position:fixed; top:0; left:0; width:100vw; height:100vh; height:100dvh;
    background:rgba(0,0,20,0.95); z-index:20; display:none;
    flex-direction:column; align-items:center; justify-content:flex-start; color:#fff; text-align:center; padding:20px;
    overflow-y:auto; -webkit-overflow-scrolling:touch;
}
.painel h1 { font-size:34px; margin:12px 0 4px;
    background:linear-gradient(to right,#ff5555,#ffd700); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.painel .sub { color:#aaa; margin:4px 0 14px; font-size:15px; max-width:440px; }
.painel button {
    font-size:20px; font-weight:bold; padding:14px 38px; border:none; border-radius:14px; cursor:pointer;
    background:linear-gradient(135deg,#00ff88,#00ccff); color:#08281a; margin:6px;
}
.painel button.cinza { background:#445; color:#fff; }
.grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:12px; max-width:680px; width:100%; padding-bottom:24px; }
.item { background:rgba(30,30,70,0.85); border:2px solid #444; border-radius:14px; padding:12px; color:#fff; }
.item canvas { background:#1a2445; border-radius:10px; cursor:default; }
.item .inome { font-size:14px; font-weight:bold; margin:4px 0; }
.item button { font-size:13px; padding:8px 14px; margin:4px 0 0; background:linear-gradient(135deg,#ffd700,#ffaa00); color:#332200; }
.item button.equipar { background:linear-gradient(135deg,#00ff88,#00ccff); color:#08281a; }
.item button.equipado { background:#333; color:#00ff88; border:1px solid #00ff88; }
.item button:disabled { opacity:0.4; }
.item.equipadoBorda { border-color:#00ff88; }
a.voltar { position:fixed; top:8px; left:10px; color:#888; text-decoration:none; z-index:40; font-size:14px; }
@media (max-width:700px){ .grid { grid-template-columns:repeat(2,1fr); } .painel h1 { font-size:26px; } }
</style>
</head>
<body>
<a class="voltar" href="/">🏠 Início</a>
<div id="hud">
    <span id="moedasHud">🪙 0</span>
    <span id="ptsHud">0 pts</span>
    <span id="recHud">🏆 0</span>
</div>
<canvas id="c" width="480" height="640"></canvas>

<div class="painel" id="menu" style="display:flex; justify-content:center;">
    <h1>🍄🪽 Cogumelo Voador</h1>
    <div class="sub">Toque na tela (ou ESPAÇO) pra bater as asas! Desvie dos canos, pegue moedas e bata seu recorde!</div>
    <div>
        <button onclick="comecar()">🪽 VOAR!</button>
        <button class="cinza" onclick="abreLoja()">🛒 SKINS</button>
    </div>
    <div class="sub" id="menuInfo"></div>
    <div class="grid" id="listaSkins" style="display:none;"></div>
</div>

<div class="painel" id="fim" style="justify-content:center;">
    <h1>💥 Caiu!</h1>
    <div class="sub" id="fimInfo"></div>
    <div>
        <button onclick="comecar()">🔄 DE NOVO</button>
        <button class="cinza" onclick="abreMenu()">📋 MENU</button>
    </div>
</div>

<script src="/stats.js"></script>
<script src="/avisos.js?v=6"></script>
<script>
if (window.initStats) initStats('voador');

// ============ SKINS (cogumelos com asas!) ============
const SKINS = [
    { id:'classico', nome:'Clássico',   preco:0,    cap:'#e53935', pintas:'#fff', corpo:'#ffe0b2', asa:'#ffffff' },
    { id:'azul',     nome:'Azulzinho',  preco:100,  cap:'#1e88e5', pintas:'#fff', corpo:'#ffe0b2', asa:'#bbdefb' },
    { id:'anjo',     nome:'Anjinho',    preco:250,  cap:'#f5f5f5', pintas:'#ffd700', corpo:'#fffde7', asa:'#ffffff' },
    { id:'morcego',  nome:'Morceguinho',preco:450,  cap:'#37474f', pintas:'#7c4dff', corpo:'#b0bec5', asa:'#4a148c' },
    { id:'fada',     nome:'Fada',       preco:700,  cap:'#ff80ab', pintas:'#fff', corpo:'#fce4ec', asa:'#f8bbd0' },
    { id:'abelha',   nome:'Abelhudo',   preco:1000, cap:'#fdd835', pintas:'#212121', corpo:'#fff9c4', asa:'#e3f2fd' },
    { id:'fenix',    nome:'Fênix',      preco:1500, cap:'#ff3d00', pintas:'#ffd600', corpo:'#ff8a65', asa:'#ff6f00' },
    { id:'gelo',     nome:'Gelinho',    preco:2200, cap:'#81d4fa', pintas:'#e1f5fe', corpo:'#e3f2fd', asa:'#b3e5fc' },
    { id:'dragao',   nome:'Dragãozinho',preco:3200, cap:'#2e7d32', pintas:'#aed581', corpo:'#c8e6c9', asa:'#1b5e20' },
    { id:'dourado',  nome:'Dourado',    preco:5000, cap:'#ffd700', pintas:'#ff6f00', corpo:'#fff8e1', asa:'#ffe082' },
    { id:'galactico',nome:'Galáctico',  preco:8000, cap:'#4a148c', pintas:'#00e5ff', corpo:'#b39ddb', asa:'#7c4dff' },
    { id:'arcoiris', nome:'Arco-Íris',  preco:12000,cap:'ARCO',    pintas:'#fff', corpo:'#ffe0b2', asa:'ARCO' }
];

// ============ SAVE ============
let moedas = parseInt(localStorage.getItem('voador_moedas')||'0');
let recorde = parseInt(localStorage.getItem('voador_recorde')||'0');
let skinsCompradas = JSON.parse(localStorage.getItem('voador_skins')||'["classico"]');
let skinEq = localStorage.getItem('voador_skinEq')||'classico';
function salva(){
    localStorage.setItem('voador_moedas', moedas);
    localStorage.setItem('voador_recorde', recorde);
    localStorage.setItem('voador_skins', JSON.stringify(skinsCompradas));
    localStorage.setItem('voador_skinEq', skinEq);
}
function skinAtual(){ return SKINS.find(s=>s.id===skinEq)||SKINS[0]; }

// ============ SOM ============
let audio;
function som(freq, dur, tipo='square', vol=0.12){
    try{
        audio = audio || new (window.AudioContext||window.webkitAudioContext)();
        const o=audio.createOscillator(), g=audio.createGain();
        o.type=tipo; o.frequency.value=freq; g.gain.value=vol;
        g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime+dur);
        o.connect(g); g.connect(audio.destination); o.start(); o.stop(audio.currentTime+dur);
    }catch(e){}
}

// ============ JOGO ============
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
let jogando=false, y, vy, canos, moedinhas, pts, coinsRun, t=0, batida=0;
const GRAV=0.45, FLAP=-7.8, VEL=2.6, VAO=170, LARG=70;

function atualizaHud(){
    document.getElementById('moedasHud').textContent = `🪙 ${moedas}`;
    document.getElementById('ptsHud').textContent = `${pts||0} pts`;
    document.getElementById('recHud').textContent = `🏆 ${recorde}`;
}

function comecar(){
    y = H/2; vy = 0; pts = 0; coinsRun = 0;
    canos = []; moedinhas = [];
    for(let i=0;i<3;i++) novoCano(W + 150 + i*260);
    jogando = true;
    document.getElementById('menu').style.display='none';
    document.getElementById('fim').style.display='none';
    atualizaHud();
    som(500,0.1);
}
function novoCano(x){
    const topo = 70 + Math.random()*(H-70*2-VAO-90);
    canos.push({ x, topo, passou:false });
    if(Math.random()<0.6) moedinhas.push({ x: x+LARG/2, y: topo+VAO/2, r:12, pega:false });
}
function bater(){
    if(!jogando) return;
    vy = FLAP; batida = 1;
    som(600,0.07,'square',0.08);
}
cv.addEventListener('mousedown', e=>{ e.preventDefault(); bater(); });
cv.addEventListener('touchstart', e=>{ e.preventDefault(); bater(); }, {passive:false});
document.addEventListener('keydown', e=>{
    if(e.code==='Space'){ e.preventDefault(); if(!e.repeat){ if(jogando) bater(); else if(document.getElementById('menu').style.display!=='none'||document.getElementById('fim').style.display==='flex') comecar(); } }
});

function fimDeJogo(){
    if(!jogando) return;
    jogando=false;
    som(150,0.5,'sawtooth');
    const ganho = coinsRun + Math.floor(pts/2);
    moedas += ganho;
    let novoRec = '';
    if(pts > recorde){ recorde = pts; novoRec = '<br>🎉 NOVO RECORDE!'; }
    salva(); atualizaHud();
    document.getElementById('fimInfo').innerHTML =
        `Você fez <b style="color:#ffd700">${pts} pontos</b>!<br>+🪙 ${ganho} moedas${novoRec}`;
    document.getElementById('fim').style.display='flex';
}

// ============ DESENHO DO COGUMELO COM ASAS ============
function desenhaCogumelo(cx, cy, sk, angulo, abertura){
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(angulo);
    // ASAS! (batem: abertura 0=fechada 1=aberta)
    const bat = -0.9 + abertura*1.6;
    for(const lado of [-1, 1]){
        ctx.save();
        ctx.scale(lado, 1);
        ctx.rotate(bat * 0.6);
        let corAsa = sk.asa;
        if(corAsa==='ARCO'){
            const g = ctx.createLinearGradient(0,-30,0,10);
            g.addColorStop(0,'#ff4444'); g.addColorStop(0.5,'#ffdd00'); g.addColorStop(1,'#4488ff');
            corAsa = g;
        }
        ctx.fillStyle = corAsa;
        ctx.beginPath();
        ctx.moveTo(-14, -4);
        ctx.quadraticCurveTo(-46, -34, -54, -10);
        ctx.quadraticCurveTo(-44, -6, -38, 0);
        ctx.quadraticCurveTo(-30, 8, -14, 6);
        ctx.closePath(); ctx.fill();
        // peninhas
        ctx.strokeStyle = 'rgba(0,0,0,0.18)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(-20, -6); ctx.quadraticCurveTo(-36, -18, -48, -12); ctx.stroke();
        ctx.restore();
    }
    // corpo
    ctx.fillStyle = sk.corpo;
    ctx.fillRect(-9, 2, 18, 16);
    // olhos
    ctx.fillStyle = '#222';
    ctx.fillRect(-5, 6, 4, 6); ctx.fillRect(3, 6, 4, 6);
    // chapéu
    if(sk.cap==='ARCO'){
        const g = ctx.createLinearGradient(-16,0,16,0);
        g.addColorStop(0,'#ff4444'); g.addColorStop(0.3,'#ffdd00'); g.addColorStop(0.6,'#44ff44'); g.addColorStop(1,'#4488ff');
        ctx.fillStyle = g;
    } else ctx.fillStyle = sk.cap;
    ctx.beginPath(); ctx.arc(0, 2, 16, Math.PI, 0); ctx.fill();
    ctx.fillRect(-17, -2, 34, 5);
    // pintas
    ctx.fillStyle = sk.pintas;
    ctx.beginPath(); ctx.arc(-7, -7, 3, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(6, -9, 3.5, 0, 7); ctx.fill();
    ctx.restore();
}

function desenha(){
    t += 0.016;
    if(batida > 0) batida = Math.max(0, batida - 0.07);

    // céu
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#7ec8f0'); g.addColorStop(1,'#cfeadd');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
    // nuvens
    ctx.fillStyle='rgba(255,255,255,0.85)';
    for(let i=0;i<3;i++){
        const nx = ((t*20*(1+i*0.4) + i*220) % (W+160)) - 80;
        ctx.beginPath(); ctx.arc(nx,80+i*90,20,0,7); ctx.arc(nx+22,72+i*90,26,0,7); ctx.arc(nx+48,82+i*90,18,0,7); ctx.fill();
    }
    // chão
    ctx.fillStyle='#4caf50'; ctx.fillRect(0,H-40,W,40);
    ctx.fillStyle='#6d4c2f'; ctx.fillRect(0,H-22,W,22);

    if(jogando){
        vy += GRAV; y += vy;
        // canos andam
        for(const c of canos){ c.x -= VEL; }
        for(const m of moedinhas){ m.x -= VEL; }
        if(canos.length && canos[0].x < -LARG){ canos.shift(); novoCano(canos[canos.length-1].x + 260); }
        moedinhas = moedinhas.filter(m=>m.x > -20 && !m.pega);
        // pontos ao passar
        for(const c of canos){
            if(!c.passou && c.x + LARG < W*0.3){ c.passou = true; pts++; som(750,0.06,'square',0.07); atualizaHud(); }
        }
        // moedas
        for(const m of moedinhas){
            if(!m.pega && Math.abs(m.x - W*0.3) < 22 && Math.abs(m.y - y) < 26){
                m.pega = true; coinsRun++; som(900,0.08,'square',0.09);
            }
        }
        // colisão (sem return — o loop de desenho continua vivo!)
        const px = W*0.3;
        if(y > H-40-14 || y < 10) fimDeJogo();
        if(jogando) for(const c of canos){
            if(px+14 > c.x && px-14 < c.x+LARG){
                if(y-12 < c.topo || y+14 > c.topo+VAO){ fimDeJogo(); break; }
            }
        }
    }

    // canos (com cara de cano de cogumelo!)
    for(const c of (canos||[])){
        ctx.fillStyle='#2e7d32';
        ctx.fillRect(c.x, 0, LARG, c.topo);
        ctx.fillRect(c.x, c.topo+VAO, LARG, H-40-(c.topo+VAO));
        ctx.fillStyle='#1b5e20';
        ctx.fillRect(c.x-5, c.topo-22, LARG+10, 22);
        ctx.fillRect(c.x-5, c.topo+VAO, LARG+10, 22);
    }
    // moedinhas
    for(const m of (moedinhas||[])){
        if(m.pega) continue;
        ctx.fillStyle='#ffd700';
        ctx.beginPath(); ctx.ellipse(m.x, m.y, m.r*Math.abs(Math.cos(t*4)), m.r, 0, 0, 7); ctx.fill();
        ctx.strokeStyle='#aa8800'; ctx.lineWidth=2; ctx.stroke();
    }
    // cogumelo
    if(jogando || document.getElementById('fim').style.display==='flex'){
        const ang = Math.max(-0.5, Math.min(0.9, (vy||0)*0.06));
        desenhaCogumelo(W*0.3, y||H/2, skinAtual(), ang, batida>0?1:Math.abs(Math.sin(t*6))*0.4);
    } else {
        desenhaCogumelo(W*0.3, H/2 + Math.sin(t*2)*14, skinAtual(), 0, Math.abs(Math.sin(t*5)));
    }
    // pontos gigantes
    if(jogando){
        ctx.font='bold 52px Arial'; ctx.textAlign='center';
        ctx.fillStyle='rgba(255,255,255,0.9)'; ctx.strokeStyle='rgba(0,0,0,0.4)'; ctx.lineWidth=5;
        ctx.strokeText(pts, W/2, 80); ctx.fillText(pts, W/2, 80);
        ctx.textAlign='start';
    }
    requestAnimationFrame(desenha);
}

// ============ MENU / LOJA ============
function abreMenu(){
    jogando=false;
    document.getElementById('fim').style.display='none';
    document.getElementById('menu').style.display='flex';
    document.getElementById('listaSkins').style.display='none';
    document.getElementById('menuInfo').textContent = `🏆 Recorde: ${recorde} · 🪙 ${moedas} moedas`;
}
function abreLoja(){
    const el = document.getElementById('listaSkins');
    el.style.display='grid';
    el.innerHTML='';
    SKINS.forEach(sk=>{
        const tem = skinsCompradas.includes(sk.id);
        const eq = skinEq===sk.id;
        const d = document.createElement('div');
        d.className='item'+(eq?' equipadoBorda':'');
        const mini = document.createElement('canvas');
        mini.width=110; mini.height=80;
        const mctx = mini.getContext('2d');
        mctx.save(); mctx.translate(55,45);
        const antigoCtx = ctx;
        // desenha a prévia usando um contexto próprio
        (function(){
            const c2 = mctx;
            c2.save();
            // asas
            for(const lado of [-1,1]){
                c2.save(); c2.scale(lado,1); c2.rotate(-0.35);
                let corAsa = sk.asa;
                if(corAsa==='ARCO'){ const gg=c2.createLinearGradient(0,-30,0,10); gg.addColorStop(0,'#ff4444'); gg.addColorStop(0.5,'#ffdd00'); gg.addColorStop(1,'#4488ff'); corAsa=gg; }
                c2.fillStyle=corAsa;
                c2.beginPath(); c2.moveTo(-14,-4); c2.quadraticCurveTo(-46,-34,-54,-10);
                c2.quadraticCurveTo(-44,-6,-38,0); c2.quadraticCurveTo(-30,8,-14,6); c2.closePath(); c2.fill();
                c2.restore();
            }
            c2.fillStyle=sk.corpo; c2.fillRect(-9,2,18,16);
            c2.fillStyle='#222'; c2.fillRect(-5,6,4,6); c2.fillRect(3,6,4,6);
            if(sk.cap==='ARCO'){ const gg=c2.createLinearGradient(-16,0,16,0); gg.addColorStop(0,'#ff4444'); gg.addColorStop(0.3,'#ffdd00'); gg.addColorStop(0.6,'#44ff44'); gg.addColorStop(1,'#4488ff'); c2.fillStyle=gg; }
            else c2.fillStyle=sk.cap;
            c2.beginPath(); c2.arc(0,2,16,Math.PI,0); c2.fill();
            c2.fillRect(-17,-2,34,5);
            c2.fillStyle=sk.pintas;
            c2.beginPath(); c2.arc(-7,-7,3,0,7); c2.fill();
            c2.beginPath(); c2.arc(6,-9,3.5,0,7); c2.fill();
            c2.restore();
        })();
        mctx.restore();
        d.appendChild(mini);
        const nome = document.createElement('div'); nome.className='inome'; nome.textContent=sk.nome;
        d.appendChild(nome);
        const btn = document.createElement('button');
        if(eq){ btn.className='equipado'; btn.textContent='✅ VOANDO'; btn.disabled=true; }
        else if(tem){ btn.className='equipar'; btn.textContent='EQUIPAR'; btn.onclick=()=>{ skinEq=sk.id; salva(); abreLoja(); som(700,0.1); }; }
        else { btn.textContent=`🪙 ${sk.preco.toLocaleString('pt-BR')}`; btn.disabled = moedas<sk.preco;
               btn.onclick=()=>{ if(moedas<sk.preco) return; moedas-=sk.preco; skinsCompradas.push(sk.id); skinEq=sk.id; salva(); atualizaHud(); abreLoja(); som(600,0.1); setTimeout(()=>som(900,0.2),100); }; }
        d.appendChild(btn);
        el.appendChild(d);
    });
}

abreMenu();
atualizaHud();
desenha();
</script>
</body>
</html>
